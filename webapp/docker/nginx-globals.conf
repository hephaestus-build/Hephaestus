# Main-context settings for the webapp image.
#
# The image runs nginx as UID 101 on a read-only root file system. The stock PID file and temp
# directories are under /run and /var/cache/nginx, which only root can write.
# /tmp/hephaestus-webapp is the one writable directory. Every service that runs this image mounts
# it, including the ones that start nginx without the entrypoint. nginx creates the temp
# directories inside it (nginx-http.conf), but not the directory itself.

worker_processes auto;
error_log stderr notice;
pid /tmp/hephaestus-webapp/nginx.pid;

events {
    worker_connections 1024;
}
