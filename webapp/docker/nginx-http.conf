# http-context settings of both server modes of this image. See nginx-globals.conf.
#
# Access logging stays nginx's built-in default here; every server block turns it off itself.

include /etc/nginx/mime.types;
default_type application/octet-stream;

client_body_temp_path /tmp/hephaestus-webapp/nginx-client-body;
proxy_temp_path /tmp/hephaestus-webapp/nginx-proxy;
fastcgi_temp_path /tmp/hephaestus-webapp/nginx-fastcgi;
uwsgi_temp_path /tmp/hephaestus-webapp/nginx-uwsgi;
scgi_temp_path /tmp/hephaestus-webapp/nginx-scgi;

# The API origin that the content security policy lets the app connect to, besides its own. The
# entrypoint writes it from APPLICATION_SERVER_URL; without that file, the app connects only to itself.
map $host $hephaestus_api_origin {
    default "";
    include /tmp/hephaestus-webapp/nginx-api-origin*.map;
}

sendfile on;
keepalive_timeout 65;
