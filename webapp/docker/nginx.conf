server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version in error pages and Server header
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # ==========================================================================
    # No HTTP access log — whole server, not per location
    # ==========================================================================
    # The stock image's http-level `access_log /var/log/nginx/access.log main;`
    # would otherwise write one combined-format line per request to stdout, and
    # that line carries the request URL. SPA deep links name people
    # (/w/<slug>/user/<username>), so the URL alone is a per-request personal-data
    # record — no `real_ip` module is loaded, so it was never the client IP that
    # leaked, it was the path. Turning this off at the server level is what makes
    # the "no layer writes a per-request IP/URL record" posture in
    # server/application/src/main/resources/application-prod.yml and docs/admin/dsms/ true;
    # a per-location `access_log off` only covered whatever locations remembered
    # to repeat it, and every new location silently opted back in.
    #
    # error_log is untouched (http-level default -> stderr): startup failures and
    # 4xx/5xx still surface in `docker logs`. No diagnostic reads the access log —
    # the container healthcheck curls / and judges the HTTP status, and Traefik
    # decides liveness from the connection, not from anything nginx writes. What
    # this does silence is the healthcheck's own line every 5s, which was the bulk
    # of the stream.
    access_log off;

    # ==========================================================================
    # Compression (applied globally)
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        application/manifest+json
        application/wasm;

    # ==========================================================================
    # env-config.{hash}.js - Immutable (content-hashed at container startup)
    # ==========================================================================
    location ~ "^/env-config\.[a-f0-9]{8}\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # ==========================================================================
    # Vite static assets - Immutable (content-hashed by Vite build)
    # ==========================================================================
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ==========================================================================
    # Static files (favicon, images, fonts) - Cache with revalidation
    # These are not content-hashed, so use shorter cache with must-revalidate
    # ==========================================================================
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ==========================================================================
    # Legal content — served as static Markdown by the SPA legal pages.
    # Priority: operator overrides (/legal-overrides/) → bundled profile →
    # shipped safety-fallback at /legal/_disclaimer/. Each location serves only
    # *.md and returns a real 404 on miss so the resolver can fall through.
    # ==========================================================================

    # Operator-mounted override directory. Runtime-editable (no-cache), never
    # served for non-.md extensions to shrink the attack surface of the mount.
    location /legal-overrides/ {
        location ~* \.md$ {
            types { } default_type "text/markdown; charset=utf-8";
            add_header Cache-Control "no-cache, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            # Raw Markdown is the resolver's input, not a canonical landing
            # page. Search engines should index /imprint and /privacy, not
            # the underlying files.
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri =404;
        }
        return 404;
    }

    # Image-bundled profile + disclaimer. Content is immutable per image build,
    # so clients may cache briefly but must revalidate.
    location /legal/ {
        location ~* \.md$ {
            types { } default_type "text/markdown; charset=utf-8";
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri =404;
        }
        return 404;
    }

    # ==========================================================================
    # Manifest and config files - No cache (may change between deployments)
    # ==========================================================================
    location ~* ^/(manifest(-dev)?\.json|robots\.txt)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # ==========================================================================
    # RFC 9116 security.txt - plain text, must not fall through to the SPA shell
    # ==========================================================================
    location = /.well-known/security.txt {
        types { } default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ==========================================================================
    # SPA routing - using error_page pattern to avoid duplicate headers
    # ==========================================================================
    
    # Direct requests to / and /index.html
    # no-cache: browser may cache but MUST revalidate with origin before use (allows 304 responses)
    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Named location for SPA fallback - headers defined once
    # Uses rewrite with 'break' to serve file without triggering another location match
    location @spa {
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Catch-all: try file, otherwise delegate to @spa via error_page
    # The '=' in 'error_page 404 =' uses response code from @spa
    location / {
        try_files $uri $uri/ =404;
        error_page 404 = @spa;
    }

    # ==========================================================================
    # Error pages
    # ==========================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
