<!doctype html>
<html
  lang="en"
  data-color-mode="auto"
  data-light-theme="light"
  data-dark-theme="dark"
  class="scroll-smooth bg-sidebar"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <meta name="theme-color" content="#315FDC" />
    <meta
      name="description"
      content="Hephaestus gives developers practice feedback on software project work, plus an AI mentor for talking through feedback and next steps."
    />
    <meta property="og:title" content="Hephaestus" />
    <meta
      property="og:description"
      content="Hephaestus gives developers practice feedback on software project work, plus an AI mentor for talking through feedback and next steps."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/hephaestus-social-card.png" />
	<meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Hephaestus — Learn from the work you're already doing" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hephaestus" />
    <meta
      name="twitter:description"
      content="Hephaestus gives developers practice feedback on software project work, plus an AI mentor for talking through feedback and next steps."
    />
    <meta name="twitter:image" content="/hephaestus-social-card.png" />
	<meta name="twitter:image:alt" content="Hephaestus — Learn from the work you're already doing" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!-- Runtime environment config - MUST load before app bundle to set window.__ENV__ -->
    <!-- Path is rewritten to content-hashed version at container startup -->
    <!-- e.g., /env-config.js becomes /env-config.a1b2c3d4.js for optimal caching -->
    <script src="/env-config.js"></script>
    <!-- The manifest link is injected by src/main.tsx (localhost gets manifest-dev.json). An
         inline script here would violate the deployed Content-Security-Policy (script-src 'self'
         in webapp/docker/security-headers.conf and the Traefik edge middleware). -->
    <title>Hephaestus</title>
  </head>
  <body class="bg-sidebar">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
