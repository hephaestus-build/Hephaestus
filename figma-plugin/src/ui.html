<!doctype html>
<html lang="en">

		<style>
			body { font: 13px/1.45 Inter, system-ui, sans-serif; margin: 12px; color: #1e1e1e; }

			p { margin: 0 0 8px; }
			.quiet { color: #6b6b6b; }

			button { font: inherit; margin: 4px 4px 4px 0; }
