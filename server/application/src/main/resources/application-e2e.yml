hephaestus:
  security:
    encryption-key: ${HEPHAESTUS_SECURITY_ENCRYPTION_KEY:hephaestusLocalDevEncryptKey0123}
    credential-encryption-key: ${HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY:hephaestusLocalDevEncryptKey0123}
  auth:
    dev-login-enabled: true
    cookie-secure: false
    cookie-name: HEPHAESTUS_AT
    # The development extension key's id; the extension E2E suite signs in through /auth/dev-login/client.
    browser-extension-ids: ijkajblcbajjpjbknfgdiiiljipafiko
  workspace:
    init-default: false
    creation-policy: SELF_SERVICE
  dev:
    trigger-enabled: true
  agent:
    enabled: ${AGENT_ENABLED:true}
  sync:
    run-on-startup: false
    filters:
      allowed-organizations: []
      allowed-repositories: []
  integration:
    gitlab:
      enabled: true
  llm:
    egress:
      allow-loopback: true
