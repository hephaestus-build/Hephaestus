spring:
    docker:
        compose:
            enabled: false
            lifecycle-management: none
            skip:
                in-tests: true
    liquibase:
        enabled: false
    datasource:
        url: jdbc:h2:mem:hephaestus-specs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
        username: sa
        password: ""
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
            # Spec generation introspects controllers and must not access the database during startup.
            ddl-auto: none
hephaestus:
    release:
        check-enabled: false
    auth:
        login-providers:
            github:
                client-id: ""
                client-secret: ""
            gitlab:
                client-id: ""
                client-secret: ""
            slack:
                client-id: ""
                client-secret: ""
            outline:
                client-id: ""
                client-secret: ""
    # Enable Slack/Outline admin endpoints so they surface in the generated client. The vendor
    # clients themselves aren't called during the spec run — just the controllers are loaded.
    integration:
        slack:
            enabled: true
            client-id: ""
            client-secret: ""
        outline:
            enabled: true
    runtime:
        webhook:
            enabled: false
    workspace:
        init-default: false
    mail:
        enabled: false
        sender: noreply@example.com
    sync:
        nats:
            enabled: false
            server: "nats://localhost:4222"

springdoc:
    # The one profile whose entire job is to publish the description. Everywhere else it defaults off
    # (see application.yml) because the security carve-out that lets this profile scrape it without a
    # JwtDecoder applies on every chain, not just this one.
    api-docs:
        enabled: true
    swagger-ui:
        enabled: true
