spring:
    application:
        name: Hephaestus
        version: "${APP_VERSION:0.0.0-development}"

    # Deploy-role aliases (see docker/compose.core.yaml + ADR 0008). Activating a group
    # name expands to its member profiles, so SPRING_PROFILES_ACTIVE=webhook-server is
    # equivalent to prod,webhook (and worker-node to prod,worker).
    profiles:
        group:
            webhook-server: prod,webhook
            worker-node: prod,worker

    config:
        import: optional:file:.env[.properties]

    threads:
        virtual:
            enabled: true

    reactor:
        context-propagation: auto

    # Virtual threads are always daemons. With virtual threads enabled, both the request executor
    # and the @Scheduled TaskScheduler use them — so no non-daemon thread remains after main().
    # keep-alive registers one to hold the JVM open between cron firings.
    main:
        keep-alive: true

    datasource:
        url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/hephaestus
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:root}
        hikari:
            connection-timeout: 45000
            idle-timeout: 600000
            max-lifetime: 1800000
            maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:20}
            minimum-idle: 5

    jpa:
        hibernate:
            # Liquibase owns DDL across every profile. `validate` makes drift fail-fast at boot;
            # prod overrides to `none` in application-prod.yml. Fresh local DB after schema change:
            # `docker compose down -v && docker compose up -d`.
            ddl-auto: validate
        # Repository queries complete in the service layer; no lazy loading during view rendering.
        open-in-view: false

        # show-sql: "true"
        properties:
            hibernate:
                # `show-sql: true` is the trigger; `format_sql` only matters then. Default off avoids
                # the formatter pass on every statement.
                format_sql: "false"
                jdbc:
                    batch_size: 50
                order_inserts: true
                order_updates: true

    # Synchronous JPA repository bootstrap (Spring Boot's default since 2.4.1). DEFERRED builds the
    # EntityManagerFactory on the applicationTaskExecutor background thread; that thread starves under
    # CPU throttling (Paketo CDS-training builder, spec generation), hanging the boot, and combined with
    # an @PostConstruct repository read it is the documented lock-order deadlock (spring-boot#23758,
    # reverted as the framework default in #24249). The cold-start overlap it bought is not worth that
    # footgun, so we keep bootstrap synchronous on the main thread for every profile.
    data:
        jpa:
            repositories:
                bootstrap-mode: default

    liquibase:
        change-log: classpath:db/master.xml
        # Gates `context="backfill"` one-shot changesets; prod overrides to `prod`.
        contexts: dev

    # Hephaestus issues + verifies its own ES256 cookie-JWTs (core.auth
    # RevocationAwareJwtDecoder is the sole JwtDecoder bean) and federates login via
    # oauth2Login. There is no spring.security.oauth2.client.registration here: the default
    # login providers are configured under hephaestus.auth.{github,gitlab} and seeded into the
    # instance-scoped login_provider store, which the DB-backed LoginProviderClientRegistrationRepository
    # reads — so a no-credentials boot does not fail Boot's non-empty-client-id validation. See ADR 0017.

    # RFC 9457 Problem Details for all framework-raised errors (ResponseStatusException,
    # validation, etc.). Set explicitly so the contract survives a Boot upgrade. The
    # core.exception.GlobalControllerAdvice supplies richer bodies for domain exceptions.
    mvc:
        problemdetails:
            enabled: true

    # Disable Mustache template location check as we don't use Mustache templates
    mustache:
        check-template-location: false

    jackson:
        default-property-inclusion: non_null
        deserialization:
            fail-on-unknown-properties: false
            fail-on-null-for-primitives: false
        time-zone: UTC
        datatype:
            datetime:
                write-dates-as-timestamps: false

    # GraphQL client configuration for GitHub API operations
    # Operations are colocated with the schema at graphql/github/operations/
    graphql:
        client:
            document-locations: classpath:graphql/github/operations/

    # Graceful shutdown drains in-flight requests before terminating; pairs with server.shutdown
    # below. Coolify's default stop-grace is 10s — bump to 30s in the deploy substrate.
    lifecycle:
        timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

server:
    port: ${SERVER_PORT:8080}
    shutdown: graceful

# Actuator on the management port; health probes for Kubernetes liveness/readiness.
management:
    tracing:
        # Propagate trace context without sampling spans.
        sampling:
            probability: 0.0
    server:
        port: ${MANAGEMENT_PORT:8080}
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
            base-path: /actuator
    endpoint:
        health:
            show-details: when_authorized
            probes:
                enabled: true
            # Operational dependencies affect readiness, not process liveness. This group replaces the
            # auto-configured readiness probe, which contains readinessState alone — on the
            # webhook-only container that reduces the probe to "the Spring context started", and both
            # the container healthcheck and Traefik read it.
            #
            # `webhook` is what makes ADR 0008's webhook-server-down alert able to fire: there it is
            # the ONLY contributor that knows about NATS, so without it a total ingestion outage reads
            # as 200. On a combined-role container it adds no new exposure — `integrationConsumer`
            # already reports DOWN on the same disconnect.
            group:
                readiness:
                    include: readinessState,integrationConsumer,webhook,practiceReview,catalogProvenanceBackfillStartup
            # Most of the group is role-gated, and the default (true) aborts the refresh wherever a
            # named contributor is absent — so every container the compose files ship, plus any deploy
            # with NATS off, plus the specs and test profiles. What it removes is a spelling check, and
            # WebhookIngestionCannotFailSilentlyTest runs that against every role at once rather than
            # each container against only its own.
            validate-group-membership: false
        # Disable potentially sensitive endpoints
        env:
            enabled: false
        beans:
            enabled: false
        configprops:
            enabled: false
    health:
        livenessState:
            enabled: true
        readinessState:
            enabled: true

springdoc:
    # Off unless a profile asks for it. SecurityConfig permitAll()s /v3/api-docs/** and /swagger-ui/**
    # on both filter chains so the `specs` profile — which boots with no JwtDecoder — can scrape the
    # description; that carve-out is not profile-guarded, so wherever springdoc registers its endpoints
    # they answer unauthenticated. Defaulting on therefore published the complete route list, admin
    # routes included, from every deployment that was not `prod`. springdoc's own
    # SpringDocConfiguration is @ConditionalOnProperty on this flag, so `false` means the endpoints are
    # never registered and the permitAll matchers match nothing.
    api-docs:
        enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    swagger-ui:
        enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    default-produces-media-type: application/json
    writer-with-order-by-keys: true

hephaestus:
    database:
        allow-insecure-remote: ${HEPHAESTUS_DATABASE_ALLOW_INSECURE_REMOTE:false}
    auth:
        issuer: ${HEPHAESTUS_AUTH_ISSUER:http://localhost:8080}
        audience: ${HEPHAESTUS_AUTH_AUDIENCE:hephaestus-spa}
        access-ttl: ${HEPHAESTUS_AUTH_ACCESS_TTL:15m}
        cookie-name: ${HEPHAESTUS_AUTH_COOKIE_NAME:__Host-HEPHAESTUS_AT}
        state-cookie-key: ${HEPHAESTUS_AUTH_STATE_COOKIE_KEY:}
        # Instance login providers seeded into the login_provider store on first boot, keyed by a stable
        # registrationId (the OAuth callback segment + identity key). A blank client-id skips that entry
        # (no crash). Seeding is seed-if-absent, so admin edits survive reboots. Multiple providers per
        # instance are supported — add more keyed entries here or in the local .env (one per (type,
        # base-url) SCM instance), or at runtime in Instance admin → Login providers. Register this
        # callback on each upstream OAuth app: {server-url}/login/oauth2/code/{registrationId}.
        login-providers:
            github:
                type: GITHUB
                display-name: ${GITHUB_OAUTH_DISPLAY_NAME:GitHub}
                client-id: ${GITHUB_OAUTH_CLIENT_ID:}
                client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
            # Default GitLab slot (gitlab.com). For a self-hosted instance, either point base-url at it
            # (e.g. https://gitlab.lrz.de) or — to keep a descriptive id and/or run several GitLabs —
            # leave this blank and declare keyed entries like `gitlab-lrz` in the .env (see .env.example).
            gitlab:
                type: GITLAB
                base-url: ${GITLAB_OAUTH_BASE_URL:https://gitlab.com}
                display-name: ${GITLAB_OAUTH_DISPLAY_NAME:GitLab}
                client-id: ${GITLAB_OAUTH_CLIENT_ID:}
                client-secret: ${GITLAB_OAUTH_CLIENT_SECRET:}
            slack:
                type: SLACK
                display-name: ${SLACK_OAUTH_DISPLAY_NAME:Slack}
                client-id: ${SLACK_OAUTH_CLIENT_ID:${HEPHAESTUS_INTEGRATION_SLACK_CLIENT_ID:}}
                client-secret: ${SLACK_OAUTH_CLIENT_SECRET:${HEPHAESTUS_INTEGRATION_SLACK_CLIENT_SECRET:}}
            # Link-only provider (like Slack): it attaches an Outline identity to an already signed-in
            # account, it is never a sign-in button. Self-hosted, so the base URL is the wiki's origin.
            # Scopes are pinned to `read` by type (LoginProviderService.OUTLINE_SCOPES) — Outline is plain
            # OAuth2, not OIDC, so `openid` must never be requested.
            outline:
                type: OUTLINE
                base-url: ${OUTLINE_OAUTH_BASE_URL:}
                display-name: ${OUTLINE_OAUTH_DISPLAY_NAME:Outline}
                client-id: ${OUTLINE_OAUTH_CLIENT_ID:}
                client-secret: ${OUTLINE_OAUTH_CLIENT_SECRET:}
        # Token-bucket rate limiting for the hot auth endpoints (core.auth.ratelimit).
        # Buckets are SHARED across replicas via a Postgres ProxyManager (no Redis) when
        # postgres-backed=true (default) and a DataSource is present; otherwise an in-JVM
        # PER-REPLICA fallback is used (logged at startup). Each limit: `capacity` requests
        # per `period` (interval refill — a fresh budget per window).
        rate-limit:
            enabled: ${HEPHAESTUS_AUTH_RATE_LIMIT_ENABLED:true}
            postgres-backed: ${HEPHAESTUS_AUTH_RATE_LIMIT_POSTGRES_BACKED:true}
            # GET /oauth2/authorization/* — keyed by client IP
            oauth-authorization:
                capacity: ${HEPHAESTUS_AUTH_RATE_LIMIT_OAUTH_CAPACITY:20}
                period: ${HEPHAESTUS_AUTH_RATE_LIMIT_OAUTH_PERIOD:1m}
            # POST /auth/refresh — keyed by account (JWT sub), IP fallback
            refresh:
                capacity: ${HEPHAESTUS_AUTH_RATE_LIMIT_REFRESH_CAPACITY:60}
                period: ${HEPHAESTUS_AUTH_RATE_LIMIT_REFRESH_PERIOD:1m}
            # POST /auth/impersonate — keyed by admin account, IP fallback
            impersonate:
                capacity: ${HEPHAESTUS_AUTH_RATE_LIMIT_IMPERSONATE_CAPACITY:10}
                period: ${HEPHAESTUS_AUTH_RATE_LIMIT_IMPERSONATE_PERIOD:1m}
            # DELETE /user — keyed by account, IP fallback
            delete-user:
                capacity: ${HEPHAESTUS_AUTH_RATE_LIMIT_DELETE_USER_CAPACITY:3}
                period: ${HEPHAESTUS_AUTH_RATE_LIMIT_DELETE_USER_PERIOD:1h}
            # POST /user/exports (async bundle assembly) — keyed by account, IP fallback. The
            # GET /user/exports/{id}/download is intentionally NOT limited (cheap ownership-gated read).
            export:
                capacity: ${HEPHAESTUS_AUTH_RATE_LIMIT_EXPORT_CAPACITY:10}
                period: ${HEPHAESTUS_AUTH_RATE_LIMIT_EXPORT_PERIOD:1h}
            mentor-chat:
                capacity: ${HEPHAESTUS_RATE_LIMIT_MENTOR_CHAT_CAPACITY:20}
                period: ${HEPHAESTUS_RATE_LIMIT_MENTOR_CHAT_PERIOD:10m}
            review-request:
                capacity: ${HEPHAESTUS_RATE_LIMIT_REVIEW_REQUEST_CAPACITY:10}
                period: ${HEPHAESTUS_RATE_LIMIT_REVIEW_REQUEST_PERIOD:1h}
            sync-trigger:
                capacity: ${HEPHAESTUS_RATE_LIMIT_SYNC_TRIGGER_CAPACITY:10}
                period: ${HEPHAESTUS_RATE_LIMIT_SYNC_TRIGGER_PERIOD:1h}

    host-url: ${APPLICATION_HOST_URL:http://localhost:4200}

    # ═══════════════════════════════════════════════════════════════════════════
    # RUNTIME ROLES (single JAR, deploy-config-selected mode)
    # ═══════════════════════════════════════════════════════════════════════════
    # Three property keys (see ADR 0005 baseline + ADR 0008 webhook role):
    #   server  — WIRED. Gates ServerSchedulingConfig (@EnableScheduling),
    #     IntegrationNatsConsumer (the unified NATS pull consumer), and WorkspaceStartupListener.
    #     Setting false silences all @Scheduled methods and prevents workspace bootstrap.
    #   worker  — WIRED. Gates DockerSandboxConfiguration + the poll-based AgentJobExecutor.
    #     Setting false removes the Docker sandbox runtime + the agent job poller.
    #   webhook — WIRED. Gates the integration.webhook receiver (controllers, HMAC
    #     verifier, JetStream publisher, stream bootstrap, health, lifecycle).
    #     The webhook-server production container deploys with server=false + worker=false
    #     + webhook=true so it runs webhook reception in isolation — restart-independent
    #     from application-server. See ADR 0008.
    # All three default true → single-JVM monolith (the dev + initial prod topology).
    runtime:
        server:
            enabled: ${HEPHAESTUS_RUNTIME_SERVER_ENABLED:true}
        worker:
            enabled: ${HEPHAESTUS_RUNTIME_WORKER_ENABLED:true}
        webhook:
            enabled: ${HEPHAESTUS_RUNTIME_WEBHOOK_ENABLED:true}

    # ═══════════════════════════════════════════════════════════════════════════
    # TENANCY ENFORCEMENT (WorkspaceStatementInspector)
    # ═══════════════════════════════════════════════════════════════════════════
    # SQL-shape defect detection for workspace-scoped tables. This complements, but does
    # not replace, workspace authorization. See core/tenancy/* and ADR 0004.
    #
    #   throw — TenancyViolationException on violations (default)
    #   log   — log + Micrometer counter, query passes (diagnostics only)
    #   off   — disable inspection entirely (diagnostics only)
    tenancy:
        enforcement: ${HEPHAESTUS_TENANCY_ENFORCEMENT:throw}

    # Provider-agnostic sync scheduler (SyncSchedulerProperties). The GitHub-specific sync
    # tuning (GraphQL timeouts, incremental buffer, backfill page size) lives under
    # hephaestus.integration.github.sync (GitHubSyncProperties); per-field rationale is on each
    # record's Javadoc, surfaced in the IDE via spring-configuration-processor.
    sync:
        run-on-startup: true
        timeframe-days: 7
        cron: "0 0 3 * * *"
        cooldown-minutes: 15
        # Discussions + Projects V2 sync are the slowest passes and not consumed yet, so off by
        # default (see DiscussionsProperties/ProjectsProperties). Flip per environment when needed.
        discussions:
            enabled: ${HEPHAESTUS_SYNC_DISCUSSIONS_ENABLED:false}
        projects:
            enabled: ${HEPHAESTUS_SYNC_PROJECTS_ENABLED:false}
        # Historical issue/PR backfill (not projects); runs after recent sync, throttled by rate limit.
        backfill:
            enabled: false
            batch-size: 25
            rate-limit-threshold: 500
            interval-seconds: 60
        # Nightly Slack reconciliation (SlackSyncProperties): heal channel metadata and replay
        # conversations.history for ACTIVE monitored channels through the consent-gated ingest stack
        # (Slack retries a dropped event only 3x within ~6 minutes; this closes longer outages).
        # Budgets/pacing assume Slack's non-Marketplace clamp of 1 request/minute and 15 objects per
        # request on conversations.history/replies (May 2025); Marketplace-approved and internal apps
        # keep the old tiers — raise the budgets and shrink the interval for those installs.
        slack:
            cron: "0 0 4 * * *" # offset from the SCM sync (3:00) and the Slack retention sweep (3:30)
            history-request-budget: 120
            history-page-limit: 15
            history-request-interval: 60s
            replies-enabled: true
            replies-request-budget: 30
            metadata-enabled: true
        # filters.allowed-organizations / allowed-repositories are intentionally unset here so
        # each profile can override; set them in application-local.yml to scope dev syncs.
        nats:
            enabled: false
            durable-consumer-name: ${NATS_DURABLE_CONSUMER_NAME:hephaestus}
            server: ""
            username: ${NATS_USERNAME:}
            password: ${NATS_PASSWORD:}
            consumer:
                # Request timeout for JetStream API calls. Increase for workspaces with many
                # repositories. The remaining consumer tuning (ack-wait, poison handling, …)
                # lives on hephaestus.integration.consumer.* (NatsConsumerProperties).
                request-timeout: 60s

    cors:
        allowed-origins:
            - ${APPLICATION_HOST_URL:http://localhost:4200}

    # ═══════════════════════════════════════════════════════════════════════════
    # CONTEXT FABRIC AND LOCAL GIT CHECKOUT
    # ═══════════════════════════════════════════════════════════════════════════
    fabric:
        root: ${HEPHAESTUS_FABRIC_ROOT:/data/git-repos}
        gc-retention-days: ${HEPHAESTUS_FABRIC_GC_RETENTION_DAYS:30}

    git:
        enabled: ${GIT_CHECKOUT_ENABLED:false}
        # Bounds on one repository-tree capture. The defaults are the numbers the shipped
        # scm.repository.tree source contract promises; a tree that exceeds them is staged up to the
        # bound and reported PARTIAL, never COMPLETE.
        tree-max-files: ${GIT_TREE_MAX_FILES:20000}
        tree-max-total-size: ${GIT_TREE_MAX_TOTAL_SIZE:32MB}
        tree-max-file-size: ${GIT_TREE_MAX_FILE_SIZE:10MB}

    webapp:
        url: ${HEPHAESTUS_WEBAPP_URL:${APPLICATION_HOST_URL:http://localhost:4200}}

    leaderboard:
        schedule:
            day: 2
            time: "9:00"
        notification:
            # Global on/off for the weekly Slack post; per-workspace channel + team filter
            # live on the Slack Connection's SlackConfig (set via the connection admin API).
            enabled: false
        # PR authors whose assignee-reviewers don't earn points (e.g., AI bots)
        self-review-author-logins:
            - Copilot

    # PAT-mode bootstrap for local dev. init-default only gates PAT workspace creation;
    # GitHub App installations are always processed regardless. Mode docs + cross-field
    # validation live on WorkspaceProperties (IDE-surfaced via spring-configuration-processor).
    workspace:
        init-default: true
        # Dev-only convenience: seed ADMIN membership to the first authenticated visitor of a
        # zero-membership workspace (fresh dev DB). MUST stay false in production (prod overrides
        # it) — otherwise it is a privilege-escalation on org-sync-churned empty-membership state.
        auto-seed-membership: true
        slug:
            # TTL (days) for slug redirects; 0 disables redirects while preserving history.
            redirect:
                ttl-days: 30
        default:
            login: ${GITHUB_PAT_LOGIN:ls1intum}
            token: ${GITHUB_PAT:}
            repositories-to-monitor:
                - ls1intum/Hephaestus
                - ls1intum/Artemis
        init-gitlab-default: ${GITLAB_WORKSPACE_INIT_DEFAULT:false}
        gitlab-default:
            login: ${GITLAB_GROUP_PATH:}
            token: ${GITLAB_PAT:}
            server-url: ${GITLAB_SERVER_URL:}

    cache:
        contributors:
            # Eviction rate in milliseconds (1 hour)
            evict-rate: 3600000
        leaderboard-xp:
            # Eviction rate in milliseconds (60 seconds - leaderboard data is moderately hot)
            evict-rate: 60000

    # ═══════════════════════════════════════════════════════════════════════════
    # FEATURE FLAGS (operational / development toggles)
    # ═══════════════════════════════════════════════════════════════════════════
    # CONFIG-backed feature flags evaluated by FeatureFlagService.
    # ROLE-backed flags (mentor_access, admin, etc.) are stored per account in the account_feature table.
    # Each flag names its own env var so the SHORT name works everywhere: docker/.env, the compose files
    # and the admin docs all say GITLAB_WORKSPACE_CREATION. The long
    # relaxed-binding form (HEPHAESTUS_FEATURES_FLAGS_GITLAB_WORKSPACE_CREATION) also reaches these keys
    # and still wins when both are set. Pinned by FeatureFlagEnvBindingTest.
    features:
        flags:
            gitlab-workspace-creation: ${GITLAB_WORKSPACE_CREATION:false}

    # ═══════════════════════════════════════════════════════════════════════════
    # PRACTICE REVIEW GATE
    # ═══════════════════════════════════════════════════════════════════════════
    # Controls the detection gate for the practice-aware PR review agent.
    # The gate decides whether to submit an agent job for a PR event.
    practice-review:
        # whether to deliver feedback to already-merged PRs
        deliver-to-merged: ${PRACTICE_REVIEW_DELIVER_TO_MERGED:false}
        # minimum minutes between reviews for the same PR (0 = no cooldown)
        cooldown-minutes: ${PRACTICE_REVIEW_COOLDOWN_MINUTES:15}
        # How many reviews one person may ask for by hand, per workspace, per hour (0 = no limit).
        # The only limit keyed on a person rather than on a piece of work, so it is the only one that
        # catches somebody asking for one review each on twenty colleagues' merge requests. The cooldown
        # above will not: those are twenty different PRs.
        max-requests-per-requester-per-hour: ${PRACTICE_REVIEW_MAX_REQUESTS_PER_REQUESTER_PER_HOUR:5}
        # Append the cross-run progress-delta footer and post the re-review notifying reply. Needs at
        # least two runs on a target before it renders anything.
        progress-footer: ${PRACTICE_REVIEW_PROGRESS_FOOTER:false}
        # Stop re-raising a locus the developer already disputed or marked not-applicable. Inert until a
        # response exists for a recurring locus.
        reaction-suppression: ${PRACTICE_REVIEW_REACTION_SUPPRESSION:false}
        # Fleet-wide limits on backfill campaigns (ReviewBackfillProperties). max-window and
        # max-artifacts are the spend guard rails: a campaign wider than either is refused at preflight,
        # before anything is confirmed and before anything is paid for.
        backfill:
            # artifacts one driver tick offers to the review path; bounds how far a campaign can
            # overshoot a budget cap it crosses mid-batch
            batch-size: ${PRACTICE_REVIEW_BACKFILL_BATCH_SIZE:25}
            max-window: ${PRACTICE_REVIEW_BACKFILL_MAX_WINDOW:400d}
            max-artifacts: ${PRACTICE_REVIEW_BACKFILL_MAX_ARTIFACTS:5000}
            # how far back the estimator looks for completed reviews to price a new campaign from
            cost-history-window: ${PRACTICE_REVIEW_BACKFILL_COST_HISTORY_WINDOW:90d}

    # ═══════════════════════════════════════════════════════════════════════════
    # SIGNAL LEDGER (SignalLedgerProperties)
    # ═══════════════════════════════════════════════════════════════════════════
    # The pending-signal reaper: what happens to a signal the review gate refused. The blockers are
    # operator actions (re-activate a workspace, re-point a binding, wait for a budget month to roll
    # over), so the retry interval is a human timescale — retrying fast only multiplies the refusal.
    # A signal still refused after pending-lapse-after is retired rather than re-offered for ever.
    signal-ledger:
        pending-retry-after: ${SIGNAL_LEDGER_PENDING_RETRY_AFTER:1h}
        pending-lapse-after: ${SIGNAL_LEDGER_PENDING_LAPSE_AFTER:7d}
        sweep-batch-size: ${SIGNAL_LEDGER_SWEEP_BATCH_SIZE:200}


    sandbox:
        docker:
            host: ${SANDBOX_DOCKER_HOST:unix:///var/run/docker.sock}
            tls-verify: ${SANDBOX_DOCKER_TLS_VERIFY:false}
            cert-path: ${SANDBOX_DOCKER_CERT_PATH:}
            app-server-container-id: ${SANDBOX_DOCKER_APP_SERVER_CONTAINER_ID:}
            container-runtime: ${SANDBOX_DOCKER_CONTAINER_RUNTIME:}
            cli: ${SANDBOX_DOCKER_CLI:docker}
        max-concurrent-containers: ${SANDBOX_MAX_CONCURRENT:5}
        container-stop-timeout-seconds: ${SANDBOX_STOP_TIMEOUT:10}
        reconciliation-interval-seconds: ${SANDBOX_RECONCILIATION_INTERVAL:60}
        gateway:
            port: ${SANDBOX_API_PORT:8081}
            max-request-bytes: ${SANDBOX_API_MAX_REQUEST_BYTES:4194304}
            requests-per-minute: ${SANDBOX_API_REQUESTS_PER_MINUTE:120}
        max-directory-bytes: ${SANDBOX_MAX_DIRECTORY_BYTES:1073741824}  # 1 GB
        max-directory-entries: ${SANDBOX_MAX_DIRECTORY_ENTRIES:500000}
        default-resource-limits:
            memory-bytes: ${SANDBOX_MEMORY_BYTES:4294967296}  # 4 GB (includes tmpfs)
            cpus: ${SANDBOX_CPUS:2.0}
            pids-limit: ${SANDBOX_PIDS_LIMIT:256}

    # Mentor sandbox resource knobs (idleTtlSeconds, maxFrameChars, queue capacities, …) bind
    # to hephaestus.mentor.* via InteractiveSandboxProperties. Per-workspace enable is in DB.

    # Dev-only actuator for manually triggering PR reviews (never enable in production).
    # Layered safety: (1) this flag, (2) not in endpoint exposure list, (3) Spring Security auth.
    dev:
        trigger-enabled: ${HEPHAESTUS_DEV_TRIGGER_ENABLED:false}

    # ═══════════════════════════════════════════════════════════════════════════
    # AGENT JOB QUEUE (PostgreSQL-backed)
    # ═══════════════════════════════════════════════════════════════════════════
    # The queue IS the agent_job table — a QUEUED insert is the enqueue, and AgentJobExecutor polls
    # for QUEUED rows on a fixed interval. Disabled by default.
    agent:
        image:
            reference: ghcr.io/hephaestus-build/agent-pi:${spring.application.version}
        enabled: ${AGENT_ENABLED:false}
        # How long the poll loop sleeps when there is nothing to claim.
        poll-interval: ${AGENT_POLL_INTERVAL:1s}
        # Max candidate QUEUED jobs considered per poll iteration; bounded by this worker's own
        # free local capacity so one poll never over-claims.
        claim-batch-size: ${AGENT_CLAIM_BATCH_SIZE:5}
        # Max orphan-requeue attempts before a RUNNING job whose owning worker was lost is failed
        # instead of requeued again. Authoritative budget lives on agent_job.retry_count.
        max-retries: ${AGENT_MAX_RETRIES:5}
        heartbeat-interval: 25s
        # Strip heavy job payloads after payload-retention; delete unreferenced terminal jobs after row-retention.
        payload-retention: ${AGENT_PAYLOAD_RETENTION:P14D}
        row-retention: ${AGENT_ROW_RETENTION:P90D}

    # ═══════════════════════════════════════════════════════════════════════════
    # LLM GOVERNANCE
    # ═══════════════════════════════════════════════════════════════════════════
    # Bound to hephaestus.llm.* via agent.LlmProperties (@Validated). Everything that is NOT here
    # lives in the database and is edited by an admin in the UI: the provider connections and their
    # API keys, the model catalog and its prices, the egress host allowlist, and the monthly budgets.
    # These three are deploy-time facts, so they are env vars.
    #
    # The placeholder names are exactly Spring's relaxed-binding names for these properties
    # (HEPHAESTUS_LLM_… ↔ hephaestus.llm.…), matching the hephaestus.auth / hephaestus.integration
    # blocks. That is deliberate: an env var an operator guesses from the property path and the name
    # written here are then the same string, so there is no second name to keep documented.
    llm:
        # ISO 4217 code the USD spend figures are ALSO shown in. Empty (the default) turns the second
        # currency off entirely and every response is exactly what it was before the feature existed.
        # EUR is the one supported value — the ECB reference feed quotes rates per 1 EUR. Anything
        # else FAILS THE BOOT with a message naming what is accepted, including a well-formed code
        # like GBP: an instance that accepted GBP could only ever have shown USD, so a currency this
        # instance cannot convert to is a deploy-time typo, not something to start up and warn about.
        display-currency: ${HEPHAESTUS_LLM_DISPLAY_CURRENCY:}
        egress:
            # Allow http://localhost provider base URLs, for testing against an Ollama/vLLM running
            # beside the app. NEVER set this in production: it is an SSRF hole that lets a workspace
            # admin aim their "provider" at host-local services. The private/link-local/CGNAT address
            # check is unconditional and this flag does not relax it. On in `local` and `e2e` only.
            allow-loopback: ${HEPHAESTUS_LLM_EGRESS_ALLOW_LOOPBACK:false}
        fx:
            # Where the daily euro reference rates come from. Override only on an air-gapped instance
            # that mirrors the ECB file internally.
            daily-url: ${HEPHAESTUS_LLM_FX_DAILY_URL:https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
        usage:
            # Age at which a spend-ledger row is deleted by the nightly sweep. Raise it on an instance
            # whose accounting obligations run longer than the default; the deletion is irreversible.
            retention: ${HEPHAESTUS_LLM_USAGE_RETENTION:P400D}

    # ═══════════════════════════════════════════════════════════════════════════
    # WEBHOOK CONFIGURATION
    # ═══════════════════════════════════════════════════════════════════════════
    # Single `hephaestus.webhook` block consumed by both webhook sides (ADR 0008):
    #   - workspace.GitLabWebhookService reads external-url, secret, token-rotation.* for
    #     auto-registration with the provider.
    #   - integration.webhook.* reads secret (HMAC / token verification) and the nested
    #     publish/stream/http blocks for the inbound receiver.
    # `secret` is shared by design — same value registered with the provider and used
    # to verify incoming bodies. The receiver runs in the `webhook-server` container.
    # external-url defaults to the app's own origin (APPLICATION_HOST_URL); set WEBHOOK_EXTERNAL_URL
    # only when the receiver is fronted at a different origin than the app (e.g. preview).
    webhook:
        external-url: ${WEBHOOK_EXTERNAL_URL:${APPLICATION_HOST_URL:}}
        secret: ${WEBHOOK_SECRET:}
        token-rotation:
            threshold-days: ${WEBHOOK_TOKEN_ROTATION_THRESHOLD_DAYS:7}
            validity-days: ${WEBHOOK_TOKEN_ROTATION_VALIDITY_DAYS:90}
        # ─── Inbound receiver (integration.webhook.*) ───
        publish:
            timeout: 9s          # fits within GitHub's 10s response budget
            max-retries: 5
            retry-base-delay: 200ms
        stream:
            # Must be >= the max vendor replay tolerance (5m: GitLab whsec + Slack v0). GitHub has
            # no timestamp, so this dedup window keyed on X-GitHub-Delivery is its only replay
            # defense; 10m also covers provider redelivery horizons. See WebhookProperties.Stream.
            duplicate-window: 10m
            # The retention CEILING: the longest a delivery is kept if disk allows. max-bytes below
            # is the floor under it, and which of the two binds is a function of volume. Nothing here
            # can predict that — `webhook.stream.oldest.message.age` reports the answer per stream.
            max-age: ${HEPHAESTUS_WEBHOOK_STREAM_MAX_AGE:180d}
            # Streams whose messages carry real personal content, not just change pointers. SQL is the
            # system of record and GDPR erasure cannot reach inside the broker, so these are capped
            # at a transport-buffer horizon rather than the ceiling above:
            #   slack   — the envelope is the channel/DM message text itself.
            #   outline — an Outline webhook delivery embeds the whole document in payload.model.text
            #             (full Markdown body, plus author/collaborator ids), so an erased or corrected
            #             document would otherwise stay readable in JetStream for months.
            max-age-by-stream:
                slack: 72h
                outline: 72h
            # The disk-safety FLOOR. At the bound JetStream deletes the oldest messages to admit new
            # ones, so it is sized to outlast what nightly RECONCILIATION can re-fetch
            # (hephaestus.sync.timeframe-days): inside that window a shed webhook is recoverable from
            # the provider API, outside it, it is recoverable by nothing. There is deliberately no
            # message-count bound — a count says nothing about disk.
            max-bytes: ${HEPHAESTUS_WEBHOOK_STREAM_MAX_BYTES:1GB}
            max-bytes-by-stream:
                # github carries the traffic; the others are a rounding error next to it.
                github: ${HEPHAESTUS_WEBHOOK_STREAM_MAX_BYTES_GITHUB:10GB}
            # What the broker may hold for all four streams together; startup refuses to run if their
            # bounds sum above it. Must match the broker's own max_file and stay under the free space
            # on the JetStream volume — docs/admin/webhook-ingestion-operations explains why.
            storage-budget: ${HEPHAESTUS_WEBHOOK_STREAM_STORAGE_BUDGET:16GB}
            # Startup keeps an existing stream's limits in step with this file, but only limits —
            # subjects, retention, storage and discard are never rewritten. A change that would delete
            # messages the stream already holds is withheld and logged rather than applied. Set this
            # once, deliberately, to let that through.
            allow-destructive-limit-updates: ${HEPHAESTUS_WEBHOOK_STREAM_ALLOW_DESTRUCTIVE_LIMIT_UPDATES:false}
            # A bound that sheds messages deletes them before the broker replies, so the wait scales
            # with the bytes shed, not with the request. Startup-only, and deliberately not the
            # timeout the health probes use — those have to fail fast to be worth alerting on.
            limit-update-timeout: ${HEPHAESTUS_WEBHOOK_STREAM_LIMIT_UPDATE_TIMEOUT:5m}
            monitor-interval: 60s
        shutdown:
            # Drain budget for in-flight publishes after HTTP closes. Docker stop_grace_period
            # must cover: Spring HTTP drain (server.shutdown=graceful + lifecycle timeout 20s)
            # + this drain + small margin. Compose pins stop_grace_period: 40s.
            drain-timeout: 15s
        http:
            # Hard cap enforced by WebhookPayloadSizeFilter (Content-Length check before
            # Spring buffers the body). Tomcat's max-http-post-size only enforces on
            # form-encoded bodies, so we can't rely on it for JSON webhooks.
            max-payload-bytes: 26214400

    # ═══════════════════════════════════════════════════════════════════════════
    # CONTRIBUTORS (Hephaestus meta — who built the app)
    # ═══════════════════════════════════════════════════════════════════════════
    # Token used by ContributorService to fetch the ls1intum/Hephaestus contributor
    # graph. Detached from `hephaestus.integration.github` so SCM-integration code no longer
    # carries an unrelated PAT. Defaults to the legacy GH_AUTH_TOKEN env var so
    # existing deployments keep working without touching their secrets stores.
    contributors:
        github:
            auth-token: ${GH_AUTH_TOKEN:}

    # ═══════════════════════════════════════════════════════════════════════════
    # INTEGRATION FEATURE FLAGS + SCM/SLACK CONFIG
    # ═══════════════════════════════════════════════════════════════════════════
    # Slack and Outline runtime surfaces are opt-in. Leaving these unset keeps
    # OAuth flows, webhook ingress, schedulers, and outbound clients inert; a few
    # pure helper/subject classes may still load because they do no external work.
    # Flip `enabled` to `true` once credentials and redirect URLs are configured.
    integration:
        consumer:
            # Lets JetStream delete a durable nothing has been BOUND to for this long — see
            # NatsConsumerProperties for what boundness measures and why 0 is the only value below 1h.
            # Disposable stacks set something far shorter (docker/preview/compose.app.yaml).
            # A bare number is hours.
            inactive-threshold: ${HEPHAESTUS_INTEGRATION_CONSUMER_INACTIVE_THRESHOLD:30d}
        # ─── GitHub authentication (GitHubProperties) ───
        # Can be any OAuth token, such as the PAT.
        github:
            app:
                # Set to 0 to disable GitHub App mode and use Personal Access Tokens instead
                id: ${GH_APP_ID:0}
                privateKeyLocation: ${GH_APP_PRIVATE_KEY_LOCATION:}
                privateKey: ${GH_APP_PRIVATE_KEY:}
                # URL where users install the GitHub App (shown in workspace creation UI)
                installation-url: ${GH_APP_INSTALLATION_URL:}
            meta:
                # DEPRECATED: token used to live here; the Hephaestus-contributor
                # endpoint now reads hephaestus.contributors.github.auth-token instead.
                # Binding kept for backwards compatibility — remove once all environments
                # have been migrated.
                auth-token: ${GH_AUTH_TOKEN:}
            # GitHub-specific sync tuning (GitHubSyncProperties). Provider-agnostic scheduler
            # knobs (run-on-startup, cron, cooldown, backfill, filters, …) stay under
            # hephaestus.sync (SyncSchedulerProperties).
            sync:
                graphql-timeout: ${HEPHAESTUS_SYNC_GRAPHQL_TIMEOUT:60s}
                extended-graphql-timeout: ${HEPHAESTUS_SYNC_EXTENDED_GRAPHQL_TIMEOUT:120s}
                pagination-throttle: ${HEPHAESTUS_SYNC_PAGINATION_THROTTLE:200ms}
                incremental-sync-enabled: ${HEPHAESTUS_SYNC_INCREMENTAL_ENABLED:true}
                incremental-sync-buffer: ${HEPHAESTUS_SYNC_INCREMENTAL_BUFFER:5m}
                backfill-graphql-timeout: ${HEPHAESTUS_SYNC_BACKFILL_TIMEOUT:120s}
                backfill-pr-page-size: ${HEPHAESTUS_SYNC_BACKFILL_PR_PAGE_SIZE:10}
        # GitLab is opt-in (default off). Flip GITLAB_ENABLED=true to load the GitLab beans +
        # manifest. The gated beans and GitLabManifest both read the `enabled` gate; the
        # sibling url/timeout/throttle keys bind GitLabProperties via @ConfigurationProperties.
        # Used by GitLab-mode workspaces (GitProviderMode.GITLAB_PAT); override default-server-url
        # for self-hosted instances.
        gitlab:
            enabled: ${GITLAB_ENABLED:false}
            # Default GitLab server URL (used when workspace has no custom serverUrl).
            # Falls back to the native-auth GitLab login base URL so deployments with GitLab login
            # automatically use the same instance for workspace creation.
            default-server-url: ${GITLAB_DEFAULT_SERVER_URL:${GITLAB_OAUTH_BASE_URL:https://gitlab.com}}
            # Timeout for standard GraphQL operations (default: 30s)
            graphql-timeout: ${GITLAB_GRAPHQL_TIMEOUT:30s}
            # Extended timeout for complex operations (default: 60s)
            extended-graphql-timeout: ${GITLAB_EXTENDED_GRAPHQL_TIMEOUT:60s}
            # Delay between pagination requests (default: 200ms)
            pagination-throttle: ${GITLAB_PAGINATION_THROTTLE:200ms}
            # Cache duration for token validation results (default: 5m)
            token-validation-cache-duration: ${GITLAB_TOKEN_CACHE_DURATION:5m}
        slack:
            enabled: ${HEPHAESTUS_INTEGRATION_SLACK_ENABLED:false}
            # OAuth client-id/client-secret drive the per-workspace install flow. Slack also
            # verifies inbound Events API and interactivity requests.
            client-id: ${HEPHAESTUS_INTEGRATION_SLACK_CLIENT_ID:}
            client-secret: ${HEPHAESTUS_INTEGRATION_SLACK_CLIENT_SECRET:}
            redirect-uri: ${HEPHAESTUS_INTEGRATION_SLACK_REDIRECT_URI:}
            api-base: ${HEPHAESTUS_INTEGRATION_SLACK_API_BASE:https://slack.com}
            # App signing secret — verifies inbound Events API POSTs to /webhooks/slack and interactivity POSTs to /webhooks/slack/interactivity (v0 HMAC over
            # "v0:{ts}:{rawBody}", 300s replay window). Inbound (mentor DM + channel ingest) is inert without it.
            signing-secret: ${HEPHAESTUS_INTEGRATION_SLACK_SIGNING_SECRET:}
            conversation-ingest:
                # Channel/group message ingestion (the channel-ingest → conversation-detection →
                # conversation-feedback subsystem). The capability is AVAILABLE by default so each workspace can
                # self-serve, but availability alone reads nothing: actual ingestion still requires a workspace
                # admin to activate a channel (consent_state=ACTIVE) AND is gated per-person by the opt-out
                # firewall, and is forward-only (never pre-announcement history). Nothing is read until a channel
                # is deliberately activated. Set to false to hard-disable the whole subsystem fleet-wide.
                enabled: ${HEPHAESTUS_INTEGRATION_SLACK_CONVERSATION_INGEST_ENABLED:true}
                # Slack Events API ingest rides the core /webhooks/slack + NATS/JetStream framework
                # (subjects slack.<team>.<scope>.<event>, Nats-Msg-Id = slack-<event_id>).
                # The mentor response stream itself is direct Slack Web API output, not NATS.
        outline:
            # Master switch for the Outline documentation integration (install, sync, content projection).
            # Off by default; a workspace admin still installs per-workspace with a base URL + token.
            enabled: ${HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED:false}
            allowed-origins: ${HEPHAESTUS_INTEGRATION_OUTLINE_ALLOWED_ORIGINS:}
            sync:
                # Reconcile schedule for the per-workspace document mirror (default every six hours).
                cron: ${HEPHAESTUS_INTEGRATION_OUTLINE_SYNC_CRON:0 0 */6 * * *}
                # Max document exports one workspace reconcile pass may spend; bounds the cost of a huge
                # corpus's first sync. A collection that ran out of budget stays PENDING (no watermark, no
                # tombstones) and the catch-up tick resumes it. 500 covers most corpora in one pass.
                export-budget: ${HEPHAESTUS_INTEGRATION_OUTLINE_SYNC_EXPORT_BUDGET:500}
                # How often the catch-up tick sweeps collections still awaiting a clean pass. Five minutes
                # converges a freshly registered large collection quickly; a caught-up fleet has no pending
                # rows, so a tick then costs zero API calls.
                catch-up-delay: ${HEPHAESTUS_INTEGRATION_OUTLINE_SYNC_CATCH_UP_DELAY:PT5M}
            cache:
                # Per-workspace cap on the total size of mirrored Markdown bodies; least-recently-materialized
                # bodies are evicted (the row survives as a directory marker) once the mirror grows past it.
                max-size-mb: ${HEPHAESTUS_INTEGRATION_OUTLINE_CACHE_MAX_SIZE_MB:200}
            # How long a document that has vanished upstream is kept as a tombstone before its row is dropped.
            staleness: ${HEPHAESTUS_INTEGRATION_OUTLINE_STALENESS:30d}

    sentry:
        dsn: ${SENTRY_DSN:}

# Protects against cascading failures when GitHub API is unavailable; defaults in ResilienceConfig.java.
resilience4j:
    circuitbreaker:
        configs:
            default:
                slidingWindowSize: 10
                failureRateThreshold: 50
                waitDurationInOpenState: 30s
                permittedNumberOfCallsInHalfOpenState: 3
                minimumNumberOfCalls: 5
                slowCallDurationThreshold: 10s
                slowCallRateThreshold: 80
        instances:
            githubGraphQl:
                baseConfig: default
            githubRest:
                baseConfig: default
            gitlabGraphQl:
                baseConfig: default

# Shared logging defaults (apply to every profile, incl. prod which sets no overrides).
# WARN is reserved for genuinely actionable situations; per-event/per-changeset chatter is
# silenced here (3rd-party loggers) or downgraded to DEBUG at the source (our own packages).
logging:
    level:
        # Spring's generic web DEBUG logger includes decoded request/response bodies. Vendor OAuth and
        # installation-token responses can contain credentials, so keep the body logger closed even when
        # a broader org.springframework.web package is raised to DEBUG for local troubleshooting.
        org.springframework.web.HttpLogging: INFO
        org.springframework.web.reactive.function.client.ExchangeFunctions: INFO
        # Liquibase logs every changeset at INFO on each boot (the bulk of startup noise).
        # WARN keeps real migration problems (validation/checksum/lock-wait).
        liquibase: WARN
        # Hibernate HHH100503 (batch-on-release) was a symptom of the achievement lock
        # contention fixed separately; WARN keeps genuine batch problems visible.
        org.hibernate.orm.jdbc.batch: WARN
        # Webhook receipts and per-event bookkeeping are logged at DEBUG at the source, so
        # per-repo sync rollups stay the only INFO. Flip the package to DEBUG to restore the
        # full per-event firehose for diagnosis (no redeploy needed):
        #   logging.level.de.tum.cit.aet.hephaestus.integration.scm: DEBUG
---
# The local profile starts ../compose.yaml and leaves its services running after the app exits.
spring:
    config:
        activate:
            on-profile: local
    docker:
        compose:
            enabled: true
            file: ../compose.yaml
            lifecycle-management: start-only
