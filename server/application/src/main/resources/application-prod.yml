spring:
    datasource:
        url: jdbc:${DATABASE_URL}
        username: ${DATABASE_USERNAME}
        password: ${DATABASE_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: none
    liquibase:
        contexts: prod

    # No resourceserver.jwt.issuer-uri in prod: tokens are issued + verified by Hephaestus
    # itself (core.auth). Required prod env: HEPHAESTUS_AUTH_ISSUER,
    # HEPHAESTUS_AUTH_STATE_COOKIE_KEY, HEPHAESTUS_TRUSTED_PROXIES, GITHUB_OAUTH_CLIENT_ID/SECRET,
    # GITLAB_OAUTH_CLIENT_ID/SECRET (+ GITLAB_OAUTH_BASE_URL/DISPLAY_NAME for a self-hosted GitLab).
    # Designate instance super-admins via HEPHAESTUS_AUTH_BOOTSTRAP_ADMINS (comma-separated
    # <provider>:@username or <provider>:<subject>, e.g. gitlab:@m.mustermann,github:1234567) —
    # promoted to APP_ADMIN on login; optional one-time
    # HEPHAESTUS_AUTH_BOOTSTRAP_TOKEN enables the break-glass POST /auth/bootstrap-admin.
    # See ADR 0017 + docs/runbooks/auth-cutover.md (First instance admin).

    # Belt-and-suspenders: the spring-boot-docker-compose jar ships in the image (it powers the
    # local profile), and Boot's default is enabled=true. Prod brings infra up via docker/compose.*
    # on the host, never from inside the app container, so explicitly disable Boot's auto-start
    # instead of relying on "no compose.yaml happens to be in the workdir".
    docker:
        compose:
            enabled: false

server:
    forward-headers-strategy: native
    tomcat:
        # Proxy trust for RemoteIpValve (activated by forward-headers-strategy: native).
        # Boot's DEFAULT internal-proxies trusts ALL of RFC-1918 (10/8, 172.16/12, 192.168/16,
        # 169.254/16, 127/8). Behind in-cluster ingress the pod peer is itself in-range, so a client
        # could spoof X-Forwarded-For and forge getRemoteAddr(), defeating the pre-auth IP rate-limit
        # buckets (AuthRateLimitFilter.clientIp). Pin to the real ingress address(es) instead.
        # HEPHAESTUS_TRUSTED_PROXIES is a Tomcat internal-proxies REGEX (NOT CIDR) — e.g. the single
        # ingress address or a tight subnet pattern. ProxyTrustGuard fails the boot if this is left at
        # the wildcard default in prod.
        remoteip:
            # Empty default so an unset env produces ProxyTrustGuard's clear fail-fast (not a raw
            # placeholder-resolution error). The guard rejects a blank value in prod+native.
            internal-proxies: ${HEPHAESTUS_TRUSTED_PROXIES:}
            remote-ip-header: X-Forwarded-For
            protocol-header: X-Forwarded-Proto
        redirect-context-root: false
        # No Tomcat file access log. Writing one to a host volume added nothing but a boot dependency
        # on a writable /var/log/hephaestus (a fresh named volume is root:root, which aborted startup).
        # Deliberately, NO layer writes a per-request IP/URL record: the Traefik ingress
        # (docker/compose.proxy.yaml) runs without --accesslog too, which is Traefik's default. Client
        # IPs are recorded only against auth_event rows, under that table's partitioned retention
        # window. This is a documented GDPR posture (docs/admin/dsms/): enabling either access log is a
        # material change that needs the record of processing updated with it.
        accesslog:
            enabled: false

hephaestus:
    host-url: ${APPLICATION_HOST_URL}

    cors:
        allowed-origins:
            - ${APPLICATION_HOST_URL}

    webapp:
        url: ${APPLICATION_HOST_URL}

    workspace:
        init-default: false
        # NEVER auto-seed ADMIN membership in production — a first-visitor of an empty-membership
        # workspace must not be silently elevated (privilege-escalation). Explicit for clarity.
        auto-seed-membership: false


    # ═══════════════════════════════════════════════════════════════════════════
    # SCM + SLACK + OUTLINE INTEGRATION (Production)
    #
    # Slack: per-workspace bot tokens are issued via OAuth and encrypted at rest in the
    # `connection` table — there is no global bot token. Events API and interactivity are
    # verified with HEPHAESTUS_INTEGRATION_SLACK_SIGNING_SECRET on the webhook-server.
    #
    # Outline: per-workspace API key, pasted by a workspace admin and encrypted at rest in the
    # same `connection` table (Outline keys are session-scoped and cannot self-rotate, so there
    # is no refresh flow — a lapsed key is re-entered by hand). Its webhook secret is
    # PER-SUBSCRIPTION, minted by OutlineWebhookRegistrar when it registers the subscription and
    # stored on that same connection row — so, unlike Slack, there is NO global signing secret
    # env var and the webhook-server verifies deliveries by reading the row through JPA.
    # HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED gates every Outline bean (matchIfMissing=false) and
    # must be set on application-server, application-worker (the agent context is assembled
    # there) and webhook-server (which otherwise answers 501 to every delivery).
    # OUTLINE_OAUTH_* additionally seeds the link-only login provider; OUTLINE_OAUTH_BASE_URL is
    # required whenever OUTLINE_OAUTH_CLIENT_ID is set (a blank base URL logs an ERROR and skips the seed).
    # Everything binds from env in the base application.yml — Outline needs no prod-only override.
    # ═══════════════════════════════════════════════════════════════════════════
    integration:
        github:
            app:
                # Set to 0 to disable GitHub App mode and use Personal Access Tokens instead
                id: ${GH_APP_ID:0}
                privateKeyLocation: ${GH_APP_PRIVATE_KEY_LOCATION:}
                privateKey: ${GH_APP_PRIVATE_KEY:}
            meta:
                auth-token: ${GH_AUTH_TOKEN:}

    sync:
        run-on-startup: ${MONITORING_RUN_ON_STARTUP:true}
        timeframe-days: ${MONITORING_TIMEFRAME:7}
        cron: ${MONITORING_SYNC_CRON:0 0 * * * *}
        cooldown-minutes: ${MONITORING_SYNC_COOLDOWN_IN_MINUTES:60}
        backfill:
            enabled: ${MONITORING_BACKFILL_ENABLED:true}
            batch-size: ${MONITORING_BACKFILL_BATCH_SIZE:50}
            rate-limit-threshold: ${MONITORING_BACKFILL_RATE_LIMIT_THRESHOLD:500}
            interval-seconds: ${MONITORING_BACKFILL_INTERVAL_SECONDS:60}
        nats:
            enabled: ${NATS_ENABLED:false}
            server: ${NATS_SERVER:}
            durable-consumer-name: ${NATS_DURABLE_CONSUMER_NAME:hephaestus}

    # ═══════════════════════════════════════════════════════════════════════════
    # AUTH (Production) — Hephaestus-native, see ADR 0017
    # ═══════════════════════════════════════════════════════════════════════════
    auth:
        # Default keeps the URI valid when HEPHAESTUS_AUTH_ISSUER is unset. The auth web layer is
        # server-only (gated off worker/webhook), but the CDS build binds this @ConfigurationProperties
        # record eagerly on every role — without a default the worker/webhook crash on the bare
        # ${...} placeholder. The server always sets the env var, so it gets the real issuer.
        issuer: ${HEPHAESTUS_AUTH_ISSUER:http://localhost:8080}
        state-cookie-key: ${HEPHAESTUS_AUTH_STATE_COOKIE_KEY}
        # Traefik strips /api before the request reaches the app (see docker/compose.app.yaml), and
        # native forward-headers can't restore the prefix — re-add it to the browser-facing OAuth URLs.
        api-base-path: /api

    # ═══════════════════════════════════════════════════════════════════════════
    # GITLAB INTEGRATION (Production)
    # ═══════════════════════════════════════════════════════════════════════════
    # Enabled via GITLAB_ENABLED env var; defaults come from base application.yml.

    # ═══════════════════════════════════════════════════════════════════════════
    # AGENT SANDBOX & PRACTICE REVIEW (Production)
    # ═══════════════════════════════════════════════════════════════════════════
    # Sandbox, the agent job queue (PostgreSQL-backed), git checkout, and LLM proxy are
    # configured via env vars in compose.app.yaml. Defaults come from base application.yml.

    agent:
        image:
            require-digest: true

    # ═══════════════════════════════════════════════════════════════════════════
    # SENTRY ERROR TRACKING (Production)
    # ═══════════════════════════════════════════════════════════════════════════
    sentry:
        dsn: ${SENTRY_DSN}
