# Worker profile overlay — SPRING_PROFILES_ACTIVE=prod,worker.
spring:
    config:
        activate:
            on-profile: worker

    # Worker pod has no user-facing API. The Hephaestus JwtDecoder (core.auth) still wires
    # harmlessly, but we exclude Boot's resource-server autoconfig so a worker-only pod never
    # depends on user-auth wiring at boot.
    autoconfigure:
        exclude:
            - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

    main:
        web-application-type: servlet

    # Preparing code evidence can hold two connections per review (docs/admin/runtime-roles.mdx).
    datasource:
        hikari:
            maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:32}

    liquibase:
        enabled: false
    jpa:
        hibernate:
            ddl-auto: none
    lifecycle:
        timeout-per-shutdown-phase: 6m

server:
    # No user-facing API: keep the application connector on loopback. Metrics and probes
    # use the separate management listener, reachable on the private container network.
    port: ${SERVER_PORT:8080}
    address: 127.0.0.1

hephaestus:
    runtime:
        server:
            enabled: false
        webhook:
            enabled: false
        worker:
            enabled: true

    sync:
        nats:
            enabled: false

    worker:
        control:
            endpoint: ${HEPHAESTUS_HUB_URL:}
            registration-token: ${HEPHAESTUS_WORKER_REGISTRATION_TOKEN:}
