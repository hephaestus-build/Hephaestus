# Activated by SPRING_PROFILES_ACTIVE=prod,webhook on the webhook-server container.
# The receiver runs alone so an application-server restart cannot interrupt webhook reception
# (ADR 0008), and it scans only core.runtime.WebhookReceiverScope, so it has no database (ADR 0066).
spring:
    config:
        activate:
            on-profile: webhook

    # The receiver holds no database (ADR 0066): core.runtime.WebhookReceiverScope keeps every component that
    # needs one out of the scan, and these remove the auto-configured DataSource, JPA, Liquibase and the
    # event publication registry, which would otherwise connect at start.
    autoconfigure:
        exclude:
            - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
            - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
            - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
            - org.springframework.boot.liquibase.autoconfigure.LiquibaseAutoConfiguration
            - org.springframework.modulith.events.jdbc.JdbcEventPublicationAutoConfiguration
            - org.springframework.modulith.events.config.EventPublicationAutoConfiguration


hephaestus:
    runtime:
        server:
            enabled: false
        worker:
            enabled: false
        webhook:
            enabled: true

    # Must stay true so config.NatsConfig contributes the @Bean Connection that
    # the webhook publisher reuses (no second NATS connection per pod).
    sync:
        nats:
            enabled: true

logging:
    structured:
        json:
            add:
                "[runtime.role]": webhook
    level:
        de.tum.cit.aet.hephaestus.integration.core.webhook: INFO
