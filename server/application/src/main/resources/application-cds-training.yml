# Activated during the Paketo CDS training run only (SPRING_PROFILES_ACTIVE=cds-training is set in
# application/project.toml; the runtime SPRING_PROFILES_ACTIVE takes precedence).
# Suppresses DB-dependent beans so context refresh succeeds without a Postgres reachable from the
# buildpack builder — Spring Boot then exits via spring.context.exit=onRefresh (set by Paketo).
spring:
    liquibase:
        enabled: false
    datasource:
        hikari:
            initialization-fail-timeout: -1
    jpa:
        hibernate:
            ddl-auto: none
        properties:
            # Identify the database without opening a JDBC connection during image builds.
            jakarta.persistence.database-product-name: PostgreSQL
            hibernate:
                boot:
                    allow_jdbc_metadata_access: false
    docker:
        compose:
            enabled: false

# Artifact generation loads the runtime contract, not deployment bootstrap or integrations.
hephaestus:
    sync:
        nats:
            enabled: false
    workspace:
        init-default: false
        init-gitlab-default: false
