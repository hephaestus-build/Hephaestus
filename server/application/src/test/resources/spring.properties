# The Spring test context cache keeps at most this many application contexts per test JVM (Spring's
# default is 32). One integration context retains about 100 MB on Java 21 and more on Java 25, whose
# ClassFile metadata reader keeps extra state (spring-framework#37112, #36978); 32 of them overran the
# integration tier's 4 GB heap on Java 25. ADR 0109 records the measurement.
spring.test.context.cache.maxSize=24
