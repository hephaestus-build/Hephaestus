# Minimal test configuration for Spring Boot tests
spring:
    # Allow test configs to override production beans
    main:
        allow-bean-definition-overriding: true
    # Database configuration for tests (overridden by Testcontainers)
    datasource:
        # These values will be overridden by @DynamicPropertySource in test classes
        url: jdbc:postgresql://localhost:5432/test
        driver-class-name: org.postgresql.Driver
        username: test
        password: test
        # HikariCP configuration optimized for tests
        # Note: Pool size increased to handle REQUIRES_NEW nested transactions
        hikari:
            maximum-pool-size: 10
            # Spring keeps up to 32 test contexts cached, each with its own pool; an idle one holds no connection.
            minimum-idle: 0
            connection-timeout: 5000 # 5 seconds (fail fast)
            idle-timeout: 10000 # HikariCP's lowest idle timeout
            validation-timeout: 3000 # 3 seconds
            leak-detection-threshold: 5000 # 5 seconds for leak detection
            connection-test-query: SELECT 1

    sql:
        init:
            mode: always
            schema-locations: classpath:db/auth-event-sequence.sql,classpath:db/rate-limit-buckets.sql

    # Liquibase owns the same native constraints and functions in tests and production.
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false

    # Test-specific configurations for faster shutdown
    task:
        execution:
            shutdown:
                await-termination: true
                await-termination-period: 5s

    liquibase:
        enabled: true
        contexts: dev

    modulith:
        events:
            jdbc:
                schema-initialization:
                    enabled: false

    # Security configuration for tests (minimal config)
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8081/realms/test

# Disable workspace bootstrapping during tests to prevent API calls
hephaestus:
    auth:
        passkeys:
            rp-id: localhost
            allowed-origins: http://localhost:4200
        rate-limit:
            enabled: false
        # The development extension key's id: installed-client sign-in and its CORS origin under test.
        browser-extension-ids: ijkajblcbajjpjbknfgdiiiljipafiko
    # Tests without a sandbox keep the worker role off. Role-graph tests supply test Pod metadata and mock the
    # Kubernetes client and isolation probe; the live suite uses the chart worker's actual authority.
    runtime:
        worker:
            enabled: false
    # Agent off in tests, pinned here rather than left to application.yml's AGENT_ENABLED default: the
    # tests that need a resubmitter or the job event listener build it by hand, and some register a
    # bean of the same type, so a leaked AGENT_ENABLED=true from server/.env would make the production
    # bean a second candidate and let it settle signals before the test does.
    agent:
        enabled: false
    # Each item event reaches its readiness edge at once; the quiet window's own tests open one.
    item-event-ledger:
        quiet-window: 0s
    # Tests take expired Heph turn leases back themselves; a background sweep would race them.
    mentor:
        turn:
            lease-reaper-delay: P1D
            # One Heph slot, as a deployment with one worker that runs one turn: a question that a worker may start
            # says that Heph answers other questions once any turn runs. Tests leave turns running, so a test that
            # needs a free slot builds its own MentorTurnWaits.
            capacity: 1
        # Slack is on suite-wide; the Heph Slack projector would take Slack turns before the tests that build their
        # own projector.
        slack:
            projector:
                enabled: false
    # Loud enforcement under test: any unguarded scoped-table query throws.
    # Production runs in 'log' mode for the staging canary period; this override
    # ensures tenancy bugs surface in CI rather than being masked.
    tenancy:
        enforcement: throw
    security:
        # 32-char (256-bit) AES key for CredentialBundleConverter under test.
        # Encrypted credential blobs only persist when a key is configured; without
        # this, integration tests that go through ConnectionService.rotateBearerToken
        # fail at the boot stage where the converter requires a key.
        encryption-key: test-encryption-key-32-bytes-aes
        credential-encryption-key: test-encryption-key-32-bytes-aes
    workspace:
        init-default: false # Disable PAT workspace bootstrap
        creation-policy: SELF_SERVICE
        # A5: keep the empty-membership ADMIN auto-seed OFF by default in tests (mirrors prod), so the
        # disabled-case test is deterministic. The enabled path is covered by a @TestPropertySource override.
        auto-seed-membership: false
    # OAuth state HMAC secret + webhook secret — required by HmacOAuthStateService
    # at boot. Without these the integration framework can't construct.
    integration:
        oauth-state:
            secret: test-oauth-state-hmac-secret-not-real
        slack:
            enabled: true
            signing-secret: test-slack-signing-secret-not-real
        # Suite-wide so GitLab @ConditionalOnProperty beans load in the base context — the GitLab
        # tests no longer need a per-class @TestPropertySource (which forked a context each).
        gitlab:
            enabled: true
            default-server-url: https://gitlab.lrz.de
    webhook:
        # Test brokers share the runner's disk with application and image builds.
        stream:
            max-bytes: 128MB
            max-bytes-by-stream:
                github: 128MB
            storage-budget: 512MB
        secret: test-github-webhook-secret-not-real-0123456789
        external-url: http://localhost:8080
        routing:
            secret: test-gitlab-routing-key-not-real-0123456789
    cors:
        allowed-origins:
            - http://localhost:4200
    webapp:
        url: http://localhost:4200
    # Sync configuration for tests
    sync:
        run-on-startup: false
        nats:
            enabled: false
            server: nats://localhost:4222
            durable-consumer-name: test-consumer
    fabric:
        root: /tmp/hephaestus-test-git-repos
    git:
        enabled: false
    practice-review:
        cooldown-minutes: 0

# Logging configuration for tests.
# One flat key, not a nested tree: the package this raises above `root: WARN` was spelled out branch by
# branch and kept pointing at the pre-rename `de.tum.in.www1` long after it stopped existing, matching
# nothing. Because Spring's LoggingSystem reconfigures Logback for the whole JVM, the first
# context-booting test in a test JVM left every later test in that fork at WARN — which is how a
# unit test asserting on an INFO line passed alone and failed in the tier.
logging:
    level:
        root: WARN
        "de.tum.cit.aet.hephaestus": INFO
