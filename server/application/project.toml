# Buildpacks recipe for the server image, applied by pack to the packaged executable
# JAR; docs/decisions/0067-the-server-image-builds-with-buildpacks-and-cds.md has the rationale. The descriptor schema has no
# run-image key, so ci-build.yml pins the run image beside the build.
[_]
schema-version = "0.2"

[io.buildpacks]
builder = "paketobuildpacks/builder-noble-java-tiny@sha256:029a82373805051d3ac3c65e7fcdc634dea5c53d8fc6e3ec97f42cc7f757fd84"

# Naming a group replaces the builder's order, so the java composite is listed before the
# health-checker buildpack the builder does not bundle; it contributes the shell-free `thc` probe the
# distroless run image needs for a real HEALTHCHECK in the image and the release upgrade drills.
[[io.buildpacks.group]]
id = "paketo-buildpacks/java"

[[io.buildpacks.group]]
uri = "docker://paketobuildpacks/health-checker@sha256:7ef317843d076c93682a2f0f79384dc11ff20227cf779d3b11b9f34e9d8b9246"

# CI mounts the buildpack dependencies as a binding (scripts/buildpack-dependencies.ts). A local build
# downloads them from GitHub releases in one attempt. By default the buildpacks stop when a response
# sends no headers within 5 seconds, and GitHub can take longer to answer.
[[io.buildpacks.build.env]]
name = "BP_RESPONSE_HEADER_TIMEOUT"
value = "60"

# No BP_JVM_VERSION: the JVM buildpack takes the JVM line from the JAR manifest's Build-Jdk-Spec, which
# Gradle writes from .java-version, and gate:toolchain refuses a value that restates it.
[[io.buildpacks.build.env]]
name = "BP_JVM_CDS_ENABLED"
value = "true"

# The AOT cache that the training run writes loads only when each launch resolves the same modules
# (JEP 483). The chart's flight recording adds the module jdk.jfr (JDK-8375469). So the training run
# and every launch process, the migrate run mode included, add jdk.jfr too. A launch without it, or
# with another module or agent, rejects the cache and loads every class into Metaspace.
# The buildpack starts the training run with this variable as its whole environment, so it also names
# the training profile.
[[io.buildpacks.build.env]]
name = "TRAINING_RUN_JAVA_TOOL_OPTIONS"
value = "--add-modules=jdk.jfr -Dspring.profiles.active=cds-training"

[[io.buildpacks.build.env]]
name = "BPE_APPEND_JAVA_TOOL_OPTIONS"
value = "--add-modules=jdk.jfr"

[[io.buildpacks.build.env]]
name = "BPE_DELIM_JAVA_TOOL_OPTIONS"
value = " "

[[io.buildpacks.build.env]]
name = "BP_HEALTH_CHECKER_ENABLED"
value = "true"

# The memory calculator sizes Metaspace from the number of classes that the JVM loads. By default it
# estimates 35 % of the classes in the image, which is below what the server loads on Java 25. The value
# is the count that the server loads after start-up and warm-up, plus a margin of about 20 %. The
# environment-variables buildpack writes it as a launch default, so a deployment can still set its own
# BPL_JVM_LOADED_CLASS_COUNT.
[[io.buildpacks.build.env]]
name = "BPE_DEFAULT_BPL_JVM_LOADED_CLASS_COUNT"
value = "55000"

# The CDS training run boots under application-cds-training.yml; the runtime SPRING_PROFILES_ACTIVE
# overrides this buildpack default.
[[io.buildpacks.build.env]]
name = "SPRING_PROFILES_ACTIVE"
value = "cds-training"
