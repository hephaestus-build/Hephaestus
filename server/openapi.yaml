components:
  schemas:
    AccountRef:
      type: object
      description: A human-readable account identity. <code>displayName</code>/<code>email</code>
        are null for deleted accounts.
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          type: integer
          format: int64
      required:
      - id
    Achievement:
      type: object
      description: Achievement with user-specific progress information
      properties:
        category:
          type: string
          description: Category for grouping achievements
          enum:
          - pull_requests
          - commits
          - communication
          - issues
          - milestones
          example: pull_requests
        id:
          type: string
          $ref: "#/components/schemas/AchievementId"
          description: Unique identifier for the achievement
          example: pr.merged.common.1
        isHidden:
          type: boolean
          description: Whether the achievement should be hidden until unlocked
        parent:
          type: string
          description: Parent achievement in progression chain
          example: first_pull
        progressData:
          description: The structured progress data based on the achievements evaluator
          oneOf:
          - $ref: "#/components/schemas/BinaryAchievementProgress"
          - $ref: "#/components/schemas/LinearAchievementProgress"
        rarity:
          type: string
          description: Visual level tier/rarity for badge styling
          enum:
          - common
          - uncommon
          - rare
          - epic
          - legendary
          - mythic
          example: common
        status:
          type: string
          description: Current status of the achievement for this user
          enum:
          - locked
          - available
          - unlocked
          - hidden
          example: unlocked
        unlockedAt:
          type: string
          format: date-time
          description: "When the achievement was unlocked, absent while it is still\
            \ locked"
      required:
      - category
      - id
      - progressData
      - rarity
      - status
    AchievementId:
      type: string
      enum:
      - commit.common.1
      - commit.common.2
      - commit.epic
      - commit.legendary
      - commit.mythic
      - commit.rare
      - commit.special.atomic_changes
      - commit.special.brute_force
      - commit.special.cross_boundary
      - commit.special.itsy_bitsy
      - commit.uncommon.1
      - commit.uncommon.2
      - issue.close.common.1
      - issue.close.common.2
      - issue.close.epic
      - issue.close.legendary
      - issue.close.rare
      - issue.close.uncommon
      - issue.open.common.1
      - issue.open.common.2
      - issue.open.epic
      - issue.open.legendary
      - issue.open.rare
      - issue.open.uncommon
      - issue.special.hive_mind
      - issue.special.necromancer
      - issue.special.oracle
      - milestone.all_epic
      - milestone.all_legendary
      - milestone.all_rare
      - milestone.first_action
      - milestone.long_time_return
      - milestone.night_owl
      - milestone.polyglot
      - pr.merged.common.1
      - pr.merged.common.2
      - pr.merged.epic
      - pr.merged.legendary
      - pr.merged.rare
      - pr.merged.uncommon
      - pr.special.speedster
      - review.common.1
      - review.common.2
      - review.epic
      - review.legendary
      - review.mythic
      - review.rare
      - review.uncommon.1
      - review.uncommon.2
    AchievementProgress:
      description: Polymorphic progress data
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
      required:
      - type
    AdminAccountView:
      type: object
      properties:
        appRole:
          type: string
        displayName:
          type: string
        id:
          type: integer
          format: int64
        primaryEmail:
          type: string
        status:
          type: string
    AdminLlmUsageReport:
      type: object
      description: "Instance-admin per-workspace month rollup (metadata only, no tenant\
        \ content)"
      properties:
        fx:
          $ref: "#/components/schemas/FxRateInfo"
          description: Display-only conversion when the instance has a display currency.
            Absent = show USD only. Applies to every USD amount in this response.
        month:
          type: string
          description: "Calendar month (UTC), ISO yyyy-MM"
          example: 2026-07
        workspaces:
          type: array
          description: "One row per workspace, including workspaces with no ledger\
            \ activity this month"
          items:
            $ref: "#/components/schemas/AdminWorkspaceLlmUsage"
      required:
      - month
      - workspaces
    AdminWorkspaceLlmUsage:
      type: object
      description: "One workspace's month of spend, as an instance admin sees it"
      properties:
        displayName:
          type: string
        events:
          type: integer
          format: int64
          description: "Ledger events (jobs / mentor turns) this month, either purse"
        instanceBudgetVerdict:
          type: string
          description: "Whether shared-model spend is within the instance cap, has\
            \ reached it, or can't be confirmed because some shared-model usage has\
            \ no price set."
          enum:
          - WITHIN
          - EXHAUSTED
          - UNVERIFIABLE
        instanceMonthlyBudgetUsd:
          type: number
          format: decimal
          description: Monthly cap in USD on this workspace's spend on shared (instance)
            models — the money this instance pays for; null = uncapped. Yours to set.
        instancePaused:
          type: boolean
          description: "Whether work on SHARED models is paused for this workspace\
            \ right now (current month only) — authoritative, mirroring the live gate."
        instanceTotalCostUsd:
          type: number
          format: decimal
          description: "This month's confirmed spend on shared (instance) models,\
            \ in USD — compared against instanceMonthlyBudgetUsd."
        ownProviderBudgetVerdict:
          type: string
          description: The same verdict for the workspace's own-provider spend against
            its own cap.
          enum:
          - WITHIN
          - EXHAUSTED
          - UNVERIFIABLE
        ownProviderMonthlyBudgetUsd:
          type: number
          format: decimal
          description: "The workspace's own cap in USD on its own-provider spend;\
            \ null = uncapped. Read-only here — it governs the workspace's money,\
            \ so only its own admins may change it."
        ownProviderPaused:
          type: boolean
          description: Whether work on the workspace's OWN provider is paused right
            now.
        ownProviderTotalCostUsd:
          type: number
          format: decimal
          description: "This month's confirmed spend on the workspace's own connected\
            \ provider(s), in USD — compared against ownProviderMonthlyBudgetUsd."
        workspaceSlug:
          type: string
          description: "Addresses the workspace everywhere else in the API, including\
            \ its cap"
      required:
      - displayName
      - events
      - instanceBudgetVerdict
      - instancePaused
      - instanceTotalCostUsd
      - ownProviderBudgetVerdict
      - ownProviderPaused
      - ownProviderTotalCostUsd
      - workspaceSlug
