          - CURRENT_REVIEWS
          - EARLIER_REVIEWS
          - EARLIER_REVIEWS_CRITERIA_UNKNOWN
          - null
        yourStanding:
          type:
          - string
          - "null"
          description: "The reader's current standing in the practice, the one their\
            \ practice profile shows: the part they are marked in. Absent unless the\
            \ split counts the reader"
          enum:
          - DEVELOPING
          - STRENGTH
          - MIXED
          - NOT_OBSERVED
          - NO_OPPORTUNITY
