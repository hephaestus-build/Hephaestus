        id:
          type: integer
          format: int64
          description: Price row id
        note:
          type: string
          description: Note
        per1mCacheReadUsd:
          type: number
          format: decimal
          description: Cache-read rate per 1M tokens (USD)
        per1mCacheWriteUsd:
          type: number
          format: decimal
          description: Cache-write rate per 1M tokens (USD)
        per1mInputUsd:
          type: number
          format: decimal
          description: Input rate per 1M tokens (USD)
        per1mOutputUsd:
          type: number
          format: decimal
          description: Output rate per 1M tokens (USD)
        pricingMode:
          type: string
          description: Pricing mode
          enum:
          - PRICED
          - NO_CHARGE
          - UNPRICED
      required:
