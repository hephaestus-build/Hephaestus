    OutlineCollection:
      type: object
      description: A mirrored Outline collection with its sync state and live document
        count
      properties:
        collectionId:
          type: string
          description: Outline collection id (UUID; the natural key)
        color:
          type:
          - string
          - "null"
          description: Collection color as configured in Outline
        createdAt:
          type: string
          format: date-time
          description: When the collection was registered for mirroring
        description:
          type:
          - string
          - "null"
          description: Collection description as shown in Outline
        documentCount:
          type: integer
          format: int64
          description: Live (non-tombstoned) mirrored document count
        documentsUpstream:
          type:
          - "null"
          - integer
          format: int32
          description: Documents upstream reported for this collection at the last
            enumeration (coverage denominator)
        exportsSkippedForBudget:
          type:
          - "null"
          - integer
          format: int32
          description: Exports the last pass skipped because the shared budget ran
            out (0 on a clean pass)
        icon:
          type:
          - string
          - "null"
          description: Collection icon as configured in Outline
        id:
          type: string
          description: Internal registry row id
          pattern: "^[1-9][0-9]*$"
        lastSyncError:
          type:
          - string
          - "null"
          description: "Last sync failure for this collection, cleared on the next\
            \ clean pass"
        lastSyncedAt:
          type:
          - string
          - "null"
          format: date-time
          description: "When this collection last completed a full reconcile pass,\
            \ if any"
        name:
          type:
          - string
          - "null"
          description: "Collection name as shown in Outline, if known"
        state:
          type: string
          description: Mirror lifecycle state (PAUSED freezes sync but keeps documents)
          enum:
          - ENABLED
          - PAUSED
        syncStatus:
          type: string
          description: Whether a clean full pass has completed since registration
            or the last resume
          enum:
          - PENDING
          - COMPLETE
        urlId:
          type:
          - string
          - "null"
          description: Outline url id (the short slug in collection URLs)
      required:
      - collectionId
      - color
      - createdAt
      - description
      - documentCount
      - documentsUpstream
      - exportsSkippedForBudget
      - icon
      - id
      - lastSyncError
      - lastSyncedAt
      - name
      - state
      - syncStatus
      - urlId
    OutlineCollectionCandidate:
      type: object
