          - REACTED_DISPUTED
          - REACTED_NOT_APPLICABLE
          - CONVERSATION_EXPIRED
          - ARTIFACT_GONE
          - ARTIFACT_CLOSED
          - ARTIFACT_MERGED
          - ARTIFACT_DRAFT
          - RECIPIENT_OPTED_OUT
          - EMPTY_AFTER_SANITIZE
          - INSTANCE_SILENCED
          - WORKSPACE_DISABLED
          - WORKSPACE_DELIVERY_PAUSED
          - STALE_ROLLOUT_REVISION
