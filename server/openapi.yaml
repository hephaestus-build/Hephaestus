          description: "Note; required when the model is free (e.g. self-hosted, no\
            \ cost)"
          maxLength: 500
          minLength: 0
        pricingMode:
          type: string
          description: "Pricing mode; when given, replaces the price wholesale (see\
            \ class docs)"
          enum:
          - PRICED
          - NO_CHARGE
          - UNPRICED
        supportsReasoning:
          type: boolean
          description: Whether the model supports a reasoning mode
    UpdateWorkspaceNotificationsRequest:
      type: object
      description: Request to update leaderboard notification settings
      properties:
        channelId:
          type: string
          description: Slack channel ID for notifications
          example: C01234567AB
          pattern: "^[CG][A-Z0-9]{8,}$"
        enabled:
          type: boolean
          description: Whether leaderboard notifications are enabled
        team:
          type: string
          description: Team name for filtering leaderboard notifications
    UpdateWorkspacePublicVisibilityRequest:
      type: object
      description: Request to update workspace public visibility setting
      properties:
        isPubliclyViewable:
          type: boolean
          description: Whether the workspace should be publicly viewable without authentication
      required:
      - isPubliclyViewable
    UpdateWorkspaceScheduleRequest:
      type: object
      description: Request to update the leaderboard notification schedule
      properties:
        day:
          type: integer
          format: int32
          description: "Day of week (1=Monday, 7=Sunday)"
          example: 1
          maximum: 7
          minimum: 1
        time:
          type: string
          description: Time in 24-hour format (HH:mm)
          example: 09:00
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      required:
      - day
      - time
    UpdateWorkspaceStatusRequest:
      type: object
      description: Request to update the workspace lifecycle status
      properties:
        status:
          type: string
          description: "Target lifecycle status. PURGED is not a status transition:\
            \ purge is irreversible and owner-only, so it lives at DELETE /workspaces/{workspaceSlug}."
          enum:
          - ACTIVE
          - SUSPENDED
      required:
      - status
    UpdateWorkspaceTokenRequest:
      type: object
      description: Request to update the workspace's SCM Personal Access Token
      properties:
        personalAccessToken:
          type: string
          description: SCM Personal Access Token for API access
          minLength: 1
      required:
      - personalAccessToken
