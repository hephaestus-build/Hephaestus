        \ always label it as an estimate and show rateDate, which is the date the\
        \ rate was actually published on (not necessarily today), and attribute it\
        \ to source."
      properties:
        currencyCode:
          type: string
          description: ISO 4217 code of the display currency
          example: EUR
        rateDate:
          type: string
          format: date
          description: "The date the underlying reference rate was published. A closed\
            \ month always reports a date inside that month, so its converted figure\
            \ never changes once the month ends."
          example: 2026-07-24
        ratePerUsd:
          type: number
          format: decimal
          description: "Units of the display currency per 1 USD, at 6 decimal places"
          example: 0.878966
        source:
          type: string
          description: "Who published the rate, so a disclosure can name it instead\
            \ of saying \"a reference rate\". ECB = the European Central Bank's daily\
            \ euro foreign-exchange reference rates."
          enum:
          - ECB
          example: ECB
      required:
      - currencyCode
      - rateDate
      - ratePerUsd
      - source
