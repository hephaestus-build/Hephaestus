          - MEMBER
      required:
      - account
      - eligibleForPracticeReview
      - hidden
      - joinedAt
      - leftAt
      - reviewSelected
      - role
    WorkspaceOnboarding:
      type: object
      description: |-
        One member's view of setup in one workspace. <code>aiChoice</code> is the account's answer, the same in
         every workspace; <code>aiOptions</code> says what this workspace has set up under each answer, which is
         what differs between workspaces. <code>mentorRefusal</code> is this member's own answer from Hephaestus's admission.
      properties:
        aiChoice:
          type: string
          enum:
          - NO_AI
          - IN_HOUSE_ONLY
          - CLOUD
        aiChoiceRequired:
          type: boolean
        aiOptions:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceAiOption"
        enabled:
          type: boolean
        links:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceOnboardingLink"
        mentorRefusal:
          type: string
          description: "Why Hephaestus declines this member here, by the rule that\
            \ admits each question; null when Hephaestus can answer"
          enum:
          - PERSON_ERASED
          - NO_AI
          - CHOICE_REQUIRED
          - UNAVAILABLE
        needsSetup:
          type: boolean
        workspaceName:
          type: string
      required:
      - aiChoiceRequired
      - aiOptions
      - enabled
      - links
      - needsSetup
      - workspaceName
    WorkspaceOnboardingLink:
      type: object
      properties:
        available:
          type: boolean
        connectionId:
          type: integer
          format: int64
        displayName:
          type: string
        linked:
          type: boolean
        providerType:
          type: string
        registrationId:
          type: string
        required:
          type: boolean
        teamName:
          type: string
      required:
      - available
      - connectionId
      - displayName
      - linked
      - providerType
      - required
    WorkspaceOnboardingSettings:
      type: object
      description: |-
        <code>aiChoiceRequired</code> is read on GET and ignored on PUT: the server latches it the first time
         the setup page is enabled and never clears it.
      properties:
        aiChoiceRequired:
          type: boolean
        enabled:
          type: boolean
        requiredConnectionIds:
          type: array
          items:
            type: integer
            format: int64
            exclusiveMinimum: 0
          maxItems: 20
          minItems: 0
        revision:
          type: integer
          format: int64
      required:
      - aiChoiceRequired
      - enabled
      - requiredConnectionIds
      - revision
    WorkspacePasskeyPolicy:
      type: object
      properties:
        assuranceEnforced:
          type: boolean
        instanceRequired:
          type: boolean
        required:
          type: boolean
      required:
      - assuranceEnforced
      - instanceRequired
      - required
    WorkspacePracticeSplit:
      type: object
