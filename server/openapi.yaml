  /workspaces/{workspaceSlug}/connections/{id}/status:
    patch:
      description: |-
        Resource-oriented lifecycle transition: <code>ACTIVE</code> (reactivate), <code>SUSPENDED</code>
         (suspend), or <code>UNINSTALLED</code> (disconnect). Disconnecting erases the integration's mirrored
         data and then, best effort, removes what it installed at the provider; if the erase fails, the
         connection is left unchanged. <code>PENDING</code> is internal to the OAuth handshake and rejected as
         a bad request; illegal transitions surface as 409 via the state machine.
      operationId: updateConnectionStatus
      parameters:
      - description: Workspace slug
        in: path
        name: workspaceSlug
        required: true
        schema:
          type: string
          maxLength: 51
          minLength: 3
          pattern: "^(?!.*--)[a-z0-9][a-z0-9-]{1,49}[a-z0-9]$"
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectionStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSummary"
          description: OK
      summary: |-
        Resource-oriented lifecycle transition: <code>ACTIVE</code> (reactivate), <code>SUSPENDED</code>
         (suspend), or <code>UNINSTALLED</code> (disconnect).
      tags:
      - Connections
