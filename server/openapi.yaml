          type: string
          description: Who may create workspaces — ADMIN_ONLY restricts creation to
            instance admins
          enum:
          - ADMIN_ONLY
          - SELF_SERVICE
        github:
          $ref: "#/components/schemas/GitHubProvider"
          description: "GitHub workspace provider config, null if not available"
        gitlab:
          $ref: "#/components/schemas/GitLabProvider"
          description: "GitLab workspace provider config, null if not available"
    WorkspaceRange:
      type: object
      description: "The middle half of the developers counted: the 25th to the 75th\
        \ percentile"
      properties:
        high:
          type: integer
          format: int32
          description: The 75th percentile
        low:
          type: integer
          format: int32
          description: The 25th percentile
      required:
      - high
      - low
    WorkspaceReviewScope:
      type: object
      properties:
        accountIds:
          type: array
          items:
            type: string
            pattern: "[1-9][0-9]*"
        people:
          type: string
          enum:
          - ALL
          - SELECTED
        repositories:
          type: string
          enum:
          - ALL
          - SELECTED
        selectedRepositories:
          type: array
          items:
            $ref: "#/components/schemas/ReviewScopeRepository"
      required:
      - accountIds
      - people
      - repositories
      - selectedRepositories
    WorkspaceSplit:
      type: object
      description: "How the developers with a standing split across one practice group\
        \ or one practice, counted in developers: a part per verdict, none yet, and\
        \ their total"
      properties:
        developers:
          type: integer
          format: int32
          description: "Every developer the split counts, the parts and none yet together,\
            \ the reader included when counted"
        noneYet:
          type: integer
          format: int32
          description: Developers with a standing in a group shown but none here
        parts:
          type: array
          description: "Developers at each verdict, Needs attention, Mixed feedback\
            \ and Going well in that order"
          items:
            $ref: "#/components/schemas/WorkspaceSplitPart"
      required:
      - developers
      - noneYet
      - parts
    WorkspaceSplitPart:
      type: object
      description: The developers at one verdict in a split
      properties:
        developers:
          type: integer
          format: int32
          description: "Developers at the verdict, the reader included when counted"
        standing:
          type: string
          description: The verdict the part counts
          enum:
          - DEVELOPING
          - MIXED
          - STRENGTH
      required:
      - developers
      - standing
    WorkspaceTile:
      type: object
      description: "One figure: the reader's own value, then the middle half of the\
        \ developers counted"
      properties:
        middle:
          anyOf:
          - $ref: "#/components/schemas/WorkspaceRange"
            description: The workspace's middle half; absent while no developer is
              counted
          - type: "null"
          description: The workspace's middle half; absent while no developer is counted
        yours:
          type: integer
          format: int32
          description: The reader's own value
      required:
      - middle
      - yours
    WorsenedBasis:
      allOf:
      - $ref: "#/components/schemas/ClaimBasis"
      - type: object
        properties:
          base:
            type: integer
            format: int32
          explanation:
            type: string
          head:
            type: integer
            format: int32
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Hephaestus-native JWT bearer authentication. The SPA normally authenticates
        through the `__Host-HEPHAESTUS_AT` session cookie. This scheme documents the
        equivalent bearer token.
      scheme: bearer
      type: http
    workerBearer:
      bearerFormat: JWT
      description: "Worker credential on the private sandbox gateway connector. Bound\
        \ to the worker, workspace, job and attempt, with the required proxy scope.\
        \ Browser cookies and app-admin authority do not authorize it."
      scheme: bearer
      type: http
