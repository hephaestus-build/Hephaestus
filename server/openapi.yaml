            a single run may take)
          maximum: 10800
          minimum: 30
        workspaceModelId:
          type: integer
          format: int64
          description: Workspace-owned model id to run this purpose on
    AgentJob:
      type: object
      description: Agent job execution record (job_token intentionally omitted)
      properties:
        availableAt:
          type: string
          format: date-time
          description: "When this job becomes eligible to be claimed. In the future\
            \ while the job is waiting — on a retry backoff, or on a hold. Read together\
            \ with holdReason: a QUEUED job with availableAt in the future is waiting,\
            \ not starved for workers."
        completedAt:
          type: string
          format: date-time
          description: Timestamp when the job completed
        configSnapshot:
          description: Frozen agent config at submit time (an INSTANCE-scoped connection's
            baseUrl is redacted to scheme://host; only a WORKSPACE-scoped connection's
            baseUrl is left intact)
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the job was created
        deliveryCommentId:
          type: string
          description: Git provider comment/note ID for posted feedback
        deliveryStatus:
          type: string
          description: "Delivery status: null = not applicable, PENDING = awaiting\
            \ delivery, DELIVERED = posted, FAILED = delivery error"
          enum:
          - PENDING
          - DELIVERED
          - FAILED
        errorMessage:
          type: string
          description: Human-readable error message
        exitCode:
          type: integer
          format: int32
          description: Container exit code
        holdReason:
          type: string
          description: "Why a QUEUED job is waiting rather than eligible, when the\
            \ reason is one an admin can undo. BUDGET = the payer is over its monthly\
            \ LLM cap and the job resumes by itself once the cap is raised or the\
            \ month rolls over. Absent means no such hold — a future availableAt is\
            \ then an ordinary retry backoff."
        id:
          type: string
          format: uuid
          description: Job ID
        jobType:
          type: string
          description: Job type
          enum:
          - PULL_REQUEST_REVIEW
          - ISSUE_REVIEW
          - CONVERSATION_REVIEW
          - DOCUMENT_REVIEW
        llmCacheReadTokens:
          type: integer
          format: int32
          description: Tokens read from prompt cache
        llmCacheWriteTokens:
          type: integer
          format: int32
          description: Tokens written to prompt cache
        llmModel:
          type: string
          description: "LLM model used (e.g. gpt-5.4-mini, openai/gpt-oss-120b)"
        llmModelVersion:
          type: string
          description: Model version/snapshot date (e.g. 2026-03-17). Only jobs from
            before the model catalog carry one; absent on everything newer.
        llmTotalCalls:
          type: integer
          format: int32
          description: Total LLM API calls (steps) during execution
        llmTotalInputTokens:
          type: integer
          format: int32
          description: Total input tokens consumed
        llmTotalOutputTokens:
          type: integer
          format: int32
          description: Total output tokens generated
        llmTotalReasoningTokens:
          type: integer
          format: int32
          description: Total reasoning/thinking tokens
        metadata:
          description: Job metadata (routing/display info)
        model:
          type: string
          description: "Upstream model this job was admitted on, frozen at submit\
            \ time (e.g. gpt-5.4-mini). Available from submission, unlike llmModel,\
            \ which the runner reports only once the job has run."
        output:
          description: Job output (agent results)
        retryCount:
          type: integer
          format: int32
          description: Number of retry attempts
        reviewOutcome:
          type: string
          description: "Why a COMPLETED run produced the observations it did. INSUFFICIENT_EVIDENCE\
            \ means no model ran because required evidence was missing, unreadable,\
            \ stale, or unauthorized — so no observations means nothing was assessed,\
            \ not that nothing was wrong. REVIEWED means the model ran against sufficient\
            \ evidence."
          enum:
          - REVIEWED
          - INSUFFICIENT_EVIDENCE
        startedAt:
          type: string
          format: date-time
          description: Timestamp when the job started running
        status:
          type: string
          description: Current job status
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
          - TIMED_OUT
          - CANCELLED
        target:
          $ref: "#/components/schemas/ReviewRunTarget"
          description: Work item reviewed by this job
      required:
      - availableAt
      - configSnapshot
      - createdAt
      - id
      - jobType
      - retryCount
      - reviewOutcome
      - status
      - target
