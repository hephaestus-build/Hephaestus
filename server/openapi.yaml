          items:
            type: string
            enum:
            - VOLUME_CAPPED
            - COMPOSER_DEDUPED
            - REACTED_DISPUTED
            - REACTED_NOT_APPLICABLE
            - CONVERSATION_EXPIRED
            - ARTIFACT_GONE
            - ARTIFACT_CLOSED
            - ARTIFACT_MERGED
            - ARTIFACT_DRAFT
            - RECIPIENT_OPTED_OUT
            - EMPTY_AFTER_SANITIZE
            - INSTANCE_SILENCED
            - WORKSPACE_DISABLED
            - WORKSPACE_DELIVERY_PAUSED
            - STALE_ROLLOUT_REVISION
            - OUTSIDE_CURRENT_COVERAGE
            - APPROVAL_STALE
            - APPROVAL_NO_LONGER_ELIGIBLE
            - PRACTICE_REQUIRES_APPROVAL
            - BACKFILL_QUIET
      required:
      - autonomy
      - deliveredCount
      - explanation
      - observationCount
      - outcome
      - practiceName
      - practiceSlug
      - watches
      - withheldReasons
    PracticeTrend:
      type: object
      properties:
        currentOutcomes:
          $ref: "#/components/schemas/OutcomeVector"
        direction:
          type: string
          enum:
          - IMPROVING
          - DECLINING
          - UNCERTAIN
          - INSUFFICIENT_EVIDENCE
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/TrendOpportunity"
        previousOutcomes:
          $ref: "#/components/schemas/OutcomeVector"
        scope:
          type: string
          enum:
          - GROUP
          - PRACTICE
        slug:
          type: string
        support:
          $ref: "#/components/schemas/TrendSupport"
      required:
      - direction
      - opportunities
      - scope
      - slug
      - support
    PracticeWorkTypeDefinitionOptions:
      type: object
      description: "Review timing, evidence choices, and recommended settings for\
        \ one type of reviewed work"
      properties:
        allowedSources:
          type: array
          items:
            $ref: "#/components/schemas/PracticeEvidenceSourceOption"
        artifactKind:
          type: string
        manualReviewSignal:
          $ref: "#/components/schemas/PracticeManualReviewSignal"
          description: "How a person asks for a review of this work type by hand,\
