            so this is what a link should follow.
        outcome:
          type: string
          enum:
          - REVIEWED
          - RUNNING
          - PENDING
          - SKIPPED
          - NOT_REACHED
          - NOT_ASSESSABLE
          - TURNED_OFF
          - NOT_OCCASIONED
          - DORMANT
          - LAPSED
          - FAILED
        practiceName:
          type: string
        practiceSlug:
          type: string
        reviewId:
          type: string
          format: uuid
          description: "The review this answer came from, when one ran"
        watches:
          type: array
          description: The signals this practice watches
          items:
            type: string
        withheldReasons:
          type: array
          description: Why prepared feedback was withheld. Non-empty with observations
