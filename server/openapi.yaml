          - CATALOG_GROUP
          - WORKSPACE_INSTANCE_LLM_BUDGET
          - WORKSPACE_OWN_PROVIDER_LLM_BUDGET
          - WORKSPACE_LLM_BUDGET
          - WORKSPACE_BYO_LLM_BUDGET
          - REVIEW_BATCH
          - REVIEW_SCHEDULE
          - FEEDBACK_DELIVERY_RECHECK
          - WORKSPACE_LLM_CONNECTION
          - WORKSPACE_LLM_MODEL
        id:
          type: integer
          format: int64
        newValue:
          type: string
        occurredAt:
          type: string
          format: date-time
        oldValue:
          type: string
        workspaceId:
          type: integer
          format: int64
      required:
      - elevatedViaInstanceAdmin
