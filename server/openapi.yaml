  /workspaces/{workspaceSlug}/practices/reviews:
    get:
      description: "Reviews are ordered by when they were created, newest first unless\
        \ sort is OLDEST. queueState keeps the reviews whose job waits for a worker,\
        \ is on hold for budget or runs now, as the queue counts them."
      operationId: listReviews
      parameters:
      - description: Workspace slug
        in: path
        name: workspaceSlug
        required: true
        schema:
          type: string
          maxLength: 51
          minLength: 3
          pattern: "^(?!.*--)[a-z0-9][a-z0-9-]{1,49}[a-z0-9]$"
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 100
          minimum: 1
      - in: query
        name: status
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - QUEUED
            - RUNNING
            - COMPLETE
            - PARTIAL
            - FAILED
            - CANCELLED
      - in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - ITEM
          - SCAN
      - in: query
        name: reviewId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: itemId
        required: false
        schema:
          type: string
          maxLength: 19
          pattern: "^[1-9][0-9]*$"
      - in: query
        name: developerId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: practiceSlug
        required: false
        schema:
          type: string
      - in: query
        name: groupSlug
        required: false
        schema:
          type: string
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - NEWEST
          - OLDEST
      - in: query
        name: queueState
        required: false
        schema:
          type: string
          enum:
          - WAITING
          - HELD
          - RUNNING
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseDTOReviewSummary"
          description: Paginated review summaries returned
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid filter or pagination
      summary: List practice reviews with result and feedback outcomes
      tags:
      - Practice reviews
