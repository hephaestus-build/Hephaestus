    LlmUsageByDay:
      type: object
      description: Spend for one UTC day
      properties:
        day:
          type: string
          format: date
        events:
          type: integer
          format: int64
          description: "Runs: job attempts and mentor turns. Rows of models for practice\
            \ scripts are not runs."
        instanceTotalCostUsd:
          type: number
          format: decimal
          description: "Confirmed spend on shared (instance) models for this day,\
            \ in USD."
        ownProviderTotalCostUsd:
          type: number
          format: decimal
          description: "Spend on this workspace's own connected provider(s) for this\
            \ day, in USD."
        unpricedEventCount:
          type: integer
          format: int64
          description: Runs this day with at least one ledger row whose cost is unavailable
            because a rate is missing or the measurement is unverified. A practice
            script row counts toward the run of its review. Those rows are excluded
            from both totals above.
      required:
      - day
      - events
      - instanceTotalCostUsd
      - ownProviderTotalCostUsd
      - unpricedEventCount
    LlmUsageByJobType:
      type: object
      description: Month spend aggregated by job type
      properties:
        cacheReadTokens:
          type: integer
          format: int64
        cacheWriteTokens:
          type: integer
          format: int64
        events:
          type: integer
          format: int64
          description: "Runs: job attempts and mentor turns. Rows of models for practice\
            \ scripts are not runs."
        inputTokens:
          type: integer
          format: int64
        instanceTotalCostUsd:
          type: number
          format: decimal
          description: "Confirmed spend on shared (instance) models for this job type,\
            \ in USD."
        jobType:
          type: string
        outputTokens:
          type: integer
          format: int64
        ownProviderTotalCostUsd:
          type: number
          format: decimal
          description: "Spend on this workspace's own connected provider(s) for this\
            \ job type, in USD."
        totalCalls:
          type: integer
          format: int64
          description: "LLM API calls, as reported by the runtime. Practice reviews\
            \ and mentor turns both include every assistant call in an internal tool\
            \ loop."
        unpricedEventCount:
          type: integer
          format: int64
          description: Runs of this job type with at least one ledger row whose cost
            is unavailable because a rate is missing or the measurement is unverified.
            A practice script row counts toward the run of its review. Those rows
            are excluded from both totals above.
      required:
      - cacheReadTokens
      - cacheWriteTokens
      - events
      - inputTokens
      - instanceTotalCostUsd
      - jobType
      - outputTokens
      - ownProviderTotalCostUsd
      - totalCalls
      - unpricedEventCount
    LlmUsageByPractice:
      type: object
      description: "The decision, embedding and reranking calls that one practice's\
        \ script made in finished reviews this month. The cost of each review's calls\
        \ is split between its practices by the priced tokens that each used."
      properties:
        calls:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        instanceTotalCostUsd:
          type: number
          format: decimal
          description: "This practice's share of the spend on shared (instance) models,\
            \ in USD."
        outputTokens:
          type: integer
          format: int64
        ownProviderTotalCostUsd:
          type: number
          format: decimal
          description: "This practice's share of the spend on this workspace's own\
            \ provider(s), in USD."
        practiceName:
          type: string
          description: The practice name. Null when the slug names no current practice.
        practiceSlug:
          type: string
          description: "The practice slug. Null for calls that cannot be split by\
            \ practice any more, such as those of a deleted review."
        purposes:
          type: array
          description: The models for practice scripts that the script called.
          items:
            type: string
            enum:
            - PRACTICE_REVIEW
            - MENTOR
            - PRACTICE_DECISION
            - PRACTICE_EMBEDDING
            - PRACTICE_RERANKING
        reviews:
          type: integer
          format: int64
          description: Reviews in which the script called a model for practice scripts.
            A review with several practices counts for each of them.
        unpricedEventCount:
          type: integer
          format: int64
          description: "Reviews with a practice script ledger row whose price is not\
            \ yet known and that holds this practice's calls, each review counted\
            \ once. Those rows are excluded from both totals above. A review with\
            \ several practices counts for each of them."
      required:
      - calls
      - inputTokens
      - instanceTotalCostUsd
      - outputTokens
      - ownProviderTotalCostUsd
      - purposes
      - reviews
      - unpricedEventCount
    LlmUsagePracticeScriptTotal:
      type: object
      description: "The decision, embedding and reranking calls of finished reviews\
        \ this month, in total. calls, inputTokens, outputTokens and both costs equal\
        \ the sums of the byPractice entries. reviews and unpricedEventCount do not:\
        \ one review can count for several practices there."
      properties:
        calls:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        instanceTotalCostUsd:
          type: number
          format: decimal
          description: "Confirmed practice script spend on shared (instance) models,\
            \ in USD."
        outputTokens:
          type: integer
          format: int64
        ownProviderTotalCostUsd:
          type: number
          format: decimal
          description: "Practice script spend on this workspace's own provider(s),\
            \ in USD."
        reviews:
          type: integer
          format: int64
          description: Distinct reviews in which a practice script called a model
            for practice scripts.
        unpricedEventCount:
          type: integer
          format: int64
          description: Distinct reviews with a practice script ledger row whose price
            is not yet known. Those rows are excluded from both totals above.
      required:
      - calls
      - inputTokens
      - instanceTotalCostUsd
      - outputTokens
      - ownProviderTotalCostUsd
      - reviews
      - unpricedEventCount
    LoginProviderView:
      type: object
