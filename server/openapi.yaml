    Question:
      type: object
      properties:
        id:
          type: string
          maxLength: 80
          minLength: 0
          pattern: "[A-Za-z0-9_-]+"
        options:
          type: array
          items:
            type: string
            maxLength: 200
            minLength: 0
          maxItems: 20
          minItems: 0
        prompt:
          type: string
          maxLength: 300
          minLength: 0
        required:
          type: boolean
        type:
          type: string
          enum:
          - TEXT
          - SINGLE_CHOICE
          - RATING
      required:
      - id
      - options
      - prompt
      - type
    RateLimitSnapshot:
      type: object
      description: "Vendor API rate-limit observation, read from in-memory trackers\
        \ (not persisted across restarts). Every field except observedAt is present\
        \ only if the vendor actually reported it."
      properties:
        limit:
          type: integer
          format: int32
          description: "Window ceiling, if the vendor reported one. Survives window\
            \ rollover — a ceiling is window-invariant."
        observedAt:
          type: string
          format: date-time
          description: When the underlying vendor response was seen
        remaining:
          type: integer
          format: int32
          description: "Remaining budget, if reported and still inside the observed\
            \ window. Null once the window has rolled over."
        resetAt:
          type: string
          format: date-time
          description: "When the observed window ends, if reported and still in the\
            \ future"
        throttledUntil:
          type: string
          format: date-time
          description: An observed 429's back-off deadline (observedAt + Retry-After);
            null if the vendor never told us to back off
      required:
      - observedAt
    RegisterOutlineCollectionRequest:
      type: object
      description: Register an Outline collection for mirroring (lands ENABLED + PENDING)
      properties:
        collectionId:
          type: string
          description: Outline collection id (UUID)
          maxLength: 64
          minLength: 0
      required:
      - collectionId
    RegisterSlackChannelRequest:
      type: object
      description: Allow-list a Slack channel (lands in PENDING)
      properties:
        channelName:
          type: string
          description: Optional human-readable channel name to store alongside the
            id
          maxLength: 256
          minLength: 0
        slackChannelId:
          type: string
          description: Slack public/private channel id (stable C… or G… id)
          maxLength: 32
          minLength: 0
          pattern: "^[CG][A-Z0-9]{8,}$"
      required:
      - slackChannelId
    RenameWorkspaceSlugRequest:
      type: object
      description: Request to rename a workspace's URL slug
      properties:
        newSlug:
          type: string
          description: New URL-friendly identifier for the workspace
          example: new-workspace-slug
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9-]{2,50}$"
      required:
      - newSlug
    ReorderPracticeGroupsRequest:
      type: object
      description: Reorder practice groups to match the supplied list
      properties:
        orderedSlugs:
          type: array
          description: Group slugs in the desired display order
          example:
          - review-ready-work
          - acting-on-review-feedback
          items:
            type: string
          minItems: 1
      required:
      - orderedSlugs
    ReorderPracticesRequest:
      type: object
      description: Reorder one group's practices to match the supplied list
      properties:
        groupSlug:
          type:
          - string
          - "null"
          description: Slug of the group whose practices are being reordered; null
            reorders the unassigned bucket
          example: review-ready-work
        orderedSlugs:
          type: array
          description: Practice slugs in the desired display order — the complete
            set for the group
          example:
          - describe-what-and-why
          - ready-and-traceable-handoff
          items:
            type: string
          minItems: 1
      required:
      - orderedSlugs
    RepositoryInfo:
      type: object
      description: Information about a git repository
      properties:
        description:
          type: string
          description: Description of the repository
        hiddenFromContributions:
          type: boolean
          description: Whether contributions from this repository are hidden from
            leaderboard calculations
        htmlUrl:
          type: string
          description: URL to the repository on the git provider
        id:
          type: integer
          format: int64
          description: Unique identifier of the repository
        labels:
          type: array
          description: Labels defined in the repository
          items:
            $ref: "#/components/schemas/LabelInfo"
        name:
          type: string
          description: Name of the repository
        nameWithOwner:
          type: string
          description: "Full name including owner (e.g., 'owner/repo')"
      required:
      - hiddenFromContributions
      - htmlUrl
      - id
      - name
      - nameWithOwner
    ResearchConsent:
      type: object
      properties:
        granted:
          type: boolean
      required:
      - granted
    ResourceCounts:
      type: object
      description: Resource-level rollup for the connection overview badge
      properties:
        errored:
          type: integer
          format: int64
          description: Resources currently reporting a sync error
        pending:
          type: integer
          format: int64
          description: "Resources that have never completed a sync (no lastSyncedAt).\
            \ Defined on the timestamp rather than on a provider's status vocabulary\
            \ so it means the same thing for a repository, a Slack channel and an\
            \ Outline collection."
        stale:
          type: integer
          format: int64
          description: "Resources whose last sync is older than twice the connection's\
            \ scheduled cadence. Always 0 when the cadence is unknown or the schedule\
            \ is irregular — staleness is a judgement against a known cron, and without\
            \ one this declines to guess rather than flagging healthy resources."
        total:
          type: integer
          format: int64
          description: Total resources known to this connection
      required:
      - errored
      - pending
      - stale
      - total
    ReviewArtifact:
      type: object
      properties:
        channelName:
          type: string
          description: Slack channel name for conversation artifacts
        id:
          type: integer
          format: int64
          description: Internal artifact entity ID
        number:
          type: integer
          format: int32
          description: Provider-visible work-item number
        provider:
          type: string
          description: "Source provider, when recorded"
          enum:
          - GITHUB
          - GITLAB
          - SLACK
          - OUTLINE
        repositoryName:
          type: string
          description: Provider-qualified repository path for SCM artifacts
        title:
          type: string
        type:
          type: string
        url:
          type: string
          description: "Provider URL, when one is available"
      required:
      - id
      - title
      - type
    ReviewBackfillRun:
      type: object
      description: "A campaign as an admin sees it — before confirming, while it runs,\
        \ and after it ends."
      properties:
        artifactKind:
          type: string
        confirmedByAccountId:
          type: integer
          format: int64
          description: Who authorised the spend; absent until the run is confirmed
        createdAt:
          type: string
          format: date-time
        discoveredVia:
          type: string
          description: "BACKFILL for a campaign an admin scoped by hand, SWEEP for\
            \ one a recurring schedule opened"
          enum:
          - EVENT
          - SYNC
          - MANUAL
          - BACKFILL
          - SWEEP
        estimatedArtifacts:
          type: integer
          format: int32
        estimatedCostUsd:
          type: number
          format: decimal
          description: Forecast total spend in USD; absent when the workspace has
            no priced review history
        failedCount:
          type: integer
          format: int32
          description: |-
            artifacts whose submission threw, leaving no job and no recorded decision. Non-zero
                 means this campaign's baseline has holes in it, which is why it is reported apart from a pass.
        finishedAt:
          type: string
          format: date-time
        fromAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        passedCount:
          type: integer
          format: int32
          description: |-
            artifacts walked past without one: already measured at their current state, or
                 refused by the review gate. The campaign looked at each of these and decided.
        pauseReason:
          type: string
          description: Set only while the run is PAUSED
          enum:
          - BUDGET_EXHAUSTED
          - REVIEW_MODEL_UNBOUND
          - WORKSPACE_UNAVAILABLE
        requestedByAccountId:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - AWAITING_CONFIRMATION
          - RUNNING
          - PAUSED
          - COMPLETED
          - CANCELLED
        submittedCount:
          type: integer
          format: int32
          description: artifacts for which a review job was created
        sweepScheduleId:
          type: string
          format: uuid
          description: The schedule that opened this run; absent for a campaign an
            admin scoped by hand
        toAt:
          type: string
          format: date-time
      required:
      - artifactKind
      - createdAt
      - discoveredVia
      - estimatedArtifacts
      - failedCount
      - fromAt
      - id
      - passedCount
      - requestedByAccountId
      - status
      - submittedCount
      - toAt
    ReviewBoundFeedback:
      type: object
      description: Feedback composed from an observation
      properties:
        agentJobId:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - IN_CONTEXT
          - IN_CHAT
          - IN_APP
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          description: When the message was placed; null if it was not delivered
        deliveryState:
          type: string
          enum:
          - AWAITING_APPROVAL
          - PREPARED
          - PARTIALLY_DELIVERED
          - PARTIALLY_FAILED
          - DELIVERED
          - SUPERSEDED
          - SUPPRESSED
          - FAILED
          - DISCARDED
        feedbackId:
          type: string
          format: uuid
        role:
          type: string
          description: Whether the observation led the feedback or reinforced it
          enum:
          - PRIMARY
          - SUPPORTING
        suppressionReason:
          type: string
          description: Why delivery stopped; set on withheld or terminally partial
            feedback
          enum:
          - VOLUME_CAPPED
          - COMPOSER_DEDUPED
          - REACTED_DISPUTED
          - REACTED_NOT_APPLICABLE
          - CONVERSATION_EXPIRED
          - ARTIFACT_GONE
          - ARTIFACT_CLOSED
          - ARTIFACT_MERGED
          - ARTIFACT_DRAFT
          - RECIPIENT_OPTED_OUT
          - EMPTY_AFTER_SANITIZE
          - INSTANCE_SILENCED
          - WORKSPACE_DISABLED
          - WORKSPACE_DELIVERY_PAUSED
          - STALE_ROLLOUT_REVISION
          - OUTSIDE_CURRENT_COVERAGE
          - APPROVAL_STALE
          - APPROVAL_NO_LONGER_ELIGIBLE
          - PRACTICE_REQUIRES_APPROVAL
          - BACKFILL_QUIET
      required:
      - agentJobId
      - channel
      - createdAt
      - deliveryState
      - feedbackId
      - role
    ReviewBoundObservation:
      type: object
      description: An observation that contributed to a piece of feedback
      properties:
        assessment:
          type: string
          description: "Assessment: GOOD or BAD (null when NOT_APPLICABLE)"
          enum:
          - GOOD
          - BAD
        claimCurrentness:
          type: string
          description: Whether an observation was produced using the current review
            rules
          enum:
          - CURRENT
          - STALE
          - UNVERIFIABLE
        group:
          $ref: "#/components/schemas/ReviewPracticeGroup"
          description: Practice group; null when the practice is Unassigned
        observationId:
          type: string
          format: uuid
        observedAt:
          type: string
          format: date-time
        ordinal:
          type: integer
          format: int32
          description: Render order within the feedback (lower renders earlier)
        practiceName:
          type: string
        practiceSlug:
          type: string
        presence:
          type: string
          enum:
          - PRESENT
          - ABSENT
          - NOT_APPLICABLE
          - INCONCLUSIVE
        role:
          type: string
          description: Whether the observation leads the feedback or reinforces it
          enum:
          - PRIMARY
          - SUPPORTING
        severity:
          type: string
          description: Severity band (null unless assessment is BAD)
          enum:
          - CRITICAL
          - MAJOR
          - MINOR
          - INFO
        summary:
          type: string
      required:
      - claimCurrentness
      - observationId
      - observedAt
      - ordinal
      - practiceName
      - practiceSlug
      - presence
      - role
      - summary
