          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The client id is not a Chrome extension id
      summary: Whether this instance lets the given installed client sign in
      tags:
      - Client session
  /auth/client/logout:
    post:
      operationId: logoutClientSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRefreshRequest"
        required: true
      responses:
        "204":
          description: "Signed out, or the secret was already unknown"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The body is malformed, or a request with a valid CSRF token\
            \ also carries the browser session cookie"
        "403":
          content:
            application/json: {}
          description: The request carries the browser session cookie without a valid
            CSRF token. The server refuses it before the endpoint runs.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "This address sent too many installed-client requests. Wait\
            \ the number of seconds in the Retry-After header, then try again."
      summary: End the session its refresh secret belongs to
      tags:
      - Client session
  /auth/client/refresh:
    post:
      operationId: refreshClientSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSessionTokens"
          description: Rotated
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The body is malformed, or a request with a valid CSRF token\
            \ also carries the browser session cookie"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The session has ended. Sign in again.
        "403":
          content:
            application/json: {}
          description: The request carries the browser session cookie without a valid
            CSRF token. The server refuses it before the endpoint runs.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "This address sent too many installed-client requests. Wait\
            \ the number of seconds in the Retry-After header, then try again."
      summary: Rotate the session's access token and refresh secret
      tags:
      - Client session
  /auth/client/token:
    post:
      operationId: exchangeClientSignIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSessionTokens"
          description: Signed in
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The body is malformed, the code is unknown, expired, used,\
            \ or does not match the verifier, client or callback, or a request with\
            \ a valid CSRF token also carries the browser session cookie"
        "403":
          content:
            application/json: {}
          description: The request carries the browser session cookie without a valid
            CSRF token. The server refuses it before the endpoint runs.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "This address sent too many installed-client requests. Wait\
            \ the number of seconds in the Retry-After header, then try again."
      summary: Redeem a sign-in handoff code with its PKCE verifier
      tags:
      - Client session
