        enabled:
          type: boolean
          description: Whether the model is active (default false)
        maxOutputTokens:
          type: integer
          format: int32
          description: Maximum output tokens
          minimum: 1
        operatedBy:
          type: string
          description: Who operates the systems the work is sent to; omit to leave
            the model undeclared
          enum:
          - OWN_ORGANISATION
          - PROVIDER
        per1mCacheReadUsd:
          type: number
          format: decimal
          description: "Cache-read rate per 1M tokens (USD), if applicable"
        per1mCacheWriteUsd:
          type: number
          format: decimal
          description: "Cache-write rate per 1M tokens (USD), if applicable"
        per1mInputUsd:
          type: number
          format: decimal
          description: Input rate per 1M tokens (USD); required when the model has
            a price
        per1mOutputUsd:
          type: number
          format: decimal
          description: Output rate per 1M tokens (USD); required when the model has
            a price
        priceNote:
          type: string
          description: "Note; required when the model is free (e.g. self-hosted, no\
            \ cost)"
          maxLength: 500
          minLength: 0
        pricingMode:
          type: string
          description: Pricing mode (default UNPRICED)
          enum:
          - PRICED
          - NO_CHARGE
          - UNPRICED
        reasoningEffort:
          type: string
          description: "Reasoning effort to request; null sends none, so the provider's\
            \ own default applies"
          enum:
          - NONE
          - MINIMAL
          - LOW
          - MEDIUM
          - HIGH
          - XHIGH
          - MAX
        slug:
          type: string
          description: Optional internal slug; generated from displayName when omitted
          maxLength: 63
          minLength: 0
        upstreamModelId:
          type: string
          description: Upstream provider model id
          maxLength: 256
          minLength: 0
      required:
      - displayName
      - upstreamModelId
    CreateWorkspaceRequest:
      type: object
      description: Request to create a new workspace
      properties:
        accountLogin:
          type: string
          description: Git provider account login (GitHub org/user or GitLab group
            path)
          example: my-org
          maxLength: 255
          minLength: 0
        accountType:
          type: string
          description: Type of account (USER or ORG)
          enum:
          - ORG
          - USER
        displayName:
          type: string
          description: Human-readable name of the workspace
          example: My Workspace
          maxLength: 120
          minLength: 0
        kind:
          type: string
          description: "Integration kind to provision. SLACK flows through OAuth,\
            \ not this endpoint."
          enum:
          - GITHUB
          - GITLAB
          example: GITLAB
        ownerUserId:
          type: integer
          format: int64
          deprecated: true
          description: "Deprecated: ignored by the server. The authenticated user\
            \ always becomes the owner."
        personalAccessToken:
          type: string
          description: Personal Access Token. Required for both kinds (GitLab API
            or GitHub PAT). Stored encrypted at rest.
          example: glpat-...
          maxLength: 512
          minLength: 0
        repositorySelection:
          type: string
          description: "GitLab only. ALL monitors every project of the group, including\
            \ ones created later; SELECTED monitors only selectedProjectIds. Omitted\
            \ means ALL."
          enum:
          - ALL
          - SELECTED
        selectedProjectIds:
          type: array
          description: "GitLab project IDs to monitor. Required, and only allowed,\
            \ when repositorySelection is SELECTED. The server checks each with the\
            \ token."
          items:
            type: integer
            format: int64
            exclusiveMinimum: 0
        serverUrl:
          type: string
          description: "For GitLab, the default GitLab instance this server reads\
            \ from, which is also used when omitted; any other instance is refused."
          example: https://gitlab.example.com
        workspaceSlug:
          type: string
          description: Non-reserved lowercase ASCII DNS label. Consecutive hyphens
            are prohibited.
          example: my-workspace
          maxLength: 51
          minLength: 3
          pattern: "^(?!.*--)[a-z0-9][a-z0-9-]{1,49}[a-z0-9]$"
      required:
      - accountLogin
      - accountType
      - displayName
      - kind
      - workspaceSlug
