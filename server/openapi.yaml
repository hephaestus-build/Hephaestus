    TracedSignal:
      type: object
      description: "One thing that happened to this artifact, and what the system\
        \ did about it"
      properties:
        discoveredVia:
          type: string
          description: "How we came to know: by event, by sync, by hand, or by backfill"
          enum:
          - EVENT
          - SYNC
          - MANUAL
          - BACKFILL
          - SWEEP
        displayName:
          type: string
          description: "Human label for the signal, from the artifact kind's descriptor"
        id:
          type: string
          format: uuid
          description: This occurrence's own identity; what a practice's occasionedById
            points at
        occurredAt:
          type: string
          format: date-time
          description: "When it happened upstream; for a sync discovery, only as precise\
            \ as the sync"
        reviewId:
          type: string
          format: uuid
          description: "The review this occurrence started, when it started one"
        revision:
          type: string
          description: Which version of the artifact this occurrence is about; the
            reason editing a description can be re-measured while the commits stay
            put
        signal:
          type: string
          description: "Signal name, e.g. scm.pull_request.ready"
        state:
          type: string
          enum:
          - RECORDED
          - DEFERRED
          - TRIGGERED
          - SUPPRESSED
          - PENDING
          - LAPSED
        stateReason:
          type: string
          description: Why it ended in that state; null once it triggered a review
          enum:
          - GATE_SKIPPED
          - COOLDOWN_ACTIVE
          - REQUEST_COOLDOWN_ACTIVE
          - REQUESTER_QUOTA_EXHAUSTED
          - CONCURRENT_DUPLICATE
          - COALESCED
          - OUT_OF_REVIEW_SCOPE
          - STALE_ROLLOUT_REVISION
          - WORKSPACE_INACTIVE
          - PRACTICES_DISABLED
          - NO_ACTIVE_PRACTICE
          - REVIEW_MODEL_UNBOUND
          - PRACTICE_AUTONOMY_OFF
          - BUDGET_EXHAUSTED
          - SUBJECT_UNLINKED
          - MODEL_UNAVAILABLE
          - ARTIFACT_NOT_VISIBLE
          - PENDING_DEADLINE_EXCEEDED
          - ARTIFACT_GONE
      required:
      - discoveredVia
      - displayName
      - id
      - occurredAt
      - revision
      - signal
      - state
