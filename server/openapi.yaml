        "404":
          description: Delivered feedback not found for the current recipient
      summary: Replace the response to delivered feedback
      tags:
      - Feedback Response
  /workspaces/{workspaceSlug}/practices/observations:
    get:
      description: Paginated observations for the authenticated developer with optional
        filters
      operationId: listObservations
      parameters:
      - description: Workspace slug
        in: path
        name: workspaceSlug
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,50}$"
      - description: Filter by practice slug
        in: query
        name: practiceSlug
        required: false
        schema:
          type: string
      - description: Filter by the practice group the observed practice belongs to
        in: query
        name: groupSlug
        required: false
        schema:
          type: string
      - description: Filter by presence
        in: query
        name: presence
        required: false
        schema:
          type: string
          enum:
          - PRESENT
          - ABSENT
          - NOT_APPLICABLE
          - INCONCLUSIVE
      - description: "Only observations on these kinds of reviewed work, e.g. scm.pull_request\
          \ (repeatable)"
        in: query
        name: artifactKinds
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Only observations with these severities (repeatable); omit for
          all
        in: query
        name: severities
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - CRITICAL
            - MAJOR
            - MINOR
            - INFO
      - description: Drop NOT_APPLICABLE rows — only observations where the practice
          actually applied
        in: query
        name: displayableOnly
        required: false
        schema:
          type: boolean
      - description: "Feed ordering: DATE (default) or SEVERITY (most severe first,\
          \ ties newest-first)"
        in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - DATE
          - SEVERITY
      - description: "Ordering direction: for DATE newest/oldest first, for SEVERITY\
          \ most/least severe first"
        in: query
        name: direction
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - description: Zero-based page
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: Page size from 1 to 100
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageObservationList"
          description: Paginated observations returned
      summary: List observations for current user
      tags:
      - Practice Observations
