      description: Result of testing your AI provider connection
      properties:
        message:
          type: string
          description: Human-readable diagnostic when not reachable
        modelCount:
          type: integer
          format: int32
          description: How many models the provider listed (0 if unreachable)
        reachable:
          type: boolean
          description: Whether the provider answered
      required:
      - modelCount
      - reachable
    WorkspaceLlmSettings:
      type: object
      description: The instance LLM policy as it applies to this workspace (read-only)
      properties:
        ownProviderAllowed:
          type: boolean
          description: Whether this workspace may register its own LLM provider connections
      required:
      - ownProviderAllowed
    WorkspaceLlmUsageReport:
      type: object
      description: "One calendar month of a workspace's LLM spend, rolled up from\
        \ the usage ledger"
      properties:
        byDay:
          type: array
          items:
            $ref: "#/components/schemas/LlmUsageByDay"
        byJobType:
          type: array
          items:
            $ref: "#/components/schemas/LlmUsageByJobType"
        fx:
          $ref: "#/components/schemas/FxRateInfo"
          description: Display-only conversion when the instance has a display currency.
            Absent = show USD only.
        instanceBudgetVerdict:
          type: string
          description: "Whether host-funded (shared-model) spend is within its cap,\
            \ has reached it, or can't be confirmed because some shared-model usage\
            \ has no price set."
          enum:
          - WITHIN
          - EXHAUSTED
          - UNVERIFIABLE
        instanceMonthlyBudgetUsd:
          type: number
          format: decimal
          description: Monthly cap in USD on spend the host pays for (shared models);
            null = uncapped. Set by instance admins only — a workspace admin can see
            it but not change it.
        instancePaused:
          type: boolean
          description: "Whether work on SHARED models is currently paused for this\
            \ workspace. Authoritative — it mirrors the live gate rather than being\
            \ derivable from the verdict alone. Always false for a past month, which\
            \ cannot pause anything."
        instanceTotalCostUsd:
          type: number
          format: decimal
          description: "This month's confirmed spend on shared (instance) models,\
            \ in USD — the figure instanceMonthlyBudgetUsd compares against. A floor,\
            \ not the full total, while unpricedEventCount is non-zero."
        month:
          type: string
          description: "Calendar month (UTC), ISO yyyy-MM"
          example: 2026-07
        ownProviderBudgetVerdict:
          type: string
          description: "The same verdict for spend on this workspace's own provider,\
            \ against its own cap."
          enum:
          - WITHIN
          - EXHAUSTED
          - UNVERIFIABLE
        ownProviderMonthlyBudgetUsd:
          type: number
          format: decimal
          description: Monthly cap in USD on spend this workspace pays for through
            its own connected provider; null = uncapped. Set by this workspace's own
            admins.
        ownProviderPaused:
          type: boolean
          description: Whether work on this workspace's OWN provider is currently
            paused.
        ownProviderTotalCostUsd:
          type: number
          format: decimal
          description: "This month's confirmed spend on this workspace's own connected\
            \ provider(s), in USD — the figure ownProviderMonthlyBudgetUsd compares\
            \ against. Different money from instanceTotalCostUsd: the two are never\
            \ added together."
        unpricedEventCount:
          type: integer
          format: int64
          description: "Calls this month (either purse) whose price is not yet known.\
            \ They are excluded from both totals above, so a non-zero value means\
            \ the real spend may be higher than shown."
      required:
      - byDay
      - byJobType
      - instanceBudgetVerdict
      - instancePaused
      - instanceTotalCostUsd
      - month
      - ownProviderBudgetVerdict
      - ownProviderPaused
      - ownProviderTotalCostUsd
      - unpricedEventCount
