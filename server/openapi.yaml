        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,50}$"
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 100
          minimum: 1
      - description: "Sorting strategy. ACTIONABILITY orders problems from CRITICAL\
          \ to INFO, then strengths, then not-applicable observations; ties are newest\
          \ first."
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: NEWEST
          enum:
          - NEWEST
          - ACTIONABILITY
      - in: query
        name: practiceSlug
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: groupSlug
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: presence
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PRESENT
            - ABSENT
            - NOT_APPLICABLE
            - INCONCLUSIVE
      - in: query
        name: assessment
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - GOOD
            - BAD
      - in: query
        name: severity
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - CRITICAL
            - MAJOR
            - MINOR
            - INFO
      - in: query
        name: agentJobId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Kind of reviewed work, e.g. scm.pull_request"
        in: query
        name: artifactKind
        required: false
        schema:
          type: string
      - description: Artifact ID; requires artifactKind
        in: query
        name: artifactId
        required: false
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - in: query
        name: subjectUserId
        required: false
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - description: "What occasioned the measurement: LIVE, MANUAL or BACKFILL"
        in: query
        name: origin
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - LIVE
            - MANUAL
            - BACKFILL
      - description: Inclusive lower bound
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: Exclusive upper bound
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedModelReviewObservation"
          description: Paginated observations returned
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid filter or pagination
      summary: List practice review observations across the workspace
      tags:
      - Practice reviews
