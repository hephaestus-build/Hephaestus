          - ACTIVITY_AUTOMATION
          - WORKSPACE_FEATURES
          - WORKSPACE_STATUS
          - WORKSPACE_TOKEN
          - WORKSPACE_VISIBILITY
          - PRACTICE_ACTIVE
          - PRACTICE_USAGE
