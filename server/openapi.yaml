      parameters:
      - description: Workspace slug
        in: path
        name: workspaceSlug
        required: true
        schema:
          type: string
          maxLength: 51
          minLength: 3
          pattern: "^(?!.*--)[a-z0-9][a-z0-9-]{1,49}[a-z0-9]$"
      - in: path
        name: connectionId
        required: true
        schema:
          type: integer
