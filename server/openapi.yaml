    ConfigAuditActorRef:
      type: object
      description: |-
        A human-readable actor identity on an audit row. Resolved at read time, so an erased account
         degrades here without the trail being rewritten: <code>AccountPurger</code> clears the email, replaces
         the display name with a placeholder, and nulls the row's actor references.

         <p>Named distinctly from the auth trail's own <code>AccountRefDTO</code>: the OpenAPI schema key is the
         simple name minus the <code>DTO</code> suffix, so two <code>AccountRefDTO</code> records would collide and one
         would be silently dropped from the spec.
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          type: integer
          format: int64
    ConfigAuditEntryView:
      type: object
      description: "One audit row, flattened for a viewer. Crosses the module boundary,\
        \ so it carries no entity."
      properties:
        actingAccountId:
          type: integer
          format: int64
        actingActor:
          $ref: "#/components/schemas/ConfigAuditActorRef"
          description: "resolved impersonator, present only for {@link ConfigAuditActorKind#IMPERSONATED\
            \ ConfigAuditActorKind#IMPERSONATED}"
        action:
          type: string
          enum:
          - CREATED
          - UPDATED
          - DELETED
        actor:
          $ref: "#/components/schemas/ConfigAuditActorRef"
          description: |-
            resolved identity of <code>actorAccountId</code>; null for SYSTEM rows or once the
                                 account is gone. Read together with <code>actorKind</code> — that is what keeps
                                 "a system did this" distinct from "we no longer know who did this".
        actorAccountId:
          type: integer
          format: int64
        actorKind:
          type: string
          enum:
          - USER
          - SYSTEM
          - IMPERSONATED
        changedKeys:
          type: array
          description: dot-paths that differ between <code>oldValue</code> and <code>newValue</code>
          items:
            type: string
        elevatedViaInstanceAdmin:
          type: boolean
          description: whether the actor reached this workspace by instance-admin
            elevation
        entityId:
          type: string
        entityType:
          type: string
          enum:
          - PRACTICE_REVIEW_SETTINGS
          - AGENT_BINDING
          - AGENT_CONFIG
          - AI_CONFIG_BINDING
          - WORKSPACE_ROLE
          - WORKSPACE_FEATURES
          - WORKSPACE_STATUS
          - WORKSPACE_TOKEN
          - WORKSPACE_VISIBILITY
          - PRACTICE_ACTIVE
          - PRACTICE_USAGE
          - PRACTICE_DEFINITION
          - PRACTICE_GROUP
          - CURATED_PRACTICE
          - CURATED_PRACTICE_GROUP
          - WORKSPACE_INSTANCE_LLM_BUDGET
          - WORKSPACE_OWN_PROVIDER_LLM_BUDGET
          - WORKSPACE_LLM_BUDGET
          - WORKSPACE_BYO_LLM_BUDGET
          - REVIEW_BACKFILL_RUN
          - REVIEW_SWEEP_SCHEDULE
          - WORKSPACE_LLM_CONNECTION
          - WORKSPACE_LLM_MODEL
        id:
          type: integer
          format: int64
        newValue:
          type: string
        occurredAt:
          type: string
          format: date-time
        oldValue:
          type: string
        workspaceId:
          type: integer
          format: int64
      required:
      - elevatedViaInstanceAdmin
