components:
  schemas:
    AcceptPracticeReleaseRequest:
      type: object
      properties:
        choices:
          type: object
          additionalProperties:
            type: string
            enum:
            - CURRENT
            - OFFERED
      required:
      - choices
    AccountAiChoice:
      type: object
      description: One account-wide answer; model names belong only to workspace-specific
        views.
      properties:
        choice:
          type:
          - string
          - "null"
          enum:
          - NO_AI
          - IN_HOUSE_ONLY
          - CLOUD
          - null
        updatedAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - choice
      - updatedAt
    AccountAiChoiceRequest:
      type: object
      properties:
        choice:
          type: string
          enum:
          - NO_AI
          - IN_HOUSE_ONLY
          - CLOUD
      required:
      - choice
    AccountRef:
      type: object
      properties:
        avatarUrl:
          type:
          - string
          - "null"
        displayName:
          type:
          - string
          - "null"
        id:
          type: string
          pattern: "^[1-9][0-9]*$"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/ProviderIdentityRef"
        status:
          type: string
          enum:
          - UNCLAIMED
          - ACTIVE
          - SUSPENDED
          - DELETING
          - DELETED
      required:
      - avatarUrl
      - displayName
      - id
      - identities
      - status
    ActivityAction:
      type: object
      description: How often one kind of activity happened on a piece of work
      properties:
        count:
          type: integer
          format: int32
          description: How often it was done
          example: 3
        kind:
          type: string
          description: What was done
          enum:
          - PULL_REQUEST_OPENED
          - PULL_REQUEST_MERGED
          - PULL_REQUEST_CLOSED
          - REVIEW_APPROVED
          - REVIEW_CHANGES_REQUESTED
          - REVIEW_COMMENTED
          - COMMENTED
          - CODE_COMMENTED
          - ISSUE_OPENED
          - ISSUE_CLOSED
      required:
      - count
      - kind
    ActivityBreakdown:
      type: object
      properties:
        approvals:
          type: integer
          format: int32
        changeRequests:
          type: integer
          format: int32
        codeComments:
          type: integer
          format: int32
        commentReviews:
          type: integer
          format: int32
        discussionComments:
          type: integer
          format: int32
        issuesClosed:
          type: integer
          format: int32
        pullRequestsClosed:
          type: integer
          format: int32
      required:
      - approvals
      - changeRequests
      - codeComments
      - commentReviews
      - discussionComments
      - issuesClosed
      - pullRequestsClosed
    ActivityCounts:
      type: object
      properties:
        activeWeeks:
          type: integer
          format: int64
        comments:
          type: integer
          format: int64
        contributions:
          type: integer
          format: int64
        issuesOpened:
          type: integer
          format: int64
        peopleHelped:
          type: integer
          format: int64
        pullRequestsMerged:
          type: integer
          format: int64
        pullRequestsOpened:
          type: integer
          format: int64
        pullRequestsReviewed:
          type: integer
          format: int64
      required:
      - activeWeeks
      - comments
      - contributions
      - issuesOpened
      - peopleHelped
      - pullRequestsMerged
      - pullRequestsOpened
      - pullRequestsReviewed
    ActivityCoverage:
      type: object
      description: "Completion comes from backfill checkpoints, not the presence of\
        \ ledger events."
      properties:
        completeRepositories:
          type: integer
          format: int64
        since:
          type: string
          format: date-time
        totalRepositories:
          type: integer
          format: int64
      required:
      - completeRepositories
      - totalRepositories
    ActivityFacets:
      type: object
      description: "The repositories and teams that workspace activity can be narrowed\
        \ to: the lists the people read also carries."
      properties:
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/ActivityRepository"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/ActivityTeam"
      required:
      - repositories
      - teams
    ActivityHighlights:
      type: object
      description: Identifiers refer only to the people in the same response.
      properties:
        firstContributors:
          type: array
          items:
            type: integer
            format: int64
        mostPeopleHelped:
          type: array
          items:
            type: integer
            format: int64
      required:
      - firstContributors
      - mostPeopleHelped
    ActivityPeople:
      type: object
      properties:
        automation:
          type: array
          items:
            $ref: "#/components/schemas/ActivityPerson"
        coverage:
          $ref: "#/components/schemas/ActivityCoverage"
        from:
          type: string
          format: date-time
        highlights:
          $ref: "#/components/schemas/ActivityHighlights"
        people:
          type: array
          items:
            $ref: "#/components/schemas/ActivityPerson"
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/ActivityRepository"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/ActivityTeam"
        to:
          type: string
          format: date-time
      required:
      - automation
      - coverage
      - from
      - highlights
      - people
      - repositories
      - teams
      - to
    ActivityPerson:
      type: object
      properties:
        counts:
          $ref: "#/components/schemas/ActivityCounts"
        firstContributionAt:
          type: string
          format: date-time
        kind:
          type: string
          enum:
          - PERSON
          - BOT
          - AUTOMATION
        person:
          $ref: "#/components/schemas/UserInfo"
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/ActivitySparklineWeek"
      required:
      - counts
      - kind
      - person
      - weeks
    ActivityPersonDetail:
      type: object
      properties:
        breakdown:
          $ref: "#/components/schemas/ActivityBreakdown"
        counts:
          $ref: "#/components/schemas/ActivityCounts"
        firstContributionAt:
          type: string
          format: date-time
        from:
          type: string
          format: date-time
        kind:
          type: string
          enum:
          - PERSON
          - BOT
          - AUTOMATION
        person:
          $ref: "#/components/schemas/UserInfo"
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/ActivityRepositoryCounts"
        to:
          type: string
          format: date-time
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/ActivityWeek"
      required:
      - breakdown
      - counts
      - from
      - kind
      - person
      - repositories
      - to
      - weeks
    ActivityRepository:
      type: object
      description: The full provider path avoids collisions between repositories with
        the same name.
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        name:
          type: string
      required:
      - id
      - key
      - name
    ActivityRepositoryCounts:
      type: object
      properties:
        breakdown:
          $ref: "#/components/schemas/ActivityBreakdown"
        counts:
          $ref: "#/components/schemas/ActivityCounts"
        repository:
          $ref: "#/components/schemas/ActivityRepository"
      required:
      - breakdown
      - counts
      - repository
    ActivitySparklineWeek:
      type: object
      properties:
        contributions:
          type: integer
          format: int64
        start:
          type: string
          format: date-time
      required:
      - contributions
      - start
    ActivityTeam:
      type: object
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        name:
          type: string
        parentId:
          type: integer
          format: int64
      required:
      - id
      - key
      - name
    ActivityWeek:
      type: object
      properties:
        breakdown:
          $ref: "#/components/schemas/ActivityBreakdown"
        counts:
          $ref: "#/components/schemas/ActivityCounts"
        start:
          type: string
          format: date-time
      required:
      - breakdown
      - counts
      - start
    ActivityWork:
      type: object
      description: The activity on one pull request or issue in a time range
      properties:
        actions:
          type: array
          description: "Each kind of activity that happened on it, in a fixed order\
            \ of kinds"
          items:
            $ref: "#/components/schemas/ActivityAction"
        id:
          type: string
          description: "Identifier of the group: work:<id of the pull request or issue>,\
            \ or event:<id of the activity> for activity whose pull request or issue\
            \ is not known"
        lastOccurredAt:
          type: string
          format: date-time
          description: When the latest of this activity happened
        people:
          type: array
          description: "Everyone this activity counts for, by name"
          items:
            $ref: "#/components/schemas/UserInfo"
        work:
          $ref: "#/components/schemas/WorkItem"
          description: "The pull request or issue; null when it, or the review or\
            \ comment the activity was, is no longer known or was deleted upstream"
      required:
      - actions
      - id
      - lastOccurredAt
      - people
    ActivityWorkPage:
      type: object
      description: "One page of activity grouped by the pull request or issue it happened\
        \ on, latest first"
      properties:
        content:
          type: array
          description: "The work on this page, by its latest activity, newest first"
          items:
            $ref: "#/components/schemas/ActivityWork"
        nextCursor:
          type: string
          description: Opaque cursor that fetches the next page when passed back as
            cursor; absent on the last page
      required:
      - content
    AdminAccountView:
      type: object
      properties:
        appRole:
          type: string
          enum:
          - USER
          - APP_ADMIN
        displayName:
          type: string
        id:
          type: integer
          format: int64
        primaryEmail:
          type: string
        status:
          type: string
          enum:
          - UNCLAIMED
          - ACTIVE
          - SUSPENDED
          - DELETING
          - DELETED
      required:
      - appRole
      - status
    AdminLlmUsageReport:
      type: object
      description: "Instance-admin per-workspace month rollup (metadata only, no tenant\
        \ content)"
      properties:
        fx:
          $ref: "#/components/schemas/FxRateInfo"
          description: Display-only conversion when the instance has a display currency.
            Absent = show USD only. Applies to every USD amount in this response.
        month:
          type: string
          description: "Calendar month (UTC), ISO yyyy-MM"
          example: 2026-07
        workspaces:
          type: array
          description: "One row per workspace, including workspaces with no ledger\
            \ activity this month"
          items:
            $ref: "#/components/schemas/AdminWorkspaceLlmUsage"
      required:
      - month
      - workspaces
    AdminWorkspaceLlmUsage:
      type: object
      description: "One workspace's month of spend, as an instance admin sees it"
      properties:
        displayName:
          type: string
        events:
          type: integer
          format: int64
          description: "Runs this month, either purse: job attempts and mentor turns.\
            \ Rows of models for practice scripts are not runs."
        instanceBudgetVerdict:
          type: string
          description: "Whether shared-model spend is within the instance cap, has\
            \ reached it, or cannot be confirmed because shared-model rates are missing\
            \ or usage measurements are unverified."
          enum:
          - WITHIN
          - EXHAUSTED
          - UNVERIFIABLE
        instanceMonthlyBudgetUsd:
          type: number
          format: decimal
          description: Monthly cap in USD on this workspace's spend on shared (instance)
            models — the money this instance pays for; null = uncapped. Yours to set.
        instancePaused:
          type: boolean
          description: "Whether work on SHARED models is paused for this workspace\
            \ right now (current month only) — authoritative, mirroring the live gate."
        instanceTotalCostUsd:
          type: number
          format: decimal
          description: "This month's confirmed spend on shared (instance) models,\
            \ in USD — compared against instanceMonthlyBudgetUsd."
        ownProviderBudgetVerdict:
          type: string
          description: The same verdict for the workspace's own-provider spend against
            its own cap.
          enum:
          - WITHIN
          - EXHAUSTED
          - UNVERIFIABLE
        ownProviderInUse:
          type: boolean
          description: Whether this month has an own-provider purse to show for the
            workspace. Same rule as WorkspaceLlmUsageReport.ownProviderInUse.
        ownProviderMonthlyBudgetUsd:
          type: number
          format: decimal
          description: "The workspace's own cap in USD on its own-provider spend;\
            \ null = uncapped. Read-only here — it governs the workspace's money,\
            \ so only its own admins may change it."
        ownProviderPaused:
          type: boolean
          description: Whether work on the workspace's OWN provider is paused right
            now.
        ownProviderTotalCostUsd:
          type: number
          format: decimal
          description: "This month's confirmed spend on the workspace's own connected\
