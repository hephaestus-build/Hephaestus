          - TOGETHER_AI
          - DEEPINFRA
          - NEBIUS
          - OPENROUTER
          - CLOUDFLARE_AI_GATEWAY
          - VERCEL_AI_GATEWAY
        createdAt:
          type: string
          format: date-time
