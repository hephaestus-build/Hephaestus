    CreateReviewBackfillRunRequest:
      type: object
      description: |-
        Ask for a campaign to be enumerated and costed. Creates nothing that spends money: the run comes back
         awaiting confirmation, and only a subsequent status change starts it.
      properties:
        artifactKind:
          type: string
          description: Kind of work to review
          enum:
          - scm.pull_request
          - scm.issue
          example: scm.pull_request
        fromAt:
          type: string
          format: date-time
          description: "Window start, inclusive, over the artifact's creation time"
        toAt:
          type: string
          format: date-time
          description: "Window end, exclusive"
      required:
      - artifactKind
      - fromAt
      - toAt
    CreateReviewRequest:
      type: object
      description: The piece of work a review is being asked for
      properties:
        artifactId:
          type: integer
          format: int64
          description: "The artifact's internal id, as the trace and review listings\
            \ report it"
          minimum: 0
        artifactKind:
          type: string
          description: "The artifact kind's wire id, e.g. scm.pull_request. A raw\
            \ string rather than a closed enum because kinds are an open vocabulary:\
            \ a build that has never heard of a kind should refuse it by name, not\
            \ fail to parse the request."
          example: scm.pull_request
          minLength: 1
      required:
      - artifactId
      - artifactKind
    CreateReviewSweepScheduleRequest:
      type: object
      description: |-
        Create a standing instruction to sweep this workspace's recent work.

         <p>Unlike a backfill campaign there is no separate confirmation step: this request <em>is</em> the
         authorisation to spend on the cadence it names, and it is recorded against the account that made it.

         <p>There is deliberately no repository or author list. Which repositories are reviewed is the
         workspace's review scope and whose work is reviewed is the practice-review role; both already apply to
         every review this workspace runs, a sweep included.
      properties:
        artifactKind:
          type: string
          description: Kind of work to sweep
          enum:
          - scm.pull_request
          - scm.issue
          example: scm.pull_request
        cadence:
          type: string
          description: How often the sweep runs
          enum:
          - DAILY
          - WEEKLY
        lookbackDays:
          type: integer
          format: int32
          description: "How far back each sweep looks, in days"
          example: 2
          maximum: 7
          minimum: 1
      required:
      - artifactKind
      - cadence
      - lookbackDays
