          type: string
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
        enabled:
          type: boolean
        redirectUri:
          type: string
          description: Redirect/callback URI to register on the upstream OAuth app
        registrationId:
          type: string
        scopes:
          type: string
        seededFromEnv:
          type: boolean
        type:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - baseUrl
      - createdAt
      - displayName
      - redirectUri
      - registrationId
      - scopes
      - type
      - updatedAt
    MemberReviewReadiness:
      type: object
      description: "Whether and how the workspace reviews one member's work, from\
        \ the rules that start and admit a review."
      properties:
        approvalBeforePosting:
          type: boolean
          description: Whether a workspace admin approves feedback from at least one
            of those practices before it is posted on the work
        blocker:
          type:
          - string
          - "null"
          description: "The first reason, in the enum's order, why no review of the\
            \ member's work runs now; null when work activity can start one. Repository\
            \ coverage and a practice's state filters depend on the work and are not\
            \ judged here."
          enum:
          - WORKSPACE_INACTIVE
          - REVIEWS_OFF
          - PERSON_ERASED
          - NO_AI
          - OUTSIDE_REVIEW_SCOPE
          - NOT_ELIGIBLE
          - CHOICE_REQUIRED
          - NO_MODEL
          - NO_PRACTICE
          - ON_REQUEST_ONLY
          - null
        events:
          type: array
          description: "The sorted, distinct item events (such as scm.pull_request.opened)\
            \ that can start a review of the member's work, from the practices that\
            \ Hephaestus reviews about the person who did the work. A review also\
            \ needs the work's repository and the practice's own conditions to match,\
            \ and a null blocker."
          items:
            type: string
      required:
      - approvalBeforePosting
      - blocker
      - events
    MentorConversation:
      type: object
      description: The developer's Hephaestus conversation in a workspace at one moment
      properties:
        activeTurns:
          type: array
          description: "Queued and running turns in the conversation and its threads,\
            \ oldest first"
          items:
            $ref: "#/components/schemas/MentorTurn"
        id:
          type: string
          format: uuid
          description: The main conversation; absent until the developer writes to
            Hephaestus or gets a weekly digest
        lastAnswerAt:
          type: string
          format: date-time
          description: When Hephaestus's newest shown answer in the conversation or
            any of its threads was written; absent before the first. Compare it with
            the newest answer the client has seen.
        lastReadAt:
          type: string
          format: date-time
          description: How far the developer read the conversation on any device;
            absent before the first read. Hephaestus has an unread answer when lastAnswerAt
            is later.
        latestSeq:
          type: integer
          format: int64
          description: Sequence number of the newest top-level message shown; 0 when
            there is none
        threads:
          type: array
          description: "The newest threads, latest activity first"
          items:
            $ref: "#/components/schemas/MentorThreadSummary"
      required:
      - activeTurns
      - latestSeq
      - threads
    MentorEntry:
      type: object
      description: One message of a Hephaestus conversation
      properties:
        conversationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        deleted:
          type: boolean
          description: The message was deleted; its text is gone
        digest:
          $ref: "#/components/schemas/WeeklyDigest"
          description: The weekly digest as it reads now; only on a weekly digest
            that was not erased
        editedAt:
          type: string
          format: date-time
          description: Set when the developer edited the message in Slack
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - USER
          - HEPH
          - DIGEST
        links:
          type: array
          description: "The results, problems and prepared feedback Hephaestus showed\
            \ in this message, in order"
          items:
            $ref: "#/components/schemas/MentorLink"
        parentEntryId:
          type: string
          format: uuid
          description: "Set when the message is in a thread: the top-level message\
            \ the thread replies to"
        requestId:
          type: string
          description: The submission that wrote the message; the app matches its
            own optimistic message by it
        seq:
          type: integer
          format: int64
          description: Order within its conversation
        slackDelivery:
          type: string
          description: "Only on a question asked in Slack: whether Hephaestus's reply\
            \ reached Slack. FAILED means Slack does not show the whole reply: it\
            \ is not there, or a stream showed only part of it before Slack or Silent\
            \ Mode refused the rest; the full reply is in the app. UNCERTAIN means\
            \ Slack cannot tell."
          enum:
          - PENDING
          - DELIVERED
          - UNCERTAIN
          - FAILED
        surface:
          type: string
          description: Where the message was written; SYSTEM for a weekly digest
          enum:
          - APP
          - SLACK
          - SYSTEM
        text:
          type: string
          description: "The developer's words or Hephaestus's answer; for a weekly\
            \ digest, the note that points Hephaestus to it; empty when the message\
            \ was deleted"
        thread:
          $ref: "#/components/schemas/MentorThreadSummary"
          description: The thread on this message; only on top-level messages that
            have one
        turnError:
          type: string
          description: "Why the turn this question asked failed, in words for the\
            \ developer; only when it FAILED"
        turnId:
          type: string
          format: uuid
          description: The turn the message asked or answered
        turnStatus:
          type: string
          description: The status of the turn this question asked; only on the developer's
            messages
          enum:
          - QUEUED
          - RUNNING
          - DONE
          - FAILED
          - STOPPED
        vote:
          type: string
          description: The developer's vote; only on Hephaestus's messages
          enum:
          - HELPFUL
          - NOT_HELPFUL
      required:
      - conversationId
      - createdAt
      - deleted
      - id
      - kind
      - links
      - seq
      - surface
      - text
    MentorEntryPage:
      type: object
      description: "One page of a conversation's messages, oldest first"
      properties:
        earlierBefore:
          type: integer
          format: int64
          description: Pass as before to read the older messages; absent when there
            are none
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MentorEntry"
      required:
      - entries
    MentorLink:
      type: object
      description: "A practice result, problem or prepared feedback Hephaestus showed\
        \ in a message"
      properties:
        id:
          type: string
          format: uuid
          description: "The result, problem or feedback id, by kind"
        itemId:
          type: integer
          format: int64
          description: "The item (pull request, issue, conversation or document) it\
            \ is about, when the developer may still read it: a problem's through\
            \ its result"
        kind:
          type: string
          enum:
          - RESULT
          - PROBLEM
          - FEEDBACK
        practiceSlug:
          type: string
          description: "The practice it is about: a problem's through its result,\
            \ feedback's when it is about one practice; absent when the developer\
            \ can no longer read it"
        text:
          type: string
          description: "Hephaestus's words about it, shown to the developer"
      required:
      - id
      - kind
      - text
    MentorRead:
      type: object
      description: How far the developer read their Hephaestus conversation
      properties:
        lastReadAt:
          type: string
          format: date-time
          description: The read marker; absent when the developer has no conversation
            yet
    MentorReadRequest:
      type: object
      description: How far the developer read their Hephaestus conversation
      properties:
        at:
          type: string
          format: date-time
          description: The time of the newest answer the developer saw
      required:
      - at
    MentorSubmission:
      type: object
      description: A stored question and the turn that answers it
      properties:
        question:
          $ref: "#/components/schemas/MentorEntry"
        turn:
          $ref: "#/components/schemas/MentorTurn"
      required:
      - question
      - turn
    MentorThread:
      type: object
      description: "A thread: the message it replies to and one page of its replies,\
        \ oldest first"
      properties:
        conversationId:
          type: string
          format: uuid
          description: The thread's conversation; absent until the first reply opens
            it
        earlierBefore:
          type: integer
          format: int64
          description: Pass as before to read the older replies; absent when there
            are none
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MentorEntry"
        parent:
          $ref: "#/components/schemas/MentorEntry"
      required:
      - entries
      - parent
    MentorThreadSummary:
      type: object
      description: The thread on a top-level message
      properties:
        conversationId:
          type: string
          format: uuid
          description: The thread's own conversation
        lastReplyAt:
          type: string
          format: date-time
        latestSeq:
          type: integer
          format: int64
          description: Sequence number of the thread's newest shown message; 0 when
            it has none
        parentEntryId:
          type: string
          format: uuid
          description: The message the thread replies to
        replyCount:
          type: integer
          format: int64
          description: Messages in the thread; can count a Hephaestus message without
            text whose feedback is no longer shown
      required:
      - conversationId
      - latestSeq
      - parentEntryId
      - replyCount
    MentorTurn:
      type: object
      description: One question to Hephaestus and the work to answer it
      properties:
        attempt:
          type: integer
          format: int32
          description: "Attempts started so far; 0 while the turn waits for its first\
            \ start. A lost lease queues the turn again with the same attempt, and\
            \ the next start counts up. Thus, with the same attempt, RUNNING comes\
            \ before QUEUED or an end."
        conversationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        error:
          type: string
          description: "Why the turn failed, worded for the developer; only on a failed\
            \ turn"
        finishedAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        parentEntryId:
          type: string
          format: uuid
          description: "Set when the turn runs in a thread: the top-level message\
            \ the thread replies to"
        partial:
          $ref: "#/components/schemas/MentorTurnPartial"
          description: Hephaestus's answer in progress; only while the turn runs
        requestId:
          type: string
          description: The submission that asked; the question's entry carries the
            same value
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - DONE
          - FAILED
          - STOPPED
        surface:
          type: string
          enum:
          - APP
          - SLACK
        waitingFor:
          type: string
          description: "Why a queued turn has not started. FREE_HEPH: a worker may\
            \ start it, and every conversation slot of the deployment is taken, so\
            \ it starts when one is free. Absent when the turn does not wait, waits\
            \ for an earlier question of its conversation, or waits for a reason that\
            \ the server does not know, such as a server without a configured conversation\
            \ turn capacity."
          enum:
          - FREE_HEPH
      required:
      - attempt
      - conversationId
      - createdAt
      - id
      - requestId
      - status
      - surface
    MentorTurnPartial:
      type: object
      description: What Hephaestus is doing in a running turn
      properties:
        activity:
          type: string
          enum:
          - THINKING
          - WRITING
          - TOOL
        stage:
          type: string
          description: "What Hephaestus is doing, in the developer's words, for example\
            \ \"Reading your practice feedback…\""
        text:
          type: string
          description: The text Hephaestus has written in this turn so far
        tool:
          type: string
          description: "The tool Hephaestus runs, while the activity is TOOL"
      required:
      - activity
      - stage
      - text
    MentorTurnRequest:
      type: object
      description: A question to Hephaestus from the app
      properties:
        pageContext:
          type: string
          description: "The page the developer asks from, for example \"Pull request\
            \ #421 in acme/web\""
          maxLength: 500
          minLength: 0
        parentEntryId:
          type: string
          format: uuid
          description: Ask in the thread on this top-level message; the first reply
            opens the thread
        requestId:
          type: string
          format: uuid
          description: "Chosen by the app for each message. Sending the same id again\
            \ returns the first submission, so a retried request never asks twice."
        text:
          type: string
          description: The developer's words
          minLength: 1
      required:
      - requestId
      - text
    MentorTurnStatusRequest:
      type: object
      description: A status change the developer asks for on a turn
      properties:
        status:
