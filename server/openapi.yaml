          pattern: "^[1-9][0-9]*$"
        createdAt:
          type: string
          format: date-time
          description: When the transition was recorded
        fromState:
          type:
          - string
          - "null"
          description: State the channel left (absent for the very first record)
          enum:
          - PENDING
          - ACTIVE
          - PAUSED
          - REVOKED
          - null
        id:
          type: string
          description: Audit entry id
          pattern: "^[1-9][0-9]*$"
        reason:
          type:
          - string
          - "null"
          description: Optional free-text reason the admin supplied
        slackChannelId:
          type: string
          description: Slack channel id the transition applied to
        toState:
          type: string
          description: State the channel entered
          enum:
          - PENDING
          - ACTIVE
          - PAUSED
          - REVOKED
      required:
      - actorAccountId
      - createdAt
      - fromState
      - id
      - reason
      - slackChannelId
      - toState
