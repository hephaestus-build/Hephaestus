openapi: 3.1.0
info:
  contact:
    email: felixtj.dietrich@tum.de
    name: Felix T.J. Dietrich
  description: |-
    API documentation for the Hephaestus application server.

    ### Money and exact decimals

    Every monetary amount and per-unit rate is a JSON number carrying `format: decimal`. It is an exact decimal on the server (`BigDecimal`, backed by a `NUMERIC` column) and MUST NOT be parsed into a binary floating-point type in a language that has an exact decimal one: bind it to `BigDecimal` / `decimal` / `Decimal`, not to `double`.

    JavaScript has no exact decimal type, so the generated TypeScript client necessarily binds these to `number` (IEEE-754 binary64). That is lossless for every value this API produces, and the margin is large: a binary64 round-trips any decimal of at most 15 significant digits exactly (`DBL_DIG`). Amounts are quantised to 6 decimal places, so they are exact below **$1,000,000,000**; per-1M-token rates are quantised to 8 places, so they are exact below **$10,000,000** per 1M tokens; budget caps are quantised to 2 places and their column tops out at $99,999,999.99. Every reachable value sits orders of magnitude inside those bounds.

    What that margin does NOT license is arithmetic. Totals, remaining budget and cap verdicts are computed on the server in exact decimal and shipped as fields; a client that re-derives them by summing rows is accumulating binary rounding error the server does not have. Read the totals, do not add them up.

    Amounts are USD throughout — the ledger, the caps and the gates all meter in USD, and the currency is therefore part of the field name (`...Usd`) rather than a per-amount field. Where a response also carries `FxRateInfo`, that is a display-only estimate in a second currency and is never an input to a budget decision.
  license:
    name: MIT License
    url: https://github.com/ls1intum/Hephaestus/blob/develop/LICENSE
  title: Hephaestus API
  version: 0.0.0-development
servers:
- description: Default Server URL
  url: /
security:
- bearerAuth: []
tags:
- description: User achievement progress and unlocks
  name: Achievements
- description: Per-workspace LLM spend rollup and budget status
  name: LLM Usage
- description: Practice group trends and review runs for the current developer
  name: Practice Group Detail
- description: Workspace-scoped mentor chat threads
  name: Mentor Threads
- description: The current developer's standing in each practice
  name: Practice Standings
- description: Recipient responses to delivered practice feedback
  name: Feedback Response
- description: "User account management (settings, deletion)"
  name: Account
- description: Instance-admin account management
  name: Admin
- description: Current user's Slack privacy preferences
  name: Slack User Preferences
- description: Per-workspace Outline collection mirroring control plane
  name: Outline collections
- description: The starting catalog copied into new workspaces
  name: Admin Practice Catalog
- description: User profile and activity data
  name: Profile
- description: Instance-wide operator settings
  name: Instance Settings
- description: Current instance definitions visible to workspace administrators
  name: Practice Catalog
- description: Session lifecycle
  name: Auth
- description: Workspace-scoped practice-review policy
  name: Practice Review Settings
- description: Workspace integration connection management
  name: Connections
- description: Up/down votes on mentor assistant messages
  name: Mentor Votes
- description: "Workspace-admin access to review runs, observations, and feedback\
    \ delivery history"
  name: Practice reviews
- description: GDPR Art. 20 self-service data export
  name: Account
- description: Workspace-scoped history of admin configuration changes
  name: Config Audit
- description: |-
    Vendor OAuth redirect ingress at <code>/oauth/callback/{kind</code>}. Unauthenticated —
     identity comes from the HMAC-signed <code>state</code> param. Browsers get 302 redirects
     on both success and failure; only <code>Accept: application/json</code> requests get
     4xx JSON.
  name: o-auth-callback-controller
- description: Recurring reviews of recent work
  name: Practice Review Sweep
- description: Redacted production configuration facts
  name: Configuration Readiness
- description: Identity provider discovery (public)
  name: Auth discovery
- description: Global contributor information
  name: Contributors
- description: User preferences
  name: Account
- description: Instance-admin login provider management
  name: Admin
- description: Per-workspace Slack channel consent + activation
  name: Slack channel activation
- description: |-
    Workspace registry endpoints under /workspaces that operate outside of a specific workspace slug;
     slugged routes live in {@link WorkspaceController WorkspaceController} via <code>@WorkspaceScopedController</code>.
  name: workspace-registry-controller
- description: Bounded campaigns that review work which already existed
  name: Practice Review Backfill
- description: |-
    Controller for managing workspace memberships and roles.
     Handles CRUD operations for workspace members and role assignments.
  name: workspace-membership-controller
- description: Workspace-scoped per-purpose agent configuration
  name: Agents
- description: Workspace-scoped agent job monitoring
  name: Agent Jobs
- description: The current developer's standing in each practice group
  name: Practice Group Standings
- description: Asking for a review of a piece of work by hand
  name: Practice review requests
- description: Current account transparency and research consent
  name: Consent
- description: Read-only access to practice evaluation observations
  name: Practice Observations
- description: Adopt instance catalog practices into a workspace
  name: Practice Catalog Adoption
- description: Team management within workspace
  name: Teams
- description: The developer's own prepared practice feedback
  name: In-App Feedback
- description: "Workspace-scoped \"bring your own\" AI provider connections, models\
    \ and settings"
  name: Workspace LLM
- description: Contributor rankings and league statistics
  name: Leaderboard
- description: Why each practice did or did not run on one piece of work; readable
    by any workspace member
  name: Practice review trace
- description: Active sessions
  name: Account
- description: |-
    GitLab-specific REST endpoints used during the workspace creation wizard. Gated on the
     <code>GITLAB_WORKSPACE_CREATION</code> feature flag.
  name: git-lab-preflight-controller
- description: Instance-admin LLM connection and settings management
  name: Admin LLM
- description: Manage practice groups
  name: Practice Groups
- description: Public JWK set for verifying Hephaestus session JWTs
  name: Auth discovery
- description: Manage practice definitions
  name: Practice Catalog
- description: Workspace-scoped team settings management
  name: Team Settings
- description: Integration sync observability and manual controls
  name: Sync
- description: "Current user identity, linked accounts, deletion"
  name: Account
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: OK
      summary: JWK set (public keys only)
      tags:
      - Auth discovery
  /admin/audit:
    get:
      operationId: adminListAuthEvents
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - in: query
        name: accountId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: actingAccountId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: eventType
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - LOGIN
            - LOGIN_FAILED
            - LOGOUT
            - TOKEN_REFRESH
            - JWT_REVOKED
            - IDENTITY_LINKED
            - IDENTITY_UNLINKED
            - IMPERSONATION_BEGIN
            - IMPERSONATION_END
            - ACCOUNT_DELETED
            - EXPORT_REQUESTED
            - APP_ROLE_CHANGED
            - RESEARCH_CONSENT_REVOKED
            - WORKSPACE_ELEVATION
            - LLM_CONNECTION_CREATED
            - LLM_CONNECTION_UPDATED
            - LLM_CONNECTION_DELETED
            - LLM_MODEL_CREATED
            - LLM_MODEL_UPDATED
            - LLM_MODEL_DELETED
            - LLM_MODEL_PRICE_CHANGED
            - LLM_MODEL_SHARING_CHANGED
            - LLM_SETTINGS_CHANGED
            - LOGIN_PROVIDER_CREATED
            - LOGIN_PROVIDER_UPDATED
            - LOGIN_PROVIDER_DELETED
            - SILENT_MODE_CHANGED
      - in: query
        name: result
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - SUCCESS
            - FAILURE
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAuthEventView"
          description: OK
      summary: "List auth audit events (paged, newest first)"
      tags:
      - Admin
  /admin/audit/export:
    get:
      operationId: adminExportAuthEvents
      parameters:
      - in: query
        name: accountId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: actingAccountId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: eventType
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - LOGIN
            - LOGIN_FAILED
            - LOGOUT
            - TOKEN_REFRESH
            - JWT_REVOKED
            - IDENTITY_LINKED
            - IDENTITY_UNLINKED
            - IMPERSONATION_BEGIN
            - IMPERSONATION_END
            - ACCOUNT_DELETED
            - EXPORT_REQUESTED
            - APP_ROLE_CHANGED
            - RESEARCH_CONSENT_REVOKED
            - WORKSPACE_ELEVATION
            - LLM_CONNECTION_CREATED
            - LLM_CONNECTION_UPDATED
            - LLM_CONNECTION_DELETED
            - LLM_MODEL_CREATED
            - LLM_MODEL_UPDATED
            - LLM_MODEL_DELETED
            - LLM_MODEL_PRICE_CHANGED
            - LLM_MODEL_SHARING_CHANGED
            - LLM_SETTINGS_CHANGED
            - LOGIN_PROVIDER_CREATED
            - LOGIN_PROVIDER_UPDATED
            - LOGIN_PROVIDER_DELETED
            - SILENT_MODE_CHANGED
      - in: query
        name: result
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - SUCCESS
            - FAILURE
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
          description: OK
      summary: "Export the filtered audit log as CSV (newest first, capped)"
      tags:
      - Admin
  /admin/config-audit:
    get:
      operationId: adminListConfigAuditEvents
      parameters:
      - in: query
        name: workspaceId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - in: query
        name: entityType
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PRACTICE_REVIEW_SETTINGS
            - AGENT_BINDING
            - AGENT_CONFIG
            - AI_CONFIG_BINDING
            - WORKSPACE_ROLE
            - WORKSPACE_FEATURES
            - WORKSPACE_STATUS
            - WORKSPACE_TOKEN
            - WORKSPACE_VISIBILITY
            - PRACTICE_ACTIVE
            - PRACTICE_USAGE
            - PRACTICE_DEFINITION
            - PRACTICE_GROUP
            - CURATED_PRACTICE
            - CURATED_PRACTICE_GROUP
            - WORKSPACE_INSTANCE_LLM_BUDGET
            - WORKSPACE_OWN_PROVIDER_LLM_BUDGET
            - WORKSPACE_LLM_BUDGET
            - WORKSPACE_BYO_LLM_BUDGET
            - REVIEW_BACKFILL_RUN
            - REVIEW_SWEEP_SCHEDULE
            - WORKSPACE_LLM_CONNECTION
            - WORKSPACE_LLM_MODEL
      - in: query
        name: entityId
        required: false
        schema:
          type: string
      - in: query
        name: changedKey
        required: false
        schema:
          type: string
      - in: query
        name: action
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - CREATED
            - UPDATED
            - DELETED
      - in: query
        name: actorId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageConfigAuditEntryView"
          description: OK
      summary: "List admin configuration changes across workspaces (paged, newest\
        \ first)"
      tags:
      - Admin
  /admin/configuration-readiness:
    get:
      operationId: adminGetConfigurationReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigurationFact"
          description: OK
      summary: Get redacted configuration readiness
      tags:
      - Configuration Readiness
  /admin/llm/connections:
    get:
      operationId: adminListLlmConnections
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmConnection"
          description: OK
      summary: List LLM connections
      tags:
      - Admin LLM
    post:
      operationId: adminCreateLlmConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLlmConnectionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnection"
          description: Connection created; URL in the Location header
        "409":
          description: An LLM connection with this slug already exists
      summary: Create an LLM connection
      tags:
      - Admin LLM
  /admin/llm/connections/probe:
    post:
      operationId: adminProbeLlmConnectionDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeLlmConnectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProbeResult"
          description: OK
      summary: Test a draft connection and fetch its models
      tags:
      - Admin LLM
  /admin/llm/connections/{connectionId}/models:
    post:
      operationId: adminCreateLlmModel
      parameters:
      - in: path
        name: connectionId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLlmModelRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"
          description: Model created; URL in the Location header
        "404":
          description: LLM connection not found
        "409":
          description: A model with this slug or upstream model id already exists
            on the connection
      summary: Create a model on an LLM connection
      tags:
      - Admin LLM
  /admin/llm/connections/{id}:
    delete:
      operationId: adminDeleteLlmConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Connection deleted
        "404":
          description: LLM connection not found
        "409":
          description: Cannot delete a connection still referenced by one or more
            models
      summary: Delete an LLM connection
      tags:
      - Admin LLM
    get:
      operationId: adminGetLlmConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnection"
          description: OK
        "404":
          description: LLM connection not found
      summary: Get an LLM connection
      tags:
      - Admin LLM
    patch:
      operationId: adminUpdateLlmConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmConnectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnection"
          description: OK
        "404":
          description: LLM connection not found
      summary: Update an LLM connection
      tags:
      - Admin LLM
  /admin/llm/connections/{id}/probe:
    post:
      operationId: adminProbeLlmConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProbeResult"
          description: OK
      summary: Test a stored connection and fetch its models
      tags:
      - Admin LLM
  /admin/llm/models:
    get:
      operationId: adminListLlmModels
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmModel"
          description: OK
      summary: List LLM catalog models
      tags:
      - Admin LLM
  /admin/llm/models/{id}:
    delete:
      operationId: adminDeleteLlmModel
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Model deleted
        "404":
          description: LLM model not found
        "409":
          description: Cannot delete a model still bound to an agent configuration
      summary: Delete an LLM catalog model
      tags:
      - Admin LLM
    get:
      operationId: adminGetLlmModel
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"
          description: OK
        "404":
          description: LLM model not found
      summary: Get an LLM catalog model
      tags:
      - Admin LLM
    patch:
      operationId: adminUpdateLlmModel
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmModelRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"
          description: OK
        "404":
          description: LLM model not found
        "409":
          description: Another model on the connection already uses this upstream
            model id
      summary: Update a model's metadata
      tags:
      - Admin LLM
  /admin/llm/models/{id}/price:
    put:
      operationId: adminUpdateLlmModelPrice
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmModelPriceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"
          description: OK
        "404":
          description: LLM model not found
      summary: Reprice a model
      tags:
      - Admin LLM
  /admin/llm/models/{id}/sharing:
    put:
      operationId: adminUpdateLlmModelSharing
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmModelSharingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"
          description: OK
        "404":
          description: LLM model not found
      summary: Share a model with all or selected workspaces
      tags:
      - Admin LLM
  /admin/llm/settings:
    get:
      operationId: adminGetLlmSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceLlmSettings"
          description: OK
      summary: Get instance-wide LLM governance settings
      tags:
      - Admin LLM
    put:
      operationId: adminUpdateLlmSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceLlmSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceLlmSettings"
          description: OK
      summary: Update instance-wide LLM governance settings
      tags:
      - Admin LLM
  /admin/llm/usage:
    get:
      operationId: adminGetLlmUsageReport
      parameters:
      - in: query
        name: month
        required: false
        schema:
          type: string
          pattern: "\\d{4}-(0[1-9]|1[0-2])"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLlmUsageReport"
          description: OK
      summary: Per-workspace LLM spend rollup for one month (all workspaces)
      tags:
      - Admin
  /admin/login-providers:
    get:
      operationId: adminListLoginProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginProviderView"
          description: OK
      summary: List login providers
      tags:
      - Admin
    post:
      operationId: adminCreateLoginProvider
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoginProviderRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginProviderView"
          description: Login provider created; URL in the Location header
      summary: Create a login provider
      tags:
      - Admin
  /admin/login-providers/{registrationId}:
    delete:
      operationId: adminDeleteLoginProvider
      parameters:
      - in: path
        name: registrationId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: Delete a login provider
      tags:
      - Admin
    patch:
      operationId: adminUpdateLoginProvider
      parameters:
      - in: path
        name: registrationId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoginProviderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginProviderView"
          description: OK
      summary: Update a login provider
      tags:
      - Admin
  /admin/practice-catalog:
    get:
      description: "Practice summaries, complete groups, ordering, and catalog state.\
        \ Fetch a practice for its full definition."
      operationId: adminGetCuratedCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuratedCatalog"
          description: OK
      summary: Read the instance catalog
      tags:
      - Admin Practice Catalog
  /admin/practice-catalog/definition-options:
    get:
      description: "Returns available review events, recommended requirements, and\
        \ allowed evidence sources by work type"
      operationId: adminGetPracticeDefinitionOptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeDefinitionOptions"
          description: OK
      summary: Read practice definition options
      tags:
      - Admin Practice Catalog
  /admin/practice-catalog/groups:
    post:
      operationId: adminCreateCuratedGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCuratedGroupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuratedGroup"
          description: Group added
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Slug already exists
      summary: Add a group to the catalog
      tags:
      - Admin Practice Catalog
  /admin/practice-catalog/groups/reorder:
    patch:
      operationId: adminReorderCuratedGroups
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
