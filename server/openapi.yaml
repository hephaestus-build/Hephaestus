      properties:
        automatedReview:
          $ref: "#/components/schemas/PracticeAutomatedReview"
          description: Automated review configuration; human review is a separate
            process
        insufficiencyReason:
          $ref: "#/components/schemas/PracticeEvidenceLimitation"
          description: Why this practice needs a human rather than automated review;
            present only when evidenceSufficiency is DECLARED_EVIDENCE_INSUFFICIENT
        knownLimitations:
          type: array
          description: Claims the selected evidence cannot support even when every
            requirement passes
          items:
            $ref: "#/components/schemas/PracticeEvidenceLimitation"
        sourceContractVersion:
          type: string
          description: Exact contract version that defines source kinds and source-state
            semantics
        whenEvidenceIsInsufficient:
          type: string
          description: Conservative action when required evidence does not pass
          enum:
          - SKIP_AUTOMATED_REVIEW
      required:
      - automatedReview
      - knownLimitations
      - sourceContractVersion
      - whenEvidenceIsInsufficient
    PracticeAutomatedReviewValidation:
      type: object
      description: "Who stands behind a practice's automated-review policy, and which\
        \ exact policy"
      properties:
        policyDigest:
          type: string
          description: SHA-256 digest of the exact automated-review policy
        reviewRuleFingerprint:
          type: string
          description: Versioned fingerprint of the exact review rules
        sourceContractVersion:
          type: string
          description: Source contract the declared practice definition is written
            against
        status:
          type: string
          description: Validation lifecycle; authors cannot mark their own review
            policy as independently validated
          enum:
          - AUTHOR_DECLARED
      required:
      - policyDigest
      - reviewRuleFingerprint
      - sourceContractVersion
      - status
    PracticeBinding:
      type: object
      description: "An occasion that starts a review, and the evidence that review\
        \ reads"
      properties:
        appliesWhen:
          $ref: "#/components/schemas/PracticeSubject"
          description: What must be in the work for this practice to apply; omit to
            always apply
        needs:
          type: array
          description: "Sources a review occasioned this way reads, each with the\
            \ stance it takes"
          items:
            $ref: "#/components/schemas/PracticeEvidenceRequirement"
        onDrafts:
          type: boolean
          description: Whether an artifact still marked draft occasions this review;
            omit for false
        signals:
          type: array
          description: "Signals that occasion this review, e.g. scm.pull_request.merged"
          items:
            type: string
          minItems: 1
        subject:
          type: string
          description: Whose conduct this review judges; omit for AUTHOR
          enum:
          - AUTHOR
          - ASSIGNEE
          - REVIEWER
      required:
      - needs
      - signals
    PracticeDefinitionOptions:
      type: object
      description: "What a practice author may choose, per type of reviewed work"
      properties:
        sourceContractVersion:
          type: string
          description: Source contract these options describe
          example: 1.0.0
        workTypes:
          type: array
          items:
            $ref: "#/components/schemas/PracticeWorkTypeDefinitionOptions"
      required:
      - sourceContractVersion
      - workTypes
    PracticeEvidenceBlocker:
      type: object
      description: "One thing that blocked automated review, and how many reviews\
        \ it affected"
      properties:
        reasonCode:
          type: string
          description: Readiness reason recorded for that source or practice
          enum:
          - SOURCE_NOT_AVAILABLE
          - SOURCE_INCOMPLETE
          - SOURCE_EMPTY
          - NO_AUTOMATED_REVIEW
          - DECLARED_EVIDENCE_INSUFFICIENT
          - SUBJECT_NOT_IN_THE_WORK
        reviewsAffected:
          type: integer
          format: int32
          description: Reviews this blocker affected
        sourceKind:
          type: string
          description: Source that did not meet its requirement; absent when the practice
            itself runs no review
      required:
      - reasonCode
      - reviewsAffected
    PracticeEvidenceLimitation:
      type: object
      description: Known claim that the selected evidence cannot support even when
        every requirement passes
      properties:
        code:
          type: string
          description: Stable machine-readable identifier
          example: RUNTIME_BEHAVIOR_NOT_OBSERVED
          pattern: "[A-Z][A-Z0-9_]{2,63}"
        description:
          type: string
          description: Plain-language explanation of the claim the evidence cannot
            support
          maxLength: 500
          minLength: 1
      required:
      - code
      - description
    PracticeEvidenceOutcome:
      type: object
      description: Recent review readiness for one practice's evidence requirements
      properties:
        blockersObserved:
          type: array
          description: "Blockers seen on the skipped reviews, most frequent first"
          items:
            $ref: "#/components/schemas/PracticeEvidenceBlocker"
        consideredReviews:
          type: integer
          format: int32
          description: Reviews that considered this practice
        practiceSlug:
          type: string
          description: Practice this outcome describes
        reviewedCount:
          type: integer
          format: int32
          description: Reviews where the evidence met every requirement
      required:
      - blockersObserved
      - consideredReviews
      - practiceSlug
      - reviewedCount
    PracticeEvidenceRequirement:
      type: object
      description: A source a practice reads and the stance it takes towards it
      properties:
        sourceKind:
          type: string
          description: Stable source identifier from the selected source contract
        stance:
          type: string
          description: Whether an absent or degraded capture refuses the review
          enum:
          - REQUIRED
          - EXHAUSTIVE
          - CONTEXTUAL
      required:
      - sourceKind
      - stance
    PracticeEvidenceSourceOption:
      type: object
      description: An evidence source a practice on this kind of work may read
      properties:
        description:
          type: string
        displayName:
          type: string
        privacyClass:
          type: string
          enum:
          - INTERNAL
          - PERSONAL
          - SENSITIVE_PERSONAL
        requiredQuality:
          type: string
          description: What requiring this source demands of its capture; fixed by
            the source contract
          enum:
          - ANY_CAPTURE
          - COMPLETE
          - COMPLETE_AND_NON_EMPTY
        selectionScope:
          type: string
          description: "How much of the source one capture takes, and the bound past\
            \ which it is no longer whole"
        sourceKind:
          type: string
        supportsExhaustiveEvidence:
          type: boolean
          description: "Whether this source can be captured whole, and so whether\
            \ a practice may rest a claim about what is absent from it on the capture"
      required:
      - description
      - displayName
      - privacyClass
      - requiredQuality
      - selectionScope
      - sourceKind
      - supportsExhaustiveEvidence
    PracticeFact:
      type: object
      properties:
        autonomy:
          type: string
          enum:
          - "OFF"
          - HUMAN_APPROVAL
          - AUTOMATIC
        slug:
          type: string
    PracticeGroup:
      type: object
      description: A practice group grouping related practices into a learning objective
      properties:
        autonomy:
          $ref: "#/components/schemas/AutonomyAssignment"
          description: "How much autonomy the system has over every practice in this\
            \ group that holds no autonomy of its own, whether that was set here or\
            \ inherited from the workspace, and which level decided it"
        catalogOrigin:
          $ref: "#/components/schemas/CatalogOrigin"
        color:
          type: string
          description: Optional palette colour key for the group's chip
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the group was created
        description:
          type: string
          description: What this group develops
        displayOrder:
          type: integer
          format: int32
          description: Sort order within the workspace
        icon:
          type: string
          description: Optional lucide icon name for the group's chip
        id:
          type: integer
          format: int64
          description: Group ID
        name:
          type: string
          description: Human-readable name
        slug:
          type: string
          description: URL-safe identifier unique within the workspace
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the group was last updated
        visibleInPracticeDashboards:
          type: boolean
          description: Whether this group is shown in practice dashboards
      required:
      - autonomy
      - createdAt
      - displayOrder
      - id
      - name
      - slug
      - visibleInPracticeDashboards
    PracticeGroupReviewObservation:
      type: object
      description: "One concrete, evidence-backed observation from a review run"
      properties:
        assessment:
          type: string
          description: Good or bad for the developer; null when the review could not
            decide (INCONCLUSIVE)
          enum:
          - GOOD
          - BAD
        feedbackId:
          type: string
          format: uuid
        feedbackResolution:
          type: string
          enum:
          - ADDRESSED
          - DISPUTED
          - NOT_APPLICABLE
        feedbackResponseComment:
          type: string
        feedbackUsefulness:
          type: string
          enum:
          - HELPFUL
          - UNHELPFUL
        observationId:
          type: string
          format: uuid
        practiceName:
          type: string
        practiceSlug:
          type: string
        presence:
          type: string
          enum:
          - PRESENT
          - ABSENT
          - NOT_APPLICABLE
          - INCONCLUSIVE
        recurrenceKey:
          type: string
        severity:
          type: string
          enum:
          - CRITICAL
          - MAJOR
          - MINOR
          - INFO
        title:
          type: string
      required:
      - observationId
      - practiceName
      - practiceSlug
      - presence
      - title
    PracticeGroupReviewRun:
      type: object
      description: A complete review run in a developer's practice-group history
      properties:
        observations:
          type: array
          items:
            $ref: "#/components/schemas/PracticeGroupReviewObservation"
        reviewId:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
        reviewedWork:
          $ref: "#/components/schemas/PracticeGroupReviewedWork"
      required:
      - observations
      - reviewId
      - reviewedAt
      - reviewedWork
    PracticeGroupReviewRunsPage:
      type: object
      description: A page of visible review runs
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PracticeGroupReviewRun"
        hasNext:
          type: boolean
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
      required:
      - content
    PracticeGroupReviewedWork:
      type: object
      description: The work assessed in a developer-facing review run
      properties:
        channelName:
          type: string
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int32
        provider:
          type: string
          enum:
          - GITHUB
          - GITLAB
          - SLACK
          - OUTLINE
        repositoryName:
          type: string
        title:
          type: string
        type:
          type: string
        url:
          type: string
      required:
      - id
      - type
    PracticeGroupStanding:
      type: object
      description: A developer's derived qualitative standing for one Group including
        1<=n<many practices
      properties:
        direction:
          type: string
          description: "Evidence-weighted, opportunity-indexed direction across the\
            \ group's practices"
          enum:
          - IMPROVING
          - DECLINING
          - UNCERTAIN
          - INSUFFICIENT_EVIDENCE
        feedbackSince:
          type: string
          format: date-time
          description: "Oldest contributing observation, for provenance only (null\
            \ without a verdict)"
        feedbackSpanDays:
          type: integer
          format: int32
          description: "Calendar span covered by the feedback, for provenance only;\
            \ never a trend-analysis unit"
        groupName:
          type: string
          description: Group name
        groupSlug:
          type: string
          description: Group slug
        guidance:
          type: string
          description: "Developer guidance aggregated from the group's feedback (null\
            \ unless the standing is a verdict). The deterministic summary combines\
            \ standing, next focus, and developer-facing catalog guidance."
        guidanceSource:
          type: string
          description: How the guidance text was produced (null when there is no guidance)
          enum:
          - RULE_BASED
        observations:
          type: array
          description: Supporting observations the standing derives from (problems
            first); empty without a verdict
          items:
            $ref: "#/components/schemas/PracticeStandingObservation"
        sources:
          type: array
          description: "Distinct pieces of reviewed work the observations come from,\
            \ per kind (provenance, not a score); empty without a verdict"
          items:
            $ref: "#/components/schemas/FeedbackSourceCount"
        standing:
          type: string
          description: Derived qualitative standing across the group's practices
          enum:
          - DEVELOPING
          - STRENGTH
          - MIXED
          - NOT_OBSERVED
          - NO_OPPORTUNITY
        trendSupport:
          $ref: "#/components/schemas/TrendSupport"
          description: Evidence support and provenance for the direction
      required:
      - groupName
      - groupSlug
      - observations
      - sources
      - standing
    PracticeGroupTrend:
      type: object
      properties:
        group:
          $ref: "#/components/schemas/PracticeTrend"
        practices:
          type: array
          items:
            $ref: "#/components/schemas/PracticeTrend"
      required:
      - group
      - practices
    PracticeManualReviewSignal:
      type: object
      description: The signal a person raises by asking for a review of this work
        type by hand
      properties:
        displayName:
          type: string
        signal:
          type: string
          example: scm.pull_request.manual_review
      required:
      - displayName
      - signal
    PracticeReviewCoveragePreview:
      type: object
      properties:
        current:
          $ref: "#/components/schemas/PracticeReviewCoverageSummary"
          description: Effective coverage before the proposed change
        proposed:
          $ref: "#/components/schemas/PracticeReviewCoverageSummary"
          description: Effective coverage if the proposed change is applied
        widens:
          type: boolean
          description: "Whether the proposal admits any repository, branch, or person\
            \ excluded now"
      required:
      - current
      - proposed
      - widens
    PracticeReviewCoverageSummary:
      type: object
      properties:
        coveredPeople:
          type: integer
          format: int32
          description: Eligible linked members admitted by the people coverage axis
        coveredRepositories:
          type: integer
          format: int32
          description: Monitored repositories admitted by the repository coverage
            axis
        eligiblePeople:
          type: integer
          format: int32
          description: Eligible linked human members in the workspace
        estimateWindowDays:
          type: integer
          format: int32
          description: Number of days included in recentReviewVolume
        monitoredRepositories:
          type: integer
          format: int32
          description: Repositories currently monitored by the workspace
        recentReviewVolume:
          type: integer
          format: int32
          description: Workspace-wide practice-review jobs created during the estimate
            window
      required:
      - coveredPeople
      - coveredRepositories
      - eligiblePeople
      - estimateWindowDays
      - monitoredRepositories
      - recentReviewVolume
    PracticeReviewSettings:
      type: object
      description: "A workspace's practice-review policy: effective values plus raw\
        \ overrides"
      properties:
        cooldownMinutes:
          type: integer
          format: int32
          description: "Effective: minimum minutes between reviews for the same PR"
        cooldownMinutesOverride:
          type: integer
          format: int32
          description: Raw override; null = inheriting the fleet default
        coverageSummary:
          $ref: "#/components/schemas/PracticeReviewCoverageSummary"
        defaultAutonomy:
          type: string
          description: "Effective: how much autonomy the system has over practices\
            \ and groups that hold no autonomy of their own — the bottom of the practice\
            \ → group → workspace chain"
          enum:
          - "OFF"
          - HUMAN_APPROVAL
          - AUTOMATIC
        defaultAutonomyOverride:
          type: string
          description: "Raw override; null = this workspace has never chosen, so HUMAN_APPROVAL\
            \ applies"
          enum:
          - "OFF"
          - HUMAN_APPROVAL
          - AUTOMATIC
        deliverToMerged:
          type: boolean
          description: "Effective: deliver feedback to merged PRs/MRs"
        deliverToMergedOverride:
          type: boolean
          description: Raw override; null = inheriting the fleet default
        deliveryStatus:
          type: string
          description: Whether new external practice feedback may be sent
          enum:
          - ACTIVE
          - PAUSED
        etag:
          type: string
          description: Strong entity tag to send in If-Match when updating this rollout
        reviewScope:
          $ref: "#/components/schemas/WorkspaceReviewScope"
          description: Explicit all-or-selected repository and person coverage. Selected-empty
            means nobody.
        revision:
          type: integer
          format: int64
          description: Monotonic rollout revision carried by automatically admitted
            review jobs
      required:
      - cooldownMinutes
      - coverageSummary
      - defaultAutonomy
      - deliverToMerged
      - deliveryStatus
      - etag
      - reviewScope
      - revision
    PracticeSignalOption:
      type: object
      description: A signal a practice can start an automated review on
      properties:
        displayName:
          type: string
        recommended:
          type: boolean
        signal:
          type: string
          example: scm.pull_request.ready
      required:
      - displayName
      - recommended
      - signal
    PracticeStanding:
      type: object
      description: A developer's readable feedback for one practice
      properties:
        direction:
          type: string
          description: Opportunity-indexed direction of this practice's recent evidence
          enum:
          - IMPROVING
          - DECLINING
          - UNCERTAIN
          - INSUFFICIENT_EVIDENCE
        groupName:
          type: string
          description: "Group name this practice belongs to, if any"
        groupSlug:
          type: string
          description: "Group slug this practice belongs to, if any"
        name:
          type: string
          description: Practice name
        slug:
          type: string
          description: Practice slug
        standing:
          type: string
          description: "Where the developer stands on this practice, or why no standing\
            \ could be formed"
          enum:
          - DEVELOPING
          - STRENGTH
          - MIXED
          - NOT_OBSERVED
          - NO_OPPORTUNITY
        strengths:
          type: array
          description: What the developer already does well here
          items:
            $ref: "#/components/schemas/PracticeStandingObservation"
        toWorkOn:
          type: array
          description: Specific feedback to act on (highest-impact first)
          items:
            $ref: "#/components/schemas/PracticeStandingObservation"
        trendSupport:
          $ref: "#/components/schemas/TrendSupport"
          description: Evidence support and provenance for the direction
        whatGoodLooksLike:
          type: string
          description: A concrete picture of doing this well
        whyItMatters:
          type: string
          description: "Why this practice matters, in plain language"
      required:
      - name
      - slug
      - standing
      - strengths
      - toWorkOn
    PracticeStandingObservation:
      type: object
      description: A single piece of practice feedback to read and act on
      properties:
        deliveredFeedback:
          type: string
          description: What to do — the delivered feedback for this observation (null
            if nothing was delivered)
        locator:
          type: string
          description: "Where in the work, e.g. \"FrameRecorder.swift:212\", when\
            \ known"
        observationId:
          type: string
          format: uuid
          description: Observation id — handle to open the full detail
        origin:
          type: string
          description: "Why this observation was recorded. BACKFILL means it came\
            \ from a review of past work rather than from something that just happened,\
            \ and nothing was posted anywhere at the time."
          enum:
          - LIVE
          - MANUAL
          - BACKFILL
        outcome:
          type: string
          description: "What this observation says about the developer: a behaviour\
            \ demonstrated, a trap avoided, something harmful done, or something needed\
            \ left out. The lists only separate positive from negative, so this is\
            \ what tells the two kinds of each apart."
          enum:
          - DEMONSTRATED_STRENGTH
          - SAFE_AVOIDANCE
          - COMMISSION_PROBLEM
          - OMISSION_GAP
        reviewedWorkId:
          type: integer
          format: int64
          description: Identifier of the reviewed work
        severity:
          type: string
          description: Impact level (null unless assessed BAD)
          enum:
          - CRITICAL
          - MAJOR
          - MINOR
          - INFO
        title:
          type: string
          description: The headline of the feedback
        workKind:
          type: string
          description: The kind of reviewed work this is about
      required:
      - observationId
      - origin
      - outcome
      - reviewedWorkId
      - title
      - workKind
    PracticeSubject:
      type: object
      description: What must be in a piece of work for this practice to have anything
        to judge
      properties:
        absentSays:
          type: string
          description: "Sentence shown when the subject was proven absent, in the\
            \ author's voice"
          maxLength: 300
          minLength: 0
        anyOf:
          type: array
          description: Shapes the subject may take; the subject is present when any
            one is found
          items:
            $ref: "#/components/schemas/PracticeSubjectClause"
          maxItems: 10
          minItems: 1
      required:
      - absentSays
    PracticeSubjectClause:
      type: object
      description: One shape the subject a practice judges can take in a piece of
        work
      properties:
        changedPathMatches:
          type: array
          description: Globs; holds when the change touches a matching path
          items:
            type: string
        diffContains:
          type: array
          description: Literal strings; holds when the diff contains one of them
          items:
            type: string
        evidenceHasItems:
          type: string
          description: Named evidence collection; holds when it has at least one entry
          enum:
          - scm.review-threads
          - scm.inline-review-comments
          - scm.general-review-comments
    PracticeTraceEntry:
      type: object
      description: "What became of one practice on this artifact, and whether anyone\
        \ heard about it"
      properties:
        autonomy:
          type: string
          description: "How much autonomy the workspace currently gives this practice,\
            \ after inheritance"
          enum:
          - "OFF"
          - HUMAN_APPROVAL
          - AUTOMATIC
        decidedAt:
          type: string
          format: date-time
          description: When the answer was settled
        deliveredCount:
          type: integer
          format: int32
          description: Interventions actually delivered to a person
        explanation:
          type: string
          description: "The outcome in a sentence, phrased as what would change it"
        observationCount:
          type: integer
          format: int32
          description: Measurements this practice produced on this artifact
        occasionedBy:
          type: string
          description: The occurrence this answer is about; null when nothing it watches
            happened
        occasionedById:
          type: string
          format: uuid
          description: That occurrence's id in this trace's signals list. The name
