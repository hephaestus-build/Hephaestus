    ReleaseStatus:
      type: object
      description: |-
        The running release and what the last update check found. Discovery is advisory: nothing here
         verifies an artifact or performs an upgrade.
      properties:
        failure:
          type: string
          description: "why the last attempt did not complete, when <code>status</code>\
            \ is <code>FAILED</code>"
          enum:
          - RATE_LIMITED
          - UNAVAILABLE
          - MALFORMED
        history:
          type: array
          description: "the releases this instance ran, newest first"
          items:
            $ref: "#/components/schemas/ReleaseStart"
        lastAttempt:
          type: string
          format: date-time
          description: "when a check was last started, on any outcome"
        lastSuccess:
          type: string
          format: date-time
          description: "when a check last completed, which is when <code>latest</code>\
            \ was observed"
        latest:
          $ref: "#/components/schemas/LatestRelease"
          description: the newest published release as of <code>lastSuccess</code>
        nextCheck:
          type: string
          format: date-time
          description: when the next automatic check is due
        retryUntil:
          type: string
          format: date-time
          description: the wait GitHub named on a rate limit; a manual check before
            it is refused
        running:
          $ref: "#/components/schemas/RunningRelease"
          description: the identity this process reports
        runningSince:
          type: string
          format: date-time
          description: "when this instance started the running release, absent unless\
            \ the newest start is it"
        status:
          type: string
          description: the verdict an administrator reads first
          enum:
          - DISABLED
          - NOT_APPLICABLE
          - NEVER_CHECKED
          - CURRENT
          - UPDATE_AVAILABLE
          - FAILED
      required:
      - history
      - running
      - status
