          type: string
          format: date-time
          description: When Outline last saw the token used
        name:
          type: string
          description: "The token's name in Outline. Absent when the token cannot\
            \ list its own key (a scoped key, or one owned by a user who cannot see\
            \ it) — sync is unaffected."
