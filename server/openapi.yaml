          description: "The reader's current standing in the group, the one their\
            \ practice profile shows: the part they are marked in. Absent unless the\
            \ split counts the reader"
          enum:
          - DEVELOPING
          - STRENGTH
          - MIXED
          - NOT_OBSERVED
          - NO_OPPORTUNITY
          - null
      required:
      - groupColor
      - groupIcon
      - groupName
      - groupSlug
      - practices
      - split
      - yourBasis
      - yourStanding
    WorkspaceListItem:
      type: object
      description: Summary information about a workspace for list views
      properties:
        accountLogin:
          type: string
          description: Git provider account login associated with this workspace
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the workspace was created
        displayName:
          type: string
          description: Human-readable name of the workspace
        id:
          type: integer
          format: int64
          description: Unique identifier of the workspace
        practicesEnabled:
          type: boolean
          description: Whether practice reviews are on
        providerType:
