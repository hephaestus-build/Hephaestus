openapi: 3.1.0
info:
  contact:
    email: felixtj.dietrich@tum.de
    name: Felix T.J. Dietrich
  description: API documentation for Hephaestus. Practice review bigint ids and monetary
    amounts are decimal strings. Monetary fields are USD; clients read server-computed
    totals and budget decisions. Provider mirror ids retain their numeric contract.
    Required nullable response fields are present with null.
  license:
    name: MIT License
    url: https://github.com/hephaestus-build/Hephaestus/blob/main/LICENSE
  title: Hephaestus API
  version: 0.0.0-development
servers:
- description: Default Server URL
  url: /
security:
- bearerAuth: []
tags:
- description: Global contributor information
  name: Contributors
- description: The current developer's practice profile
  name: Practice Profile
- description: User preferences
  name: Account
- description: The authenticated developer's feedback
  name: Practice feedback
- description: Instance-admin login provider management
  name: Admin
- description: Per-workspace Slack channel consent + activation
  name: Slack channel activation
- description: Per-workspace LLM spend rollup and budget status
  name: LLM Usage
- description: Running release identity and update checks
  name: Instance Release
- description: "Sign-in, refresh and sign-out for installed clients"
  name: Client session
- description: The current developer's standing in each practice
  name: Practice Standings
- description: Recipient responses to delivered practice feedback
  name: Feedback Response
- description: Workspace-scoped per-purpose agent configuration
  name: Agents
- description: The current developer's standing in each practice group
  name: Practice Group Standings
- description: Asking for a review of a piece of work by hand
  name: Practice review requests
- description: Current account transparency and research consent
  name: Consent
- description: "User account management (settings, deletion)"
  name: Account
- description: Instance-admin account management
  name: Admin
- description: Current user's Slack privacy preferences
  name: Slack User Preferences
- description: Instance-admin research disclosures and downstream removal receipts
  name: Research
- description: Adopt instance catalog practices into a workspace
  name: Practice Catalog Adoption
- description: |-
    Practices across the workspace, read by the calling developer: everyone, the caller included, inside a count, and
     the caller's own figures beside the workspace's. Like the Practice profile, the route takes no user parameter.
  name: practices-across-workspace-controller
- description: Per-workspace Outline collection mirroring control plane
  name: Outline collections
- description: Team management within workspace
  name: Teams
- description: Instance-wide email transport verification
  name: Instance Email
- description: "Workspace-scoped \"bring your own\" AI provider connections, models\
    \ and settings"
  name: Workspace LLM
- description: Why each practice did or did not run on one piece of work. Any workspace
    member can read it.
  name: Practice review trace
- description: Instance-wide operator settings
  name: Instance Settings
- description: Session lifecycle
  name: Auth
- description: Workspace-scoped practice-review policy
  name: Practice Review Settings
- description: Active sessions
  name: Account
- description: Instance-admin-only read-only access to users
  name: User view
- description: Review catalog changes before they affect a workspace
  name: Practice Catalog
- description: |-
    GitLab-specific REST endpoints used during the workspace creation wizard. Gated on the
     <code>GITLAB_WORKSPACE_CREATION</code> feature flag.
  name: git-lab-preflight-controller
- description: Workspace integration connection management
  name: Connections
- description: Instance-admin LLM connection and settings management
  name: Admin LLM
- description: Public JWK set for verifying Hephaestus session JWTs
  name: Auth discovery
- description: "Workspace-admin access to reviews, results, and feedback delivery\
    \ history"
  name: Practice reviews
- description: GDPR Art. 20 self-service data export
  name: Account
- description: The developer's conversation with Hephaestus
  name: Mentor
- description: Instance-administrator access and erasure requests
  name: Person Data
- description: Workspace-scoped history of admin configuration changes
  name: Config Audit
- description: |-
    Vendor OAuth redirect ingress at <code>/oauth/callback/{kind</code>}. Unauthenticated —
     identity comes from the HMAC-signed <code>state</code> param. Browsers get 302 redirects
     on both success and failure; only <code>Accept: application/json</code> requests get
     4xx JSON.
  name: o-auth-callback-controller
- description: Repository contributions and open work
  name: Activity
- description: Redacted production configuration facts
  name: Configuration Readiness
- description: Identity provider discovery (public)
  name: Auth discovery
- description: Integration sync observability and manual controls
  name: Sync
- description: "Current user identity, linked accounts, deletion"
  name: Account
- description: Read-only access to practice evaluation results
  name: Practice Results
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: OK
      summary: JWK set (public keys only)
      tags:
      - Auth discovery
  /admin/audit:
    get:
      operationId: adminListAuthEvents
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - in: query
        name: accountId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: actingAccountId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: eventType
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - USER_VIEW
            - LOGIN
            - PASSKEY_CHANGED
            - PASSKEY_VERIFIED
            - LOGIN_FAILED
            - LOGOUT
            - TOKEN_REFRESH
            - JWT_REVOKED
            - IDENTITY_LINKED
            - IDENTITY_UNLINKED
            - IMPERSONATION_BEGIN
            - IMPERSONATION_END
            - ACCOUNT_DELETED
            - EXPORT_REQUESTED
            - PERSON_DATA_PREVIEWED
            - PERSON_DATA_EXPORTED
            - PERSON_DATA_ERASURE_REQUESTED
            - APP_ROLE_CHANGED
            - RESEARCH_CONSENT_REVOKED
            - WORKSPACE_ELEVATION
            - LLM_CONNECTION_CREATED
            - LLM_CONNECTION_UPDATED
            - LLM_CONNECTION_DELETED
            - LLM_MODEL_CREATED
            - LLM_MODEL_UPDATED
            - LLM_MODEL_DELETED
            - LLM_MODEL_PRICE_CHANGED
            - LLM_MODEL_SHARING_CHANGED
            - LLM_SETTINGS_CHANGED
            - LOGIN_PROVIDER_CREATED
            - LOGIN_PROVIDER_UPDATED
            - LOGIN_PROVIDER_DELETED
            - SILENT_MODE_CHANGED
            - PUBLIC_ACTIVITY_CHANGED
            - RESEARCH_DATASET_RELEASED
            - RESEARCH_REMOVAL_RECORDED
      - in: query
        name: result
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - SUCCESS
            - FAILURE
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseDTOAuthEventView"
          description: OK
      summary: "List auth audit events (paged, newest first)"
      tags:
      - Admin
  /admin/audit/export:
    get:
      operationId: adminExportAuthEvents
      parameters:
      - in: query
        name: accountId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: actingAccountId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: eventType
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - USER_VIEW
            - LOGIN
            - PASSKEY_CHANGED
            - PASSKEY_VERIFIED
            - LOGIN_FAILED
            - LOGOUT
            - TOKEN_REFRESH
            - JWT_REVOKED
            - IDENTITY_LINKED
            - IDENTITY_UNLINKED
            - IMPERSONATION_BEGIN
            - IMPERSONATION_END
            - ACCOUNT_DELETED
            - EXPORT_REQUESTED
            - PERSON_DATA_PREVIEWED
            - PERSON_DATA_EXPORTED
            - PERSON_DATA_ERASURE_REQUESTED
            - APP_ROLE_CHANGED
            - RESEARCH_CONSENT_REVOKED
            - WORKSPACE_ELEVATION
            - LLM_CONNECTION_CREATED
            - LLM_CONNECTION_UPDATED
            - LLM_CONNECTION_DELETED
            - LLM_MODEL_CREATED
            - LLM_MODEL_UPDATED
            - LLM_MODEL_DELETED
            - LLM_MODEL_PRICE_CHANGED
            - LLM_MODEL_SHARING_CHANGED
            - LLM_SETTINGS_CHANGED
            - LOGIN_PROVIDER_CREATED
            - LOGIN_PROVIDER_UPDATED
            - LOGIN_PROVIDER_DELETED
            - SILENT_MODE_CHANGED
            - PUBLIC_ACTIVITY_CHANGED
            - RESEARCH_DATASET_RELEASED
            - RESEARCH_REMOVAL_RECORDED
      - in: query
        name: result
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - SUCCESS
            - FAILURE
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
          description: OK
      summary: "Export the filtered audit log as CSV (newest first, capped)"
      tags:
      - Admin
  /admin/config-audit:
    get:
      operationId: adminListConfigAuditEvents
      parameters:
      - in: query
        name: workspaceId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - in: query
        name: entityType
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PRACTICE_REVIEW_SETTINGS
            - AGENT_BINDING
            - AGENT_CONFIG
            - AI_CONFIG_BINDING
            - WORKSPACE_ROLE
            - ACTIVITY_AUTOMATION
            - WORKSPACE_FEATURES
            - WORKSPACE_STATUS
            - WORKSPACE_TOKEN
            - WORKSPACE_VISIBILITY
            - PRACTICE_ACTIVE
            - PRACTICE_USAGE
            - PRACTICE_DEFINITION
            - PRACTICE_GROUP
            - CATALOG_PRACTICE
            - CATALOG_GROUP
            - WORKSPACE_INSTANCE_LLM_BUDGET
            - WORKSPACE_OWN_PROVIDER_LLM_BUDGET
            - WORKSPACE_LLM_BUDGET
            - WORKSPACE_BYO_LLM_BUDGET
            - REVIEW_BATCH
            - REVIEW_SCHEDULE
            - FEEDBACK_DELIVERY_RECHECK
            - WORKSPACE_LLM_CONNECTION
            - WORKSPACE_LLM_MODEL
      - in: query
        name: entityId
        required: false
        schema:
          type: string
      - in: query
        name: changedKey
        required: false
        schema:
          type: string
      - in: query
        name: action
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - CREATED
            - UPDATED
            - DELETED
      - in: query
        name: actorId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseDTOConfigAuditEntryView"
          description: OK
      summary: "List admin configuration changes across workspaces (paged, newest\
        \ first)"
      tags:
      - Admin
  /admin/configuration-readiness:
    get:
      operationId: adminGetConfigurationReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigurationFact"
          description: OK
      summary: Get redacted configuration readiness
      tags:
      - Configuration Readiness
  /admin/email/test:
    post:
      description: "Sends a test email through the configured relay to the given address,\
        \ or to the caller's verified address when none is given."
      operationId: adminSendTestEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTestRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTestResponse"
          description: Email delivery outcome
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed request or invalid recipient address
      summary: Send a test email
      tags:
      - Instance Email
  /admin/llm/call-pools:
    get:
      operationId: adminListLlmCallPools
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmCallPool"
          description: OK
      summary: List the pools of provider capacity
      tags:
      - Admin LLM
    post:
      operationId: adminCreateLlmCallPool
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLlmCallPoolRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmCallPool"
          description: Pool created; URL in the Location header
        "409":
          description: A pool with this slug already exists
      summary: Create a pool of provider capacity
      tags:
      - Admin LLM
  /admin/llm/call-pools/models:
    get:
      operationId: adminListLlmCallPoolModels
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmCallPoolModel"
          description: OK
      summary: "List every model that can join a pool, with the pool it is in"
      tags:
      - Admin LLM
  /admin/llm/call-pools/{id}:
    delete:
      operationId: adminDeleteLlmCallPool
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Pool deleted
        "404":
          description: Pool not found
        "409":
          description: "The pool still has calls, rate history, or a cooldown"
      summary: Delete a pool; its models are no longer limited
      tags:
      - Admin LLM
    put:
      operationId: adminUpdateLlmCallPool
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLlmCallPoolRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmCallPool"
          description: OK
        "400":
          description: The pool slug cannot change or the limits are invalid
        "404":
          description: Pool not found
        "409":
          description: "The pool still has calls, rate history, or a cooldown"
      summary: Change a pool's name and limits
      tags:
      - Admin LLM
  /admin/llm/call-pools/{id}/models:
    put:
      operationId: adminUpdateLlmCallPoolModels
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmCallPoolModelsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmCallPoolModel"
          description: OK
        "404":
          description: Pool or model not found
        "409":
          description: "The pool still has calls, rate history, or a cooldown"
      summary: Replace the models in a pool
      tags:
      - Admin LLM
  /admin/llm/connections:
    get:
      operationId: adminListLlmConnections
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmConnection"
          description: OK
      summary: List LLM connections
      tags:
      - Admin LLM
    post:
      operationId: adminCreateLlmConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLlmConnectionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnection"
          description: Connection created; URL in the Location header
        "409":
          description: An LLM connection with this slug already exists
      summary: Create an LLM connection
      tags:
      - Admin LLM
  /admin/llm/connections/probe:
    post:
      operationId: adminProbeLlmConnectionDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeLlmConnectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProbeResult"
          description: OK
      summary: Test a draft connection and fetch its models
      tags:
      - Admin LLM
  /admin/llm/connections/{connectionId}/models:
    post:
      operationId: adminCreateLlmModel
      parameters:
      - in: path
        name: connectionId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLlmModelRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"
          description: Model created; URL in the Location header
        "404":
          description: LLM connection not found
        "409":
          description: A model with this slug or upstream model id already exists
            on the connection
      summary: Create a model on an LLM connection
      tags:
      - Admin LLM
  /admin/llm/connections/{id}:
    delete:
      operationId: adminDeleteLlmConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Connection deleted
        "404":
          description: LLM connection not found
        "409":
          description: Cannot delete a connection still referenced by one or more
            models
      summary: Delete an LLM connection
      tags:
      - Admin LLM
    patch:
      operationId: adminUpdateLlmConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmConnectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnection"
          description: OK
        "404":
          description: LLM connection not found
      summary: Update an LLM connection
      tags:
      - Admin LLM
  /admin/llm/connections/{id}/probe:
    post:
      operationId: adminProbeLlmConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProbeResult"
          description: OK
      summary: Test a stored connection and fetch its models
      tags:
      - Admin LLM
  /admin/llm/models:
    get:
      operationId: adminListLlmModels
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmModel"
          description: OK
      summary: List LLM catalog models
      tags:
      - Admin LLM
  /admin/llm/models/{id}:
    delete:
      operationId: adminDeleteLlmModel
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Model deleted
        "404":
          description: LLM model not found
        "409":
          description: Cannot delete a model still bound to an agent configuration
      summary: Delete an LLM catalog model
      tags:
      - Admin LLM
    patch:
      operationId: adminUpdateLlmModel
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmModelRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"
          description: OK
        "404":
          description: LLM model not found
        "409":
          description: Another model on the connection already uses this upstream
            model id
      summary: Update a model's metadata
      tags:
      - Admin LLM
  /admin/llm/models/{id}/capabilities:
    put:
      operationId: adminProbeLlmModelCapabilities
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelCapabilities"
          description: OK
      summary: Probe the model's forced tool-choice capability
      tags:
      - Admin LLM
  /admin/llm/models/{id}/price:
    put:
      operationId: adminUpdateLlmModelPrice
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmModelPriceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"
          description: OK
        "404":
          description: LLM model not found
      summary: Reprice a model
      tags:
      - Admin LLM
  /admin/llm/models/{id}/sharing:
    put:
      operationId: adminUpdateLlmModelSharing
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmModelSharingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"
          description: OK
        "404":
          description: LLM model not found
      summary: Share a model with all or selected workspaces
      tags:
      - Admin LLM
  /admin/llm/settings:
    get:
      operationId: adminGetLlmSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceLlmSettings"
          description: OK
      summary: Get instance-wide LLM governance settings
      tags:
      - Admin LLM
    put:
      operationId: adminUpdateLlmSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceLlmSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceLlmSettings"
          description: OK
      summary: Update instance-wide LLM governance settings
      tags:
      - Admin LLM
  /admin/llm/usage:
    get:
      operationId: adminGetLlmUsageReport
      parameters:
      - in: query
        name: month
        required: false
        schema:
          type: string
          pattern: "\\d{4}-(0[1-9]|1[0-2])"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLlmUsageReport"
          description: OK
      summary: Per-workspace LLM spend rollup for one month (all workspaces)
      tags:
      - Admin
  /admin/login-providers:
    get:
      operationId: adminListLoginProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginProviderView"
          description: OK
      summary: List login providers
