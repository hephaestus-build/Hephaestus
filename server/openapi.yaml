    WorkspaceLlmConnection:
      type: object
      description: Your AI provider connection (API key redacted)
      properties:
        apiKeyLast4:
          type: string
          description: "Last four characters of the stored API key, if any"
        apiProtocol:
          type: string
          description: Wire protocol
          enum:
          - anthropic-messages
          - openai-completions
          - openai-responses
          - openai-decisions
          - openai-embeddings
          - cohere-rerank
          example: openai-responses
        authMode:
          type: string
          description: Credential shape
          enum:
          - BEARER
          - API_KEY
        baseUrl:
          type: string
          description: Provider base URL
        connectionPlatform:
          type: string
          description: Admin-declared connection platform
          enum:
          - LOGOS
          - VLLM
          - OLLAMA
          - AZURE
          - AWS_BEDROCK
          - GOOGLE_VERTEX
          - OPENAI
          - GOOGLE_AI_STUDIO
          - ALIBABA_CLOUD
          - GROQ
          - FIREWORKS
          - TOGETHER_AI
          - DEEPINFRA
          - NEBIUS
          - OPENROUTER
          - CLOUDFLARE_AI_GATEWAY
          - VERCEL_AI_GATEWAY
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        displayName:
          type: string
          description: Human-readable name
        enabled:
          type: boolean
          description: Whether the connection is active
        hasApiKey:
          type: boolean
          description: Whether an API key is stored
        id:
          type: integer
          format: int64
          description: Connection ID
        purposes:
          type: array
          description: "The purposes a model on this connection can serve, from its\
            \ protocol"
          items:
            type: string
            enum:
            - PRACTICE_REVIEW
            - MENTOR
            - PRACTICE_DECISION
            - PRACTICE_EMBEDDING
            - PRACTICE_RERANKING
        slug:
          type: string
          description: Unique slug within the workspace
          example: openai-prod
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      required:
      - apiProtocol
      - authMode
      - baseUrl
      - createdAt
      - displayName
      - enabled
      - hasApiKey
      - id
      - purposes
      - slug
    WorkspaceLlmModel:
      type: object
      description: A model on your AI provider
      properties:
        brand:
          type: string
          description: Model brand declared by an admin; display only
          enum:
          - OPENAI
          - ANTHROPIC
          - GEMINI
          - GEMMA
          - META
          - MISTRAL
          - QWEN
          - DEEPSEEK
          - XAI
          - COHERE
          - Z_AI
          - MOONSHOT
        callPool:
          $ref: "#/components/schemas/LlmCallPoolMembership"
          description: The instance pool whose capacity the model's calls share; only
            an instance admin sets it
        connectionDisplayName:
          type: string
          description: Owning connection's display name
        connectionId:
          type: integer
          format: int64
          description: Owning connection id
        contextWindow:
          type: integer
          format: int32
          description: Context window in tokens
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        currency:
          type: string
          description: Currency code
        dataHandlingNote:
          type: string
          description: "Admin-only note: region, agreement, renewal date"
        dataHandlingTier:
          type: string
          description: Data-handling tier derived from the operator; UNDECLARED until
            it is set
          enum:
          - IN_HOUSE
          - CLOUD
          - UNDECLARED
        displayName:
          type: string
          description: Human-readable name
        enabled:
          type: boolean
          description: Active toggle
        forcedToolChoice:
          type: boolean
          description: Probed forced_tool_choice capability; null until established
        id:
          type: integer
          format: int64
          description: Model id
        maxOutputTokens:
          type: integer
          format: int32
          description: Maximum output tokens
        operatedBy:
          type: string
          description: Who operates the systems the work is sent to; null until declared
          enum:
          - OWN_ORGANISATION
          - PROVIDER
        per1mCacheReadUsd:
          type: number
          format: decimal
          description: Cache-read rate per 1M tokens (USD)
        per1mCacheWriteUsd:
          type: number
          format: decimal
          description: Cache-write rate per 1M tokens (USD)
        per1mInputUsd:
          type: number
          format: decimal
          description: Input rate per 1M tokens (USD)
        per1mOutputUsd:
          type: number
          format: decimal
          description: Output rate per 1M tokens (USD)
        priceNote:
          type: string
          description: Price note
        pricingMode:
          type: string
          description: Pricing mode
          enum:
          - PRICED
          - NO_CHARGE
          - UNPRICED
        reasoningEffort:
          type: string
          description: "Reasoning effort requested of the model; null sends none,\
            \ the provider's default applies"
          enum:
          - NONE
          - MINIMAL
          - LOW
          - MEDIUM
          - HIGH
          - XHIGH
          - MAX
        slug:
          type: string
          description: Unique slug within the workspace
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        upstreamModelId:
          type: string
          description: Upstream provider model id
      required:
      - connectionDisplayName
      - connectionId
      - createdAt
      - currency
      - dataHandlingTier
      - displayName
      - enabled
      - id
      - pricingMode
      - slug
      - upstreamModelId
    WorkspaceLlmProbeResult:
      type: object
      description: Result of testing your AI provider connection
      properties:
        message:
          type: string
          description: Human-readable diagnostic when not reachable
        modelCount:
          type: integer
          format: int32
          description: How many models the provider listed (0 if unreachable)
        reachable:
          type: boolean
          description: Whether the provider answered
        statusCode:
          type: integer
          format: int32
          description: "HTTP status returned by the provider, if any"
      required:
      - modelCount
      - reachable
    WorkspaceLlmSettings:
      type: object
      description: The instance LLM policy as it applies to this workspace (read-only)
      properties:
        ownProviderAllowed:
          type: boolean
          description: Whether this workspace may register its own LLM provider connections
      required:
      - ownProviderAllowed
    WorkspaceLlmUsageReport:
      type: object
      description: "One calendar month of a workspace's LLM spend, rolled up from\
        \ the usage ledger"
      properties:
        byDay:
          type: array
          items:
            $ref: "#/components/schemas/LlmUsageByDay"
        byJobType:
          type: array
          items:
            $ref: "#/components/schemas/LlmUsageByJobType"
        byPractice:
          type: array
          description: "The decision, embedding and reranking calls of practice scripts,\
            \ one entry per practice, most spend first. Their spend is already part\
            \ of byJobType. Chat calls of practice scripts are in each review's own\
            \ cost and not here."
          items:
            $ref: "#/components/schemas/LlmUsageByPractice"
        fx:
          $ref: "#/components/schemas/FxRateInfo"
          description: Display-only conversion when the instance has a display currency.
            Absent = show USD only.
        instanceBudgetVerdict:
          type: string
          description: "Whether host-funded (shared-model) spend is within its cap,\
            \ has reached it, or cannot be confirmed because shared-model rates are\
            \ missing or usage measurements are unverified."
          enum:
          - WITHIN
          - EXHAUSTED
          - UNVERIFIABLE
        instanceMonthlyBudgetUsd:
          type: number
          format: decimal
          description: Monthly cap in USD on spend the host pays for (shared models);
            null = uncapped. Set by instance admins only — a workspace admin can see
            it but not change it.
        instancePaused:
          type: boolean
          description: "Whether work on SHARED models is currently paused for this\
            \ workspace. Authoritative — it mirrors the live gate rather than being\
            \ derivable from the verdict alone. Always false for a past month, which\
            \ cannot pause anything."
        instanceTotalCostUsd:
          type: number
          format: decimal
          description: "This month's confirmed spend on shared (instance) models,\
            \ in USD — the figure instanceMonthlyBudgetUsd compares against. A floor,\
            \ not the full total, while unpricedEventCount is non-zero."
        month:
          type: string
          description: "Calendar month (UTC), ISO yyyy-MM"
          example: 2026-07
        ownProviderBudgetVerdict:
          type: string
          description: "The same verdict for spend on this workspace's own provider,\
            \ against its own cap."
          enum:
          - WITHIN
          - EXHAUSTED
          - UNVERIFIABLE
        ownProviderInUse:
          type: boolean
          description: "Whether this month has an own-provider purse to show. True\
            \ when the month has at least one own-provider call, priced or not, so\
            \ a month of confirmed $0.00 calls counts. For the current month, also\
            \ true when the workspace has an enabled own-provider model on an enabled\
            \ connection, so its admins can set a provider cap before the first call.\
            \ The spend and cap fields cannot answer this."
        ownProviderMonthlyBudgetUsd:
          type: number
          format: decimal
          description: Monthly cap in USD on spend this workspace pays for through
            its own connected provider; null = uncapped. Set by this workspace's own
            admins.
        ownProviderPaused:
          type: boolean
          description: Whether work on this workspace's OWN provider is currently
            paused.
        ownProviderTotalCostUsd:
          type: number
          format: decimal
          description: "This month's confirmed spend on this workspace's own connected\
            \ provider(s), in USD — the figure ownProviderMonthlyBudgetUsd compares\
            \ against. Different money from instanceTotalCostUsd: the two are never\
            \ added together."
        practiceScriptTotal:
          $ref: "#/components/schemas/LlmUsagePracticeScriptTotal"
          description: "The byPractice entries in total, read from the ledger."
        unpricedEventCount:
          type: integer
          format: int64
          description: "Runs this month (job attempts and mentor turns, either purse)\
            \ with at least one ledger row whose cost is unavailable because a rate\
            \ is missing or the measurement is unverified, each counted once. A practice\
            \ script row counts toward the run of its review. Those rows are excluded\
            \ from both totals above, so a non-zero value means the real spend may\
            \ be higher than shown."
      required:
      - byDay
      - byJobType
      - byPractice
      - instanceBudgetVerdict
      - instancePaused
      - instanceTotalCostUsd
      - month
      - ownProviderBudgetVerdict
      - ownProviderInUse
      - ownProviderPaused
      - ownProviderTotalCostUsd
      - practiceScriptTotal
      - unpricedEventCount
    WorkspaceMembership:
      type: object
      properties:
        account:
