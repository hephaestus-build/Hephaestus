    LlmModel:
      type: object
      description: Instance catalog model
      properties:
        brand:
          type: string
          description: Model brand declared by an admin; display only
          enum:
          - OPENAI
          - ANTHROPIC
          - GEMINI
          - GEMMA
          - META
          - MISTRAL
          - QWEN
          - DEEPSEEK
          - XAI
          - COHERE
          - Z_AI
          - MOONSHOT
        callPoolId:
          type: integer
          format: int64
          description: The pool whose capacity the model's calls share; null for none
        connectionDisplayName:
          type: string
          description: Owning connection's display name
        connectionId:
          type: integer
          format: int64
          description: Owning connection id
        contextWindow:
          type: integer
          format: int32
          description: Context window in tokens
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        currentPrice:
          $ref: "#/components/schemas/LlmModelPrice"
          description: Current price; null if none has ever been set
        dataHandlingNote:
          type: string
          description: "Admin-only note: region, agreement, renewal date"
        dataHandlingTier:
          type: string
          description: Data-handling tier derived from the operator; UNDECLARED until
            it is set
          enum:
          - IN_HOUSE
          - CLOUD
          - UNDECLARED
        displayName:
          type: string
          description: Human-readable name
        enabled:
          type: boolean
          description: Active toggle
        forcedToolChoice:
          type: boolean
          description: Probed forced_tool_choice capability; null until established
        grantedWorkspaceIds:
          type: array
          description: Workspace ids shared with; only meaningful when visibility
            is GRANTED
          items:
            type: integer
            format: int64
        id:
          type: integer
          format: int64
          description: Model id
        maxOutputTokens:
          type: integer
          format: int32
          description: Maximum output tokens
        operatedBy:
          type: string
          description: Who operates the systems the work is sent to; null until declared
          enum:
          - OWN_ORGANISATION
          - PROVIDER
        reasoningEffort:
          type: string
          description: "Reasoning effort requested of the model; null sends none,\
            \ the provider's default applies"
          enum:
          - NONE
          - MINIMAL
          - LOW
          - MEDIUM
          - HIGH
          - XHIGH
          - MAX
        slug:
          type: string
          description: Unique slug within the connection
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        upstreamModelId:
          type: string
          description: Upstream provider model id
        visibility:
          type: string
          description: Share with all workspaces (PUBLIC) or only selected ones (GRANTED)
          enum:
          - PUBLIC
          - GRANTED
      required:
      - connectionDisplayName
      - connectionId
      - createdAt
      - dataHandlingTier
      - displayName
      - enabled
      - grantedWorkspaceIds
      - id
      - slug
      - upstreamModelId
      - visibility
    LlmModelCapabilities:
