org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=2
org.gradle.java.installations.auto-download=false

# Give Maven Central a minute to recover from rate limiting across Gradle's two retries.
systemProp.org.gradle.internal.repository.initial.backoff=20000

# Name the deprecated API and caller instead of a non-actionable Gradle 10 banner.
org.gradle.warning.mode=all
