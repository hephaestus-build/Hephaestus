# Local development stack. From the repo root: `vp run dev` writes the database password to
# server/.env, runs `docker compose up -d --wait`, then starts the server + webapp. Postgres is a bind mount (./postgres-data), so
# `docker compose down -v` won't clear it — use `vp run dev:reset` to reset the DB.
#
# Authentication is Hephaestus-native (no Keycloak — ADR 0017). For local login, register a
# GitHub OAuth app (callback http://localhost:8080/login/oauth2/code/github) and set
# GITHUB_OAUTH_CLIENT_ID / GITHUB_OAUTH_CLIENT_SECRET in server/.env. See
# docs/contributor/local-development.mdx.

services:
  postgres:
    build:
      context: ../docker/postgres
    image: 'ghcr.io/hephaestus-build/postgres:dev'
    environment:
      POSTGRES_DB: hephaestus
      # PostgreSQL reads it only when it creates the database. `vp run dev` writes a random value to
      # server/.env on first use, and Spring Boot reads the same file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run `vp run dev:compose` once, or set POSTGRES_PASSWORD in server/.env}
      POSTGRES_USER: root
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - app-network
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d hephaestus']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Catches every email the local server sends; nothing leaves the machine. UI on MAILPIT_UI_PORT.
  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    networks:
      - app-network
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  app-network:
    driver: bridge
