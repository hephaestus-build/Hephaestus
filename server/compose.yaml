# Local development stack. From the repo root: `vp run dev` runs `docker compose up -d --wait`
# then starts the server + webapp. Postgres is a bind mount (./postgres-data), so
# `docker compose down -v` won't clear it — use `vp run dev:reset` to reset the DB.
#
# Authentication is Hephaestus-native (no Keycloak — ADR 0017). For local login, register a
# GitHub OAuth app (callback http://localhost:8080/login/oauth2/code/github) and set
# GITHUB_OAUTH_CLIENT_ID / GITHUB_OAUTH_CLIENT_SECRET in server/.env. See
# docs/contributor/local-development.mdx.

services:
  postgres:
    build:
      context: ../docker/postgres
    image: 'ghcr.io/hephaestus-build/postgres:dev'
    environment:
      POSTGRES_DB: hephaestus
      POSTGRES_PASSWORD: root
      POSTGRES_USER: root
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - app-network
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d hephaestus']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Available for opt-in agent/webhook pipeline work (set the relevant hephaestus.*.nats.enabled
  # in application-local.yml). Idle otherwise — no Spring connection opens unless enabled.
  nats:
    image: nats:2.14.6-alpine@sha256:ad7a43eb7e3337c3c38ce5d784d1461791f95f730f252d2b25eee699752a0ca3
    command: ['-js', '-m', '8222']
    ports:
      - '${NATS_PORT:-4222}:4222'
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Catches every email the local server sends; nothing leaves the machine. UI on MAILPIT_UI_PORT.
  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    networks:
      - app-network
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  app-network:
    driver: bridge
