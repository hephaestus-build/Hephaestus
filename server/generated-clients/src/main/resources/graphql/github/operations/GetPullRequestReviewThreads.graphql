# Reads a pull request's review threads for correlation-key readback.
# Used by GitHubInlineFeedbackChannel to find the copies of an inline feedback package (matched by the
# correlation key embedded in a thread's first comment) before posting, and to recover a copy whose create
# response was lost. A thread without that tag is not ours and is left untouched.
# Only the first comment per thread is needed: it is the comment the review created. Its authorship by the
# authenticated viewer, its original commit and its original lines verify that copy.

query GetPullRequestReviewThreads(
    $owner: String!,
    $name: String!,
    $number: Int!,
    $first: Int!,
    $after: String
) {
    rateLimit {
        cost
        limit
        remaining
        resetAt
    }
    repository(owner: $owner, name: $name) {
        pullRequest(number: $number) {
            reviewThreads(first: $first, after: $after) {
                pageInfo {
                    hasNextPage
                    endCursor
                }
                nodes {
                    id
                    isResolved
                    isOutdated
                    comments(first: 1) {
                        nodes {
                            id
                            url
                            body
                            viewerDidAuthor
                            path
                            originalLine
                            originalStartLine
                            originalCommit {
                                oid
                            }
                        }
                    }
                }
            }
        }
    }
}
