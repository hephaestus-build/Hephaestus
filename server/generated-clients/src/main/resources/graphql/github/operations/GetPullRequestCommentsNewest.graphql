# Newest-end scan of a PR's conversation comments, for the summary-dedup lookup.
# `last`/`before` walks the connection backwards from the newest comment; GetPullRequestComments
# walks it forwards from the oldest for sync. Selects only what a copy match needs (id, body, permalink and
# whether the authenticated identity wrote it), so this is a cheap scan and not a second sync path.

query GetPullRequestCommentsNewest($owner: String!, $name: String!, $number: Int!, $last: Int!, $before: String) {
    rateLimit {
        cost
        limit
        remaining
        resetAt
    }
    repository(owner: $owner, name: $name) {
        pullRequest(number: $number) {
            comments(last: $last, before: $before) {
                pageInfo {
                    hasPreviousPage
                    startCursor
                }
                nodes {
                    id
                    url
                    body
                    viewerDidAuthor
                }
            }
        }
    }
}
