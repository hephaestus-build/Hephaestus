# Starts the pending review that holds one feedback package.
# Without an event the review stays PENDING and notifies no one; SubmitFeedbackReview publishes it.

mutation AddPullRequestReviewWithThreads(
    $pullRequestId: ID!,
    $body: String,
    $event: PullRequestReviewEvent,
    $commitOID: GitObjectID,
    $threads: [DraftPullRequestReviewThread!]
) {
    addPullRequestReview(input: {
        pullRequestId: $pullRequestId,
        body: $body,
        event: $event,
        commitOID: $commitOID,
        threads: $threads
    }) {
        pullRequestReview {
            id
            state
            comments(first: 100) {
                nodes {
                    id
                    url
                    path
                    line
                    body
                }
            }
        }
    }
}
