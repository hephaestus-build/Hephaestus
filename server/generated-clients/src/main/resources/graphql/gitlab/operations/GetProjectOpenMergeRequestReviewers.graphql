# Every open merge request's reviewers and where each review stands, for the reviewer refresh that follows an
# incremental merge request sync (GitLabMergeRequestSyncService).
#
# The incremental sync reads merge requests updated after its watermark. Approving, requesting changes or
# asking a reviewer again changes the reviewer's state (mergeRequestInteraction.reviewState) but is not known
# to advance the merge request's updatedAt, so a state whose webhook was missed would never be read again.
# This listing reads them for the open merge requests only, whose review requests matter.
#
# `reviewers(first: 20)` with `count` and `pageInfo` matches GetProjectMergeRequests, so an overflowing list is
# completed by GetMergeRequestReviewers rather than applied short.
query GetProjectOpenMergeRequestReviewers($fullPath: ID!, $first: Int!, $after: String) {
    project(fullPath: $fullPath) {
        mergeRequests(first: $first, after: $after, state: opened, sort: CREATED_ASC) {
            pageInfo {
                hasNextPage
                endCursor
            }
            nodes {
                iid
                reviewers(first: 20) {
                    count
                    pageInfo {
                        hasNextPage
                        endCursor
                    }
                    nodes {
                        ...GitLabUserFields
                        mergeRequestInteraction {
                            reviewState
                        }
                    }
                }
            }
        }
    }
}
