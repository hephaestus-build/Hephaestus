# Newest-end scan of an issue's notes, for the summary-dedup lookup.
# `last`/`before` walks the connection backwards from the newest note, so a just-posted summary is
# found on the first request; GetIssueNotes walks the same connection forwards from the oldest for
# sync. Selects only what a marker match needs (id, body and permalink), so this is a cheap scan and not a
# second sync path.
#
# Deliberately reads the noteable's FLAT `notes` connection rather than `discussions { notes }`:
# the flat connection carries its own cursor, so every note is reachable — the nested form pages
# notes at a fixed `first: 100` inside each discussion with no cursor of its own.

query GetIssueNotesNewest($fullPath: ID!, $iid: String!, $last: Int!, $before: String) {
    project(fullPath: $fullPath) {
        issue(iid: $iid) {
            notes(last: $last, before: $before) {
                pageInfo {
                    hasPreviousPage
                    startCursor
                }
                nodes {
                    id
                    url
                    body
                }
            }
        }
    }
}
