StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = STE
STE.Words = YES
STE.Contractions = YES
STE.NegativeContractions = NO
STE.Vocabulary = YES

# User docs and practice guides share the UI voice: positive contractions are allowed, negative ones
# are spelled out. The STE word list, passive voice and "-ing" suggestions describe maintenance
# manuals, not this voice.
[{**/docs/user/**/*.{md,mdx},**/server/application/src/main/resources/practices/guidance/**/*.md}]
STE.Contractions = NO
STE.NegativeContractions = YES
STE.Vocabulary = NO
STE.PassiveVoice = NO
STE.IngForms = NO

# Decision records keep the product name that was current when the decision was made.
# Ignore only that retired name; all other prose checks still apply.
[**/docs/decisions/*.md]
TokenIgnores = (\bHeph\b)

# The vocabulary owner must name the word it retires.
[**/docs/contributor/practice-feedback-language.md]
TokenIgnores = (\bHeph\b)
