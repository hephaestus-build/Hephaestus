StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = STE
STE.Words = YES
STE.Contractions = YES
STE.NegativeContractions = NO
STE.Vocabulary = YES

# User docs share the UI voice: positive contractions are allowed, negative ones are spelled out.
# The STE word list, passive voice and "-ing" suggestions describe maintenance manuals, not this voice.
[**/docs/user/**/*.{md,mdx}]
STE.Contractions = NO
STE.NegativeContractions = YES
STE.Vocabulary = NO
STE.PassiveVoice = NO
STE.IngForms = NO
