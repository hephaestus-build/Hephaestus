packages:
  - .
  - webapp
  - mobile
  - docs

linkWorkspacePackages: true
nodeLinker: isolated
hoist: false
publicHoistPattern:
  - react
  - react-dom
  - "@types/react"
  - "@types/react-dom"
  - "@types/hast"
minimumReleaseAge: 4320
# Initial, explicitly requested adoption; keep the age policy for every other package/version.
minimumReleaseAgeExclude:
  - "@shadcn/lint@0.1.0"

allowBuilds:
  '@google/genai': false
  '@nestjs/core': false
  '@openapitools/openapi-generator-cli': false
  '@sentry/cli': true
  "@swc/core": true
  core-js: false
  # eas-cli's logger falls back to plain output without this optional DTrace addon.
  dtrace-provider: false
  esbuild: true
  msw: false
  protobufjs: false
  # Its postinstall downloads highlighting grammars and a math renderer; the app turns both off
  # (mobile/package.json `enriched-markdown`), so nothing is fetched at install time.
  react-native-enriched-markdown: false

# Declares what a package requires but only receives through hoisting, so it resolves under the
# isolated layout above.
packageExtensions:
  # The Babel plugin requires both; they only arrive through @babel/core in a hoisted install.
  react-native-worklets:
    dependencies:
      "@babel/generator": ^7.29.0
      "@babel/traverse": ^7.29.0

# The tools vite-plus bundles, at the versions it bundles; `vp run sync:toolchain-pins` writes them.
catalog:
  oxfmt: 0.67.0
  oxlint: 1.82.0
  oxlint-tsgolint: 7.0.2001
  "@oxlint/plugins": 1.79.0
  vitest: 4.1.11
  "@vitest/browser": 4.1.11
  "@vitest/browser-playwright": 4.1.11
  "@vitest/coverage-v8": 4.1.11
  "@vitest/runner": 4.1.11
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  # Shared by the webapp and the mobile app: one generator for both API clients, one contract for the
  # query cache and the mentor chat stream, and one date library.
  "@hey-api/openapi-ts": 0.0.0-next-20260824173136
  "@tanstack/react-query": 5.102.8
  ai: 7.0.93
  "@ai-sdk/react": 4.0.96
  zod: 4.5.4
  date-fns: 4.4.0

overrides:
  mermaid: 11.17.2
  vitest: "catalog:"
  "@vitest/browser": "catalog:"
  "@vitest/runner": "catalog:"
  "browserslist@<=4.28.6": 4.28.9
  dompurify: 3.4.14
  "js-yaml@>=4.0.0": 4.3.2
  lodash: 4.18.1
  lodash-es: 4.18.1
  "markdown-it@<14.3.1": 14.3.1
  "qs@>=2.2.5 <6.16.0": 6.16.0
  serialize-javascript: 7.1.1
  "shell-quote@<=1.8.4": 1.10.0
  "uuid@<11.1.1": 11.1.1
