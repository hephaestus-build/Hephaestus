packages:
  - .
  - webapp
  - docs
  - extension
  - scripts/api-generator

linkWorkspacePackages: true
nodeLinker: isolated
hoist: false
publicHoistPattern:
  - react
  - react-dom
  - "@types/react"
  - "@types/react-dom"
  - "@types/hast"
# The install policy. `scripts/check-toolchain.ts` holds both agent images' workspace files to it.
# The malicious releases of recent registry incidents were removed within hours, so a version
# installs three days after it is published.
minimumReleaseAge: 4320
# A registry response without release times fails the install instead of skipping the age check.
minimumReleaseAgeIgnoreMissingTime: false
# The trust policy (`trustPolicy: no-downgrade`, versions younger than 30 days) applies where CI
# verifies every locked entry: the setup-toolchain install step sets it. A fresh resolve with it
# needs about 2 GB, which Renovate's 3 GB hosted job cannot spare beside its own process.
# When scripts run, a dependency build that `allowBuilds` does not list fails the install.
strictDepBuilds: true
# Only direct dependencies can come from a Git repository or a tarball URL (pnpm.io/settings).
blockExoticSubdeps: true
# An install checks only the versions it newly resolves against the release age. Re-verifying
# every locked entry needs each package's full registry metadata, more memory than Renovate's
# hosted job has. The setup-toolchain install in CI still verifies every entry (--no-trust-lockfile).
trustLockfile: true
# Explicitly requested versions; keep the age policy for every other package/version.
minimumReleaseAgeExclude:
  # CVE-2026-118772.
  - "joi@17.13.9"
  - "@shadcn/lint@0.1.0"
  # Renovate security update: fast-xml-parser@5.12.0
  - fast-xml-parser@5.12.0

allowBuilds:
  "@google/genai": false
  "@swc/core": true
  core-js: false
  esbuild: true
  msw: false
  protobufjs: false

# The tools vite-plus bundles, at the versions it bundles; `vp run sync:toolchain-pins` writes them.
catalog:
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  "@oxlint/plugins": 1.89.0
  vitest: 5.0.5
  "@vitest/browser": 5.0.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0

# The plugin imports these without declaring them; under `nodeLinker: isolated` it cannot reach them.
# As peers they resolve to the versions `docs/package.json` pins beside the rest of Docusaurus.
packageExtensions:
  "@signalwire/docusaurus-plugin-llms-txt@1.2.2":
    peerDependencies:
      "@docusaurus/logger": ^3
      "@docusaurus/utils": ^3
      "@docusaurus/utils-validation": ^3
  # Its SVG renderer imports the wasm libraries without declaring them (render-diagrams.ts).
  "@hylimo/diagram-render-svg@3.0.0-alpha.2":
    dependencies:
      "@hylimo/wasm-libs": 3.0.0-alpha.2

overrides:
  # CVE-2026-116689.
  "follow-redirects@>=1.16.0 <1.16.2": 1.16.2
  # CVE-2026-118772.
  "joi@>=17.1.1 <17.13.9": 17.13.9
  "@docusaurus/core>tinypool": 2.1.2
  mermaid: 12.2.0
  vitest: "catalog:"
  "@vitest/browser": "catalog:"
  dompurify: 3.4.17
  "js-yaml@>=4.0.0": 4.3.2
  # CVE-2026-116795. markdownlint pins 2.8.6 exactly.
  "re2js@<2.8.7": 2.8.8
  # CVE-2026-110816 (GHSA-6pq8-jhm2-2vcw) reaches 6.16.0 itself.
  "qs@>=2.2.5 <6.16.1": 6.16.1
  # CVE-2026-115754 and CVE-2026-115897 (GHSA-m5mm-p8h7-m29v).
  serialize-javascript: 7.1.4
  "shell-quote@<1.11.0": 1.11.0
  "undici@>=8.0.0 <8.12.2": 8.12.2
  "uuid@<11.1.1": 11.1.1
  # CVE-2026-118773 (GHSA-3g3m-2fjr-6pw4). No consumer releases a range that reaches 14.0.2.
  "glob@>=9.0.0 <14.0.2": 14.0.4
  # CVE-2026-118764 (GHSA-g3hv-75wg-m249). ESLint and ts-morph still require ^10.
  "minimatch@>=10.0.0 <11.0.1": 11.0.5
  # CVE-2026-104844 (GHSA-rj75-hqrm-r3gf). @tailwindcss/typography pins 6.0.10 exactly.
  "postcss-selector-parser@<6.1.5": 6.1.5
  # CVE-2026-103923 (GHSA-238p-pmpm-9mq7). micromark-extension-math requires ^0.16.
  "katex@<0.18.2": 0.18.11
patchedDependencies:
  "@earendil-works/pi-ai@1.4.0": docker/agents/pi/patches/@earendil-works__pi-ai@1.4.0.patch
  "@hey-api/openapi-ts@0.99.0": patches/@hey-api__openapi-ts@0.99.0.patch
  wxt@0.21.5: patches/wxt@0.21.5.patch
