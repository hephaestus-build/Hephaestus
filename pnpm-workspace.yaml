packages:
  - .
  - webapp
  - docs
  - extension
  - scripts/api-generator

linkWorkspacePackages: true
nodeLinker: isolated
hoist: false
publicHoistPattern:
  - react
  - react-dom
  - "@types/react"
  - "@types/react-dom"
  - "@types/hast"
minimumReleaseAge: 4320
# Initial, explicitly requested adoption; keep the age policy for every other package/version.
minimumReleaseAgeExclude:
  - "@shadcn/lint@0.1.0"
  - "@earendil-works/chord@1.0.0"
  - "@earendil-works/pi-agent-core@1.0.0"
  - "@earendil-works/pi-ai@1.0.0"
  - "@earendil-works/pi-codemode@1.0.0"
  - "@earendil-works/pi-coding-agent@1.0.0"
  - "@earendil-works/pi-mcp@1.0.0"
  - "@earendil-works/pi-telemetry@1.0.0"
  - "@earendil-works/pi-tui@1.0.0"
  # Renovate security update: dompurify@3.4.16
  - dompurify@3.4.16

allowBuilds:
  "@google/genai": false
  "@nestjs/core": false
  "@openapitools/openapi-generator-cli": false
  "@sentry/cli": true
  "@swc/core": true
  core-js: false
  esbuild: true
  msw: false
  protobufjs: false

# The tools vite-plus bundles, at the versions it bundles; `vp run sync:toolchain-pins` writes them.
catalog:
  oxfmt: 0.67.0
  oxlint: 1.82.0
  oxlint-tsgolint: 7.0.2001
  "@oxlint/plugins": 1.79.0
  vitest: 4.1.11
  "@vitest/browser": 4.1.11
  "@vitest/browser-playwright": 4.1.11
  "@vitest/coverage-v8": 4.1.11
  "@vitest/runner": 4.1.11
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  "@hey-api/openapi-ts": 0.99.0

overrides:
  "get-uri>basic-ftp": 6.2.1
  "@docusaurus/core>tinypool": 2.1.2
  mermaid: 11.17.2
  vitest: "catalog:"
  "@vitest/browser": "catalog:"
  "@vitest/runner": "catalog:"
  "browserslist@<=4.28.6": 4.28.9
  dompurify: 3.4.16
  "js-yaml@>=4.0.0": 4.3.2
  lodash: 4.18.1
  lodash-es: 4.18.1
  "markdown-it@<14.3.1": 14.3.1
  "qs@>=2.2.5 <6.16.0": 6.16.0
  serialize-javascript: 7.1.1
  "shell-quote@<1.11.0": 1.11.0
  "smol-toml@<1.7.1": 1.7.1
  "undici@>=8.0.0 <8.11.2": 8.11.2
  "uuid@<11.1.1": 11.1.1
patchedDependencies:
  "@earendil-works/pi-ai@1.0.0": docker/agents/pi/patches/@earendil-works__pi-ai@1.0.0.patch
  wxt@0.21.4: patches/wxt@0.21.4.patch
