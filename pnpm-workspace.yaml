packages:
  - .
  - webapp
  - docs
  - extension
  - scripts/api-generator

linkWorkspacePackages: true
nodeLinker: isolated
hoist: false
publicHoistPattern:
  - react
  - react-dom
  - "@types/react"
  - "@types/react-dom"
  - "@types/hast"
minimumReleaseAge: 4320
# An install checks only the versions it newly resolves against the release age. Re-verifying
# every locked entry needs each package's full registry metadata, more memory than Renovate's
# hosted job has. The setup-toolchain install in CI still verifies every entry (--no-trust-lockfile).
trustLockfile: true
# Initial, explicitly requested adoption; keep the age policy for every other package/version.
minimumReleaseAgeExclude:
  - "@shadcn/lint@0.1.0"
  - "@earendil-works/chord@1.0.0"
  - "@earendil-works/pi-agent-core@1.0.0"
  - "@earendil-works/pi-ai@1.0.0"
  - "@earendil-works/pi-codemode@1.0.0"
  - "@earendil-works/pi-coding-agent@1.0.0"
  - "@earendil-works/pi-mcp@1.0.0"
  - "@earendil-works/pi-telemetry@1.0.0"
  - "@earendil-works/pi-tui@1.0.0"

allowBuilds:
  "@google/genai": false
  "@nestjs/core": false
  "@openapitools/openapi-generator-cli": false
  "@swc/core": true
  core-js: false
  esbuild: true
  msw: false
  protobufjs: false

# The tools vite-plus bundles, at the versions it bundles; `vp run sync:toolchain-pins` writes them.
catalog:
  oxfmt: 0.73.0
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  "@oxlint/plugins": 1.88.0
  vitest: 5.0.5
  "@vitest/browser": 5.0.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0

overrides:
  "get-uri>basic-ftp": 6.2.1
  "@docusaurus/core>tinypool": 2.1.2
  mermaid: 11.17.2
  vitest: "catalog:"
  "@vitest/browser": "catalog:"
  "browserslist@<=4.28.6": 4.28.9
  dompurify: 3.4.17
  "js-yaml@>=4.0.0": 4.3.2
  lodash: 4.18.1
  lodash-es: 4.18.1
  "markdown-it@<14.3.3": 14.3.3
  "qs@>=2.2.5 <6.16.0": 6.16.0
  serialize-javascript: 7.1.2
  "shell-quote@<1.11.0": 1.11.0
  "smol-toml@<1.9.0": 1.9.0
  "undici@>=8.0.0 <8.12.2": 8.12.2
  "uuid@<11.1.1": 11.1.1
patchedDependencies:
  "@earendil-works/pi-ai@1.0.0": docker/agents/pi/patches/@earendil-works__pi-ai@1.0.0.patch
  wxt@0.21.4: patches/wxt@0.21.4.patch
