packages:
  - .
  - webapp
  - docs

linkWorkspacePackages: true
nodeLinker: isolated
hoist: false
publicHoistPattern:
  - react
  - react-dom
  - "@types/react"
  - "@types/react-dom"
  - "@types/hast"
minimumReleaseAge: 4320

allowBuilds:
  '@google/genai': false
  '@nestjs/core': false
  '@openapitools/openapi-generator-cli': false
  '@sentry/cli': true
  "@swc/core": true
  core-js: false
  esbuild: true
  msw: false
  protobufjs: false

# The tools vite-plus bundles, at the versions it bundles; `vp run sync:toolchain-pins` writes them.
catalog:
  oxfmt: 0.64.0
  oxlint: 1.79.0
  oxlint-tsgolint: 7.0.2001
  "@oxlint/plugins": 1.79.0
  vitest: 4.1.11
  "@vitest/browser": 4.1.11
  "@vitest/browser-playwright": 4.1.11
  "@vitest/coverage-v8": 4.1.11
  "@vitest/runner": 4.1.11

overrides:
  mermaid: 11.16.1
  vitest: "catalog:"
  "@vitest/browser": "catalog:"
  "@vitest/runner": "catalog:"
  "browserslist@<=4.28.6": 4.28.9
  dompurify: 3.4.14
  "js-yaml@>=4.0.0": 4.3.2
  lodash: 4.18.1
  lodash-es: 4.18.1
  "markdown-it@<=14.1.1": 14.3.1
  "qs@>=2.2.5 <6.16.0": 6.16.0
  serialize-javascript: 7.1.1
  "shell-quote@<=1.8.4": 1.10.0
  "uuid@<11.1.1": 11.1.1

patchedDependencies:
  "storybook@10.4.0": patches/storybook@10.4.0.patch
