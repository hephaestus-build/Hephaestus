body:
  - type: markdown
    attributes:
      value: |
        Before you start a discussion, search [existing ideas](https://github.com/hephaestus-build/Hephaestus/discussions/categories/ideas).

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who has the problem. State what they want to do. Explain why the current experience does not meet their needs.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good outcome look like?
      description: Describe the result and its value.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Share relevant workarounds, alternatives, constraints, or links.
