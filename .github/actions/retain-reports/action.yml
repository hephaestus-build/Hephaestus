name: "Retain reports"
description: >-
  Upload a job's own reports, such as raw test results or diagnostics, as an artifact, in up to three attempts. A
  failed upload does not change the job's verdict, which comes from its tests: after the last attempt, a warning
  annotation and the job summary name the reports that were not retained. An artifact that a later job or a release
  reads is not a report: upload it with actions/upload-artifact, so that its loss fails the job.
inputs:
  name:
    description: "The artifact name"
    required: true
  path:
    description: "The files to upload"
    required: true
  retention-days:
    description: "How long GitHub keeps the artifact"
    required: false
    default: "14"
  if-no-files-found:
    description: "warn or ignore. A report is never required, so error, which would only become a warning here, is not offered"
    required: false
    default: "warn"
runs:
  using: "composite"
  # GitHub Actions has no retry for a `uses:` step, so the attempts are written out. A failed finalize can leave a
  # partial artifact of the same name, so every attempt overwrites it.
  steps:
    - id: first
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true
    - if: steps.first.outcome == 'failure'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        echo "Uploading $NAME failed; trying again in 15 s"
        sleep 15
    - id: second
      if: steps.first.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true
    - if: steps.second.outcome == 'failure'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        echo "Uploading $NAME failed again; trying a last time in 45 s"
        sleep 45
    - id: third
      if: steps.second.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true
    - if: steps.third.outcome == 'failure'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        echo "::warning title=Reports not retained::$NAME failed to upload in 3 attempts. The job's verdict comes from its tests; these reports are missing from the run."
        {
          echo "### Reports not retained"
          echo ""
          echo "\`$NAME\` failed to upload in 3 attempts. The job's verdict comes from its tests, but these reports are missing from the run. Re-run the job to keep them."
        } >> "$GITHUB_STEP_SUMMARY"
