name: Setup release security tools
description: Install pinned and verified release security tools
inputs:
  cache:
    description: Restore and save GitHub Actions cache archives; disable in signing jobs
    default: "true"
  install-syft:
    description: Install Syft; Cosign and Trivy are always installed
    default: "true"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-toolchain
      with:
        install: "none"
    - uses: ./.github/actions/setup-ci-tool
      with:
        cache: ${{ inputs.cache }}
        tool: cosign-bootstrap
    - uses: ./.github/actions/setup-ci-tool
      with:
        cache: ${{ inputs.cache }}
        tool: cosign
    - uses: ./.github/actions/setup-ci-tool
      with:
        cache: ${{ inputs.cache }}
        tool: cosign
        variant: key
    - uses: ./.github/actions/setup-ci-tool
      with:
        cache: ${{ inputs.cache }}
        tool: cosign
        variant: keyless
    - uses: ./.github/actions/setup-ci-tool
      with:
        cache: ${{ inputs.cache }}
        tool: cosign
        variant: kms
    - uses: ./.github/actions/setup-ci-tool
      if: inputs.install-syft == 'true'
      with:
        cache: ${{ inputs.cache }}
        tool: syft
    - uses: ./.github/actions/setup-ci-tool
      with:
        cache: ${{ inputs.cache }}
        tool: trivy
    - name: Install verified release security tools
      shell: bash
      env:
        INSTALL_SYFT: ${{ inputs.install-syft }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/setup-release-security-tools.ts
