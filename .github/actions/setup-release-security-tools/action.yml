name: Setup release security tools
description: Install release security tools
inputs:
  install-syft:
    description: Install Syft; Cosign and Trivy are always installed
    default: "true"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-toolchain
      with:
        install: "none"
    - name: Install verified release security tools
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INSTALL_SYFT: ${{ inputs.install-syft }}
        # renovate: datasource=github-releases depName=sigstore/cosign
        COSIGN_VERSION: v3.1.4
        # renovate: datasource=github-releases depName=anchore/syft
        SYFT_VERSION: 1.55.0
        # renovate: datasource=github-releases depName=aquasecurity/trivy
        TRIVY_VERSION: 0.76.1
      run: node scripts/setup-release-security-tools.ts
