name: "Upload an artifact with retries"
description: >-
  Upload an artifact in up to three attempts. A required artifact, such as the packaged server, the image digests or
  release evidence, fails the job after the last attempt, with an error that names it. A report that is not required,
  such as raw test results or diagnostics, does not change the job's verdict, which comes from its tests: after the
  last attempt, a warning annotation and the job summary name the reports that were not retained.
inputs:
  name:
    description: "The artifact name"
    required: true
  path:
    description: "The files to upload"
    required: true
  required:
    description: "true: losing the artifact fails the job. false: only for a job's own reports, which a later job or a release never reads"
    required: false
    default: "true"
  retention-days:
    description: "How long GitHub keeps the artifact, in days. Empty keeps the repository's setting"
    required: false
    default: ""
  if-no-files-found:
    description: "warn, error or ignore. error makes sense only for a required artifact: a report's error would only become a warning"
    required: false
    default: "warn"
  compression-level:
    description: "The zlib compression level, 0 to 9"
    required: false
    default: "6"
  include-hidden-files:
    description: "Whether files and directories whose names start with a dot are uploaded"
    required: false
    default: "false"
  overwrite:
    description: "Whether the first attempt replaces an artifact of the same name, such as one from an earlier run attempt"
    required: false
    default: "false"
outputs:
  artifact-id:
    description: "The ID of the uploaded artifact, from the last attempt that uploaded it"
    value: ${{ steps.third.outputs.artifact-id || steps.second.outputs.artifact-id || steps.first.outputs.artifact-id }}
runs:
  using: "composite"
  # GitHub Actions has no retry for a `uses:` step, so the attempts are written out. A failed finalize can leave a
  # partial artifact of the same name, so a retry overwrites it. The first attempt does so only when asked, so two
  # uploads of one name still fail.
  steps:
    - id: first
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: ${{ inputs.overwrite }}
    - if: steps.first.outcome == 'failure'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        echo "Uploading $NAME failed; trying again in 15 s"
        sleep 15
    - id: second
      if: steps.first.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true
    - if: steps.second.outcome == 'failure'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        echo "Uploading $NAME failed again; trying a last time in 45 s"
        sleep 45
    - id: third
      if: steps.second.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true
    - if: steps.third.outcome == 'failure' && inputs.required != 'false'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        echo "::error title=Artifact not uploaded::$NAME failed to upload in 3 attempts. A later job or the release needs it, so this job fails. Re-run the job."
        exit 1
    - if: steps.third.outcome == 'failure' && inputs.required == 'false'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        echo "::warning title=Reports not retained::$NAME failed to upload in 3 attempts. The job's verdict comes from its tests; these reports are missing from the run."
        {
          echo "### Reports not retained"
          echo ""
          echo "\`$NAME\` failed to upload in 3 attempts. The job's verdict comes from its tests, but these reports are missing from the run. Re-run the job to keep them."
        } >> "$GITHUB_STEP_SUMMARY"
