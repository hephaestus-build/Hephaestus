name: "Setup toolchain"
description: "The Node.js version package.json pins and, for a frozen install, its pnpm and Vite+ pins with the executable, package store and native lockfile-verification verdict cached; install is none or frozen."
inputs:
  install:
    description: "none: the Node.js runtime alone, for dependency-free Node scripts or shell; frozen: pnpm and Vite+ as well, then pnpm install --frozen-lockfile --ignore-scripts. No lifecycle script runs in CI, so pnpm-workspace.yaml#allowBuilds is exercised only by a contributor's install."
    required: false
    default: "none"
runs:
  using: "composite"
  steps:
    - if: inputs.install != 'none' && inputs.install != 'frozen'
      shell: bash
      run: |
        echo "::error::setup-toolchain: install must be none or frozen"
        exit 1
    - id: pnpm
      if: inputs.install == 'frozen'
      shell: bash
      run: |
        echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"
        # Use the native home directory, not Git Bash's MSYS path, on Windows.
        echo "dest=$(node -p 'require("node:path").join(require("node:os").homedir(), "setup-pnpm")')" >> "$GITHUB_OUTPUT"
    # Only the executable: pnpm/setup installs a Node runtime beside it, and setup-node owns Node.
    - id: pnpm-cache
      if: inputs.install == 'frozen'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/setup-pnpm/pnpm
          ~/setup-pnpm/pnpm.exe
        key: pnpm-bin-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.version }}
    # A hit skips pnpm/setup, so it has to reproduce what that action exports: PNPM_HOME, and both
    # the destination and its bin directory on PATH.
    - if: steps.pnpm-cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        PNPM_DEST: ${{ steps.pnpm.outputs.dest }}
      run: |
        mkdir -p "$PNPM_DEST/bin"
        echo "PNPM_HOME=$PNPM_DEST" >> "$GITHUB_ENV"
        echo "$PNPM_DEST" >> "$GITHUB_PATH"
        echo "$PNPM_DEST/bin" >> "$GITHUB_PATH"
    # GitHub Actions has no retry for a `uses:` step and pnpm/setup has no retry input, so the
    # attempts are written out; a loop would mean re-implementing the installer and giving up npm's
    # signature verification of the executable. pnpm/setup does not separate a registry blip from a
    # bad pin, so a deterministic failure also costs all three attempts.
    - id: pnpm-setup-1
      if: inputs.install == 'frozen' && steps.pnpm-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        cache: false
        cache-dependency-path: pnpm-lock.yaml
        install: false
        require-lockfile: true
    - if: steps.pnpm-setup-1.outcome == 'failure'
      shell: bash
      run: sleep 5
    - id: pnpm-setup-2
      if: steps.pnpm-setup-1.outcome == 'failure'
      continue-on-error: true
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        cache: false
        cache-dependency-path: pnpm-lock.yaml
        install: false
        require-lockfile: true
    - if: steps.pnpm-setup-2.outcome == 'failure'
      shell: bash
      run: sleep 10
    - if: steps.pnpm-setup-2.outcome == 'failure'
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        cache: false
        cache-dependency-path: pnpm-lock.yaml
        install: false
        require-lockfile: true
    # Cache entries are immutable: validate the executable before publishing a new entry.
    - if: inputs.install == 'frozen'
      shell: bash
      env:
        PNPM_VERSION: ${{ steps.pnpm.outputs.version }}
      run: test "$(pnpm --version)" = "$PNPM_VERSION"
    # Default-branch caches are reusable across PRs; merge-ref caches are scoped to that PR.
    - if: inputs.install == 'frozen' && steps.pnpm-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/setup-pnpm/pnpm
          ~/setup-pnpm/pnpm.exe
        key: pnpm-bin-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.version }}
    # Both modes end here: pnpm/setup installs a Node runtime of its own, so the pinned one is
    # selected last to win on PATH. setup-node reads `pnpm store path`, which needs pnpm installed.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        cache: ${{ inputs.install == 'frozen' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml
    - if: inputs.install == 'frozen'
      uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
      with:
        node-manager: false
        cache: false
        run-install: false
    # setup-node caches package bytes, not pnpm's content-and-policy-validated verification record.
    # Without the latter, even a fully warm store repeats registry metadata checks on every runner.
    - name: Locate pnpm verification cache
      id: pnpm-verification-path
      if: inputs.install == 'frozen'
      shell: bash
      run: |
        cache_dir="$(pnpm cache path)"
        echo "path=$(node -p 'require("node:path").join(process.argv[1], "lockfile-verified.jsonl")' "$cache_dir")" >> "$GITHUB_OUTPUT"
    - name: Restore pnpm verification cache
      id: pnpm-verification-cache
      if: inputs.install == 'frozen'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-verification-path.outputs.path }}
        key: pnpm-verification-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
    # pnpm/setup cannot pass --ignore-scripts, so the install is its own step.
    - name: Install dependencies
      id: pnpm-install
      if: inputs.install == 'frozen'
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Verify pnpm verification cache
      if: inputs.install == 'frozen'
      shell: bash
      env:
        PNPM_VERIFICATION_CACHE: ${{ steps.pnpm-verification-path.outputs.path }}
      run: |
        node -e 'if (!require("node:fs").statSync(process.argv[1]).isFile()) process.exit(1)' "$PNPM_VERIFICATION_CACHE"
        echo "Verified native cache file: $PNPM_VERIFICATION_CACHE"
    # Only a successful default-branch push install publishes a reusable policy verdict.
    # pnpm itself checks the lockfile content and policy again before accepting a restored record.
    - name: Save pnpm verification cache
      if: >-
        inputs.install == 'frozen' && steps.pnpm-install.outcome == 'success' &&
        steps.pnpm-verification-cache.outputs.cache-hit != 'true' &&
        github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-verification-path.outputs.path }}
        key: pnpm-verification-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
