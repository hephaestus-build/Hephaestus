name: Setup Kubernetes tools
description: Install pinned k3d, kind and kubeconform with verified cache and upstream fallback
inputs:
  gateway-api:
    description: Also cache the Gateway API definitions for a cluster that needs them
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-ci-tool
      with:
        tool: k3d
    - uses: ./.github/actions/setup-ci-tool
      with:
        tool: kind
    - uses: ./.github/actions/setup-ci-tool
      with:
        tool: kubeconform
    - uses: ./.github/actions/setup-ci-tool
      if: inputs.gateway-api == 'true'
      with:
        tool: gateway-api
    - name: Install verified Kubernetes tools
      shell: bash
      run: node scripts/setup-kubernetes-tools.ts
