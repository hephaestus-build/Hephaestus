name: "Restore the built server"
description: "Restore the package job's JARs, compiled tests and resources without recompilation."
inputs:
  artifact:
    description: "Name of the server artifact uploaded by the package job"
    required: true
outputs:
  executable-jar:
    description: "Absolute path of the executable application JAR"
    value: ${{ steps.locate.outputs.executable-jar }}
runs:
  using: "composite"
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: server
    - name: Validate the artifact and locate the executable JAR
      id: locate
      shell: bash
      working-directory: server
      run: |
        set -euo pipefail
        test -d application/build/classes/java/main
        test -d application/build/classes/java/test
        test -d application/build/resources/main
        test -d application/build/resources/test
        mapfile -t jars < <(find application/build/libs -maxdepth 1 -name 'hephaestus-application-*.jar')
        mapfile -t clients < <(find generated-clients/build/libs -maxdepth 1 -name 'hephaestus-generated-clients-*.jar')
        (( ${#jars[@]} == 1 )) && (( ${#clients[@]} == 1 ))
        echo "executable-jar=$PWD/${jars[0]}" >> "$GITHUB_OUTPUT"
