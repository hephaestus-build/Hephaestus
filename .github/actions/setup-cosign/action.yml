name: Install verified Cosign
description: Install Cosign through the release API with checksum and signature verification
inputs:
  cosign-release:
    description: The Cosign release to verify and install
    default: v3.1.4
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ github.action_path }}/../../../package.json
    - name: Verify and install Cosign
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COSIGN_VERSION: ${{ inputs.cosign-release }}
        INSTALL_ONLY_COSIGN: "true"
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../../../scripts/setup-release-security-tools.ts"
