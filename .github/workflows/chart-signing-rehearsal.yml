name: Release / Chart signing rehearsal

# Rehearses the chart half of a release on a scratch repository that no release uses: the release's
# own packaging, push and keyless `cosign sign`, then the operator's verification from
# docs/admin/kubernetes.mdx § Verify the release chart. It writes no release chart, release, tag or
# lock. See docs/contributor/release-management.mdx § Joint lock with the chart.
on:
  workflow_dispatch:

permissions: {}

jobs:
  rehearse:
    # The operator command names a default-branch identity; a run from another ref proves nothing.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"

      - uses: ./.github/actions/setup-helm

      - name: Install Cosign
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.4

      # Cosign reads the Docker credentials; Helm keeps its own.
      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and sign a rehearsal chart
        id: chart
        env:
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          mkdir "$RUNNER_TEMP/chart"
          node scripts/rehearse-chart-signing.ts "$RUN_ID" "$SHA" \
            "ghcr.io/${OWNER,,}/charts-rehearsal/hephaestus" "$RUNNER_TEMP/chart" > "$RUNNER_TEMP/chart.json"
          jq . "$RUNNER_TEMP/chart.json"
          chart=$(jq -er '"\(.repository)@\(.digest)"' "$RUNNER_TEMP/chart.json")
          node scripts/keyless-sign.ts sign --yes "$chart"
          {
            echo "repository=$(jq -er .repository "$RUNNER_TEMP/chart.json")"
            echo "digest=$(jq -er .digest "$RUNNER_TEMP/chart.json")"
            echo "version=$(jq -er .version "$RUNNER_TEMP/chart.json")"
          } >> "$GITHUB_OUTPUT"

      # Steps 2 to 4 of docs/admin/kubernetes.mdx § Verify the release chart, with this workflow's
      # identity in place of release.yml's. ci-contract.test.ts holds them to the documented ones.
      - name: Verify the chart as an operator
        working-directory: ${{ runner.temp }}
        env:
          CHART: ${{ steps.chart.outputs.repository }}
          DIGEST: ${{ steps.chart.outputs.digest }}
          VERSION: ${{ steps.chart.outputs.version }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign verify "$CHART@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          helm pull "oci://$CHART@$DIGEST" --untar --untardir "chart-$VERSION"
          helm show chart "chart-$VERSION/hephaestus" | grep -qx "version: $VERSION"
          echo "Verified $CHART@$DIGEST as chart $VERSION" >> "$GITHUB_STEP_SUMMARY"
