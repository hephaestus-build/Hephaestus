name: Docs / Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # The docs build runs these scripts and checks the web app's docs targets.
      - "scripts/docs-astro.ts"
      - "scripts/check-docs-links.ts"
      - "scripts/check-docs-addresses.ts"
      - "scripts/check-doc-targets.ts"
      - "webapp/src/lib/doc-targets.ts"
      - ".github/workflows/cd-docs.yml"
  # The tooling leg builds the docs at the root. This builds them at /next/ too, whose link check catches a link
  # that leaves the base path.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "scripts/docs-astro.ts"
      - "scripts/check-docs-links.ts"
      - "scripts/check-docs-addresses.ts"
      - "scripts/check-doc-targets.ts"
      - "webapp/src/lib/doc-targets.ts"
      # Lockfile maintenance alone moves the transitive packages of the site.
      - "pnpm-lock.yaml"
      - ".github/workflows/cd-docs.yml"
  # A release republishes the site root with its docs (docs/README.md § Versions). The release workflow publishes with
  # GITHUB_TOKEN, whose release event starts no workflow, so this follows its completed run instead.
  workflow_run: # zizmor: ignore[dangerous-triggers] Nothing from the run is checked out or executed.
    workflows: ["Release / Publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-pull-request:
    name: Build (pull request)
    if: github.event_name == 'pull_request'
    concurrency:
      group: docs-build-pr-${{ github.event.number }}
      cancel-in-progress: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - name: Build at /next/
        run: vp run --filter docs build
        env:
          DOCS_BASE_URL: "/next/"
          DOCS_CHANNEL: next

  # The release whose docs the site root serves: the newest release candidate before 1.0.0, the newest stable after.
  release-ref:
    name: Resolve the release
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      # The release workflow runs after every push to main, and most runs publish nothing. A run republishes the site
      # only when a release tag points at its commit.
      - id: release
        env:
          EVENT: ${{ github.event_name }}
          RELEASED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag=$(node scripts/docs-release.ts)
          publish=true
          if [ "$EVENT" = workflow_run ] && [ -z "$(git tag --points-at "$RELEASED_SHA" --list 'v*')" ]; then
            publish=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # The site root: the docs of the latest release, built from its tag with that tag's own toolchain.
  build-release:
    name: Build (latest release)
    needs: release-ref
    if: needs.release-ref.outputs.publish == 'true'
    concurrency:
      group: docs-build-release-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-ref.outputs.tag }}
          # Each page's last-updated date and sitemap entry come from its own last commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - run: vp run --filter docs build
        env:
          DOCS_BASE_URL: "/"
          DOCS_CHANNEL: latest
          DOCS_RELEASE: ${{ needs.release-ref.outputs.tag }}
      # The tag builds with its own config, and tags up to v1.0.0-rc.9 write docs/build, not docs/dist.
      # Remove the docs/build branch when the release at the site root is newer than v1.0.0-rc.9.
      - name: Find the release build
        id: release-build
        env:
          TAG: ${{ needs.release-ref.outputs.tag }}
        run: |
          if [ -d docs/dist ]; then
            echo "path=docs/dist" >> "$GITHUB_OUTPUT"
          elif [ -d docs/build ]; then
            echo "path=docs/build" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The docs build of $TAG wrote neither docs/dist nor docs/build."
            exit 1
          fi
      # The checked-out ref can predate upload-artifact-retry, so the action comes from this workflow's commit.
      - name: Check out the upload action of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-actions
          sparse-checkout: .github/actions/upload-artifact-retry
          persist-credentials: false
      - uses: ./workflow-actions/.github/actions/upload-artifact-retry
        with:
          name: docs-build-latest
          path: ${{ steps.release-build.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  # /next/: the docs of main, with the banner that marks them unreleased.
  build-production:
    name: Build (next)
    needs: release-ref
    if: needs.release-ref.outputs.publish == 'true'
    concurrency:
      group: docs-build-next-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Each page's last-updated date and sitemap entry come from its own last commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - run: vp run --filter docs build
        env:
          DOCS_BASE_URL: "/next/"
          DOCS_CHANNEL: next
          DOCS_RELEASE: ${{ needs.release-ref.outputs.tag }}
      # The checked-out ref can predate upload-artifact-retry, so the action comes from this workflow's commit.
      - name: Check out the upload action of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-actions
          sparse-checkout: .github/actions/upload-artifact-retry
          persist-credentials: false
      - uses: ./workflow-actions/.github/actions/upload-artifact-retry
        with:
          name: docs-build-next
          path: docs/dist
          retention-days: 1

  # deploy-pages finds the site artifact by listing the run's artifacts. Right after an upload in the
  # same job the listing can still lack it, so the site is uploaded here and deployed by its own job.
  assemble:
    name: Assemble the site
    needs: [build-release, build-production]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-build-latest
          path: docs-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-build-next
          path: docs-build/next
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-build

  deploy:
    name: GitHub Pages
    concurrency:
      group: docs-production-deploy
      cancel-in-progress: false
    needs: [assemble]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
