name: Docs / Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/cd-docs.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "scripts/docs-preview.ts"
      - "scripts/render-preview-comment.ts"
      - "scripts/publish-preview-comments.ts"
      - "scripts/lib/preview-comment.ts"
      - "scripts/lib/json.ts"
      - "scripts/lib/process.ts"
      - ".github/workflows/cd-docs.yml"
  # A release republishes the site root with its docs (docs/README.md § Versions). The release workflow publishes with
  # GITHUB_TOKEN, whose release event starts no workflow, so this follows its completed run instead.
  workflow_run: # zizmor: ignore[dangerous-triggers] Nothing from the run is checked out or executed.
    workflows: ["Release / Publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-preview:
    name: Build (preview)
    if: github.event_name == 'pull_request'
    concurrency:
      group: docs-preview-build-${{ github.event.number }}
      cancel-in-progress: true
    outputs:
      docs-changed: ${{ steps.docs.outputs.changed }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_URL: hephaestus-build-docs-pr-${{ github.event.number }}.surge.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect documentation changes in this update
        id: docs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { docsChanged } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/docs-preview.ts`);
            core.setOutput("changed", docsChanged(context.payload));
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/.docusaurus
            docs/node_modules/.cache
          key: ${{ runner.os }}-docusaurus-preview-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('docs/**/*.md', 'docs/**/*.mdx', 'docs/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-preview-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-docusaurus-preview-
      - run: vp run --filter docs build
        env:
          DOCUSAURUS_BASE_URL: "/"
      - name: Prepare preview links
        run: >-
          node scripts/render-preview-comment.ts docs docs/.docusaurus
          "https://$PREVIEW_URL"
          ${{ github.event.pull_request.base.sha }} docs-preview-comment.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-build-preview
          path: docs/build
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview-comment
          path: docs-preview-comment.json
          retention-days: 1

  # The release whose docs the site root serves: the newest release candidate before 1.0.0, the newest stable after.
  release-ref:
    name: Resolve the release
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      # The release workflow runs after every push to main, and most runs publish nothing. A run republishes the site
      # only when a release tag points at its commit.
      - id: release
        env:
          EVENT: ${{ github.event_name }}
          RELEASED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag=$(node scripts/docs-release.ts)
          publish=true
          if [ "$EVENT" = workflow_run ] && [ -z "$(git tag --points-at "$RELEASED_SHA" --list 'v*')" ]; then
            publish=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # The site root: the docs of the latest release, built from its tag with that tag's own toolchain.
  build-release:
    name: Build (latest release)
    needs: release-ref
    if: needs.release-ref.outputs.publish == 'true'
    concurrency:
      group: docs-build-release-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-ref.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/.docusaurus
            docs/node_modules/.cache
          key: ${{ runner.os }}-docusaurus-latest-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('docs/**/*.md', 'docs/**/*.mdx', 'docs/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-latest-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-docusaurus-latest-
      - run: vp run --filter docs build
        env:
          DOCUSAURUS_BASE_URL: "/"
          DOCS_CHANNEL: latest
          DOCS_RELEASE: ${{ needs.release-ref.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-build-latest
          path: docs/build
          retention-days: 1

  # /next/: the docs of main, with the banner that marks them unreleased.
  build-production:
    name: Build (next)
    needs: release-ref
    if: needs.release-ref.outputs.publish == 'true'
    concurrency:
      group: docs-build-next-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/.docusaurus
            docs/node_modules/.cache
          key: ${{ runner.os }}-docusaurus-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('docs/**/*.md', 'docs/**/*.mdx', 'docs/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-docusaurus-next-
      - run: vp run --filter docs build
        env:
          DOCUSAURUS_BASE_URL: "/next/"
          DOCS_CHANNEL: next
          DOCS_RELEASE: ${{ needs.release-ref.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-build-next
          path: docs/build
          retention-days: 1

  preview:
    name: PR Preview
    needs: build-preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.build-preview.outputs.docs-changed == 'true'
    concurrency:
      group: docs-preview-${{ github.event.number }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      PREVIEW_URL: hephaestus-build-docs-pr-${{ github.event.number }}.surge.sh
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-build-preview
          path: docs-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview-comment
          path: preview-comment
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - name: Claim this head's preview deployment
        id: claim
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { claimDocsPreview } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/docs-preview.ts`);
            const decision = await claimDocsPreview({ github, repo: context.repo, pullNumber: context.issue.number, headSha: process.env.HEAD_SHA, runUrl: process.env.RUN_URL });
            core.setOutput("deploy", decision.kind === "claimed");
            await core.summary.addHeading("Docs preview").addRaw(decision.summary).write();
      - name: Deploy to Surge.sh
        id: surge
        if: steps.claim.outputs.deploy == 'true'
        continue-on-error: true
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: ./node_modules/.bin/surge ./docs-build "$PREVIEW_URL" --token "$SURGE_TOKEN"
      - name: Report the preview outcome
        if: ${{ always() && steps.claim.outputs.deploy == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SURGE_OUTCOME: ${{ steps.surge.outcome }}
        with:
          script: |
            const { finishDocsPreview } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/docs-preview.ts`);
            const result = await finishDocsPreview({ github, repo: context.repo, headSha: process.env.HEAD_SHA, runUrl: process.env.RUN_URL, previewUrl: `https://${process.env.PREVIEW_URL}`, outcome: process.env.SURGE_OUTCOME });
            await core.summary.addHeading("Docs preview result").addRaw(result.summary).write();
            if (result.state !== "success") core.warning(result.summary);
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: steps.claim.outputs.deploy == 'true' && steps.surge.outcome == 'success'
        env:
          PREVIEW_COMMENT_PATH: preview-comment/docs-preview-comment.json
        with:
          script: |
            const { publishPreviewComments } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-preview-comments.ts`);
            await publishPreviewComments({ github, context, kind: "docs", path: process.env.PREVIEW_COMMENT_PATH });

  deploy:
    name: GitHub Pages
    concurrency:
      group: docs-production-deploy
      cancel-in-progress: false
    needs: [build-release, build-production]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-build-latest
          path: docs-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-build-next
          path: docs-build/next
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-build
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
