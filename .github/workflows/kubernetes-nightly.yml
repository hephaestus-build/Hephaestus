name: CI / Kubernetes nightly

# A push to main runs no cluster legs, because its merge group tested that commit. A change that the
# `kubernetes` filter does not select reaches main untested on a cluster, so every leg runs each night
# on the newest main build that passed CI, with that build's chart and images.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: kubernetes-nightly
  cancel-in-progress: false

jobs:
  build:
    name: "Newest main build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
    outputs:
      commit: ${{ steps.newest.outputs.commit }}
    steps:
      - name: Find the newest main build that passed CI
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit=$(gh api "repos/$REPOSITORY/actions/workflows/cicd.yml/runs?event=push&branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No main build has passed CI"; exit 1; }
          echo "Commit: \`$commit\`" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  Kubernetes:
    needs: build
    uses: ./.github/workflows/ci-kubernetes.yml
    permissions:
      contents: read
    with:
      commit: ${{ needs.build.outputs.commit }}
      ref: ${{ needs.build.outputs.commit }}
      queue: true

  # The review sandbox's memory on the newest main: two reviews of a large repository at once, from
  # the agent image that main published. The model is a stand-in, so no credential is needed.
  footprint:
    name: "Sandbox footprint"
    needs: build
    runs-on: ubuntu-24.04
    # Up to 45 minutes of waiting for the merge queue leaves 45 minutes for about 15-20 minutes of work.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      # The 20 runners are shared with the merge queue, which carries accepted work. A busy queue is
      # not a defect in main, so the benchmark skips that night instead of failing.
      - name: Wait while merge-group jobs are queued
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 45 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs=$(gh run list -R "$REPOSITORY" --workflow cicd.yml --event merge_group --limit 5 \
              --json databaseId,status -q '.[] | select(.status != "completed") | .databaseId')
            queued=0
            for id in $runs; do
              jobs=$(gh api "repos/$REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq '[(.jobs | length), ([.jobs[] | select(.status == "queued")] | length)] | @tsv')
              read -r total waiting <<< "$jobs"
              # A merge-group run that has not fanned out yet has no jobs, but it will.
              if [ "$total" -eq 0 ]; then waiting=1; fi
              queued=$((queued + waiting))
            done
            if [ "$queued" -eq 0 ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$queued merge-group jobs are queued; waiting a minute"
            sleep 60
          done
          echo "::notice::The merge queue stayed busy for 45 minutes, so tonight's sandbox footprint run is skipped."
          echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-caches
        if: steps.queue.outputs.run == 'true'
      - name: Resolve the agent image of the tested build
        if: steps.queue.outputs.run == 'true'
        id: image
        run: |
          set -euo pipefail
          node scripts/resolve-release-images.ts "$COMMIT" release-images.tsv
          reference=$(awk -F '\t' '$1 == "agent-pi" { print $2 "@" $3 }' release-images.tsv)
          [ -n "$reference" ] || { echo "::error::No agent-pi image for $COMMIT"; exit 1; }
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
      - name: Stage a review of the large fixture
        if: steps.queue.outputs.run == 'true'
        env:
          FOOTPRINT_STAGE_DIR: ${{ runner.temp }}/footprint-stage
          FOOTPRINT_REPO: ${{ runner.temp }}/swiftformat
          FOOTPRINT_BASE: aadf4245ddfd71e1305c45104e7e0207e30e157f
          FOOTPRINT_HEAD: abc138dd52a104716fa248344309c875911d4195
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/nicklockwood/SwiftFormat.git "$FOOTPRINT_REPO"
          cd server
          ./gradlew :application:liveTest --tests '*ReviewFootprintStagingLiveTest*' --console=plain
      - name: Measure two reviews at once
        if: steps.queue.outputs.run == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          STAGE: ${{ runner.temp }}/footprint-stage
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE"
          node scripts/sandbox-footprint.ts --stage "$STAGE" --image "$IMAGE" --reviews 2 \
            --label "nightly-$COMMIT" --work sandbox-footprint
      # The report, each container's log and the raw samples: a failure is read from these.
      - name: Keep the report, the logs and the samples
        if: always() && steps.queue.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-footprint
          path: sandbox-footprint/
          if-no-files-found: warn
          retention-days: 30


  # A scheduled run has no pull request to fail, so each failed job reports on its own tracking issue.
  report:
    name: "Report a failure"
    needs: [build, Kubernetes, footprint]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - name: Report each failed job on its tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ needs.build.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD: ${{ needs.build.result }}
          KUBERNETES: ${{ needs.Kubernetes.result }}
          FOOTPRINT: ${{ needs.footprint.result }}
        run: |
          set -euo pipefail
          report() {
            local title=$1 body=$2 number
            number=$(gh issue list -R "$REPOSITORY" --state open --search "\"$title\" in:title" --json number,title |
              jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
            if [ -n "$number" ]; then
              gh issue comment "$number" -R "$REPOSITORY" --body "$body"
            else
              gh issue create -R "$REPOSITORY" --title "$title" --body "$body"
            fi
          }
          if [ "$BUILD" = failure ] || [ "$KUBERNETES" = failure ]; then
            report "The nightly Kubernetes run failed" \
              "The nightly cluster run on \`${COMMIT:-no commit}\` failed: $RUN_URL"
          fi
          if [ "$FOOTPRINT" = failure ]; then
            report "The nightly sandbox footprint run failed" \
              "The nightly sandbox footprint run on \`${COMMIT:-no commit}\` failed: $RUN_URL. The \`sandbox-footprint\` artifact holds the report (its \`verdict.reasons\`), each container's log and the samples."
          fi
