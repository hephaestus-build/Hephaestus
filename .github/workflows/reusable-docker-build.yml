name: Docker Build (Cached)

# Builds every image a run publishes in one job per platform, then merges, attests, signs and tags
# them in one job. Signature and attestation verification name this file as the signer, so the
# signing steps stay in it.

on:
  workflow_call:
    inputs:
      database-artifact:
        description: "Immutable advisory database artifact ID selected by this CI run"
        type: string
        required: true
      scan-images:
        description: "Scan published images here unless the caller requires complete release evidence instead."
        type: boolean
        default: true
      application-server:
        type: boolean
        default: false
        description: "Publish the application-server image, built with Cloud Native Buildpacks from the executable JAR in application-artifact"
      webapp:
        type: boolean
        default: false
        description: "Publish the webapp image (a docker/docker-bake.hcl target)"
      agent-pi:
        type: boolean
        default: false
        description: "Publish the agent-pi image (a docker/docker-bake.hcl target)"
      postgres:
        type: boolean
        default: false
        description: "Publish the postgres image (a docker/docker-bake.hcl target)"
      application-artifact:
        type: string
        required: false
        default: ""
        description: "Artifact holding the executable JAR when images includes application-server"
      project-descriptor:
        type: string
        required: false
        default: ""
        description: "Buildpacks project descriptor (builder, buildpacks, build environment) for application-server"
      run-image:
        type: string
        required: false
        default: ""
        description: "Digest-pinned run image for application-server"
      registry:
        type: string
        default: "ghcr.io"
        description: "Container registry"
      publish:
        # No default: whether a build may write to the registry is not a decision to make silently
        # on a caller's behalf. cicd.yml derives it once, for every image build in the run.
        type: boolean
        required: true
        description: "Publish, attest, sign, and scan the images; false builds them locally without registry writes"
      platforms:
        # No default, for the same reason as publish: cicd.yml decides it once for every image build.
        type: string
        required: true
        description: 'JSON list of the platforms to build, merge into the index, and scan, such as ["linux/amd64"]'
      reuse-run:
        type: string
        required: false
        default: ""
        description: "Successful merge-queue run whose verified images of this commit a push reuses instead of building"
      reuse-images:
        type: string
        required: false
        default: "[]"
        description: "JSON list of the images reuse-run published; only these are reused"
    outputs:
      application-server-digest:
        description: "Published application-server image index digest"
        value: ${{ jobs.merge.outputs.application-server-digest }}
      webapp-digest:
        description: "Published webapp image index digest"
        value: ${{ jobs.merge.outputs.webapp-digest }}
      agent-pi-digest:
        description: "Published agent-pi image index digest"
        value: ${{ jobs.merge.outputs.agent-pi-digest }}
      postgres-digest:
        description: "Published postgres image index digest"
        value: ${{ jobs.merge.outputs.postgres-digest }}

permissions: {}

env:
  # Every image this workflow can publish: the one list that each per-image input, check and step
  # follows. Each job selects the images whose input is true.
  IMAGE_NAMES: '["application-server","webapp","agent-pi","postgres"]'
  INPUTS: ${{ toJSON(inputs) }}
  # Every tag is guarded on the event that started the run, so a consumer can derive from its own
  # event which tag exists. The commit tag is the one every consumer resolves through: `github.sha`
  # is the commit a push, dispatch or merge group built, and a pull request uses its head commit
  # because `github.sha` there is a merge commit no other run can name.
  STANDARD_IMAGE_TAGS: |
    type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'push' }}
    type=raw,value=${{ format('ci-{0}', github.run_number) }},enable=${{ github.event_name == 'push' }}
    type=raw,value=${{ github.sha }},enable=${{ github.event_name != 'pull_request' }}
    type=raw,value=${{ github.event.pull_request.head.sha }},enable=${{ github.event_name == 'pull_request' }}
    type=raw,value=${{ format('pr-{0}', github.event.number) }},enable=${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.platform }} images
    # Builds every selected image that the push does not reuse from the merge queue.
    if: >-
      ${{ !cancelled() && (
        (inputs.application-server && !contains(fromJSON(inputs.reuse-images), 'application-server')) ||
        (inputs.webapp && !contains(fromJSON(inputs.reuse-images), 'webapp')) ||
        (inputs.agent-pi && !contains(fromJSON(inputs.reuse-images), 'agent-pi')) ||
        (inputs.postgres && !contains(fromJSON(inputs.reuse-images), 'postgres'))) }}
    strategy:
      # Each platform scans in its own build, so one platform's refusal must not cancel the other's
      # scan and evidence. A broken build therefore lets its sibling finish; the merge still waits
      # for every build to succeed.
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    timeout-minutes: 45
    # Each platform builds natively on its own runner; no emulation.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Buildpacks use the Docker daemon directly; the Dockerfile images use this BuildKit builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      # Caller-selected registry, not GHCR-only; see ci-cd.mdx § Shared setup actions.
      - name: Log in to Container Registry
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images this job builds: every selected one, less those the push reuses.
      - name: Plan the build
        id: prep
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          REUSE_IMAGES: ${{ inputs.reuse-images }}
        run: |
          set -euo pipefail
          platform=$MATRIX_PLATFORM
          echo "platform_pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          images=$(jq -cn --argjson names "$IMAGE_NAMES" --argjson inputs "$INPUTS" --argjson reuse "$REUSE_IMAGES" \
            '[$names[] | select($inputs[.] == true) | select(. as $image | $reuse | index($image) | not)]')
          jq -e 'length > 0' <<< "$images" >/dev/null
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "bake-targets=$(jq -r '[.[] | select(. != "application-server")] | join(",")' <<< "$images")" >> "$GITHUB_OUTPUT"

      # Each produces the standard OCI labels for its bake target; only the version label reads the
      # tag: the commit, which a merge group and its push share.
      - name: Extract webapp metadata
        id: meta-webapp
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/hephaestus-build/webapp
          tags: type=raw,value=${{ github.event.pull_request.head.sha || github.sha }}
          bake-target: webapp-metadata

      - name: Extract agent-pi metadata
        id: meta-agent-pi
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/hephaestus-build/agent-pi
          tags: type=raw,value=${{ github.event.pull_request.head.sha || github.sha }}
          bake-target: agent-pi-metadata

      - name: Extract postgres metadata
        id: meta-postgres
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/hephaestus-build/postgres
          tags: type=raw,value=${{ github.event.pull_request.head.sha || github.sha }}
          bake-target: postgres-metadata

      # One BuildKit invocation builds the Dockerfile images in parallel and pushes each by digest.
      - name: Build and push the Dockerfile images
        id: bake
        if: steps.prep.outputs.bake-targets != ''
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          REGISTRY: ${{ inputs.registry }}
          PLATFORM_PAIR: ${{ steps.prep.outputs.platform_pair }}
          PUBLISH: ${{ inputs.publish }}
          # A push reuses the images its merge group built, so the merge group keeps the cache warm.
          WRITE_CACHE: ${{ github.ref == 'refs/heads/main' || github.event_name == 'merge_group' }}
          SOURCE_COMMIT: ${{ github.sha }}
          # Use the PR source branch; ref_name identifies GitHub's synthetic merge ref on pull
          # requests. A merge group builds the image its push to the default branch reuses, so it
          # names that branch.
          COOLIFY_BRANCH: ${{ github.head_ref || (github.event_name == 'merge_group' && github.event.repository.default_branch) || github.ref_name }}
        with:
          source: .
          files: |
            ./docker/docker-bake.hcl
            ${{ steps.meta-webapp.outputs.bake-file-labels }}
            ${{ steps.meta-agent-pi.outputs.bake-file-labels }}
            ${{ steps.meta-postgres.outputs.bake-file-labels }}
          targets: ${{ steps.prep.outputs.bake-targets }}
          set: "*.platform=${{ matrix.platform }}"

      # A failed Dockerfile build does not stop the App Server image from building and reporting.
      - name: Set up pack
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && contains(fromJSON(steps.prep.outputs.images), 'application-server') }}
        uses: buildpacks/github-actions/setup-pack@af8c06ccd592e27001cbf78083dcc9b47aa6652a # v6.1.1
        with:
          # renovate: datasource=github-releases depName=buildpacks/pack
          pack-version: 0.40.9

      - name: Download the executable JAR
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && contains(fromJSON(steps.prep.outputs.images), 'application-server') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.application-artifact }}
          path: ${{ runner.temp }}/application

      - uses: ./.github/actions/setup-toolchain
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && (contains(fromJSON(steps.prep.outputs.images), 'application-server') || (inputs.publish && inputs.scan-images)) }}
        with:
          install: "none"

      # --trust-builder lets one creator container run every lifecycle phase; that is only safe
      # because the builder is pinned by digest.
      - name: Build with Buildpacks and CDS
        id: build-buildpacks
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && contains(fromJSON(steps.prep.outputs.images), 'application-server') }}
        env:
          APPLICATION_DIRECTORY: ${{ runner.temp }}/application
          INPUT_REGISTRY: ${{ inputs.registry }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          PLATFORM_PAIR: ${{ steps.prep.outputs.platform_pair }}
          PROJECT_DESCRIPTOR: ${{ inputs.project-descriptor }}
          PUBLISH: ${{ inputs.publish }}
          RUN_IMAGE: ${{ inputs.run-image }}
        run: |
          set -euo pipefail
          [[ -n "$PROJECT_DESCRIPTOR" && -n "$RUN_IMAGE" ]]
          mapfile -t jars < <(find "$APPLICATION_DIRECTORY" -name 'hephaestus-application-*.jar')
          (( ${#jars[@]} == 1 ))
          PER_ARCH_TAG="$INPUT_REGISTRY/hephaestus-build/application-server:ci-$GITHUB_RUN_ID-$PLATFORM_PAIR"
          if [ "$PUBLISH" != true ]; then
            # Nothing downstream of a build without registry writes reads a digest.
            pack build "$PER_ARCH_TAG" --path "${jars[0]}" --descriptor "$PROJECT_DESCRIPTOR" \
              --run-image "$RUN_IMAGE" --platform "$MATRIX_PLATFORM" --trust-builder 2>&1 | node scripts/summarize-buildpack-log.ts "$RUNNER_TEMP/buildpacks.log"
            exit 0
          fi
          pack build "$PER_ARCH_TAG" --path "${jars[0]}" --descriptor "$PROJECT_DESCRIPTOR" \
            --run-image "$RUN_IMAGE" --platform "$MATRIX_PLATFORM" --publish --trust-builder 2>&1 | node scripts/summarize-buildpack-log.ts "$RUNNER_TEMP/buildpacks.log"
          # Buildpacks may wrap one platform in an index; capture its manifest, not the wrapper.
          RAW=$(docker buildx imagetools inspect "$PER_ARCH_TAG" --format '{{json .Manifest}}')
          if echo "$RAW" | jq -e '.manifests' >/dev/null 2>&1; then
            ARCH=$(echo "$MATRIX_PLATFORM" | awk -F/ '{print $2}')
            DIGEST=$(echo "$RAW" | jq -r --arg arch "$ARCH" \
              '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux") | .digest')
          else
            DIGEST=$(echo "$RAW" | jq -r '.digest')
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Refusing to publish: per-arch digest is not a sha256:<64 hex> (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Per-arch digest: $DIGEST"

      - name: Retain complete buildpack diagnostics
        if: ${{ always() && steps.prep.outcome == 'success' && contains(fromJSON(steps.prep.outputs.images), 'application-server') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildpacks-log-${{ steps.prep.outputs.platform_pair }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buildpacks.log
          retention-days: 14
          if-no-files-found: warn

      # One directory per image and platform, so the merge job can assemble each index from one
      # artifact per platform. It records every image that built, so each can be scanned, and fails
      # when one did not; the upload below hands the digests over only when every image built.
      - name: Export digests
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && inputs.publish }}
        env:
          IMAGES: ${{ steps.prep.outputs.images }}
          BAKE_METADATA: ${{ steps.bake.outputs.metadata || '{}' }}
          BUILDPACKS_DIGEST: ${{ steps.build-buildpacks.outputs.digest }}
          PLATFORM_PAIR: ${{ steps.prep.outputs.platform_pair }}
        run: |
          set -euo pipefail
          missing=()
          for name in $(jq -r '.[]' <<< "$IMAGES"); do
            if [ "$name" = application-server ]; then
              digest=$BUILDPACKS_DIGEST
            else
              digest=$(jq -r --arg name "$name" '.[$name]["containerimage.digest"] // empty' <<< "$BAKE_METADATA")
            fi
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::No digest produced for $name (got: ${digest:-<empty>})"
              missing+=("$name")
              continue
            fi
            mkdir -p "$RUNNER_TEMP/digests/$name/$PLATFORM_PAIR"
            touch "$RUNNER_TEMP/digests/$name/$PLATFORM_PAIR/${digest#sha256:}"
          done
          (( ${#missing[@]} == 0 ))

      # The scan runs on the runner that built the platform, before its digest reaches the merge, so
      # a refused image never enters an index. Re-running the job scans a fresh build of the platform.
      - uses: ./.github/actions/setup-release-security-tools
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && inputs.publish && inputs.scan-images }}
        with:
          install-syft: "true"

      # A blocking gate inherits Trivy's database availability as a hard dependency, so the
      # retries and the mirror fallback live in one action rather than in each caller.
      - uses: ./.github/actions/download-trivy-db
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && inputs.publish && inputs.scan-images }}
        with:
          database-artifact: ${{ inputs.database-artifact }}

      # Trivy and Syft pull through the job's registry login, so the package-writing token is not
      # also handed to them as environment variables. A scan or policy failure of one image does not
      # stop the scans of the others; a subject that cannot be resolved stops the step at once.
      - name: Enforce the release vulnerability policy
        id: scan
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && inputs.publish && inputs.scan-images }}
        env:
          IMAGES: ${{ steps.prep.outputs.images }}
          REGISTRY: ${{ inputs.registry }}
          SCAN_PLATFORM: ${{ matrix.platform }}
          PLATFORM_PAIR: ${{ steps.prep.outputs.platform_pair }}
        run: |
          set -euo pipefail
          mkdir -p reports
          refused=()
          for name in $(jq -r '.[]' <<< "$IMAGES"); do
            # An image that did not build has no digest; its build step already failed the job.
            if [ ! -d "$RUNNER_TEMP/digests/$name/$PLATFORM_PAIR" ]; then
              echo "::notice::$name did not build, so it has no scan"
              continue
            fi
            subject="$RUNNER_TEMP/subject-$name"
            : > "$subject"
            GITHUB_OUTPUT="$subject" DIGEST_DIRECTORY="$RUNNER_TEMP/digests/$name/$PLATFORM_PAIR" \
              IMAGE_REPOSITORY="$REGISTRY/hephaestus-build/$name" INPUT_IMAGE_NAME="hephaestus-build/$name" \
              node scripts/resolve-image-scan-subject.ts
            image=$(sed -n 's/^image=//p' "$subject")
            digest=$(sed -n 's/^digest=//p' "$subject")
            stem=$(sed -n 's/^report-stem=//p' "$subject")
            repository="$REGISTRY/hephaestus-build/$name"
            if ! { trivy image --skip-db-update --scanners vuln --format json \
                     --output "reports/$stem.json" "$repository@$digest" &&
                   node scripts/check-release-vulnerabilities.ts "$image" "$SCAN_PLATFORM" "$digest" \
                     "$repository" "reports/$stem.json" security/vulnerability-policy.json \
                     "reports/$stem.policy.json"; }; then
              refused+=("$name")
            fi
          done
          if (( ${#refused[@]} > 0 )); then
            echo "::error::The vulnerability scan or policy failed for: ${refused[*]}"
            exit 1
          fi

      # The policy results name the CVEs; the gate's exit status alone cannot.
      - name: Upload the vulnerability policy results
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per attempt, so re-running a refused build can record its result again.
          name: vulnerability-policy-${{ steps.prep.outputs.platform_pair }}-${{ github.run_attempt }}
          path: reports
          if-no-files-found: warn
          retention-days: 7

      - name: Upload digests
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.prep.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create manifests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: build
    # A skipped build means the push reuses every selected image from the merge queue.
    if: ${{ inputs.publish && !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      INPUTS_REGISTRY: ${{ inputs.registry }}
    outputs:
      application-server-digest: ${{ steps.digest.outputs.application-server }}
      webapp-digest: ${{ steps.digest.outputs.webapp }}
      agent-pi-digest: ${{ steps.digest.outputs.agent-pi }}
      postgres-digest: ${{ steps.digest.outputs.postgres }}
    steps:
      # IMAGES: every selected image. BUILT: those this run built. REUSED: those the push reuses.
      - name: Select the images
        id: prep
        env:
          REUSE_IMAGES: ${{ inputs.reuse-images }}
        run: |
          set -euo pipefail
          images=$(jq -cn --argjson names "$IMAGE_NAMES" --argjson inputs "$INPUTS" '[$names[] | select($inputs[.] == true)]')
          jq -e 'length > 0' <<< "$images" >/dev/null
          built=$(jq -c --argjson reuse "$REUSE_IMAGES" '[.[] | select(. as $image | $reuse | index($image) | not)]' <<< "$images")
          reused=$(jq -c --argjson reuse "$REUSE_IMAGES" '[.[] | select(. as $image | $reuse | index($image))]' <<< "$images")
          {
            echo "IMAGES=$images"
            echo "BUILT=$built"
            echo "REUSED=$reused"
          } >> "$GITHUB_ENV"
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Download digests
        if: steps.prep.outputs.built != '[]'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # Caller-selected registry, not GHCR-only; see ci-cd.mdx § Shared setup actions.
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker

      - name: Install Cosign
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.4

      # The merge queue squashes, so a push to the default branch carries the commit its merge group
      # already built, signed, attested and scanned. That image is the one that was tested, so it
      # ships only once its signature and provenance prove the successful queue run built it for this
      # commit and these platforms. An image that fails any check fails the push: `main` never ships
      # an image the merge group did not test.
      - name: Verify the merge-queue images
        id: reuse
        if: steps.prep.outputs.reused != '[]'
        env:
          REGISTRY: ${{ inputs.registry }}
          COMMIT: ${{ github.sha }}
          QUEUE_RUN: ${{ inputs.reuse-run }}
          PLATFORMS: ${{ inputs.platforms }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Called in a command substitution, which does not inherit `set -e`, so every check returns.
          verify() {
            local image="$REGISTRY/hephaestus-build/$1" digest reference
            [[ "$QUEUE_RUN" =~ ^[0-9]+$ ]] || return 1
            digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$image:$COMMIT" | jq -er .digest) || return 1
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
            reference="$image@$digest"
            docker buildx imagetools inspect "$reference" --raw |
              jq -e --argjson platforms "$PLATFORMS" '
                [.manifests[] | select(.platform.os != "unknown" or .platform.architecture != "unknown")
                  | .platform.os + "/" + .platform.architecture] | sort == ($platforms | sort)' >/dev/null || return 1
            cosign verify "$reference" \
              --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/\\.github/workflows/reusable-docker-build\\.yml@refs/heads/gh-readonly-queue/$DEFAULT_BRANCH/" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-repository "${{ github.repository }}" \
              --certificate-github-workflow-trigger merge_group \
              --certificate-github-workflow-sha "$COMMIT" \
              > /dev/null || return 1
            gh attestation verify "oci://$reference" --bundle-from-oci --owner "${{ github.repository_owner }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/reusable-docker-build.yml" \
              --source-digest "$COMMIT" --format json |
              jq -e --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/$QUEUE_RUN/" '
                length > 0 and all(.[]; .verificationResult.signature.certificate.runInvocationURI | startswith($run))' >/dev/null || return 1
            echo "$digest"
          }
          digests='{}'
          for name in $(jq -r '.[]' <<< "$REUSED"); do
            if ! digest=$(verify "$name"); then
              echo "::error::$name: the merge-queue image did not verify, so this push publishes nothing"
              exit 1
            fi
            digests=$(jq -c --arg name "$name" --arg digest "$digest" '. + {($name): $digest}' <<< "$digests")
          done
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

      # One tag set per repository; the publish step selects each image's own tags.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ inputs.registry }}/hephaestus-build/application-server
            ${{ inputs.registry }}/hephaestus-build/webapp
            ${{ inputs.registry }}/hephaestus-build/agent-pi
            ${{ inputs.registry }}/hephaestus-build/postgres
          tags: ${{ env.STANDARD_IMAGE_TAGS }}

      - name: Create manifests and push
        if: steps.prep.outputs.built != '[]'
        working-directory: ${{ runner.temp }}/digests
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          mapfile -t platforms < <(jq -er '.[]' <<< "$PLATFORMS")
          (( ${#platforms[@]} > 0 ))
          for name in $(jq -r '.[]' <<< "$BUILT"); do
            jq -en --arg name "$name" --argjson names "$IMAGE_NAMES" '$names | index($name)' >/dev/null
            repository="$INPUTS_REGISTRY/hephaestus-build/$name"
            entries=("$name"/*)
            (( ${#entries[@]} == ${#platforms[@]} )) || exit 1
            args=(--tag "$repository:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-index" --metadata-file "$RUNNER_TEMP/merged-$name.json")
            expected='[]'
            for platform in "${platforms[@]}"; do
              [[ "$platform" =~ ^linux/(amd64|arm64)$ ]] || exit 1
              arch="${platform#linux/}"
              files=("$name/linux-$arch"/*)
              (( ${#files[@]} == 1 )) || exit 1
              [[ -f "${files[0]}" && ! -L "${files[0]}" ]] || exit 1
              digest="${files[0]##*/}"
              [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
              reference="$repository@sha256:$digest"
              raw=$(docker buildx imagetools inspect "$reference" --raw)
              leaf=$(jq -er --arg arch "$arch" --arg digest "sha256:$digest" '
                if has("manifests") then
                  [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
                  | if length == 1 then .[0] else error("expected one platform leaf") end
                else $digest end' <<< "$raw")
              [[ "$leaf" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
              expected=$(jq -cn --argjson previous "$expected" --arg platform "linux/$arch" --arg digest "$leaf" \
                '$previous + [{platform: $platform, digest: $digest}]')
              args+=("$reference")
            done
            docker buildx imagetools create "${args[@]}"
            merged=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/merged-$name.json")
            [[ "$merged" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
            # Each build scanned the digest it handed over in these artifacts.
            # Refuse publication if the index's real platform leaves differ from those scanned subjects.
            docker buildx imagetools inspect "$repository@$merged" --raw |
              jq -e --argjson expected "$expected" '
                [.manifests[] | select(.platform.os != "unknown" or .platform.architecture != "unknown")
                  | {platform: (.platform.os + "/" + .platform.architecture), digest: .digest}]
                | sort_by(.platform) == ($expected | sort_by(.platform))' >/dev/null
          done

      - name: Capture manifest digests
        id: digest
        env:
          REUSED_DIGESTS: ${{ steps.reuse.outputs.digests || '{}' }}
        run: |
          set -euo pipefail
          for name in $(jq -r '.[]' <<< "$IMAGES"); do
            digest=$(jq -r --arg name "$name" '.[$name] // empty' <<< "$REUSED_DIGESTS")
            if [ -z "$digest" ]; then
              digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/merged-$name.json")
            fi
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Refusing to publish $name: manifest digest is not a sha256:<64 lowercase hex> value (got: ${digest:-<empty>})"
              exit 1
            fi
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
            echo "$name multi-arch manifest digest: $digest"
          done

      # A reused image keeps the provenance of the queue run that built it. The action pushes one
      # registry attestation per call, so each image has its own step.
      - name: Attest the application-server image
        if: contains(fromJSON(steps.prep.outputs.built), 'application-server')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-name: ${{ inputs.registry }}/hephaestus-build/application-server
          subject-digest: ${{ steps.digest.outputs.application-server }}
          push-to-registry: true

      - name: Attest the webapp image
        if: contains(fromJSON(steps.prep.outputs.built), 'webapp')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-name: ${{ inputs.registry }}/hephaestus-build/webapp
          subject-digest: ${{ steps.digest.outputs.webapp }}
          push-to-registry: true

      - name: Attest the agent-pi image
        if: contains(fromJSON(steps.prep.outputs.built), 'agent-pi')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-name: ${{ inputs.registry }}/hephaestus-build/agent-pi
          subject-digest: ${{ steps.digest.outputs.agent-pi }}
          push-to-registry: true

      - name: Attest the postgres image
        if: contains(fromJSON(steps.prep.outputs.built), 'postgres')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-name: ${{ inputs.registry }}/hephaestus-build/postgres
          subject-digest: ${{ steps.digest.outputs.postgres }}
          push-to-registry: true

      # --recursive: sign each child manifest so per-platform verify works. A reused image is signed
      # again here, because the release accepts only this workflow's default-branch identity.
      - name: Sign images with cosign
        env:
          DIGESTS: ${{ toJSON(steps.digest.outputs) }}
        run: |
          set -euo pipefail
          for name in $(jq -r '.[]' <<< "$IMAGES"); do
            digest=$(jq -er --arg name "$name" '.[$name]' <<< "$DIGESTS")
            cosign sign --yes --recursive "$INPUTS_REGISTRY/hephaestus-build/$name@$digest"
          done

      # Intentionally inline in this checkout-free registry job; see ci-cd.mdx § Shared setup actions.
      - name: Verify signatures + attestations
        env:
          DIGESTS: ${{ toJSON(steps.digest.outputs) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in $(jq -r '.[]' <<< "$IMAGES"); do
            reference="$INPUTS_REGISTRY/hephaestus-build/$name@$(jq -er --arg name "$name" '.[$name]' <<< "$DIGESTS")"
            cosign verify "$reference" \
              --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/reusable-docker-build\.yml@' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-repository "${{ github.repository }}" \
              > /dev/null
            gh attestation verify "oci://$reference" --bundle-from-oci --owner "${{ github.repository_owner }}"
          done

      - name: Publish verified image tags
        env:
          DIGESTS: ${{ toJSON(steps.digest.outputs) }}
        run: |
          set -euo pipefail
          for name in $(jq -r '.[]' <<< "$IMAGES"); do
            repository="$INPUTS_REGISTRY/hephaestus-build/$name"
            reference="$repository@$(jq -er --arg name "$name" '.[$name]' <<< "$DIGESTS")"
            tags=$(jq -er --arg prefix "$repository:" '.tags[] | select(startswith($prefix))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            args=()
            while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$tags"
            docker buildx imagetools create --prefer-index=false "${args[@]}" \
              --metadata-file "$RUNNER_TEMP/published-$name.json" "$reference"
            published=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/published-$name.json")
            [[ "$published" = "${reference##*@}" ]]
          done
