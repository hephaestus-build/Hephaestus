name: Docker Build (Cached)

on:
  workflow_call:
    inputs:
      database-artifact:
        description: "Immutable advisory database artifact ID selected by this CI run"
        type: string
        required: true
      scan-images:
        description: "Scan published images here unless the caller requires complete release evidence instead."
        type: boolean
        default: true
      image-name:
        type: string
        required: true
        description: "Full image name (e.g., hephaestus-build/webapp)"
      docker-file:
        type: string
        required: false
        default: ""
        description: "Path to Dockerfile (required unless use-buildpacks=true)"
      docker-context:
        type: string
        default: "."
        description: "Docker build context"
      use-buildpacks:
        type: boolean
        required: false
        default: false
        description: "Build with Cloud Native Buildpacks from the executable JAR in application-artifact instead of a Dockerfile"
      application-artifact:
        type: string
        required: false
        default: ""
        description: "Artifact holding the executable JAR when use-buildpacks=true"
      project-descriptor:
        type: string
        required: false
        default: ""
        description: "Buildpacks project descriptor (builder, buildpacks, build environment) when use-buildpacks=true"
      run-image:
        type: string
        required: false
        default: ""
        description: "Digest-pinned run image when use-buildpacks=true"
      registry:
        type: string
        default: "ghcr.io"
        description: "Container registry"
      labels:
        type: string
        required: false
        description: "OCI labels for Dockerfile builds; the buildpacks path applies none"
      build-args:
        type: string
        required: false
        description: "Build arguments"
      publish:
        # No default: whether a build may write to the registry is not a decision to make silently
        # on a caller's behalf. cicd.yml derives it once, for every image build in the run.
        type: boolean
        required: true
        description: "Publish, attest, sign, and scan the image; false builds it locally without registry writes"
      platforms:
        # No default, for the same reason as publish: cicd.yml decides it once for every image build.
        type: string
        required: true
        description: 'JSON list of the platforms to build, merge into the index, and scan, such as ["linux/amd64"]'
      reuse-run:
        type: string
        required: false
        default: ""
        description: "Successful merge-queue run whose verified image of this commit a push reuses instead of building"
    outputs:
      manifest-digest:
        description: "Published image index digest"
        value: ${{ jobs.merge.outputs.manifest-digest }}

permissions: {}

env:
  # Every tag is guarded on the event that started the run, so a consumer can derive from its own
  # event which tag exists. The commit tag is the one every consumer resolves through: `github.sha`
  # is the commit a push, dispatch or merge group built, and a pull request uses its head commit
  # because `github.sha` there is a merge commit no other run can name.
  STANDARD_IMAGE_TAGS: |
    type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'push' }}
    type=raw,value=${{ format('ci-{0}', github.run_number) }},enable=${{ github.event_name == 'push' }}
    type=raw,value=${{ github.sha }},enable=${{ github.event_name != 'pull_request' }}
    type=raw,value=${{ github.event.pull_request.head.sha }},enable=${{ github.event_name == 'pull_request' }}
    type=raw,value=${{ format('pr-{0}', github.event.number) }},enable=${{ github.event_name == 'pull_request' }}

jobs:
  # The merge queue squashes, so a push to the default branch carries the commit its merge group
  # already built, signed, attested and scanned. That image is the one that was tested, so it ships
  # once its signature and provenance prove the successful queue run built it for this commit and
  # these platforms. Anything less leaves the digest empty, and the image is built instead.
  reuse:
    name: Reuse merge-queue image
    if: inputs.publish && inputs.reuse-run != ''
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.4

      # Caller-selected registry, not GHCR-only; see ci-cd.mdx § Shared setup actions.
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the merge-queue image
        id: verify
        continue-on-error: true
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
          COMMIT: ${{ github.sha }}
          QUEUE_RUN: ${{ inputs.reuse-run }}
          PLATFORMS: ${{ inputs.platforms }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$QUEUE_RUN" =~ ^[0-9]+$ ]]
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$COMMIT" | jq -er .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          reference="$IMAGE@$digest"
          docker buildx imagetools inspect "$reference" --raw |
            jq -e --argjson platforms "$PLATFORMS" '
              [.manifests[] | select(.platform.os != "unknown" or .platform.architecture != "unknown")
                | .platform.os + "/" + .platform.architecture] | sort == ($platforms | sort)' >/dev/null
          cosign verify "$reference" \
            --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/\\.github/workflows/reusable-docker-build\\.yml@refs/heads/gh-readonly-queue/$DEFAULT_BRANCH/" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository "${{ github.repository }}" \
            --certificate-github-workflow-trigger merge_group \
            --certificate-github-workflow-sha "$COMMIT" \
            > /dev/null
          gh attestation verify "oci://$reference" --bundle-from-oci --owner "${{ github.repository_owner }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/reusable-docker-build.yml" \
            --source-digest "$COMMIT" --format json |
            jq -e --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/$QUEUE_RUN/" '
              length > 0 and all(.[]; .verificationResult.signature.certificate.runInvocationURI | startswith($run))' >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} Docker Image
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.digest == '' }}
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    timeout-minutes: 45
    # Each platform builds natively on its own runner; no emulation.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: ${{ inputs.use-buildpacks && 'docker' || 'docker-container' }}

      # Caller-selected registry, not GHCR-only; see ci-cd.mdx § Shared setup actions.
      - name: Log in to Container Registry
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          # Only the version label reads it: the commit, which a merge group and its push share.
          tags: type=raw,value=${{ github.event.pull_request.head.sha || github.sha }}
          labels: ${{ inputs.labels }}

      - name: Prepare platform pair
        id: prep
        run: |
          platform=$MATRIX_PLATFORM
          echo "platform_pair=${platform//\//-}" >> $GITHUB_OUTPUT
          image="$INPUT_IMAGE_NAME"
          echo "image_name=${image//\//-}" >> $GITHUB_OUTPUT
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          MATRIX_PLATFORM: ${{ matrix.platform }}

      - name: Build and push (Dockerfile)
        id: build
        if: ${{ !inputs.use-buildpacks }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-file }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ inputs.publish }}
          outputs: ${{ inputs.publish && format('type=image,"name={0}/{1}",push-by-digest=true,name-canonical=true,push=true', inputs.registry, inputs.image-name) || '' }}
          # A refreshed package stage does not invalidate cached descendants in BuildKit.
          no-cache-filters: os-packages,runtime
          cache-from: |
            type=registry,ref=${{ inputs.registry }}/${{ inputs.image-name }}:cache-main-${{ steps.prep.outputs.platform_pair }}
          # A push reuses the images its merge group built, so the merge group keeps the cache warm.
          cache-to: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && format('type=registry,ref={0}/{1}:cache-main-{2},mode=max', inputs.registry, inputs.image-name, steps.prep.outputs.platform_pair) || '' }}

      - name: Set up pack
        if: inputs.use-buildpacks
        uses: buildpacks/github-actions/setup-pack@af8c06ccd592e27001cbf78083dcc9b47aa6652a # v6.1.1
        with:
          # renovate: datasource=github-releases depName=buildpacks/pack
          pack-version: 0.40.9

      - name: Download the executable JAR
        if: inputs.use-buildpacks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.application-artifact }}
          path: ${{ runner.temp }}/application

      - uses: ./.github/actions/setup-toolchain
        if: inputs.use-buildpacks
        with:
          install: "none"

      # --trust-builder lets one creator container run every lifecycle phase; that is only safe
      # because the builder is pinned by digest.
      - name: Build with Buildpacks and CDS
        id: build-buildpacks
        if: inputs.use-buildpacks
        env:
          APPLICATION_DIRECTORY: ${{ runner.temp }}/application
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          PLATFORM_PAIR: ${{ steps.prep.outputs.platform_pair }}
          PROJECT_DESCRIPTOR: ${{ inputs.project-descriptor }}
          PUBLISH: ${{ inputs.publish }}
          RUN_IMAGE: ${{ inputs.run-image }}
        run: |
          set -euo pipefail
          [[ -n "$PROJECT_DESCRIPTOR" && -n "$RUN_IMAGE" ]]
          mapfile -t jars < <(find "$APPLICATION_DIRECTORY" -name 'hephaestus-application-*.jar')
          (( ${#jars[@]} == 1 ))
          PER_ARCH_TAG="$INPUT_REGISTRY/$INPUT_IMAGE_NAME:ci-$GITHUB_RUN_ID-$PLATFORM_PAIR"
          if [ "$PUBLISH" != true ]; then
            # Nothing downstream of a build without registry writes reads a digest.
            pack build "$PER_ARCH_TAG" --path "${jars[0]}" --descriptor "$PROJECT_DESCRIPTOR" \
              --run-image "$RUN_IMAGE" --platform "$MATRIX_PLATFORM" --trust-builder 2>&1 | node scripts/summarize-buildpack-log.ts "$RUNNER_TEMP/buildpacks.log"
            exit 0
          fi
          pack build "$PER_ARCH_TAG" --path "${jars[0]}" --descriptor "$PROJECT_DESCRIPTOR" \
            --run-image "$RUN_IMAGE" --platform "$MATRIX_PLATFORM" --publish --trust-builder 2>&1 | node scripts/summarize-buildpack-log.ts "$RUNNER_TEMP/buildpacks.log"
          # Buildpacks may wrap one platform in an index; capture its manifest, not the wrapper.
          RAW=$(docker buildx imagetools inspect "$PER_ARCH_TAG" --format '{{json .Manifest}}')
          if echo "$RAW" | jq -e '.manifests' >/dev/null 2>&1; then
            ARCH=$(echo "$MATRIX_PLATFORM" | awk -F/ '{print $2}')
            DIGEST=$(echo "$RAW" | jq -r --arg arch "$ARCH" \
              '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux") | .digest')
          else
            DIGEST=$(echo "$RAW" | jq -r '.digest')
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Refusing to publish: per-arch digest is not a sha256:<64 hex> (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Per-arch digest: $DIGEST"

      - name: Retain complete buildpack diagnostics
        if: ${{ always() && inputs.use-buildpacks }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildpacks-log-${{ steps.prep.outputs.platform_pair }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buildpacks.log
          retention-days: 14
          if-no-files-found: warn

      # The artifact carries its platform directory, because a download extracts one matched
      # artifact into its path but several into one subdirectory each.
      - name: Export digest
        if: inputs.publish
        env:
          DOCKERFILE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILDPACKS_DIGEST: ${{ steps.build-buildpacks.outputs.digest }}
          PLATFORM_PAIR: ${{ steps.prep.outputs.platform_pair }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/$PLATFORM_PAIR"
          digest="${BUILDPACKS_DIGEST:-$DOCKERFILE_DIGEST}"
          if [ -z "$digest" ]; then
            echo "::error::No digest produced by either build path"
            exit 1
          fi
          touch "$RUNNER_TEMP/digests/$PLATFORM_PAIR/${digest#sha256:}"

      - name: Upload digest
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.prep.outputs.image_name }}-${{ steps.prep.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create manifest
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [reuse, build]
    if: ${{ inputs.publish && !cancelled() && (needs.reuse.outputs.digest != '' || needs.build.result == 'success') }}
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      manifest-digest: ${{ steps.digest.outputs.manifest-digest }}
    steps:
      - name: Prepare
        id: prep
        run: |
          image="${INPUTS_IMAGE_NAME}"
          echo "image_name=${image//\//-}" >> $GITHUB_OUTPUT
        env:
          INPUTS_IMAGE_NAME: ${{ inputs.image-name }}

      - name: Download digests
        if: needs.reuse.outputs.digest == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ steps.prep.outputs.image_name }}-*
          merge-multiple: true

      # Caller-selected registry, not GHCR-only; see ci-cd.mdx § Shared setup actions.
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: ${{ env.STANDARD_IMAGE_TAGS }}
          labels: ${{ inputs.labels }}

      - name: Create manifest and push
        if: needs.reuse.outputs.digest == ''
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mapfile -t platforms < <(jq -er '.[]' <<< "$PLATFORMS")
          entries=(*)
          (( ${#platforms[@]} > 0 && ${#entries[@]} == ${#platforms[@]} )) || exit 1
          args=(--tag "$STAGING_IMAGE" --metadata-file "$RUNNER_TEMP/merged-image.json")
          expected='[]'
          for platform in "${platforms[@]}"; do
            [[ "$platform" =~ ^linux/(amd64|arm64)$ ]] || exit 1
            arch="${platform#linux/}"
            files=("linux-$arch"/*)
            (( ${#files[@]} == 1 )) || exit 1
            [[ -f "${files[0]}" && ! -L "${files[0]}" ]] || exit 1
            digest="${files[0]##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            reference="$INPUTS_REGISTRY/$INPUTS_IMAGE_NAME@sha256:$digest"
            raw=$(docker buildx imagetools inspect "$reference" --raw)
            leaf=$(jq -er --arg arch "$arch" --arg digest "sha256:$digest" '
              if has("manifests") then
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
                | if length == 1 then .[0] else error("expected one platform leaf") end
              else $digest end' <<< "$raw")
            [[ "$leaf" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
            expected=$(jq -cn --argjson previous "$expected" --arg platform "linux/$arch" --arg digest "$leaf" \
              '$previous + [{platform: $platform, digest: $digest}]')
            args+=("$reference")
          done
          docker buildx imagetools create "${args[@]}"
          merged=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/merged-image.json")
          [[ "$merged" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          # The scans use these build artifacts while this job assembles and verifies the index.
          # Refuse publication if its real platform leaves differ from the scanned subjects.
          docker buildx imagetools inspect "$INPUTS_REGISTRY/$INPUTS_IMAGE_NAME@$merged" --raw |
            jq -e --argjson expected "$expected" '
              [.manifests[] | select(.platform.os != "unknown" or .platform.architecture != "unknown")
                | {platform: (.platform.os + "/" + .platform.architecture), digest: .digest}]
              | sort_by(.platform) == ($expected | sort_by(.platform))' >/dev/null
        env:
          INPUTS_REGISTRY: ${{ inputs.registry }}
          INPUTS_IMAGE_NAME: ${{ inputs.image-name }}
          PLATFORMS: ${{ inputs.platforms }}
          STAGING_IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}:ci-${{ github.run_id }}-${{ github.run_attempt }}-index

      - name: Capture manifest digest
        id: digest
        env:
          REUSED_DIGEST: ${{ needs.reuse.outputs.digest }}
        run: |
          set -euo pipefail
          DIGEST="${REUSED_DIGEST:-}"
          if [ -z "$DIGEST" ]; then
            DIGEST=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/merged-image.json")
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Refusing to publish: manifest digest is not a sha256:<64 lowercase hex> value (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "manifest-digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Multi-arch manifest digest: $DIGEST"

      # A reused image keeps the provenance of the queue run that built it.
      - name: Generate build provenance attestation
        if: needs.reuse.outputs.digest == ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.digest.outputs.manifest-digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.4

      # --recursive: sign each child manifest so per-platform verify works. A reused image is signed
      # again here, because the release accepts only this workflow's default-branch identity.
      - name: Sign image with cosign
        env:
          IMAGE_REF: ${{ inputs.registry }}/${{ inputs.image-name }}@${{ steps.digest.outputs.manifest-digest }}
        run: |
          cosign sign --yes --recursive "$IMAGE_REF"

      # Intentionally inline in this checkout-free registry job; see ci-cd.mdx § Shared setup actions.
      - name: Verify signature + attestation
        env:
          IMAGE_REF: ${{ inputs.registry }}/${{ inputs.image-name }}@${{ steps.digest.outputs.manifest-digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/reusable-docker-build\.yml@' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository "${{ github.repository }}" \
            > /dev/null
          gh attestation verify "oci://$IMAGE_REF" --bundle-from-oci --owner "${{ github.repository_owner }}"

      - name: Publish verified image tags
        env:
          IMAGE_REF: ${{ inputs.registry }}/${{ inputs.image-name }}@${{ steps.digest.outputs.manifest-digest }}
        run: |
          set -euo pipefail
          tags=$(jq -er '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$tags"
          docker buildx imagetools create --prefer-index=false "${args[@]}" \
            --metadata-file "$RUNNER_TEMP/published-image.json" "$IMAGE_REF"
          PUBLISHED_DIGEST=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/published-image.json")
          [[ "$PUBLISHED_DIGEST" = "${IMAGE_REF##*@}" ]]

  scan:
    name: Scan ${{ matrix.platform }} Image
    needs: build
    if: ${{ inputs.scan-images && inputs.publish && !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      SCAN_PLATFORM: ${{ matrix.platform }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"

      - uses: ./.github/actions/setup-release-security-tools
        with:
          install-syft: "true"

      # Caller-selected registry, not GHCR-only; see ci-cd.mdx § Shared setup actions.
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare digest artifact name
        id: prep
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          echo "image_name=${INPUT_IMAGE_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "platform_pair=${SCAN_PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Download platform digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ steps.prep.outputs.image_name }}-${{ steps.prep.outputs.platform_pair }}
          path: ${{ runner.temp }}/scan-digest

      - name: Resolve the platform subject
        id: subject
        env:
          DIGEST_DIRECTORY: ${{ runner.temp }}/scan-digest/${{ steps.prep.outputs.platform_pair }}
          IMAGE_REPOSITORY: ${{ inputs.registry }}/${{ inputs.image-name }}
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        run: node scripts/resolve-image-scan-subject.ts

      # A blocking gate inherits Trivy's database availability as a hard dependency, so the
      # retries and the mirror fallback live in one action rather than in each caller.
      - uses: ./.github/actions/download-trivy-db
        with:
          database-artifact: ${{ inputs.database-artifact }}

      - name: Enforce the release vulnerability policy
        env:
          IMAGE: ${{ steps.subject.outputs.image }}
          REPOSITORY: ${{ inputs.registry }}/${{ inputs.image-name }}
          SUBJECT_DIGEST: ${{ steps.subject.outputs.digest }}
          REPORT_STEM: ${{ steps.subject.outputs.report-stem }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p reports
          trivy image --skip-db-update --scanners vuln --format json \
            --output "reports/$REPORT_STEM.json" "$REPOSITORY@$SUBJECT_DIGEST"
          node scripts/check-release-vulnerabilities.ts "$IMAGE" "$SCAN_PLATFORM" "$SUBJECT_DIGEST" \
            "$REPOSITORY" "reports/$REPORT_STEM.json" security/vulnerability-policy.json \
            "reports/$REPORT_STEM.policy.json"

      # The policy result names the CVEs; the gate's exit status alone cannot.
      - name: Upload the vulnerability policy result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-policy-${{ steps.subject.outputs.report-stem }}
          path: reports
          if-no-files-found: warn
          retention-days: 7
