name: Validate Compose

# Shared Compose files can break either the reference or self-hosted stack, so
# render both configurations.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: "Render compose stacks"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      COMPOSE_ENV_FILES: .env,smoke-lock.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - name: Render the self-hosted stack
        working-directory: docker/self-host
        run: |
          set -euo pipefail
          node ../../scripts/prepare-host-smoke-env.ts
          node ../../scripts/prepare-smoke-lock.ts
          docker compose config > /dev/null
          echo "Rendered services:"
          docker compose config --services | sort

      - name: Fail on unset variables
        working-directory: docker/self-host
        run: |
          set -euo pipefail
          # `config` warns rather than fails when .env omits a referenced variable.
          if docker compose config 2>&1 >/dev/null | grep "variable is not set"; then
            echo "::error::docker/self-host/.env.example is missing variables the stack references (see warnings above)"
            exit 1
          fi

      - name: Assert the merged stack matches single-host intent
        working-directory: docker/self-host
        run: |
          set -euo pipefail
          services=$(docker compose config --services)
          for unwanted in application-worker maintenance; do
            grep -qx "$unwanted" <<< "$services" && {
              echo "::error::'$unwanted' is a reference-deployment service and must not run on a single host"; exit 1; } || true
          done
          for required in application-server webhook-server postgres nats-server webapp reverse-proxy; do
            grep -qx "$required" <<< "$services" || {
              echo "::error::'$required' is missing from the self-hosted stack"; exit 1; }
          done
          # Some Compose releases accept `!override` without applying it.
          rendered=$(docker compose config)
          rendered_json=$(docker compose config --format json)
          nats_config=$(jq -r '.configs["nats-server.conf"].content' <<< "$rendered_json")
          grep -Eq '^[[:space:]]*sync_interval:[[:space:]]*always[[:space:]]*$' <<< "$nats_config" || {
            echo "::error::the single-node JetStream store must fsync every write"; exit 1; }
          jq -e '
            .services.webapp.labels["traefik.http.middlewares.webapp-body-limit.buffering.maxRequestBodyBytes"] == "26214400" and
            .services.webapp.labels["traefik.http.middlewares.webapp-body-limit.buffering.memRequestBodyBytes"] == "1048576" and
            (.services.webapp.labels["traefik.http.routers.https-webapp.middlewares"] | split(",") | index("webapp-body-limit")) != null and
            .services["webhook-server"].labels["traefik.http.middlewares.webhook-body-limit.buffering.maxRequestBodyBytes"] == "26214400" and
            .services["webhook-server"].labels["traefik.http.middlewares.webhook-body-limit.buffering.memRequestBodyBytes"] == "1048576" and
            (.services["webhook-server"].labels["traefik.http.routers.https-webhook-server.middlewares"] | split(",") | index("webhook-body-limit") != null and index("gzip") != null)
          ' <<< "$rendered_json" >/dev/null || {
            echo "::error::webapp and webhook request-body limits are not attached to their routers"; exit 1; }

          # HSTS is the one security header a response cannot set for itself, and the entrypoint
          # that used to carry it exists only where the proxy stack is the edge. Behind any other
          # proxy the header simply vanished, so each router that terminates a public request
          # carries it now, and this is what keeps that true.
          jq -e '
            [ .services | to_entries[] | .value.labels // {} | to_entries[]
              | select(.key | test("^traefik\\.http\\.routers\\.https-[a-z-]+\\.middlewares$"))
              | select((.value | split(",") | any(test("hsts"))) | not) | .key ] | length == 0
          ' <<< "$rendered_json" >/dev/null || {
            echo "::error::an https router would serve without HSTS behind a proxy that is not ours"; exit 1; }
          for required in \
            'entrypoints.https.http.middlewares=security-headers@docker' \
            'providers.file.filename=/etc/traefik/dynamic.yml' \
            'serversTransport.forwardingTimeouts.dialTimeout=10s' \
            'serversTransport.forwardingTimeouts.responseHeaderTimeout=30s' \
            'contentsecuritypolicy' \
            'default-src' \
            'stsseconds' \
            '2592000' \
            'minversion' \
            'versiontls12'; do
            grep -Fiq "$required" <<< "$rendered" || {
              echo "::error::runtime edge envelope is missing '$required'"; exit 1; }
          done
          edge_csp=$(sed -n 's/.*contentSecurityPolicy=\(.*\)"/\1/p' ../compose.proxy.yaml)
          selfhost_csp=$(sed -n 's/.*contentSecurityPolicy=\(.*\)"/\1/p' compose.single-host.yaml)
          nginx_csp=$(sed -n 's/add_header Content-Security-Policy "\(.*\)" always;/\1/p' ../../webapp/docker/security-headers.conf)
          [ "$edge_csp" = "$nginx_csp" ] || {
            echo "::error::Traefik and nginx Content-Security-Policy values differ"; exit 1; }
          [ "$edge_csp" = "$selfhost_csp" ] || {
            echo "::error::reference and single-host Content-Security-Policy values differ"; exit 1; }
          grep -q "admin@tum.de" <<< "$rendered" && {
            echo "::error::the maintainers' ACME email survived the override — Compose is too old to honour !override"; exit 1; } || true
          published=$(docker compose config --format json \
            | jq -r '.services["reverse-proxy"].ports[].published' | sort -n | tr '\n' ' ')
          [ "$published" = "80 443 " ] || {
            echo "::error::reverse-proxy publishes '$published', expected '80 443 ' — !override was ignored"; exit 1; }

      - name: Render the preview stack and assert it stays sandboxed
        run: vp run gate:preview-stack

      - name: Render the reference deployment
        working-directory: docker
        run: |
          set -euo pipefail
          # One stack at a time, because that is how the reference deployment runs them:
          # the reconciler renders each file on its own and brings it up as its own Compose
          # project, one per stack. Rendering the three merged instead made
          # every cross-project reference look satisfiable, and hid a `depends_on` no stack could
          # honour until a release had already been published. The merged combination is still
          # covered — the single-host stack above includes all three. Values mirror what the deploy
          # workflow supplies; this only proves each file renders, not that it is right for production.
          for stack in proxy core app; do
            docker compose -f "compose.${stack}.yaml" \
              --env-file self-host/.env --env-file self-host/smoke-lock.env config --quiet
          done
          # No service names a serversTransport, because only the file provider can define one and
          # the app stack must render without the proxy stack. The backend timeouts therefore have
          # to reach default@internal from the edge's own static configuration, or they are absent.
          proxy=$(docker compose -f compose.proxy.yaml \
            --env-file self-host/.env --env-file self-host/smoke-lock.env config)
          for required in \
            'serversTransport.forwardingTimeouts.dialTimeout=10s' \
            'serversTransport.forwardingTimeouts.responseHeaderTimeout=30s'; do
            grep -Fq "$required" <<< "$proxy" || {
              echo "::error::the bundled edge does not bound the backend wait ('$required')"; exit 1; }
          done
