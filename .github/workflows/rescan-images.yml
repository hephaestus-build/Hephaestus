name: Security / Rescan images

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rescan-images
  cancel-in-progress: false

jobs:
  main:
    name: Rescan main's images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"

      - uses: ./.github/actions/setup-release-security-tools
        with:
          install-syft: "true"

      - name: Log in to Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/download-trivy-db
        with:
          max-age-hours: "48"
          metadata-path: reports/trivy-db.json

      - name: Scan the images built from main
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/scan-main-images.ts reports

      # The pinned upstream digests too, so the daily picture is the release gate's subject set
      # rather than half of it. Report-only for the same reason as the images above: a CVE
      # published after the digest was pinned belongs to no commit here.
      - name: Scan the pinned upstream images
        run: node scripts/scan-upstream-images.ts reports --report-only

      - name: Upload the vulnerability policy results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-image-rescan-${{ github.run_id }}
          path: reports
          if-no-files-found: warn
          retention-days: 30

      - name: Route findings to the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/report-vulnerability-drift.ts reports

      # Findings go to the drift issue above, so only a crash fails this job, and nothing else reports it.
      - name: Report a failed rescan
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="The rescan of main's images failed"
          # Only the workflow token opens this issue, and anyone can open one with the same title. `--author`
          # does not match an app, and the search index can miss an issue that a run just opened, so the
          # listing is filtered here.
          number=$(gh issue list -R "$REPOSITORY" --state open --limit 500 --json number,title,author |
            jq -r --arg title "$title" \
              '[.[] | select(.title == $title and .author.login == "app/github-actions")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPOSITORY" --body "@hephaestus-build/maintainer: the rescan failed again: $RUN_URL"
          else
            gh issue create -R "$REPOSITORY" --title "$title" \
              --body "@hephaestus-build/maintainer: the rescan of main's images stopped before it could report its findings: $RUN_URL. The run's log names the step. Close this issue when a run passes."
          fi

  release:
    name: Rescan the supported release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      - uses: ./.github/actions/setup-release-security-tools
        with:
          install-syft: "true"
      - name: Download latest supported release evidence
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          mkdir release-evidence
          gh release download "$tag" --repo "${{ github.repository }}" --dir release-evidence
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/download-trivy-db
        with:
          max-age-hours: "48"
          metadata-path: reports/trivy-db.json
      - name: Rescan immutable subjects
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/rescan-release-images.ts release-evidence reports "$RELEASE_TAG"
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supported-release-rescan-${{ github.run_id }}
          path: reports
          if-no-files-found: warn
          retention-days: 30
      - name: Notify vulnerability response tracking
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/report-vulnerability-drift.ts reports --release-failure

  dependencies-and-platform:
    name: Rescan dependency and platform pins
    # Branch analyses can annotate pull requests. Keep these findings on the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      TRIVY_INCLUDE_DEV_DEPS: "true"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-release-security-tools
        with:
          install-syft: "false"
      - uses: ./.github/actions/download-trivy-db
        with:
          max-age-hours: "48"
          java-db: "true"
      - uses: ./.github/actions/setup-helm
      - name: Scan the dependency locks and pinned platform components, and judge the platform images
        run: node scripts/scan-platform-images.ts
      # Security alerts are access-controlled. Do not copy detailed findings into public artifacts or issues.
      - name: Publish restricted security alerts
        if: ${{ !cancelled() && hashFiles('tmp/platform-rescan/linux-amd64/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: tmp/platform-rescan/linux-amd64
      - name: Publish restricted ARM64 security alerts
        if: ${{ !cancelled() && hashFiles('tmp/platform-rescan/linux-arm64/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: tmp/platform-rescan/linux-arm64
      - name: Notify maintainers when the rescan is unavailable
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 2
          script: |
            const marker = '<!-- hephaestus:platform-rescan-unavailable -->';
            const body = `${marker}\n@hephaestus-build/maintainer: a scheduled security scan is unavailable, or a platform image no longer satisfies the vulnerability policy. Inspect [this run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, creator: 'github-actions[bot]', state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.startsWith(marker));
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title: 'Scheduled security scan unavailable', body });
