name: Release / Seeded upgrade

on:
  workflow_call:
    # A release passes all four; the merge group passes none, so the resolver takes the last release
    # from the tags and the images of this commit.
    inputs:
      previous-version:
        description: >-
          Previous release version (X.Y.Z or X.Y.Z-rc.N). Its image repository is resolved per
          version from security/release-identities.json — releases published before the
          repository transfer stay in the old GHCR namespace forever (issue #1599).
        type: string
        required: false
      candidate-application-image:
        type: string
        required: false
      postgres-image:
        type: string
        required: false
      candidate-source-sha:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      previous-tag:
        description: Previous stable or RC tag (defaults to the last stable tag)
        required: false
      candidate-sha:
        description: Candidate commit SHA (defaults to this workflow commit)
        required: false
  schedule:
    - cron: "37 4 * * 3"

permissions:
  contents: read
  packages: read

concurrency:
  group: release-upgrade-${{ inputs.candidate-application-image || inputs.candidate-sha || github.sha }}
  cancel-in-progress: false

jobs:
  upgrade:
    name: Migrate a seeded database
    runs-on: ubuntu-latest
    # Two seeded upgrades when the latest published release differs from the supported starting release.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate-source-sha || inputs.candidate-sha || github.sha }}
          # The release tags select the previous release on a scheduled or manual run.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable image references
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PREVIOUS_VERSION: ${{ inputs.previous-version }}
          INPUT_CANDIDATE_APP: ${{ inputs.candidate-application-image }}
          INPUT_POSTGRES: ${{ inputs.postgres-image }}
          REQUESTED_PREVIOUS: ${{ inputs.previous-tag }}
          REQUESTED_CANDIDATE: ${{ inputs.candidate-sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/resolve-release-upgrade-images.ts

      - name: Test seeded upgrade
        env:
          PREVIOUS_APP: ${{ steps.images.outputs.previous-app }}
          PREVIOUS_VERSION: ${{ steps.images.outputs.previous-version }}
          PREVIOUS_AGENT_IMAGE: ${{ steps.images.outputs.previous-agent }}
          CANDIDATE_APP: ${{ steps.images.outputs.candidate-app }}
          POSTGRES_IMAGE: ${{ steps.images.outputs.postgres }}
        run: node scripts/release-upgrade-test.ts "$PREVIOUS_APP" "$CANDIDATE_APP" "$POSTGRES_IMAGE"

      - name: Test seeded upgrade from the latest release
        # Also after a failed first upgrade, so one run reports both.
        if: ${{ !cancelled() && steps.images.outputs.latest-app != '' }}
        env:
          PREVIOUS_APP: ${{ steps.images.outputs.latest-app }}
          PREVIOUS_VERSION: ${{ steps.images.outputs.latest-version }}
          PREVIOUS_AGENT_IMAGE: ${{ steps.images.outputs.latest-agent }}
          CANDIDATE_APP: ${{ steps.images.outputs.candidate-app }}
          POSTGRES_IMAGE: ${{ steps.images.outputs.postgres }}
        run: node scripts/release-upgrade-test.ts "$PREVIOUS_APP" "$CANDIDATE_APP" "$POSTGRES_IMAGE"
