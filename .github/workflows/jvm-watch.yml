name: Security / Java runtime watch

# The OpenJDK advisory names the affected builds before NVD lets a scanner match them, and before a
# vendor build exists. scripts/watch-jvm-advisories.ts opens one issue per advisory that affects the pin.
# scripts/update-buildpack-pins.ts opens the pull request for a newer JRE once a Paketo builder ships it.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  advisories:
    name: OpenJDK advisories against the pinned JRE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      - name: Open an issue for each new advisory that affects the pinned JRE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watch-jvm-advisories.ts

  jre-update:
    name: Propose the newer JRE that the newest builder ships
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      proposed: ${{ steps.propose.outputs.proposed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      - name: Open or update the JRE pull request
        id: propose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-buildpack-pins.ts

  # GitHub holds the pull_request runs of a GITHUB_TOKEN push for approval, but it starts a workflow_dispatch
  # run at once, and that run reports CI Status Gate on the head commit. actions: write stays in this job,
  # which checks out nothing and runs no action or repository code.
  dispatch-ci:
    name: Start CI/CD on the JRE pull request
    needs: jre-update
    if: ${{ needs.jre-update.outputs.proposed == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Dispatch CI/CD on the pull request's branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run cicd.yml --ref automation/jre-update
