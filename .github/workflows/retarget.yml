name: CI / Retarget

# A layer of a stack runs the light tier while its base is another pull request's branch. When the
# layer below merges and this pull request is retargeted to the default branch, no push may follow,
# so the CI/CD run of its head is run again. `Detect changes` reads the base from the pull request,
# not from the event, so the new attempt runs the full tier: ci-cd.mdx § Light tier for stacked layers.
# A push can also follow the retarget within seconds. Its own run then covers the new head, and a
# re-run of the old head would join CI/CD's concurrency group and cancel it, so the job re-reads the
# head before it acts.

on:
  pull_request:
    types: [edited]

# A later edit, such as a title change, waits instead of cancelling: a retarget cancelled after it
# cancelled the old run would leave the pull request with no CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  rerun:
    name: "Run CI again on the new base"
    # A fork's token cannot re-run a workflow; a push to the fork runs the full tier.
    if: >-
      github.event.changes.base != null &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write # re-run this pull request's CI/CD run
      pull-requests: read # read the pull request's current head
    steps:
      - name: Run the head's CI/CD run again
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Exits when the pull request's head is no longer the event's; a failed read fails the job.
          exit_if_head_moved() {
            local current
            current=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            if [ -z "$current" ]; then
              echo "::error::Could not read the head of pull request $PR_NUMBER."
              exit 1
            fi
            if [ "$current" != "$HEAD_SHA" ]; then
              echo "The head moved from $HEAD_SHA to $current; the push's own CI/CD run covers it."
              exit 0
            fi
          }
          exit_if_head_moved
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cicd.yml --event pull_request --commit "$HEAD_SHA" \
            --limit 1 --json databaseId,status --jq '.[0] // empty | "\(.databaseId) \(.status)"')
          if [ -z "$run" ]; then
            echo "No CI/CD run of $HEAD_SHA yet; the next push runs the full tier."
            exit 0
          fi
          read -r id status <<< "$run"
          # A run cannot be run again before it ends. A light run of a pull request carries no merge verdict.
          if [ "$status" != completed ]; then
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY"
            gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 10 > /dev/null || true
          fi
          # The cancel can take minutes, so a push may arrive in between.
          exit_if_head_moved
          gh run rerun "$id" --repo "$GITHUB_REPOSITORY"
