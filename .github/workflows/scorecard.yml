name: Security / OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # the assessment this publishes is the one the ratchet then reads, and on the
  # default branch it is the only one that commit will ever get.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: read-all

jobs:
  # The action names its image by tag. This job proves the tag is still the pinned digest and that
  # the digest pulls for linux/amd64, so a broken pin fails here by name. Workflow lint runs the same
  # check on every pull request that changes CI configuration. It is a separate job because OpenSSF
  # accepts only allowlisted actions in the job that publishes.
  image:
    name: Pinned Scorecard image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Renovate moves this pin and the action commit in one pull request (renovate.json).
      SCORECARD_IMAGE: ghcr.io/ossf/scorecard-action:v2.5.0@sha256:1e1481c65fc2407d3fd6ab18a23c741eb4d1c0d9359ebafc4b3ab13aa61d8627
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      - name: Verify the pinned image
        run: node scripts/check-scorecard-image.ts

  analysis:
    name: Supply-chain posture
    needs: [image]
    runs-on: ubuntu-latest
    # OpenSSF publishing is limited to the default branch.
    if: github.event.repository.default_branch == github.ref_name
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

      - name: Preserve the assessment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard-${{ github.sha }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 14
