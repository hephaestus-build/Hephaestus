name: CI / Fail fast

# A merge group that has already lost frees its runners. `cicd.yml` calls this once per leg when
# that leg fails. The graceful cancel lets `CI Status Gate` (`if: always()`) still run and fail, so
# the queue removes the entry. A force-cancel skips the gate, and the entry then waits in the queue
# with no verdict until its check timeout: docs/contributor/ci-cd.mdx § Fail fast in the merge queue.

on:
  workflow_call:

permissions: {}

jobs:
  cancel:
    name: "Cancel the run"
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # The only `actions: write` grant of the CI run. This job runs no checkout and no action, so no
    # other code holds the token.
    permissions:
      actions: write # cancel this run
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"
