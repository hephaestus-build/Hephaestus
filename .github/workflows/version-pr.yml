name: Release / Version PR

# Versioning contract: docs/contributor/release-management.mdx.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only successful same-repository main pushes start maintenance. It runs main's tip and versions a validated main commit, never the event's ref.
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  version-pr:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository }}
    concurrency:
      group: version-pr
      cancel-in-progress: false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      # Main moves faster than its CI, so its tip is rarely validated when a run completes. The
      # script runs from the tip and versions the newest first-parent commit whose push run succeeded.
      - name: Maintain Version PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/maintain-version-pr.ts

  # A failed maintenance leaves the Version PR stale without any other signal.
  report:
    needs: version-pr
    # A timeout or a manual cancel also ends cancelled, so the report step separates those from a
    # run that the concurrency group replaced while it waited, even with cancel-in-progress off.
    if: ${{ always() && contains(fromJSON('["success", "failure", "cancelled"]'), needs.version-pr.result) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RESULT: ${{ needs.version-pr.result }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = cancelled ]; then
            # GitHub lists no steps for a job that never got a runner.
            steps=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "version-pr") | .steps | length')
            if [ "$steps" = 0 ]; then
              echo "The concurrency group replaced this run before it started."
              exit 0
            fi
          fi
          title="Version PR maintenance failed"
          # A listing, not the search index, so a failure right after another finds its issue.
          number=$(gh issue list -R "$REPOSITORY" --state open --limit 500 --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" -R "$REPOSITORY" --comment "Maintenance succeeded again: $RUN_URL"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPOSITORY" --body "Maintenance failed again: $RUN_URL"
          else
            gh issue create -R "$REPOSITORY" --title "$title" \
              --body "Maintenance failed, so the Version PR does not include the newest validated changesets: $RUN_URL. The workflow's log names the step. A later successful run closes this issue."
          fi
