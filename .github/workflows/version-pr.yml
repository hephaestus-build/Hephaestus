name: Release / Version PR

# Versioning contract: docs/contributor/release-management.mdx.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only successful same-repository main pushes start maintenance, and it versions a validated main commit, never the event's ref.
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  version-pr:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository }}
    concurrency:
      group: version-pr
      cancel-in-progress: false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # Main moves faster than its CI, so its tip is rarely validated when a run completes.
      # Version the newest first-parent commit whose push CI/CD succeeded instead.
      - name: Select the newest validated main commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          validated=$(gh api "repos/$REPOSITORY/actions/workflows/cicd.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.head_repository.full_name == env.REPOSITORY) | .head_sha')
          base=$(git rev-list --first-parent HEAD | grep -Fx -m 1 -f <(printf '%s\n' "$validated")) || {
            echo "No recent main commit has a successful push CI/CD run." >&2
            exit 1
          }
          git checkout --detach "$base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - name: Maintain Version PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_BASE: ${{ steps.base.outputs.sha }}
        run: node scripts/maintain-version-pr.ts

  # A failed maintenance leaves the Version PR stale without any other signal.
  report:
    needs: version-pr
    # A run that the concurrency group replaces ends cancelled; only a finished run reports.
    if: ${{ always() && contains(fromJSON('["success", "failure"]'), needs.version-pr.result) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RESULT: ${{ needs.version-pr.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Version PR maintenance failed"
          number=$(gh issue list -R "$REPOSITORY" --state open --search "\"$title\" in:title" --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" -R "$REPOSITORY" --comment "Maintenance succeeded again: $RUN_URL"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPOSITORY" --body "Maintenance failed again: $RUN_URL"
          else
            gh issue create -R "$REPOSITORY" --title "$title" \
              --body "Maintenance failed, so the Version PR does not include the newest validated changesets: $RUN_URL. The workflow's log names the step. A later successful run closes this issue."
          fi
