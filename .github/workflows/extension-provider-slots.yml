name: CI / Extension provider slots

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: extension-provider-slots
  cancel-in-progress: false

jobs:
  slots:
    name: Live provider report slots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-browsers
      - name: Check the actual adapters against public GitHub and GitLab pages
        run: node scripts/ci-browser.ts node scripts/check-extension-provider-slots.ts
      - name: Keep each provider result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-provider-slots
          path: tmp/extension-provider-slots.json
          if-no-files-found: warn
          retention-days: 14
