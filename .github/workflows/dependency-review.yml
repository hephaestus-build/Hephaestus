name: Dependency review

on:
  # The files the dependency graph reads. Without a change to one, the comparison is empty.
  # dependency-graph.yml filters on the same list, so the head snapshot this waits for exists.
  pull_request:
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-workspace.yaml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependency-review-config.yml"
      - "server/**/*.gradle.kts"
      - "server/**/gradle.lockfile"
      - "server/*-gradle.lockfile"
      - "server/gradle/**"
      - "server/gradle.properties"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: "New dependency risk"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
