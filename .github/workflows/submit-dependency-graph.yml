name: Security / Submit Gradle dependency graph

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only snapshot data is submitted; no originating code is checked out or executed.
    workflows: ["Security / Gradle dependency graph"]
    types: [completed]

permissions: {}

jobs:
  submit:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      # This trusted workflow consumes data from that run; it never checks out or executes its code.
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit
          cache-disabled: true
      - name: Require the submitted snapshot
        run: test -s dependency-graph-reports/server.json
