name: CI / Feedback eval panel

# The model panel of the feedback eval gate: docs/contributor/feedback-quality-evals.md § Model panel.
# The checks that need no model gate every pull request in cicd.yml. With a configured provider, this
# workflow composes the fixed panel each night on main, on a manual run, and on a pull request
# labelled `eval:run`.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

concurrency:
  group: feedback-eval-panel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The panel runs only with a configured provider: docs/contributor/ci-cd.mdx § Feedback eval
  # panel provider. A cron cannot be conditional, so a night without the variables starts no job.
  provider:
    name: Model provider
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.FEEDBACK_EVAL_BASE_URL != '' && vars.FEEDBACK_EVAL_MODEL != '') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'eval:run'))
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # A secret cannot appear in an `if:`, so this step reads only whether the key is set.
      - name: Check the provider settings
        id: check
        env:
          BASE_URL_SET: ${{ vars.FEEDBACK_EVAL_BASE_URL != '' }}
          MODEL_SET: ${{ vars.FEEDBACK_EVAL_MODEL != '' }}
          KEY_SET: ${{ secrets.FEEDBACK_EVAL_API_KEY != '' }}
        run: |
          if [ "$BASE_URL_SET" = true ] && [ "$MODEL_SET" = true ] && [ "$KEY_SET" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Feedback eval panel"
            echo
            echo "The model provider is not configured, so the panel did not run."
            echo "The deterministic feedback eval gate still covers every pull request."
            echo "docs/contributor/ci-cd.mdx § Feedback eval panel provider lists the settings."
          } >> "$GITHUB_STEP_SUMMARY"

  panel:
    name: Model panel
    needs: [provider]
    if: needs.provider.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
      artifact: ${{ steps.keep.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - uses: ./.github/actions/setup-caches

      - name: Compose the panel
        id: gate
        env:
          HEPHAESTUS_LIVE_LLM_BASE_URL: ${{ vars.FEEDBACK_EVAL_BASE_URL }}
          HEPHAESTUS_LIVE_LLM_MODEL: ${{ vars.FEEDBACK_EVAL_MODEL }}
          HEPHAESTUS_LIVE_LLM_API_KEY: ${{ secrets.FEEDBACK_EVAL_API_KEY }}
        run: node scripts/feedback-eval-gate.ts --model --output "$RUNNER_TEMP/feedback-eval-panel"

      - name: Keep the panel result
        id: keep
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-eval-panel
          path: ${{ runner.temp }}/feedback-eval-panel
          retention-days: 14
          if-no-files-found: warn

  # A night has no pull request to fail, so it keeps one tracking issue. A red or unfinished night
  # comments on it with the commits since the last green night. The next green night closes it. A
  # night without a provider runs no panel, so it never reaches this job.
  report:
    name: "Report a failure"
    needs: [panel]
    if: always() && github.event_name == 'schedule' && needs.panel.result != 'skipped'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: read
      issues: write
    steps:
      - name: Keep the tracking issue in step with the night
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.panel.outputs.artifact }}
          RESULT: ${{ needs.panel.result }}
          STATUS: ${{ needs.panel.outputs.status }}
        run: |
          set -euo pipefail
          title="The nightly feedback eval panel is not green"
          number=$(gh issue list -R "$REPOSITORY" --state open --search "\"$title\" in:title" --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ "$RESULT" = success ] && [ "$STATUS" = passed ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" -R "$REPOSITORY" --comment "The panel is green again on \`$COMMIT\`: $RUN_URL"
            fi
            exit 0
          fi
          case "$STATUS" in
            failed) what="fell below a floor" ;;
            skipped) what="measured nothing, because the endpoint gave no composition for a panel case" ;;
            *) what="did not finish ($RESULT)" ;;
          esac
          # This run is not green yet, so the newest successful scheduled run is the last green night.
          green=$(gh api "repos/$REPOSITORY/actions/workflows/feedback-eval-panel.yml/runs?event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -n "$green" ]; then
            range="Commits since the last green night: https://github.com/$REPOSITORY/compare/$green...$COMMIT"
          else
            range="No night has been green yet. This night ran on \`$COMMIT\`."
          fi
          body="@hephaestus-build/maintainer: the nightly feedback eval panel $what.

          $range
          Run: $RUN_URL
          Result: ${ARTIFACT_URL:-no artifact was kept}"
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPOSITORY" --body "$body"
          else
            gh issue create -R "$REPOSITORY" --title "$title" --body "$body"
          fi
