name: CI / Feedback eval panel

# The model panel of the feedback eval gate: docs/contributor/feedback-quality-evals.mdx § Model panel.
# The checks that need no model gate every pull request in cicd.yml. A person starts every run of this
# workflow: a manual run, or a maintainer who adds `eval:run` to a pull request from this repository. A run
# composes the whole panel with the configured provider. Nothing starts it on a path change or a schedule,
# and its result is never a required check.

on:
  workflow_dispatch:
  pull_request:
    # Only adding the label starts a run, against the head at that moment. A later push starts nothing: remove
    # the label and add it again to run on the new head.
    types: [labeled]

permissions: {}

jobs:
  # The panel runs only with the CI model connection: docs/contributor/ci-cd.mdx § CI model
  # connection. The base URL is a secret, and a job `if:` cannot read a secret, so this job checks
  # the settings in a step. A pull request from a fork gets no secrets, so it starts no job.
  provider:
    name: Model connection
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'eval:run' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # Each expression is only whether a setting is set; no value reaches the step.
      - name: Check the model connection
        id: check
        env:
          BASE_URL_SET: ${{ secrets.CI_LLM_BASE_URL != '' }}
          KEY_SET: ${{ secrets.CI_LLM_API_KEY != '' }}
          MODEL_SET: ${{ vars.CI_LLM_MODEL != '' }}
        run: |
          if [ "$BASE_URL_SET" = true ] && [ "$KEY_SET" = true ] && [ "$MODEL_SET" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          missing=()
          [ "$BASE_URL_SET" = true ] || missing+=("CI_LLM_BASE_URL")
          [ "$KEY_SET" = true ] || missing+=("CI_LLM_API_KEY")
          [ "$MODEL_SET" = true ] || missing+=("CI_LLM_MODEL")
          echo "::notice title=Feedback eval panel::The CI model connection is not configured, so nothing was composed. Missing: ${missing[*]}."
          {
            echo "## Feedback eval panel"
            echo
            echo "The CI model connection is not configured, so nothing was composed. Missing: ${missing[*]}."
            echo "The deterministic feedback eval gate still covers every pull request."
            echo "docs/contributor/ci-cd.mdx § CI model connection lists the settings."
          } >> "$GITHUB_STEP_SUMMARY"

  panel:
    name: Model panel
    needs: [provider]
    if: needs.provider.outputs.configured == 'true'
    # One panel at a time on the shared endpoint, and none cancels another: each run was started by a
    # person and may already have spent model calls. On the job, not the workflow: a run for an
    # unrelated label never enters the group.
    concurrency:
      group: feedback-eval-panel
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - uses: ./.github/actions/setup-caches

      # A person started this run, so it composes the whole panel.
      - name: Compose the panel
        id: gate
        env:
          HEPHAESTUS_LIVE_LLM_BASE_URL: ${{ secrets.CI_LLM_BASE_URL }}
          HEPHAESTUS_LIVE_LLM_MODEL: ${{ vars.CI_LLM_MODEL }}
          HEPHAESTUS_LIVE_LLM_API_KEY: ${{ secrets.CI_LLM_API_KEY }}
        run: node scripts/feedback-eval-gate.ts --model --output "$RUNNER_TEMP/feedback-eval-panel"

      - name: Keep the panel result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-eval-panel
          path: ${{ runner.temp }}/feedback-eval-panel
          retention-days: 14
          if-no-files-found: warn
