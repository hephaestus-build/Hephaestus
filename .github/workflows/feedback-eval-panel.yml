name: CI / Feedback eval panel

# The model panel of the feedback eval gate: docs/contributor/feedback-quality-evals.md § Model panel.
# The checks that need no model gate every pull request in cicd.yml. This workflow composes the fixed
# panel with a model each night on main, on a manual run, and on a pull request labelled `eval:run`.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

concurrency:
  group: feedback-eval-panel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  panel:
    name: Model panel
    # The repository variables select the provider and the model. Without them, only a manual run
    # starts, and its summary says why: no night and no label run asks for a panel it cannot compose.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.FEEDBACK_EVAL_MODEL != '' &&
        (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'eval:run')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
      artifact: ${{ steps.keep.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - name: Set up the Java build
        if: vars.FEEDBACK_EVAL_MODEL != ''
        uses: ./.github/actions/setup-caches

      - name: Compose the panel
        id: gate
        env:
          HEPHAESTUS_LIVE_LLM_BASE_URL: ${{ vars.FEEDBACK_EVAL_BASE_URL }}
          HEPHAESTUS_LIVE_LLM_MODEL: ${{ vars.FEEDBACK_EVAL_MODEL }}
          HEPHAESTUS_LIVE_LLM_API_KEY: ${{ secrets.FEEDBACK_EVAL_API_KEY }}
        run: node scripts/feedback-eval-gate.ts --model --output "$RUNNER_TEMP/feedback-eval-panel"

      - name: Keep the panel result
        id: keep
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-eval-panel
          path: ${{ runner.temp }}/feedback-eval-panel
          retention-days: 14
          if-no-files-found: warn

  # A night has no pull request to fail, so it keeps one tracking issue. A red or skipped night
  # comments on it with the commits since the last green night. The next green night closes it.
  report:
    name: "Report a failure"
    needs: [panel]
    if: always() && github.event_name == 'schedule' && needs.panel.result != 'skipped'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: read
      issues: write
    steps:
      - name: Keep the tracking issue in step with the night
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.panel.outputs.artifact }}
          RESULT: ${{ needs.panel.result }}
          STATUS: ${{ needs.panel.outputs.status }}
        run: |
          set -euo pipefail
          title="The nightly feedback eval panel is not green"
          number=$(gh issue list -R "$REPOSITORY" --state open --search "\"$title\" in:title" --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ "$RESULT" = success ] && [ "$STATUS" = passed ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" -R "$REPOSITORY" --comment "The panel is green again on \`$COMMIT\`: $RUN_URL"
            fi
            exit 0
          fi
          case "$STATUS" in
            failed) what="fell below a floor" ;;
            skipped) what="was skipped, so it measured nothing" ;;
            *) what="did not finish ($RESULT)" ;;
          esac
          # This run is not green yet, so the newest successful scheduled run is the last green night.
          green=$(gh api "repos/$REPOSITORY/actions/workflows/feedback-eval-panel.yml/runs?event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -n "$green" ]; then
            range="Commits since the last green night: https://github.com/$REPOSITORY/compare/$green...$COMMIT"
          else
            range="No night has been green yet. This night ran on \`$COMMIT\`."
          fi
          body="@hephaestus-build/maintainer: the nightly feedback eval panel $what.

          $range
          Run: $RUN_URL
          Result: ${ARTIFACT_URL:-no artifact was kept}"
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPOSITORY" --body "$body"
          else
            gh issue create -R "$REPOSITORY" --title "$title" --body "$body"
          fi
