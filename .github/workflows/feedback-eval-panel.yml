name: CI / Feedback eval panel

# The model panel of the feedback eval gate: docs/contributor/feedback-quality-evals.md § Model panel.
# The checks that need no model gate every pull request in cicd.yml. With a configured provider, this
# workflow composes the fixed panel each night on main, on a manual run, and on a pull request
# labelled `eval:run`.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

concurrency:
  group: feedback-eval-panel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The panel runs only with a configured provider: docs/contributor/ci-cd.mdx § Feedback eval
  # panel provider. A cron cannot be conditional, so a night without the variables starts no job.
  provider:
    name: Model provider
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.FEEDBACK_EVAL_BASE_URL != '' && vars.FEEDBACK_EVAL_MODEL != '') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'eval:run'))
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # A secret cannot appear in an `if:`, so this step reads only whether the key is set.
      - name: Check the provider settings
        id: check
        env:
          BASE_URL_SET: ${{ vars.FEEDBACK_EVAL_BASE_URL != '' }}
          MODEL_SET: ${{ vars.FEEDBACK_EVAL_MODEL != '' }}
          KEY_SET: ${{ secrets.FEEDBACK_EVAL_API_KEY != '' }}
        run: |
          if [ "$BASE_URL_SET" = true ] && [ "$MODEL_SET" = true ] && [ "$KEY_SET" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Feedback eval panel"
            echo
            echo "The model provider is not configured, so the panel did not run."
            echo "The deterministic feedback eval gate still covers every pull request."
            echo "docs/contributor/ci-cd.mdx § Feedback eval panel provider lists the settings."
          } >> "$GITHUB_STEP_SUMMARY"

  panel:
    name: Model panel
    needs: [provider]
    if: needs.provider.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
      artifact: ${{ steps.keep.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - uses: ./.github/actions/setup-caches

      - name: Compose the panel
        id: gate
        env:
          HEPHAESTUS_LIVE_LLM_BASE_URL: ${{ vars.FEEDBACK_EVAL_BASE_URL }}
          HEPHAESTUS_LIVE_LLM_MODEL: ${{ vars.FEEDBACK_EVAL_MODEL }}
          HEPHAESTUS_LIVE_LLM_API_KEY: ${{ secrets.FEEDBACK_EVAL_API_KEY }}
        run: node scripts/feedback-eval-gate.ts --model --output "$RUNNER_TEMP/feedback-eval-panel"

      - name: Keep the panel result
        id: keep
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-eval-panel
          path: ${{ runner.temp }}/feedback-eval-panel
          retention-days: 14
          if-no-files-found: warn

  # A night has no pull request to fail, so it keeps one tracking issue. A red or unfinished night
  # comments on it with the commits since the last night whose panel measured and passed. The next
  # such night closes it. A night without a provider runs no panel, so it never reaches this job.
  # CI / Scheduled failures writes to the same issue if this job itself fails.
  report:
    name: "Report a failure"
    needs: [panel]
    if: always() && github.event_name == 'schedule' && needs.panel.result != 'skipped'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: read
      issues: write
    steps:
      - name: Keep the tracking issue in step with the night
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.panel.result }}
          STATUS: ${{ needs.panel.outputs.status }}
          ARTIFACT_URL: ${{ needs.panel.outputs.artifact }}
        with:
          retries: 2
          script: |
            const title = 'The nightly feedback eval panel is not green';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, creator: 'github-actions[bot]', state: 'open', per_page: 100,
            });
            const open = issues.find(issue => !issue.pull_request && issue.title === title);
            if (process.env.RESULT === 'success' && process.env.STATUS === 'passed') {
              if (open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: open.number,
                  body: `The panel measured and passed again on \`${context.sha}\`: ${runUrl}` });
                await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: 'closed' });
              }
              return;
            }
            // Only a night whose panel job succeeded measured and passed: a night without a provider
            // succeeds with a skipped panel, so a successful run alone is not a green night.
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'feedback-eval-panel.yml', event: 'schedule', per_page: 30,
            });
            let green = null;
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, per_page: 100,
              });
              if (jobs.some(job => job.name === 'Model panel' && job.conclusion === 'success')) {
                green = run.head_sha;
                break;
              }
            }
            const what = { failed: 'fell below a floor',
              skipped: 'measured nothing, because the endpoint gave no composition for a panel case',
              'ceiling-reached': 'stopped at its call ceiling' }[process.env.STATUS]
              ?? `did not finish (${process.env.RESULT})`;
            const range = green
              ? `Commits since the last night that measured and passed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/compare/${green}...${context.sha}`
              : `No night of the last 30 measured and passed. This night ran on \`${context.sha}\`.`;
            const body = [
              `@hephaestus-build/maintainer: the nightly feedback eval panel ${what}.`, '',
              range, `Run: ${runUrl}`, `Result: ${process.env.ARTIFACT_URL || 'no artifact was kept'}`,
            ].join('\n');
            if (open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
