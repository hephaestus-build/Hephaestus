name: CodeQL

on:
  workflow_call:
  schedule:
    - cron: "15 5 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  # Preserve analysis for every default-branch commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Select analysis languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.filter.outputs.changes || '["actions","java-kotlin","javascript-typescript"]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: >-
          github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
          (github.event_name == 'push' && github.event.before != '' &&
            github.event.before != '0000000000000000000000000000000000000000')
        with:
          # Use the complete pushed range, not just its last commit. Scheduled/manual runs stay full.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            actions:
              - '.github/**'
            java-kotlin:
              - 'server/**'
              - '.java-version'
              - '.github/actions/setup-caches/**'
              - '.github/codeql/**'
              - '.github/workflows/codeql.yml'
            javascript-typescript:
              - '**/*.{js,cjs,mjs,jsx,ts,cts,mts,tsx,html,vue}'
              - '**/package.json'
              - '**/tsconfig*.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - '.github/codeql/**'
              - '.github/workflows/codeql.yml'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java build
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-caches

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # Trace the real Java toolchain, dependencies and generated clients rather than guessing them.
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Compile Java for analysis
        if: matrix.language == 'java-kotlin'
        working-directory: server
        # Extraction observes javac: restored classes and a reused Gradle daemon bypass it.
        # This produces analysis inputs, never the packaged server that CI tests and ships.
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache -PcodeqlExtraction=true clean :application:testClasses

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
