# Promotes successful main builds through the environment-protected promotion workflow.
name: Release / Continuous staging

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Nothing from the run is checked out or executed.
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  follow-main:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write # dispatch the promotion workflow
    steps:
      # The promotion run owns the outcome: its result, its deployment record and the host metrics.
      # Watching it here would hold a runner for the whole promotion.
      - name: Follow this commit on staging
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          url=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/promote.yml/dispatches" \
            -f ref=main -f 'inputs[environment]=Staging' -f "inputs[commit]=$COMMIT" \
            -f 'inputs[automatic]=true' -F return_run_details=true --jq '.html_url')
          [[ "$url" == https://* ]] || { echo "::error::Dispatch returned no run URL"; exit 1; }
          echo "Promotion of $COMMIT: $url" | tee -a "$GITHUB_STEP_SUMMARY"
