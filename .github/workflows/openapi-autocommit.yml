name: API

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions: {}

concurrency:
  group: openapi-autocommit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate spec and client
    # A fork's token is read-only, so nothing could be pushed back; skip the whole run.
    if: >-
      ${{ github.event.label.name == 'autocommit-openapi'
        && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - name: Set up Java build
        uses: ./.github/actions/setup-caches
      - name: Generate OpenAPI spec and client
        run: vp run generate:api
      - name: Upload generated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-openapi-${{ github.run_id }}
          path: |
            server/openapi.yaml
            webapp/src/api
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit generated files
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commit generated files to the PR branch
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # Holds the write token: it installs no dependencies, and nothing from the artifact is run.
      - name: Checkout PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      - name: Remove checked-in client
        run: rm -rf webapp/src/api
      - name: Download generated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-openapi-${{ github.run_id }}
          path: .
      - name: Commit generated files
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          # Stale runs fail closed: a branch that moved since the label was applied rejects the
          # commit rather than replacing whatever moved it.
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/commit-via-api.ts \
            --branch "$HEAD_BRANCH" \
            --expected-head "$EXPECTED_HEAD" \
            --message "chore: update API specs and client" \
            -- server/openapi.yaml webapp/src/api

  report:
    name: Report result
    if: >-
      ${{ always()
        && github.event.label.name == 'autocommit-openapi'
        && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [generate, commit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write # remove the label and comment on the PR
    steps:
      - name: Remove label and report result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          COMMIT_RESULT: ${{ needs.commit.result }}
          CHANGED: ${{ needs.commit.outputs.changed }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$REPOSITORY/issues/$PR_NUMBER/labels/autocommit-openapi" || true
          if [ "$GENERATE_RESULT" != success ]; then
            comment="🤖 Generating the OpenAPI spec and client failed, so nothing was committed. See the workflow run for the error."
          elif [ "$COMMIT_RESULT" != success ]; then
            comment="🤖 The generated OpenAPI files could not be committed. The branch may have changed during generation; rerun the workflow."
          elif [ "$CHANGED" = true ]; then
            comment="🤖 OpenAPI specs and clients have been automatically updated and committed."
          else
            comment="🤖 No OpenAPI changes were needed — everything is already up to date."
          fi
          gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$comment"
