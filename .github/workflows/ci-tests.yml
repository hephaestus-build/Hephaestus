name: CI / Tests

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      application_server_changed:
        description: "Whether application-server files changed"
        required: false
        type: string
        default: "true"
      postgres_base_sha:
        description: "Commit whose published PostgreSQL image the integration tests reuse"
        required: true
        type: string
      postgres_image_changed:
        description: "Whether this run changed the PostgreSQL image inputs"
        required: false
        type: string
        default: "false"
      migration_only:
        description: "Whether this fast-tier PR changes only migration files and release notes"
        required: true
        type: string
      queue_tier:
        description: "Whether integration tests are selected by this run"
        required: true
        type: string

permissions: {}

env:
  INTEGRATION_COUNT: "8"
  SERVER_BUILD_ARTIFACT: server-build-${{ github.run_id }}
  # The suites run the package job's compiled classes. docs/contributor/ci-cd.mdx § Build once says why.
  ORG_GRADLE_PROJECT_packagedServer: "true"

jobs:
  server-verification:
    name: Unit
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true' && inputs.migration_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    env:
      TEST_TIER: unit
    steps: &verification-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
      - uses: ./.github/actions/restore-server-build
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - name: Verify test tier and shard discovery
        if: env.TEST_TIER == 'architecture'
        run: vp run test:server:selection
      # The unit tier also checks the coverage floors.
      - name: Run the tier's tests
        env:
          TASK: test:server:${{ env.TEST_TIER }}
        run: vp run "$TASK"
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: "Test Results - Server ${{ env.TEST_TIER }}"
          path: "server/application/build/test-results/*/TEST-*.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ job.status == 'failure' && 50 || 0 }}
          fail-on-error: false
      - name: Retain raw test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ env.TEST_TIER }}-reports-${{ github.run_attempt }}
          path: server/application/build/test-results
          retention-days: 14
          if-no-files-found: warn

  server-architecture:
    name: Architecture
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true' && inputs.migration_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    env:
      TEST_TIER: architecture
    steps: *verification-steps

  server-integration:
    name: Integration (review)
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    env:
      INTEGRATION_SHARD: "review"
    steps: &integration-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
      - uses: ./.github/actions/restore-server-build
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - uses: ./.github/actions/postgres-image
        with:
          base-sha: ${{ inputs.postgres_base_sha }}
          image-changed: ${{ inputs.postgres_image_changed }}
          tag: hephaestus-postgres:ci
      - name: Run integration tests
        env:
          HEPHAESTUS_INTEGRATION_SHARD: ${{ env.INTEGRATION_SHARD }}
          HEPHAESTUS_TEST_POSTGRES_IMAGE: hephaestus-postgres:ci
        run: vp run test:server:integration
      - name: List the shard's classes
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ env.INTEGRATION_SHARD }}
        run: node scripts/integration-test-durations.ts summary "$SHARD" server/application/build/test-results/integrationTest
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: "Test Results - Integration (${{ env.INTEGRATION_SHARD == 'review' && 'review' || format('{0} of {1}', env.INTEGRATION_SHARD, env.INTEGRATION_COUNT) }})"
          path: "server/application/build/test-results/integrationTest/TEST-*.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ job.status == 'failure' && 50 || 0 }}
          fail-on-error: false
      - name: Retain raw test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-integration-${{ env.INTEGRATION_SHARD }}-reports-${{ github.run_attempt }}
          path: server/application/build/test-results/integrationTest
          retention-days: 14
          if-no-files-found: warn
      - name: Retain dependency verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-integration-${{ env.INTEGRATION_SHARD }}-dependency-verification-${{ github.run_attempt }}
          path: server/build/reports/dependency-verification
          retention-days: 14
          if-no-files-found: ignore

  server-integration-1:
    name: Integration (1 of 8)
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true' && inputs.queue_tier == 'true'
    runs-on: ubuntu-latest
