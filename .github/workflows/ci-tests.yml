name: CI / Tests

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      application_server_changed:
        description: "Whether application-server files changed"
        required: false
        type: string
        default: "true"
      postgres_base_sha:
        description: "Commit whose published PostgreSQL image the integration tests reuse"
        required: true
        type: string
      postgres_image_changed:
        description: "Whether this run changed the PostgreSQL image inputs"
        required: false
        type: string
        default: "false"
      shard:
        description: "The unit or architecture tier, or the integration shard `review` or a numbered one, selected by the caller"
        required: true
        type: string
      queue_tier:
        description: "Whether integration tests are selected by this run"
        required: true
        type: string

permissions: {}

env:
  SERVER_BUILD_ARTIFACT: server-build-${{ github.run_id }}
  # The suites run the package job's compiled classes. docs/contributor/ci-cd.mdx § Build once says why.
  ORG_GRADLE_PROJECT_packagedServer: "true"

jobs:
  # The unit and the architecture tier run in jobs of their own: the unit tier is the longest
  # chain after the package job, and in one job its forks would share two workers with the
  # architecture tier. ci-cd.mdx § Parallelism and concurrency.
  server-verification:
    name: "App Server: ${{ inputs.shard == 'unit' && 'Unit' || 'Architecture' }}"
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true' && (inputs.shard == 'unit' || inputs.shard == 'architecture')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
      - uses: ./.github/actions/restore-server-build
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - name: Verify test tier and shard discovery
        if: inputs.shard == 'architecture'
        run: vp run test:server:selection
      # The unit tier also checks the coverage floors.
      - name: Run the tier's tests
        env:
          TASK: test:server:${{ inputs.shard }}
        run: vp run "$TASK"
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - App Server ${{ inputs.shard }}"
          path: "server/application/build/test-results/*/TEST-*.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ job.status == 'failure' && 50 || 0 }}
          fail-on-error: false
      - name: Retain raw test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ inputs.shard }}-reports-${{ github.run_attempt }}
          path: server/application/build/test-results
          retention-days: 14
          if-no-files-found: warn

  server-integration:
    name: "App Server: Integration (${{ inputs.shard }})"
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true' && inputs.shard != 'unit' && inputs.shard != 'architecture' && (inputs.queue_tier == 'true' || inputs.shard == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
      - uses: ./.github/actions/restore-server-build
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - uses: ./.github/actions/postgres-image
        with:
          base-sha: ${{ inputs.postgres_base_sha }}
          image-changed: ${{ inputs.postgres_image_changed }}
          tag: hephaestus-postgres:ci
      - name: Run integration tests
        env:
          HEPHAESTUS_INTEGRATION_SHARD: ${{ inputs.shard }}
          HEPHAESTUS_TEST_POSTGRES_IMAGE: hephaestus-postgres:ci
        run: vp run test:server:integration
      - name: List the shard's classes
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ inputs.shard }}
        run: node scripts/integration-test-durations.ts summary "$SHARD" server/application/build/test-results/integrationTest
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - App Server Integration (${{ inputs.shard }})"
          path: "server/application/build/test-results/integrationTest/TEST-*.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ job.status == 'failure' && 50 || 0 }}
          fail-on-error: false
      - name: Retain raw test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-integration-${{ inputs.shard }}-reports-${{ github.run_attempt }}
          path: server/application/build/test-results/integrationTest
          retention-days: 14
          if-no-files-found: warn
      - name: Retain dependency verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-integration-${{ inputs.shard }}-dependency-verification-${{ github.run_attempt }}
          path: server/build/reports/dependency-verification
          retention-days: 14
          if-no-files-found: ignore

  fail-fast:
    needs: [server-verification, server-integration]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/fail-fast.yml
    permissions:
      actions: write
