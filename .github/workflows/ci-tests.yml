    steps: *integration-steps

  server-integration-8:
    name: Integration (8 of 8)
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true' && inputs.queue_tier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    env:
      INTEGRATION_SHARD: "8"
    steps: *integration-steps

  fail-fast-server-verification:
    name: Stop the merge group early
    needs: [server-verification]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  fail-fast-server-architecture:
