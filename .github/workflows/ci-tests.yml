name: Test

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      application_server_changed:
        description: "Whether application-server files changed"
        required: false
        type: string
        default: "true"
      postgres_base_sha:
        description: "Commit whose published PostgreSQL image the integration tests reuse"
        required: true
        type: string
      postgres_image_changed:
        description: "Whether this run changed the PostgreSQL image inputs"
        required: false
        type: string
        default: "false"
      queue_tier:
        description: "Whether the run also verifies the queue tier (docs/contributor/ci-cd.mdx § Two verification tiers)"
        required: true
        type: string

permissions: {}

env:
  SERVER_BUILD_ARTIFACT: server-build-${{ github.run_id }}
  # The suites run the package job's compiled classes. docs/contributor/ci-cd.mdx § Build once says why.
  ORG_GRADLE_PROJECT_packagedServer: "true"

jobs:
  server-verification:
    name: "App Server: Unit and architecture"
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
      - uses: ./.github/actions/restore-server-build
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - name: Verify test tier and shard discovery
        run: vp run test:server:selection
      - name: Run unit and architecture tests with coverage floors
        run: vp run test:server:verification
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - App Server Verification"
          path: "server/application/build/test-results/*/TEST-*.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ job.status == 'failure' && 50 || 0 }}
          fail-on-error: false
      - name: Retain raw test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-verification-reports-${{ github.run_attempt }}
          path: server/application/build/test-results
          retention-days: 14
          if-no-files-found: warn

  server-integration:
    name: "App Server: Integration (${{ matrix.shard }})"
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true' && inputs.queue_tier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: providers
          - shard: practices-and-agent
          - shard: application
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
      - uses: ./.github/actions/restore-server-build
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - uses: ./.github/actions/postgres-image
        with:
          base-sha: ${{ inputs.postgres_base_sha }}
          image-changed: ${{ inputs.postgres_image_changed }}
          tag: hephaestus-postgres:ci
      - name: Run integration tests
        env:
          HEPHAESTUS_INTEGRATION_SHARD: ${{ matrix.shard }}
          HEPHAESTUS_TEST_POSTGRES_IMAGE: hephaestus-postgres:ci
        run: vp run test:server:integration
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - App Server Integration (${{ matrix.shard }})"
          path: "server/application/build/test-results/integrationTest/TEST-*.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ job.status == 'failure' && 50 || 0 }}
          fail-on-error: false
      - name: Retain raw test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-integration-${{ matrix.shard }}-reports-${{ github.run_attempt }}
          path: server/application/build/test-results/integrationTest
          retention-days: 14
          if-no-files-found: warn
      - name: Retain dependency verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-integration-${{ matrix.shard }}-dependency-verification-${{ github.run_attempt }}
          path: server/build/reports/dependency-verification
          retention-days: 14
          if-no-files-found: ignore
