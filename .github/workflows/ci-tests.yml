name: Test

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      application_server_changed:
        description: "Whether application-server files changed"
        required: false
        type: string
        default: "true"

permissions: {}

# Test compilation runs independently of release packaging to avoid a serial build dependency.
jobs:
  server-verification:
    name: "App Server: Unit and architecture"
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
        with:
          cache-type: application-server-reactor
          os: ${{ runner.os }}
      - name: Run unit and architecture tests with coverage floors
        run: vp run test:server:verification
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - App Server Verification"
          path: "server/application/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false
      - name: Retain raw test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-verification-reports-${{ github.run_attempt }}
          path: server/application/target/surefire-reports
          retention-days: 14
          if-no-files-found: warn

  server-integration:
    name: "App Server: Integration (${{ matrix.shard }})"
    if: inputs.should_skip != 'true' && inputs.application_server_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Surefire's test selector replaces includes; an exclusion-only shard covers the remainder.
          - shard: providers-and-startup
            tests: "de/tum/cit/aet/hephaestus/integration/**,de/tum/cit/aet/hephaestus/StartupBudgetIntegrationTest"
          - shard: application
            tests: "!de/tum/cit/aet/hephaestus/integration/**,!de/tum/cit/aet/hephaestus/StartupBudgetIntegrationTest"
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
        with:
          cache-type: application-server-reactor
          os: ${{ runner.os }}
      - name: Run integration tests
        env:
          HEPHAESTUS_INTEGRATION_TESTS: ${{ matrix.tests }}
        run: vp run test:server:integration
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - App Server Integration (${{ matrix.shard }})"
          path: "server/application/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false
      - name: Retain raw test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-integration-${{ matrix.shard }}-reports-${{ github.run_attempt }}
          path: server/application/target/surefire-reports
          retention-days: 14
          if-no-files-found: warn
