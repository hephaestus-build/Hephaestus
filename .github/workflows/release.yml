name: Release / Publish

# Versioning contract: docs/admin/compatibility-policy.mdx

on:
  workflow_dispatch:
    inputs:
      promote-candidate:
        description: Promote the latest immutable vX.Y.Z-rc.N on the exact main commit, without rebuilding images
        required: true
        type: string
  workflow_run: # zizmor: ignore[dangerous-triggers] The guard authenticates the completed run before privileged jobs start.
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]

# The lock sits on the jobs it is actually for — promotion of the moving series and latest tags —
# rather than on the whole run, so a release can never hold the group open waiting on something
# outside those jobs. Deployment is not part of this workflow: hosts pull a signed channel, which
# the Release / Promote workflow publishes. See docs/admin/pull-based-deployment.
permissions: {}

jobs:
  release:
    # Only real pushes to our own main — a fork PR's CI/CD run reports
    # head_branch of the fork; without these guards a fork branch named "main"
    # could drive the privileged release job.
    if: >-
      ${{ (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        && inputs.promote-candidate != '') }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      # No release is created here — tag-images creates the draft once the evidence gate has
      # passed. Draft releases are invisible to tokens without push access, and the plan turns on
      # whether this version's release is a draft, so listing them still needs write.
      contents: write
    outputs:
      released: ${{ steps.cut.outputs.released }}
      version: ${{ steps.cut.outputs.version }}
      major: ${{ steps.cut.outputs.major }}
      minor: ${{ steps.cut.outputs.minor }}
      tag_name: ${{ steps.cut.outputs.tag_name }}
      previous_version: ${{ steps.cut.outputs.previous_version }}
      sha: ${{ steps.cut.outputs.sha }}
      migrations: ${{ steps.cut.outputs.migrations }}
      candidate: ${{ steps.cut.outputs.candidate }}
      prerelease: ${{ steps.cut.outputs.prerelease }}
      notes_version: ${{ steps.cut.outputs.notes_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"

      # scripts/plan-release.ts owns release eligibility, including pending changesets.
      # Planning creates nothing. tag-images creates the draft only after the evidence gate.
      - name: Plan the release for this commit
        id: cut
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CANDIDATE: ${{ inputs.promote-candidate }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # The commit CI/CD built has to be one of ours; everything downstream checks it out.
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "::error::Commit $SHA is not on main"; exit 1; }

          if [ "$EVENT" = workflow_dispatch ] && [ -z "$CANDIDATE" ]; then
            echo "::error::A manual release must select a qualified candidate"; exit 1
          fi
          if [ -n "$CANDIDATE" ]; then
            node scripts/plan-release.ts --candidate "$CANDIDATE" "$SHA"
          else
            node scripts/plan-release.ts "$SHA"
          fi

      - name: Summary
        if: steps.cut.outputs.released == 'true'
        run: |
          echo "## Preparing ${{ steps.cut.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Evidence verification is in progress; the draft is created once it passes." >> "$GITHUB_STEP_SUMMARY"

  # The notes need the Markdown parser, so they are rendered here, with the dependencies installed
  # and read-only access, and not in the job that signs and creates the release.
  release-notes:
    needs: release
    if: needs.release.outputs.released == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the released tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      # CHANGELOG.md as checked out at the released commit: every section since the release the
      # upgrade test seeds from, so the notes of a version that never published are not lost.
      - name: Render the release notes
        id: render
        env:
          VERSION: ${{ needs.release.outputs.version }}
          NOTES_VERSION: ${{ needs.release.outputs.notes_version }}
          PREVIOUS_VERSION: ${{ needs.release.outputs.previous_version }}
          RELEASE: ${{ needs.release.outputs.tag_name }}
          COMMIT: ${{ needs.release.outputs.sha }}
          MIGRATIONS: ${{ needs.release.outputs.migrations }}
        run: |
          set -euo pipefail
          node scripts/plan-release.ts --notes "$PREVIOUS_VERSION" "$NOTES_VERSION" CHANGELOG.md notes.md
          node scripts/github-release-notes.ts notes.md release-body.md

      - name: Keep the complete notes and bounded description
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          overwrite: true
          path: |
            notes.md
            release-body.md
          if-no-files-found: error

  tag-images:
    needs: [release, release-notes]
    if: needs.release.outputs.released == 'true'
    # Moves `X.Y`, `latest` and the version tags; two releases must never interleave here.
    concurrency:
      group: release-promotion
      cancel-in-progress: false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
      contents: write # gh release create/upload, once the evidence gate has passed
    outputs:
      agent-pi-digest: ${{ steps.retag.outputs.agent-pi-digest }}
      application-server-digest: ${{ steps.retag.outputs.application-server-digest }}
      postgres-digest: ${{ steps.retag.outputs.postgres-digest }}
    steps:
      - name: Check out the released tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the rendered release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes

      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"

      - name: Install cosign for candidate verification
        if: needs.release.outputs.candidate != ''
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.4

      # The images this release promotes, resolved through the same script the pre-merge evidence
      # preflight resolves them with, so the two can never disagree about which artefact is subject.
      - name: Capture release image digests
        id: retag
        env:
          SOURCE_TAG: ${{ needs.release.outputs.sha }}
          CANDIDATE: ${{ needs.release.outputs.candidate }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE" ]; then
            node scripts/promote-release-candidate.ts capture "$CANDIDATE" "$SOURCE_TAG" "$RUNNER_TEMP/candidate" release-images.tsv
          else
            node scripts/resolve-release-images.ts "$SOURCE_TAG" release-images.tsv
          fi

      - name: Verify Node-only agent-pi sandbox
        id: sandbox-contract
        background: true
        env:
          IMAGE: ghcr.io/hephaestus-build/agent-pi@${{ steps.retag.outputs.agent-pi-digest }}
          LAYOUT: server/application/src/main/java/de/tum/cit/aet/hephaestus/agent/runtime/SandboxLayout.java
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c \
            'node --version && for runtime in npm npx corepack yarn yarnpkg pnpm pnpx; do ! command -v "$runtime" || exit 1; done'

          expected=$(grep -oE 'RUNTIME_CONTRACT_VERSION = [0-9]+' "$LAYOUT" | grep -oE '[0-9]+$')
          [ -n "$expected" ] || { echo "::error::Could not read RUNTIME_CONTRACT_VERSION from $LAYOUT"; exit 1; }
          declared=$(docker inspect --format '{{index .Config.Labels "hephaestus.agent.runtime-contract"}}' "$IMAGE")
          if [ "$declared" != "$expected" ]; then
            echo "::error::agent-pi implements runtime contract '${declared:-<none>}' but the released server stages for v${expected} — refusing to publish a pin for an unmatched pair."
            exit 1
          fi
          echo "agent-pi implements runtime contract v${expected}"

      - uses: ./.github/actions/setup-release-security-tools

      # The database the whole evidence bundle is scanned against: recorded into the bundle, and
      # refused beyond the freshness limit, so a stale mirror cannot be signed as a fresh scan.
      - uses: ./.github/actions/download-trivy-db
        with:
          max-age-hours: "48"
          java-db: "true"
          metadata-path: evidence/trivy-db.json

      - wait: sandbox-contract

      - name: Generate and enforce release evidence
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.release.outputs.tag_name }}
          COMMIT: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/generate-release-evidence.ts evidence \
            --release "$RELEASE" --commit "$COMMIT" --digests release-images.tsv
          node scripts/verify-release-evidence.ts evidence --write-validation
          # Rekor v2 logs the signed envelope's digest, so complete SBOMs do not exceed v1 request limits.
          cosign signing-config create --with-default-rekor-v2 --out "$RUNNER_TEMP/rekor-v2-signing.json"
          jq -er '.subjects[] | select(.provenance == "first-party") | [.repository, .digest, .image, .platform] | @tsv' evidence/manifest.json |
          while IFS=$'\t' read -r repository digest image platform; do
            suffix=${platform//\//-}
            node scripts/keyless-sign.ts attest --signing-config "$RUNNER_TEMP/rekor-v2-signing.json" --yes --type spdxjson --predicate "evidence/$image-$suffix.spdx.json" "$repository@$digest"
          done
          cp release-notes/notes.md evidence/release-notes.md
          (cd evidence && sha256sum -- * > SHA256SUMS)
          node scripts/keyless-sign.ts sign-blob --yes --bundle evidence/SHA256SUMS.sigstore.json evidence/SHA256SUMS

      - name: Verify evidence from registry subjects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-evidence.ts evidence --verify-signatures

      - uses: ./.github/actions/setup-helm

      # The chart is packaged from a copy of this checkout, the released commit, at the release
      # version. Its values pin the images of the verified evidence; the lock that names the
      # package's digest is written after the push.
      - name: Publish the chart by digest
        id: chart
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          SHA: ${{ needs.release.outputs.sha }}
          VERSION: ${{ needs.release.outputs.version }}
          CANDIDATE: ${{ needs.release.outputs.candidate }}
        run: |
          set -euo pipefail
          # The push writes the chart's version tag. Only an absent release or this commit's own
          # draft may take it; a published release keeps the chart its signed lock names.
          state=$(node scripts/plan-release.ts --source "$TAG_NAME" "$SHA" absent draft) || {
            echo "$state"; exit 1; }
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          mkdir "$RUNNER_TEMP/chart"
          if [ -n "$CANDIDATE" ]; then
            node scripts/plan-release.ts --candidate-source "$CANDIDATE" "$SHA"
            source="$RUNNER_TEMP/candidate/release-${CANDIDATE}.chart.json"
            mkdir "$RUNNER_TEMP/candidate-chart"
            node scripts/release-chart.ts verify "$source" "$CANDIDATE" security/release-images.json "$RUNNER_TEMP/candidate-chart" >/dev/null
          fi
          # The source commit and image digests match the candidate; only release metadata changes.
          node scripts/release-chart.ts publish "v${VERSION}" deploy/chart/hephaestus evidence/manifest.json \
            security/release-images.json "$RUNNER_TEMP/chart" > "$RUNNER_TEMP/chart.json"
          package="$RUNNER_TEMP/chart/hephaestus-${VERSION}.tgz"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          jq . "$RUNNER_TEMP/chart.json"

      # One typed joint lock from the verified evidence and the pushed chart. The schema 1 lock that
      # hosts on earlier releases read is derived from it and keeps its name and shape.
      - name: Write release image lock
        id: pin
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CANDIDATE: ${{ needs.release.outputs.candidate }}
        run: |
          set -euo pipefail
          ASSET="release-v${VERSION}.json"
          JOINT="release-v${VERSION}.chart.json"
          node scripts/release-image-lock.ts write evidence/manifest.json "$RUNNER_TEMP/chart.json" \
            "v${VERSION}" "$JOINT" "$ASSET"
          node scripts/release-image-lock.ts "$ASSET" evidence/manifest.json \
            "v${VERSION}" "$RUNNER_TEMP/release-lock.env"
          node scripts/release-image-lock.ts projection "$JOINT" "$ASSET" "v${VERSION}"
          if [ -n "$CANDIDATE" ]; then
            node scripts/promote-release-candidate.ts verify "$RUNNER_TEMP/candidate/release-${CANDIDATE}.chart.json" "$JOINT"
          fi
          echo "asset-path=$ASSET" >> "$GITHUB_OUTPUT"
          echo "joint-path=$JOINT" >> "$GITHUB_OUTPUT"
          jq . "$ASSET" "$JOINT"

      # The files of the one-host install, its installer included, as the released commit has them.
      - name: Collect the k3s platform assets
        run: |
          set -euo pipefail
          mkdir k3s-platform
          cp deploy/platform/k3s-* k3s-platform/

      - name: Generate subject checksums
        id: subjects
        env:
          ASSET: ${{ steps.pin.outputs.asset-path }}
          JOINT: ${{ steps.pin.outputs.joint-path }}
          CHART_PACKAGE: ${{ steps.chart.outputs.package }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r image _ digest; do
            printf '%s  %s\n' "${digest#sha256:}" "$image"
          done < release-images.tsv > subjects.sha256
          # The chart, as its OCI manifest and as its package bytes, is a subject of the release.
          jq -r '"\(.chart.digest | ltrimstr("sha256:"))  \(.chart.repository)"' "$JOINT" >> subjects.sha256
          printf '%s  %s\n' "$(sha256sum "$CHART_PACKAGE" | cut -d' ' -f1)" "$(basename "$CHART_PACKAGE")" \
            >> subjects.sha256
          sha256sum "$ASSET" "$JOINT" >> subjects.sha256
          (cd k3s-platform && sha256sum -- *) >> subjects.sha256
          cat subjects.sha256
          # purl namespace/name are canonically lowercase; derive them from the run
          # context so the attestation follows a repository transfer (issue #1599).
          echo "purl-repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Attest release image lock
        id: release-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: subjects.sha256
          predicate-type: https://in-toto.io/attestation/release/v0.1
          predicate: |
            { "purl": "pkg:github/${{ steps.subjects.outputs.purl-repository }}@${{ needs.release.outputs.tag_name }}" }

      # Both locks and the k3s platform assets, each with its own bundle, and the chart's digest in the
      # registry, all with the release workflow identity. Operators verify the chart with `cosign verify`
      # on that digest.
      - name: Sign release image lock
        env:
          ASSET: ${{ steps.pin.outputs.asset-path }}
          JOINT: ${{ steps.pin.outputs.joint-path }}
        run: |
          set -euo pipefail
          # The glob expands before the first bundle exists.
          for lock in "$ASSET" "$JOINT" k3s-platform/*; do
            node scripts/keyless-sign.ts sign-blob --yes --bundle "${lock}.sigstore.json" "$lock"
          done
          chart=$(jq -er '"\(.chart.repository)@\(.chart.digest)"' "$JOINT")
          node scripts/keyless-sign.ts sign --yes "$chart"

      - name: Verify signature with the deploy-side identity (fail fast)
        env:
          ASSET: ${{ steps.pin.outputs.asset-path }}
          JOINT: ${{ steps.pin.outputs.joint-path }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          for lock in "$ASSET" "$JOINT" $(find k3s-platform -type f ! -name '*.sigstore.json' | sort); do
            cosign verify-blob \
              --bundle "${lock}.sigstore.json" \
              --certificate-identity '${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$lock"
          done
          # The chart the joint lock names: its registry signature, and the package pulled back by digest,
          # whose values must pin exactly the lock's images.
          mkdir "$RUNNER_TEMP/chart-verified"
          node scripts/release-chart.ts verify "$JOINT" "v${VERSION}" security/release-images.json \
            "$RUNNER_TEMP/chart-verified"

      # First and only write to the release surface: every step above fails without creating one,
      # so a rejected release leaves no draft to delete and no tag — a draft materialises none —
      # and the version re-cuts unchanged from a commit that carries the fix.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.sha }}
          CANDIDATE: ${{ needs.release.outputs.candidate }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The release job planned outside the promotion lock, so another run may have written this
          # version since. Only an absent release or this commit's own draft takes this evidence.
          state=$(node scripts/plan-release.ts --source "$TAG_NAME" "$SHA" absent draft) || {
            echo "$state"; exit 1; }
          if [ "$state" = draft ]; then
            echo "Resuming the existing draft $TAG_NAME."
            exit 0
          fi

          [ -s release-notes/release-body.md ] || { echo "::error::No release description for $TAG_NAME"; exit 1; }
          if [ -n "$CANDIDATE" ]; then node scripts/plan-release.ts --candidate-source "$CANDIDATE" "$SHA"; fi
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG_NAME" --draft \
            "${flags[@]}" \
            --title "$TAG_NAME" \
            --notes-file release-notes/release-body.md \
            --target "$SHA" \
            --repo "${{ github.repository }}"

      - name: Upload release image lock to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          SHA: ${{ needs.release.outputs.sha }}
          ASSET: ${{ steps.pin.outputs.asset-path }}
          ATTESTATION: ${{ steps.release-attestation.outputs.bundle-path }}
          JOINT: ${{ steps.pin.outputs.joint-path }}
        run: |
          set -euo pipefail
          # Assets replace those of this commit's own draft only.
          node scripts/plan-release.ts --source "$TAG_NAME" "$SHA" draft
          # The release attestation is also in GitHub's attestation store; as an asset, it travels
          # with the release, under the name provenance tools look for.
          provenance="$RUNNER_TEMP/release-${TAG_NAME}.intoto.jsonl"
          cp "$ATTESTATION" "$provenance"
          # --clobber so a re-run over a resumed draft replaces its assets instead of failing on
          # every name that already exists.
          gh release upload "$TAG_NAME" \
            "$ASSET" "${ASSET}.sigstore.json" "$provenance" "$JOINT" "${JOINT}.sigstore.json" \
            k3s-platform/* evidence/* \
            --clobber \
            --repo "${{ github.repository }}"

  upgrade-test:
    needs: [release, tag-images]
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/release-upgrade.yml
    permissions:
      contents: read
      packages: read
    with:
      # The previous release keeps the namespace it was published under (GHCR packages
      # do not transfer between organizations — issue #1599), so the reusable workflow
      # resolves its repository per version from security/release-identities.json.
      previous-version: ${{ needs.release.outputs.previous_version }}
      candidate-application-image: ghcr.io/hephaestus-build/application-server@${{ needs.tag-images.outputs.application-server-digest }}
      postgres-image: ghcr.io/hephaestus-build/postgres@${{ needs.tag-images.outputs.postgres-digest }}
      candidate-source-sha: ${{ needs.release.outputs.sha }}

  # The one-host install on k3s, on both supported architectures, from the draft's own assets.
  k3s-host-smoke:
    needs: [release, tag-images]
    if: needs.release.outputs.released == 'true'
    name: k3s host smoke
    uses: ./.github/workflows/release-host-smoke.yml
    permissions:
      # The release is still a draft here, so its assets require authenticated push access.
      contents: write
      packages: read
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      sha: ${{ needs.release.outputs.sha }}

  publish-release:
    needs: [release, tag-images, upgrade-test, k3s-host-smoke]
    if: needs.release.outputs.released == 'true'
    # Same lock as the tag moves: publication is the other half of that promotion.
    concurrency:
      group: release-promotion
      cancel-in-progress: false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: read
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"

      - name: Install Cosign
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.4

      # Verifying the durable assets pulls the chart by its locked digest.
      - uses: ./.github/actions/setup-helm

      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download k3s host smoke records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: host-smoke-k3s-*
          path: host-smoke-k3s
          merge-multiple: true

      - name: Verify k3s host smoke records
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          jq -s -e --arg release "$TAG_NAME" --arg commit "$RELEASE_SHA" '
            length == 2 and
            ([.[].host.architecture] | sort) == ["amd64", "arm64"] and
            all(.[];
              .schemaVersion == 1 and .release == $release and .commit == $commit and
              (.testedAt | sub("\\.[0-9]{3}Z$"; "Z") | fromdateiso8601) and
              .host.os == "Ubuntu 24.04" and
              (.host.kernel | type) == "string" and (.host.kernel | length) > 0 and
              (.host.kubeletVersion | startswith("v")) and
              (.workers | type) == "number" and .workers > 0 and .workers == (.workers | floor) and
              .checks == {install: true, secondInstall: true, upgrade: true,
                workloadsReady: true, isolation: true, reviewsEnabled: true,
                gateway: true, shutdownBudget: true, statefulPodsPreserved: true,
                secretsPreserved: true})' host-smoke-k3s/*.json >/dev/null

      - name: Verify durable assets from a clean environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir evidence
          gh release download "$TAG_NAME" --repo "${{ github.repository }}" --dir evidence
          lock="release-${TAG_NAME}.json"
          cosign verify-blob \
            --bundle "evidence/$lock.sigstore.json" \
            --certificate-identity '${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "evidence/$lock"
          jq -e --arg commit "$RELEASE_SHA" '.commit == $commit' "evidence/$lock" >/dev/null || {
            echo "::error::Release lock does not cover the qualified source commit"; exit 1; }
          node scripts/release-image-lock.ts "evidence/$lock" evidence/manifest.json \
            "$TAG_NAME" "$RUNNER_TEMP/release-lock.env"
          # The joint lock: signed with the same identity, and exactly the schema 1 lock plus the chart.
          joint="release-${TAG_NAME}.chart.json"
          cosign verify-blob \
            --bundle "evidence/$joint.sigstore.json" \
            --certificate-identity '${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "evidence/$joint"
          node scripts/release-image-lock.ts projection "evidence/$joint" "evidence/$lock" "$TAG_NAME"
          # The chart by the locked digest: its registry signature, metadata, values that pin exactly the
          # lock's images, and the release attestation that release.yml made for it.
          mkdir "$RUNNER_TEMP/chart"
          package=$(node scripts/release-chart.ts verify "evidence/$joint" "$TAG_NAME" \
            security/release-images.json "$RUNNER_TEMP/chart")
          gh attestation verify "$package" --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
            --predicate-type https://in-toto.io/attestation/release/v0.1
          # Exercise the installed verifier composition against the signed draft assets.
          mkdir "$RUNNER_TEMP/installed-chart"
          node scripts/prepare-release-chart.ts "$TAG_NAME" "$RELEASE_SHA" \
            "$RUNNER_TEMP/installed-chart" helm security/release-images.json
          node scripts/verify-release-evidence.ts evidence --verify-signatures
          gh attestation verify "evidence/$lock" \
            --bundle "evidence/release-${TAG_NAME}.intoto.jsonl" \
            --predicate-type https://in-toto.io/attestation/release/v0.1 \
            --repo "${{ github.repository }}"
          # The k3s platform assets of the one-host install, with the same identity.
          [ -f evidence/k3s-platform.yaml ] || { echo "::error::The release has no k3s-platform.yaml"; exit 1; }
          for file in $(find evidence -name 'k3s-*' ! -name '*.sigstore.json' | sort); do
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity '${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "$file" >/dev/null
          done
          asset="evidence/release-${TAG_NAME}.json"
          cosign verify-blob --bundle "${asset}.sigstore.json" \
            --certificate-identity '${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "$asset" >/dev/null

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          CANDIDATE: ${{ needs.release.outputs.candidate }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The draft, or the published release and its tag, must belong to the qualified commit
          # before this run writes anything to it.
          state=$(node scripts/plan-release.ts --source "$TAG_NAME" "$RELEASE_SHA" draft published) || {
            echo "$state"; exit 1; }
          if [ "$state" = draft ]; then
            if [ -n "$CANDIDATE" ]; then node scripts/plan-release.ts --candidate-source "$CANDIDATE" "$RELEASE_SHA"; fi
            gh release upload "$TAG_NAME" host-smoke-k3s/*.json --clobber --repo "${{ github.repository }}"
            flags=(--draft=false "--prerelease=$PRERELEASE")
            if [ "$PRERELEASE" = true ]; then flags+=(--latest=false); fi
            gh release edit "$TAG_NAME" --repo "${{ github.repository }}" "${flags[@]}"
          else
            # A failed alias promotion leaves an immutable release. Its assets must match the
            # qualified artifacts from this run; retrying must never replace published evidence.
            for architecture in amd64 arm64; do
              cmp "host-smoke-k3s/host-smoke-k3s-$architecture.json" "evidence/host-smoke-k3s-$architecture.json" || {
                echo "::error::Published $architecture host smoke record differs or is missing; refusing image aliases"; exit 1; }
            done
          fi
          [ "$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json isImmutable --jq .isImmutable)" = true ] || {
            echo "::error::The published release is not immutable; refusing to promote image aliases"; exit 1; }
          [ "$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)" = "$PRERELEASE" ] || {
            echo "::error::The published release has the wrong prerelease flag"; exit 1; }
          # Publication creates the tag at the draft's target. Aliases move only if it names this commit.
          node scripts/plan-release.ts --source "$TAG_NAME" "$RELEASE_SHA" published

      - name: Promote verified image digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SERIES: ${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
        run: |
          set -euo pipefail
          jq -er '[.subjects[] | select(.provenance == "first-party") | [.repository, .indexDigest]] | unique[] | @tsv' \
            evidence/manifest.json > "$RUNNER_TEMP/promotions.tsv"

          # Resolve every immutable source before changing aliases. OCI registries update one tag
          # at a time, so retries and final verification recover any interrupted promotion.
          while IFS=$'\t' read -r ref digest; do
            source=$(docker buildx imagetools inspect "$ref@$digest" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$source" = "$digest" ] || { echo "::error::Cannot resolve promotion source $ref@$digest"; exit 1; }
          done < "$RUNNER_TEMP/promotions.tsv"

          # The planner owns release ordering; the promotion lock holds through all alias writes.
          jq -e --arg tag "v$VERSION" '.release == $tag' evidence/manifest.json >/dev/null || {
            echo "::error::Release version does not match verified evidence; refusing image aliases"; exit 1; }
          node scripts/plan-release.ts --promote "$VERSION"
          aliases=$(node scripts/plan-release.ts --aliases "$VERSION")
          [ -n "$aliases" ] || { echo "::error::No image aliases selected"; exit 1; }
          mapfile -t tags <<< "$aliases"
          while IFS=$'\t' read -r ref digest; do
            flags=()
            for tag in "${tags[@]}"; do flags+=(-t "$ref:$tag"); done
            docker buildx imagetools create "${flags[@]}" "$ref@$digest"
          done < "$RUNNER_TEMP/promotions.tsv"
          while IFS=$'\t' read -r ref digest; do
            for tag in "${tags[@]}"; do
              promoted=$(docker buildx imagetools inspect "$ref:$tag" --format '{{json .Manifest}}' | jq -r .digest)
              [ "$promoted" = "$digest" ] || { echo "::error::Promotion changed $ref:$tag digest"; exit 1; }
            done
          done < "$RUNNER_TEMP/promotions.tsv"
