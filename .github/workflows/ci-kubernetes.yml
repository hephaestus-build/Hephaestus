name: CI / Kubernetes

# The chart on real clusters, with this run's images: an install, an upgrade that rolls every role
# but PostgreSQL and NATS, each worker's isolation probe, and the sandbox isolation gate of each
# SandboxTemplate. docs/admin/kubernetes.mdx § Supported clusters states what these
# jobs show. They share scripts/kubernetes-cluster.ts with `vp run dev:kubernetes`.

on:
  workflow_call:
    inputs:
      commit:
        description: The commit whose images the Docker jobs published under its tag
        type: string
        required: true
      queue:
        description: Whether to add the lowest minor on amd64 and kind with Calico; a pull request runs the latest k3s alone
        type: boolean
        default: false
      arm64:
        description: Whether the queue's legs add the lowest minor on arm64; only the nightly run sets it, so that arm64 runners stay out of the merge queue
        type: boolean
        default: false
      backup-drill:
        description: Qualify replacement-storage recovery on the latest amd64 leg
        type: boolean
        default: false
      application-artifact:
        description: The package job's compiled server and tests; empty keeps a cluster-only qualification
        type: string
        default: ""
      ref:
        description: The commit whose chart and scripts to check out; empty checks out the caller's commit
        type: string
        default: ""

permissions: {}

env:
  # The schema sources of kubeconform, at pinned commits.
  KUBERNETES_SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/f7d855e49c34b039c9ef2196444910275e31e09e/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

  # One node image per minor, pinned by digest.
  K3S_IMAGES: >-
    {"1.35": "docker.io/rancher/k3s:v1.35.9-k3s1@sha256:ec9868c6a38d4e8c1869832fb5fd1eb8473c39794a0b44d2b952e7ba911951bc",
    "1.37": "docker.io/rancher/k3s:v1.37.2-k3s1@sha256:21ea6e0fac4e3930c2ce8aa40ddd41a8b18cb3e9a0222c030dc005e7e88c4332"}

# Leg names use the distribution, minor and architecture. Each summary records the pinned image.
# The lowest amd64 minor uses the small profile; other legs use dev. Only the latest uses gVisor.
jobs:
  k3d:
    name: k3s 1.37 amd64
    permissions:
      contents: read
      actions: read
      packages: read
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      KUBERNETES_MINOR: "1.37"
      KUBERNETES_ARCH: amd64
      PROFILES: --profile dev
      GVISOR: "true"
      # The drills of the latest minor on amd64 run on the pull request's own head, which the
      # `kubernetes` filter selects for every change they exercise, and each night on main. A
      # merge group installs and upgrades the combined tree only; the release preflight refuses
      # a release while the newest nightly run failed.
      DRILLS: ${{ github.event_name != 'merge_group' }}
    steps: &k3d-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        if: ${{ !(env.KUBERNETES_MINOR == '1.37' && env.KUBERNETES_ARCH == 'amd64') }}
        with:
          install: "none"
      - uses: ./.github/actions/setup-toolchain
        if: env.KUBERNETES_MINOR == '1.37' && env.KUBERNETES_ARCH == 'amd64'
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-helm
      - uses: ./.github/actions/setup-kubernetes-tools
      # The render runs `helm lint --strict` on each set of values before it renders them.
      - name: Lint the chart and validate every rendered resource on the lowest and the latest Kubernetes
        if: env.KUBERNETES_MINOR == '1.37' && env.KUBERNETES_ARCH == 'amd64'
        run: |
          set -euo pipefail
          node scripts/kubernetes-cluster.ts render > manifests.yaml
          # No public catalog carries the agent-sandbox kinds: their schemas come from the pinned definitions.
          node scripts/crd-schemas.ts deploy/platform/k3s-agent-sandbox.yaml platform-schemas
          for version in 1.35.0 1.37.0; do
            kubeconform -strict -summary -kubernetes-version "$version" \
              -schema-location "$KUBERNETES_SCHEMAS" \
              -schema-location "platform-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              -schema-location "$CRD_SCHEMAS" manifests.yaml
          done

      - uses: ./.github/actions/setup-caches
        if: ${{ inputs.application-artifact != '' && env.DRILLS == 'true' }}
      - uses: ./.github/actions/restore-server-build
        if: ${{ inputs.application-artifact != '' && env.DRILLS == 'true' }}
        with:
          artifact: ${{ inputs.application-artifact }}
      - name: Resolve this run's images
        env:
          COMMIT: ${{ inputs.commit }}
        run: node scripts/resolve-release-images.ts "$COMMIT" release-images.tsv
      - name: Free disk space for the cluster
        run: node scripts/prepare-kubernetes-runner.ts
      # k3s enforces NetworkPolicy with its embedded controller, so the isolation probe judges it.
      - name: Create a server and an agent node
        env:
          NODE_IMAGE: ${{ fromJSON(env.K3S_IMAGES)[env.KUBERNETES_MINOR] }}
        run: |
          set -euo pipefail
          echo "Node image: \`$NODE_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          runtime=()
          if [ "$GVISOR" = true ]; then
            # The one-host platform's runsc and containerd template, on every node.
            gvisor="$RUNNER_TEMP/gvisor"
            node scripts/kubernetes-cluster.ts gvisor --work "$gvisor"
            for file in runsc containerd-shim-runsc-v1 gvisor-bin; do
              runtime+=(--volume "$gvisor/$file:/usr/local/bin/$file@all")
            done
            runtime+=(--volume "$PWD/deploy/platform/k3s-containerd.toml.tmpl:/var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.tmpl@all")
          fi
          k3d cluster create hephaestus --agents 1 --image "$NODE_IMAGE" --wait \
            --k3s-arg "--kubelet-arg=pod-max-pids=4096@all" --port "127.0.0.1:443:443@loadbalancer" "${runtime[@]}"
      - name: Install, upgrade and verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/kubernetes-cluster"
          # The release serves through the Gateway of k3s's Traefik, as in `vp run dev:kubernetes`.
          node scripts/kubernetes-cluster.ts prepare --work "$work" --images release-images.tsv --commit "$COMMIT" --gateway
          node scripts/kubernetes-cluster.ts gateway --work "$work"
          if [ "$GVISOR" = true ]; then PROFILES="$PROFILES --set worker.sandbox.templates.runtimeClassName=gvisor"; fi
          # shellcheck disable=SC2086 # PROFILES is a list of flags.
          node scripts/kubernetes-cluster.ts install --work "$work" $PROFILES
          node scripts/kubernetes-cluster.ts verify
          # A second prepare keeps the Secrets that the database started with, as a second dev run does.
          node scripts/kubernetes-cluster.ts prepare --work "$work" --images release-images.tsv --commit "$COMMIT" --gateway
          # A changed release identity rolls every role but PostgreSQL and NATS, whose Pods must stay.
          # shellcheck disable=SC2086
          node scripts/kubernetes-cluster.ts upgrade --work "$work" $PROFILES --set "release.version=v0.0.1-cluster"
          node scripts/kubernetes-cluster.ts verify
          node scripts/kubernetes-cluster.ts request --work "$work"
      # A conversation turn runs bash in its tools Pod through a worker roll and then a loop roll.
      # The fake model provider runs in the Pod network, which k3s gives 10.42.0.0/16.
      - name: Keep a conversation turn through a worker roll and a loop roll
        if: ${{ env.DRILLS == 'true' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # PROFILES is a list of flags.
          node scripts/kubernetes-cluster.ts turn-roll --work "$RUNNER_TEMP/kubernetes-cluster" $PROFILES \
            --set "release.version=v0.0.1-cluster" --pod-cidr 10.42.0.0/16
      - name: Qualify the sandbox adapters in the chart worker Pod
        if: ${{ inputs.application-artifact != '' && env.DRILLS == 'true' }}
        run: |
          set -euo pipefail
          echo "Live sandbox kernel: $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
          node scripts/kubernetes-cluster.ts live --packaged
      # k3s gives Pods 10.42.0.0/16, where the drill's S3 server runs.
      # Nightly and relevant pull requests opt in; merge groups keep the destructive drill off their path.
      - name: Back up, then restore to a point in time
        if: ${{ inputs.backup-drill && env.KUBERNETES_MINOR == '1.37' && env.KUBERNETES_ARCH == 'amd64' }}
        run: node scripts/kubernetes-cluster.ts backup-drill --work "$RUNNER_TEMP/kubernetes-cluster" --pod-cidr 10.42.0.0/16
      # A node that joins gets the agent image from the DaemonSet, and its first sandbox pulls nothing.
      - name: Start a sandbox on a new node without an image pull
        if: ${{ env.KUBERNETES_MINOR == '1.37' && env.KUBERNETES_ARCH == 'amd64' }}
        run: |
          set -euo pipefail
          if [ "$GVISOR" = true ]; then set -- --gvisor "$RUNNER_TEMP/gvisor"; fi
          node scripts/sandbox-prepull-drill.ts "$@"
      - name: Verify kubelet memory eviction order on a disposable node
        if: ${{ env.DRILLS == 'true' }}
        run: node scripts/kubernetes-memory-drill.ts release-images.tsv
      - name: Record the cluster state
        if: ${{ failure() }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n hephaestus describe pods || true
          # A failed migration Job blocks every role; its own log names the cause.
          kubectl -n hephaestus logs -l app.kubernetes.io/component=migration --all-containers --tail=400 --prefix || true
          kubectl -n hephaestus logs -l app.kubernetes.io/component=postgresql --all-containers --tail=200 --prefix || true
          kubectl -n hephaestus logs -l app.kubernetes.io/component=worker --tail=300 --prefix || true
          kubectl -n hephaestus logs -l app.kubernetes.io/component=server --tail=300 --prefix || true
          kubectl -n hephaestus logs -l app.kubernetes.io/component=conversation-loop --tail=300 --prefix || true
          kubectl -n hephaestus get jobs,cronjobs -o wide || true
          kubectl -n hephaestus logs -l app.kubernetes.io/component=postgresql-backup --tail=200 --prefix || true
          kubectl -n hephaestus-sandboxes get pods,jobs -o wide || true
          kubectl -n hephaestus-sandboxes get sandboxtemplates,sandboxwarmpools,sandboxclaims,sandboxes -o wide || true
          kubectl -n hephaestus-sandboxes describe pods || true
          kubectl -n agent-sandbox-system logs deployment/agent-sandbox-controller --tail=200 || true
          # A runsc failure reaches the Pod events only as a failed task; containerd logs the cause.
          if [ "$GVISOR" = true ]; then
            for node in k3d-hephaestus-server-0 k3d-hephaestus-agent-0; do
              docker exec "$node" sh -c 'grep -i runsc /var/lib/rancher/k3s/agent/containerd/containerd.log | tail -n 100' || true
            done
          fi
          kubectl describe nodes | grep -A 12 "Allocated resources" || true

  k3d-1-35-amd64:
    name: k3s 1.35 amd64
    if: inputs.queue
    permissions:
      contents: read
      actions: read
      packages: read
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      KUBERNETES_MINOR: "1.35"
      KUBERNETES_ARCH: amd64
      PROFILES: --profile small
      GVISOR: "false"
      # The drills of the latest minor on amd64 run on the pull request's own head, which the
      # `kubernetes` filter selects for every change they exercise, and each night on main. A
      # merge group installs and upgrades the combined tree only; the release preflight refuses
      # a release while the newest nightly run failed.
      DRILLS: "false"
    steps: *k3d-steps

  k3d-1-35-arm64:
    name: k3s 1.35 arm64
    if: inputs.queue && inputs.arm64
    permissions:
      contents: read
      actions: read
      packages: read
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    env:
      KUBERNETES_MINOR: "1.35"
      KUBERNETES_ARCH: arm64
      PROFILES: --profile dev
      GVISOR: "false"
      # The drills of the latest minor on amd64 run on the pull request's own head, which the
      # `kubernetes` filter selects for every change they exercise, and each night on main. A
      # merge group installs and upgrades the combined tree only; the release preflight refuses
      # a release while the newest nightly run failed.
      DRILLS: "false"
    steps: *k3d-steps

  calico:
    name: "kind 1.35 Calico"
    if: inputs.queue
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      NODE_IMAGE: docker.io/kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
      CALICO_URL: https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml
      CALICO_SHA256: 2de8f47595fb9c41b3f47d7b767a1f8e72ecf84057af834738ff12689a234da5
      # Calico's default pool, which the operator's PostgreSQL gets its address from.
      POD_CIDR: 192.168.0.0/16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      - uses: ./.github/actions/setup-helm
      - uses: ./.github/actions/setup-kubernetes-tools
        with:
          gateway-api: "true"
      - name: Resolve this run's images
        env:
          COMMIT: ${{ inputs.commit }}
        run: node scripts/resolve-release-images.ts "$COMMIT" release-images.tsv
      - name: Free disk space for the cluster
        run: node scripts/prepare-kubernetes-runner.ts
      - name: Create three nodes with Calico
        run: |
          set -euo pipefail
          {
            echo "Node image: \`$NODE_IMAGE\`"
            echo "Calico: \`$CALICO_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat > kind.yaml <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: "$POD_CIDR"
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          EOF
          kind create cluster --name hephaestus --image "$NODE_IMAGE" --config kind.yaml
          # kind bind-mounts files over /sys/devices/virtual/dmi/id to give each node its own product id.
          # The kernel then refuses sysfs in a new user namespace, so no Pod with hostUsers: false starts.
          # The nodes have joined, so the kubelet no longer needs the ids.
          for node in $(kind get nodes --name hephaestus); do
            docker exec "$node" sh -c 'awk '\''$5 ~ "^/sys/devices/virtual/dmi/id/" { print $5 }'\'' /proc/self/mountinfo \
              | xargs -r -n1 umount && ! grep -q " /sys/devices/virtual/dmi/id/" /proc/self/mountinfo'
          done
          curl -fsSL --proto '=https' --retry 5 --retry-all-errors -o calico.yaml "$CALICO_URL"
          echo "$CALICO_SHA256  calico.yaml" | sha256sum -c -
          kubectl apply -f calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=10m
          kubectl wait --for=condition=Ready nodes --all --timeout=10m
      - name: Install with an external PostgreSQL, upgrade and verify
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/kubernetes-cluster"
          node scripts/kubernetes-cluster.ts prepare --work "$work" --images release-images.tsv --commit "$COMMIT" \
            --external-postgresql-cidr "$POD_CIDR"
          node scripts/kubernetes-cluster.ts install --work "$work"
          node scripts/kubernetes-cluster.ts verify
          node scripts/kubernetes-cluster.ts prepare --work "$work" --images release-images.tsv --commit "$COMMIT" \
            --external-postgresql-cidr "$POD_CIDR"
          node scripts/kubernetes-cluster.ts upgrade --work "$work" --set "release.version=v0.0.1-cluster"
          node scripts/kubernetes-cluster.ts verify
      - name: Record the cluster state
        if: ${{ failure() }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n hephaestus describe pods || true
          # A failed migration Job blocks every role; its own log names the cause.
          kubectl -n hephaestus logs -l app.kubernetes.io/component=migration --all-containers --tail=400 --prefix || true
          kubectl -n hephaestus logs -l app.kubernetes.io/component=postgresql --all-containers --tail=200 --prefix || true
          kubectl -n hephaestus logs -l app.kubernetes.io/component=worker --tail=300 --prefix || true
          kubectl -n hephaestus logs -l app.kubernetes.io/component=server --tail=300 --prefix || true
          kubectl -n hephaestus-sandboxes get pods,jobs -o wide || true
          kubectl -n hephaestus-sandboxes get sandboxtemplates,sandboxwarmpools,sandboxclaims,sandboxes -o wide || true
          kubectl -n hephaestus-sandboxes describe pods || true
          kubectl -n agent-sandbox-system logs deployment/agent-sandbox-controller --tail=200 || true
          kubectl -n hephaestus-sandboxes get events --sort-by=.lastTimestamp || true
          kubectl describe nodes | grep -A 12 "Allocated resources" || true

  fail-fast-k3d:
    name: Stop the merge group early
    needs: [k3d]
    if: ${{ always() && github.event_name == 'merge_group' && needs.k3d.result == 'failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  fail-fast-k3d-1-35-amd64:
    name: Stop the merge group early
    needs: [k3d-1-35-amd64]
    if: ${{ always() && github.event_name == 'merge_group' && needs.k3d-1-35-amd64.result == 'failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  fail-fast-k3d-1-35-arm64:
    name: Stop the merge group early
    needs: [k3d-1-35-arm64]
    if: ${{ always() && github.event_name == 'merge_group' && needs.k3d-1-35-arm64.result == 'failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  fail-fast-calico:
    name: Stop the merge group early
    needs: [calico]
    if: ${{ always() && github.event_name == 'merge_group' && needs.calico.result == 'failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"
