name: Docs / Preview teardown

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  teardown:
    name: Teardown Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: docs-preview-${{ github.event.number }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: hephaestus-build-docs-pr-${{ github.event.number }}.surge.sh
      STORYBOOK_PREVIEW_URL: hephaestus-build-storybook-pr-${{ github.event.number }}.surge.sh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the pull request is still closed
        id: state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { shouldTeardownPreviews } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/docs-preview.ts`);
            const closed = await shouldTeardownPreviews({ github, repo: context.repo, pullNumber: context.issue.number });
            core.setOutput("closed", closed);
            if (!closed) core.notice("The pull request reopened. Its previews are preserved.");
      - uses: ./.github/actions/setup-toolchain
        if: steps.state.outputs.closed == 'true'
        with:
          install: "frozen"

      - name: Teardown Surge.sh preview
        if: steps.state.outputs.closed == 'true'
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: ./node_modules/.bin/surge teardown "$PREVIEW_URL" --token "$SURGE_TOKEN"
        continue-on-error: true
      - name: Teardown Storybook preview
        if: steps.state.outputs.closed == 'true'
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: ./node_modules/.bin/surge teardown "$STORYBOOK_PREVIEW_URL" --token "$SURGE_TOKEN"
        continue-on-error: true

      - name: Retire preview comments and their continuation parts
        if: steps.state.outputs.closed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { publishPreviewComments } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-preview-comments.ts`);
            for (const kind of ["docs", "storybook"]) {
              await publishPreviewComments({ github, context, kind });
            }
