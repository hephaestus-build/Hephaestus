name: CD / Docs Teardown

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  teardown:
    name: Teardown Preview
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: hephaestus-build-docs-pr-${{ github.event.number }}.surge.sh
      STORYBOOK_PREVIEW_URL: hephaestus-build-storybook-pr-${{ github.event.number }}.surge.sh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - name: Teardown Surge.sh preview
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: ./node_modules/.bin/surge teardown "$PREVIEW_URL" --token "$SURGE_TOKEN"
        continue-on-error: true
      - name: Teardown Storybook preview
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: ./node_modules/.bin/surge teardown "$STORYBOOK_PREVIEW_URL" --token "$SURGE_TOKEN"
        continue-on-error: true

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-preview
          message: |
            ## 📚 Documentation Preview

            ~~Preview has been removed~~ (PR closed)
      - name: Update Storybook PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: storybook-preview
          message: |
            ## 🧩 Storybook Preview

            ~~Preview has been removed~~ (PR closed)
