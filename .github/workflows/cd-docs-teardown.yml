name: CD / Docs Teardown

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  teardown:
    name: Teardown Preview
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: hephaestus-build-docs-pr-${{ github.event.number }}.surge.sh
      STORYBOOK_PREVIEW_URL: hephaestus-build-storybook-pr-${{ github.event.number }}.surge.sh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - name: Teardown Surge.sh preview
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: ./node_modules/.bin/surge teardown "$PREVIEW_URL" --token "$SURGE_TOKEN"
        continue-on-error: true
      - name: Teardown Storybook preview
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: ./node_modules/.bin/surge teardown "$STORYBOOK_PREVIEW_URL" --token "$SURGE_TOKEN"
        continue-on-error: true

      - name: Retire preview comments and their continuation parts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { publishPreviewComments } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-preview-comments.ts`);
            for (const kind of ["docs", "storybook"]) {
              await publishPreviewComments({ github, context, kind });
            }
