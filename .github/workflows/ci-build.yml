name: Build

on:
  workflow_call:
    outputs:
      application-server-digest:
        description: "Digest of the application image built from this run's packaged JAR"
        value: ${{ jobs.application-server-image.outputs.manifest-digest }}
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      # publish and single_arch have no default; reusable-docker-build.yml says why.
      publish:
        description: "Whether image jobs may write to the registry"
        required: true
        type: boolean
      single_arch:
        description: "Whether to build linux/amd64 alone instead of the supported multi-architecture set"
        required: true
        type: string
      server_changed:
        description: "Whether anything that runs the packaged reactor changed"
        required: false
        type: string
        default: "true"
      contracts_changed:
        description: "Whether the API or database contracts or their PostgreSQL image changed"
        required: false
        type: string
        default: "true"
      e2e_changed:
        description: "Whether browser E2E runtime files changed"
        required: false
        type: string
        default: "true"
      postgres_image_changed:
        description: "Whether PostgreSQL image inputs changed"
        required: false
        type: string
        default: "false"
      postgres_base_sha:
        description: "Commit whose published PostgreSQL image the database legs reuse"
        required: true
        type: string
      server_image_changed:
        description: "Whether the application-server image inputs changed"
        required: false
        type: string
        default: "true"

permissions: {}

env:
  SERVER_BUILD_ARTIFACT: server-build-${{ github.run_id }}

# Every job after server-package runs Maven goals or pack against the restored classes and JAR. A
# lifecycle phase (compile, package, verify) in a consumer would compile a second time and break
# the guarantee that the tested JAR is the shipped one; scripts/ci-contract.test.ts rejects it.
jobs:
  server-package:
    name: "App Server: Package"
    if: inputs.should_skip != 'true' && inputs.server_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-caches
        with:
          cache-type: application-server-reactor
          os: ${{ runner.os }}
      - name: Package the reactor
        working-directory: server
        run: ./mvnw -pl application -am package -DskipTests --batch-mode
      - name: Validate the packaged reactor
        working-directory: server
        run: |
          set -euo pipefail
          test -d application/target/classes
          test -d application/target/test-classes
          mapfile -t jars < <(find application/target -maxdepth 1 -name 'hephaestus-application-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          mapfile -t clients < <(find generated-clients/target -maxdepth 1 -name 'hephaestus-generated-clients-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          (( ${#jars[@]} == 1 )) && (( ${#clients[@]} == 1 ))
          unzip -p "${jars[0]}" META-INF/MANIFEST.MF | grep -q '^Main-Class: org.springframework.boot.loader'
      - name: Upload the packaged reactor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.SERVER_BUILD_ARTIFACT }}
          path: |
            server/application/target/classes
            server/application/target/test-classes
            server/application/target/hephaestus-application-*.jar
            server/generated-clients/target/hephaestus-generated-clients-*.jar
            !server/**/*-sources.jar
            !server/**/*-javadoc.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          # A re-run of failed jobs keeps this artifact; a re-run of all jobs replaces it.
          overwrite: true

  server-api:
    name: "App Server: Generated artifacts"
    needs: server-package
    if: inputs.should_skip != 'true' && inputs.contracts_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
        with:
          cache-type: application-server-tests
          os: ${{ runner.os }}
      - uses: ./.github/actions/restore-server-build
        id: server
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - name: OpenAPI specification and client
        id: openapi
        continue-on-error: true
        env:
          HEPHAESTUS_APPLICATION_JAR: ${{ steps.server.outputs.executable-jar }}
        run: |
          vp run generate:api
          git add .
          if ! git diff --cached --quiet; then
            echo "::error::OpenAPI out of sync. Run: vp run generate:api"
            echo "### OpenAPI Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| API specs sync | :x: Out of sync | \`vp run generate:api\` |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - uses: ./.github/actions/postgres-image
        if: always()
        with:
          base-sha: ${{ inputs.postgres_base_sha }}
          image-changed: ${{ inputs.postgres_image_changed }}
          tag: hephaestus-postgres:ci
      - name: Migration chain, schema drift and ERD
        id: schema
        continue-on-error: true
        if: always()
        run: |
          docker run -d --name postgres-db \
            -e POSTGRES_DB=hephaestus -e POSTGRES_PASSWORD=root -e POSTGRES_USER=root \
            -p 5432:5432 hephaestus-postgres:ci
          trap 'docker stop postgres-db 2>/dev/null; docker rm postgres-db 2>/dev/null' EXIT
          until docker exec postgres-db pg_isready -U root -d hephaestus; do sleep 2; done

          ISSUES_FOUND=()

          # db:check-drift applies the whole master.xml chain to an empty database before it diffs,
          # so this step is also the migration-chain replay gate.
          vp run db:check-drift || ISSUES_FOUND+=("Schema drift or migration-chain apply failed. Run: vp run db:draft-changelog")

          vp run db:generate-erd-docs || ISSUES_FOUND+=("ERD generation failed. Run: vp run db:generate-erd-docs")
          git add docs/contributor/erd/schema.mmd
          if ! git diff --cached --quiet docs/contributor/erd/schema.mmd; then
            echo "::error::ERD outdated. Run: vp run db:generate-erd-docs"
            ISSUES_FOUND+=("ERD outdated")
          fi

          if [ ${#ISSUES_FOUND[@]} -gt 0 ]; then
            echo "### Database Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            for issue in "${ISSUES_FOUND[@]}"; do
              echo "::error::$issue"
              if [[ "$issue" == *"Run:"* ]]; then
                echo "| ${issue%%.*} | :x: Failed | \`${issue##*Run: }\` |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $issue | :x: Failed | See logs |" >> $GITHUB_STEP_SUMMARY
              fi
            done
            exit 1
          fi
      - name: Evaluate generated artifacts
        if: always()
        env:
          OPENAPI: ${{ steps.openapi.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
        run: |
          if [ "$OPENAPI" != "success" ] || [ "$SCHEMA" != "success" ]; then
            echo "::error::OpenAPI or schema validation failed; review both independently reported steps."
            exit 1
          fi

  server-database:
    name: "App Server: Database"
    needs: server-package
    if: inputs.should_skip != 'true' && inputs.contracts_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
        with:
          cache-type: application-server-tests
          os: ${{ runner.os }}
      - uses: ./.github/actions/restore-server-build
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - uses: ./.github/actions/postgres-image
        with:
          base-sha: ${{ inputs.postgres_base_sha }}
          image-changed: ${{ inputs.postgres_image_changed }}
          tag: hephaestus-postgres:ci
      - name: Run database contract tests and the major-upgrade drill
        run: |
          docker run -d --name postgres-db \
            -e POSTGRES_DB=hephaestus -e POSTGRES_PASSWORD=root -e POSTGRES_USER=root \
            -p 5432:5432 hephaestus-postgres:ci
          trap 'docker stop postgres-db 2>/dev/null; docker rm postgres-db 2>/dev/null' EXIT
          until docker exec postgres-db pg_isready -U root -d hephaestus; do sleep 2; done

          export SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/hephaestus"
          export SPRING_DATASOURCE_USERNAME="root"
          export SPRING_DATASOURCE_PASSWORD="root"
          (cd server && ./mvnw -f application/pom.xml --batch-mode -Dmaven.build.cache.enabled=false \
            -Dsurefire.includedGroups=database surefire:test)

          vp run test:postgres-upgrade
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - App Server Database"
          path: "server/application/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

  webapp-e2e:
    name: "Webapp: E2E"
    needs: server-package
    if: inputs.should_skip != 'true' && inputs.e2e_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version-file: .java-version
          cache-jdk: false
      - uses: ./.github/actions/setup-browsers
      - name: Download the packaged reactor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SERVER_BUILD_ARTIFACT }}
          path: server
      # `server/compose.yaml` resolves the database by the `dev` tag, so that is the name it needs.
      - uses: ./.github/actions/postgres-image
        with:
          base-sha: ${{ inputs.postgres_base_sha }}
          image-changed: ${{ inputs.postgres_image_changed }}
          tag: ghcr.io/hephaestus-build/postgres:dev
      - name: Run end-to-end tests against the built server
        run: |
          docker compose -f server/compose.yaml up -d --wait --no-build postgres
          cleanup() {
            if [[ -n "${SERVER_PID:-}" ]]; then
              kill -TERM -- "-$SERVER_PID" 2>/dev/null || true
              (sleep 10; kill -KILL -- "-$SERVER_PID" 2>/dev/null || true) &
              KILL_WATCHDOG=$!
              wait "$SERVER_PID" 2>/dev/null || true
              if kill -0 -- "-$SERVER_PID" 2>/dev/null; then
                wait "$KILL_WATCHDOG" 2>/dev/null || true
              else
                kill "$KILL_WATCHDOG" 2>/dev/null || true
                wait "$KILL_WATCHDOG" 2>/dev/null || true
              fi
            fi
            docker compose -f server/compose.yaml down -v
          }
          trap cleanup EXIT
          mapfile -t SERVER_JARS < <(find server/application/target -maxdepth 1 -name 'hephaestus-application-*.jar')
          (( ${#SERVER_JARS[@]} == 1 ))
          SERVER_JAR=${SERVER_JARS[0]}
          SERVER_PORT=8080 MANAGEMENT_PORT=8080 POSTGRES_PORT=5432 \
            SPRING_DOCKER_COMPOSE_ENABLED=false APPLICATION_HOST_URL=http://localhost:4200 \
            setsid java -jar "$SERVER_JAR" --spring.profiles.active=e2e,playwright > e2e-server.log 2>&1 &
          SERVER_PID=$!
          timeout 5m bash -c 'until curl --fail --silent http://localhost:8080/actuator/health/liveness >/dev/null; do kill -0 '"${SERVER_PID}"' || exit 1; sleep 2; done'
          curl --fail --silent --show-error -X POST http://localhost:8080/auth/dev-login \
            -H 'content-type: application/json' -d '{"username":"e2e","admin":true}' >/dev/null
          docker compose -f server/compose.yaml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U root -d hephaestus < webapp/e2e/seed.sql
          timeout --kill-after=30s 10m vp run --filter webapp test:e2e
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webapp-e2e-results
          path: |
            webapp/test-results
            e2e-server.log
          if-no-files-found: warn
          retention-days: 7

  application-server-image:
    name: "App Server image"
    needs: server-package
    if: inputs.should_skip != 'true' && inputs.server_image_changed == 'true'
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: "hephaestus-build/application-server"
      use-buildpacks: true
      application-artifact: server-build-${{ github.run_id }}
      project-descriptor: "server/application/project.toml"
      # renovate: datasource=docker depName=paketobuildpacks/ubuntu-noble-run-tiny
      run-image: "paketobuildpacks/ubuntu-noble-run-tiny@sha256:c32333227b6dfbc2a4a93b03ee6d3475cfe152468c7d396bf22f06099bb0ecc9"
      registry: "ghcr.io"
      publish: ${{ inputs.publish }}
      single-arch: ${{ inputs.single_arch == 'true' }}
