name: CI / Build

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      contracts_changed:
        description: "Whether the API or database contracts or their PostgreSQL image changed"
        required: false
        type: string
        default: "true"
      postgres_image_changed:
        description: "Whether PostgreSQL image inputs changed"
        required: false
        type: string
        default: "false"
      postgres_base_sha:
        description: "Commit whose published PostgreSQL image the database legs reuse"
        required: true
        type: string
      queue_tier:
        description: "Whether the run also verifies the queue tier (docs/contributor/ci-cd.mdx § Two verification tiers)"
        required: true
        type: string

permissions: {}

env:
  SERVER_BUILD_ARTIFACT: server-build-${{ github.run_id }}

# Consumers must not recompile: API checks, browser tests and buildpacks share the package job's JAR.
# docs/contributor/ci-cd.mdx § Build once owns the artifact contract.
jobs:

  server-api:
    name: Generated API
    if: inputs.should_skip != 'true' && inputs.contracts_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
      - uses: ./.github/actions/restore-server-build
        id: server
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - uses: ./.github/actions/postgres-image
        with:
          base-sha: ${{ inputs.postgres_base_sha }}
          image-changed: ${{ inputs.postgres_image_changed }}
          tag: hephaestus-postgres:ci
      - name: OpenAPI specification and client
        id: openapi
        continue-on-error: true
        env:
          HEPHAESTUS_APPLICATION_JAR: ${{ steps.server.outputs.executable-jar }}
        run: |
          vp run generate:api
          if ! node scripts/assert-generated-clean.ts server/openapi.yaml webapp/src/api extension/src/api; then
            echo "::error::OpenAPI out of sync. Run: vp run generate:api"
            echo "### OpenAPI Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| API specs sync | :x: Out of sync | \`vp run generate:api\` |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      # Judges the spec generated above against the latest published release, which it fetches from
      # origin. docs/contributor/ci-cd.mdx § API compatibility.
      - uses: ./.github/actions/setup-ci-tool
        if: always()
        with:
          tool: oasdiff

      - name: API compatibility with the previous release
        id: api-compatibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        if: always()
        run: vp run gate:api-compatibility
      - name: Configuration reference
        id: configuration-reference
        continue-on-error: true
        env:
          HEPHAESTUS_APPLICATION_JAR: ${{ steps.server.outputs.executable-jar }}
        run: |
          vp run generate:configuration-reference
          if ! node scripts/assert-generated-clean.ts docs/admin/configuration-reference.mdx docs/admin/_configuration-reference; then
            echo "::error::Configuration reference out of sync. Run: vp run generate:configuration-reference"
            exit 1
          fi
      - name: Migration chain, schema drift and ERD
        id: schema
        continue-on-error: true
        if: always()
        run: |
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${POSTGRES_PASSWORD}"
          export POSTGRES_PASSWORD
          docker run -d --name postgres-db \
            -e POSTGRES_DB=hephaestus -e POSTGRES_PASSWORD -e POSTGRES_USER=root \
            -p 5432:5432 hephaestus-postgres:ci
          trap 'docker stop postgres-db 2>/dev/null; docker rm postgres-db 2>/dev/null' EXIT
          until docker exec postgres-db pg_isready -U root -d hephaestus; do sleep 2; done

          ISSUES_FOUND=()

          # db:check-drift applies the whole master.xml chain to an empty database before it diffs,
          # so this step is also the migration-chain replay gate.
          vp run db:check-drift || ISSUES_FOUND+=("Schema drift or migration-chain apply failed. Run: vp run db:draft-changelog")

          vp run db:generate-erd-docs || ISSUES_FOUND+=("ERD generation failed. Run: vp run db:generate-erd-docs")
          if ! node scripts/assert-generated-clean.ts docs/contributor/erd; then
            echo "::error::ERD outdated. Run: vp run db:generate-erd-docs"
            ISSUES_FOUND+=("ERD outdated")
          fi

          if [ ${#ISSUES_FOUND[@]} -gt 0 ]; then
            echo "### Database Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            for issue in "${ISSUES_FOUND[@]}"; do
              echo "::error::$issue"
              if [[ "$issue" == *"Run:"* ]]; then
                echo "| ${issue%%.*} | :x: Failed | \`${issue##*Run: }\` |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $issue | :x: Failed | See logs |" >> $GITHUB_STEP_SUMMARY
              fi
            done
            exit 1
          fi
      - name: Evaluate generated artifacts
        if: always()
        env:
          OPENAPI: ${{ steps.openapi.outcome }}
          API_COMPATIBILITY: ${{ steps.api-compatibility.outcome }}
          CONFIGURATION_REFERENCE: ${{ steps.configuration-reference.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
        run: |
          if [ "$OPENAPI" != "success" ] || [ "$API_COMPATIBILITY" != "success" ] || [ "$CONFIGURATION_REFERENCE" != "success" ] || [ "$SCHEMA" != "success" ]; then
            echo "::error::OpenAPI, API compatibility, configuration reference or schema validation failed; review the independently reported steps."
            exit 1
          fi

  server-database:
    name: Database migrations
    if: inputs.should_skip != 'true' && inputs.contracts_changed == 'true' && inputs.queue_tier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
      - uses: ./.github/actions/restore-server-build
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - uses: ./.github/actions/postgres-image
        with:
          base-sha: ${{ inputs.postgres_base_sha }}
          image-changed: ${{ inputs.postgres_image_changed }}
          tag: hephaestus-postgres:ci
      - name: Run database contract tests
        run: |
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${POSTGRES_PASSWORD}"
          export POSTGRES_PASSWORD
          docker run -d --name postgres-db \
            -e POSTGRES_DB=hephaestus -e POSTGRES_PASSWORD -e POSTGRES_USER=root \
            -p 5432:5432 hephaestus-postgres:ci
          trap 'docker stop postgres-db 2>/dev/null; docker rm postgres-db 2>/dev/null' EXIT
          until docker exec postgres-db pg_isready -U root -d hephaestus; do sleep 2; done

          export SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/hephaestus"
          export SPRING_DATASOURCE_USERNAME="root"
          export SPRING_DATASOURCE_PASSWORD="${POSTGRES_PASSWORD}"
          (cd server && ./gradlew :application:databaseTest -PpackagedServer=true)

      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - Database migrations"
          path: "server/application/build/test-results/databaseTest/TEST-*.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ job.status == 'failure' && 50 || 0 }}
          fail-on-error: false

      - name: Retain full database test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-test-reports-${{ github.run_attempt }}
          path: server/application/build/test-results/databaseTest
          retention-days: 14
          if-no-files-found: warn

  # The drills migrate their own named containers from the packaged JAR, so they take a job of
  # their own rather than queueing behind databaseTest's Gradle invocation. They share one job:
  # together they are shorter than the integration shards, and a job of its own costs each a
  # runner's setup.

  postgres-drill:
    name: PostgreSQL drills
    if: inputs.should_skip != 'true' && inputs.contracts_changed == 'true' && inputs.queue_tier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-caches
      - uses: ./.github/actions/restore-server-build
        id: server
        with:
          artifact: ${{ env.SERVER_BUILD_ARTIFACT }}
      - uses: ./.github/actions/postgres-image
        with:
          base-sha: ${{ inputs.postgres_base_sha }}
          image-changed: ${{ inputs.postgres_image_changed }}
          tag: hephaestus-postgres:ci
      - name: Run the PostgreSQL backup-restore drill
        id: backup_restore
        env:
          HEPHAESTUS_APPLICATION_JAR: ${{ steps.server.outputs.executable-jar }}
        run: node scripts/postgres-backup-restore-test.ts --target-image hephaestus-postgres:ci
      # The PITR drill reports on its own even when the backup-restore drill failed, but not after a
      # failed setup step.
      - name: Run the PostgreSQL pitr drill
        if: ${{ !cancelled() && (success() || steps.backup_restore.outcome == 'failure') }}
        env:
          HEPHAESTUS_APPLICATION_JAR: ${{ steps.server.outputs.executable-jar }}
        run: node scripts/postgres-pitr-test.ts --target-image hephaestus-postgres:ci

  fail-fast-server-api:
    name: Stop the merge group early
    needs: [server-api]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  fail-fast-server-database:
    name: Stop the merge group early
    needs: [server-database]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  fail-fast-postgres-drill:
    name: Stop the merge group early
    needs: [postgres-drill]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"
