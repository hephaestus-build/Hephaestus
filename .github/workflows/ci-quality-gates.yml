name: Quality

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      webapp_changed:
        description: "Whether webapp files changed (or should run for other reasons)"
        required: false
        type: string
        default: "true"
      application_server_changed:
        description: "Whether application-server files changed (or should run for other reasons)"
        required: false
        type: string
        default: "true"
      tooling_changed:
        description: "Whether repository tooling, docs, or instruction files changed"
        required: false
        type: string
        default: "true"
      pmd_canary:
        description: "Whether PMD wiring inputs changed"
        required: false
        type: string
        default: "false"
    secrets:
      CHROMATIC_PROJECT_TOKEN:
        required: false
      SURGE_TOKEN:
        required: false

permissions: {}

jobs:
  # Steps are gated rather than the job: a skipped leg still reports, so the status gate sees it.
  quality:
    name: "${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    if: inputs.should_skip != 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: server
            name: "App Server"
            os: ubuntu-latest
            changes: application_server
            history: true
            cache: true
            flags: ""
          - leg: tooling
            name: "Tooling and Docs"
            os: ubuntu-latest
            changes: tooling
            hooks: true
            cache: true
            flags: ""
          - leg: webapp
            name: "Webapp"
            os: ubuntu-latest
            changes: webapp
            cache: true
            flags: ""
          # Uncached: on Windows the runner's automatic input tracking misses a new file
          # (scripts/check-runner-contract.ts), so a cached verdict there could be stale.
          - leg: windows
            name: "Windows"
            os: windows-latest
            changes: tooling
            history: true
            hooks: true
            flags: --no-cache
    env:
      RUN: ${{ inputs[format('{0}_changed', matrix.changes)] }}
    defaults:
      run:
        shell: bash
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gate:contracts compares the branch with the base, which needs the history. The depths
          # are QUOTED: unquoted, `cond && 0 || 1` always yields 1, because the number 0 is falsy in
          # GitHub expressions and the non-empty string '0' is truthy.
          fetch-depth: ${{ matrix.history && '0' || '1' }}
          persist-credentials: false

      - if: env.RUN == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      # Content-addressed, so a pull request may save them for its own reruns.
      - name: Restore Vite task cache
        if: env.RUN == 'true' && matrix.cache
        id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.leg }}-

      - name: Setup application-server caches
        if: env.RUN == 'true' && matrix.leg == 'server'
        uses: ./.github/actions/setup-caches
        with:
          cache-type: application-server-reactor
          os: ${{ runner.os }}

      - name: Quality gates
        if: env.RUN == 'true'
        run: vp run ${{ matrix.flags }} ci:${{ matrix.leg }}

      - name: Task report
        if: env.RUN == 'true' && !cancelled()
        run: vp run --last-details | node scripts/report-task-run.ts

      - name: PMD canary
        if: env.RUN == 'true' && matrix.leg == 'server' && inputs.pmd_canary == 'true'
        run: vp run gate:pmd-canary

      # CI installs with --ignore-scripts, so prepare never runs: both hooks are dispatched here instead.
      - name: Commit-msg hook
        if: env.RUN == 'true' && matrix.hooks && !cancelled()
        run: |
          node scripts/enable-hooks.ts
          test "$(git config core.hooksPath)" = ".vite-hooks/_"
          git config user.name ci
          git config user.email ci@example.invalid
          if git commit --allow-empty --quiet -m "bad message"; then
            echo "::error::commit-msg accepted a message commitlint rejects"
            exit 1
          fi
          git commit --allow-empty --quiet -m "chore(ci): probe the commit-msg hook"

      # The dispatcher prepends node_modules/.bin to PATH, so the launcher is shadowed there; the
      # gate itself must not run a second time.
      - name: Pre-push hook
        if: env.RUN == 'true' && matrix.hooks && !cancelled()
        run: |
          node scripts/enable-hooks.ts
          probe="$(mktemp)"
          remote="$(mktemp -d)"
          launcher=node_modules/.bin/vp
          # Nothing else in CI runs the local launcher: GitHub does not put node_modules/.bin on PATH.
          "$launcher" --version > /dev/null
          mv "$launcher" "$launcher.real"
          trap 'mv "$launcher.real" "$launcher"; rm -f "$probe"; rm -rf "$remote"' EXIT
          cat > "$launcher" <<'EOF'
          #!/bin/sh
          if [ "$#" -ne 2 ] || [ "$1" != run ] || [ "$2" != check ]; then
            exit 1
          fi
          printf 'ran\n' > "$PRE_PUSH_PROBE"
          EOF
          chmod +x "$launcher"
          export PRE_PUSH_PROBE="$probe"
          git init --bare --quiet "$remote"
          git push --dry-run --quiet "$remote" HEAD:refs/heads/pre-push-probe
          test "$(cat "$probe")" = ran

      - name: Upload webapp unit-test results
        if: env.RUN == 'true' && matrix.leg == 'webapp' && !cancelled()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - Webapp Unit"
          path: "webapp/test-results/junit-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Summarize webapp unit tests
        if: env.RUN == 'true' && matrix.leg == 'webapp' && !cancelled()
        continue-on-error: true
        run: vp run report:test-results "Webapp Unit" webapp/test-results ci-metrics/webapp-unit.json

      - name: Upload webapp test metrics
        if: env.RUN == 'true' && matrix.leg == 'webapp' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-metrics-webapp-unit
          path: ci-metrics/webapp-unit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Vite task cache
        if: env.RUN == 'true' && matrix.cache && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  # The contributor's first command, without setup-toolchain: vp install must fetch the pinned pnpm,
  # install the workspace and enable the hooks on its own.
  clean-install:
    name: "Clean install"
    if: inputs.should_skip != 'true' && inputs.tooling_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-manager: false
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run gate:toolchain
      - run: test "$(git config core.hooksPath)" = ".vite-hooks/_"

  webapp-stories:
    name: "Webapp: Stories"
    if: inputs.should_skip != 'true' && inputs.webapp_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
      statuses: write
    env:
      PREVIEW_URL: hephaestus-build-storybook-pr-${{ github.event.number }}.surge.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-browsers
      - name: Run story tests and generated-asset check
        id: tests
        continue-on-error: true
        run: |
          timeout --kill-after=30s 15m vp run --filter webapp test:storybook
          vp run --filter webapp export:assets
          BRAND_ASSETS=(webapp/brand webapp/public docs/images/readme docs/static/img/brand docs/static/img/favicon.png docs/static/img/hephaestus-social-card.png docker/compose.proxy.yaml)
          if [[ -n "$(git status --porcelain --untracked-files=all -- "${BRAND_ASSETS[@]}")" ]]; then
            echo "::error::Brand assets are stale. Run 'vp run --filter webapp export:assets' and commit the result."
            git status --short --untracked-files=all -- "${BRAND_ASSETS[@]}"
            exit 1
          fi
      - name: Build Storybook with dependency stats
        run: |
          vp run --filter webapp build-storybook
          test -s webapp/storybook-static/preview-stats.json
      - name: Chromatic visual testing
        id: chromatic
        continue-on-error: true
        if: >-
          success() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: chromaui/action@4cc98810d00b34b8f9e89d454d64a8ac3d088340 # v18.7.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: webapp
          storybookBuildDir: storybook-static
          onlyChanged: true
          zip: true
          skip: "@(dependabot/**|renovate/**)"
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
          exitZeroOnChanges: false
          logLevel: info
          junitReport: true
        env:
          CHROMATIC_BRANCH: ${{ github.head_ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Deploy public Storybook preview
        id: storybook_preview
        if: >-
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(steps.chromatic.outputs.storybookUrl, 'http')
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: ./node_modules/.bin/surge ./webapp/storybook-static "$PREVIEW_URL" --token "$SURGE_TOKEN"
      - name: Prepare Storybook preview links
        if: steps.storybook_preview.outcome == 'success'
        run: >-
          node scripts/render-preview-comment.ts storybook webapp/storybook-static
          "https://$PREVIEW_URL"
          ${{ github.event.pull_request.base.sha }} "$RUNNER_TEMP/storybook-preview.md"
      - name: Publish Storybook preview links
        if: steps.storybook_preview.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: storybook-preview
          path: ${{ runner.temp }}/storybook-preview.md
      - name: Create Storybook status check
        if: >-
          success() && startsWith(steps.chromatic.outputs.storybookUrl, 'http') &&
          (github.event_name != 'pull_request' || steps.storybook_preview.outcome == 'success')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_URL: https://${{ env.PREVIEW_URL }}
          CHROMATIC_STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
        with:
          script: |
            const storybookUrl = context.payload.pull_request
              ? process.env.TARGET_URL
              : process.env.CHROMATIC_STORYBOOK_URL;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request?.head?.sha || context.sha,
              state: 'success',
              target_url: storybookUrl,
              description: 'Click Details to view your Storybook',
              context: 'Preview / Storybook'
            });
      - name: Upload Storybook test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - Webapp Stories"
          path: "webapp/test-results/junit-storybook.xml"
          reporter: java-junit
          fail-on-error: false
      - name: Upload Chromatic test results
        if: always() && startsWith(steps.chromatic.outputs.storybookUrl, 'http')
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - Chromatic"
          path: "webapp/chromatic-build-*.xml"
          reporter: java-junit
          fail-on-error: false
      - name: Evaluate stories checks
        if: always()
        env:
          STORYBOOK_TESTS: ${{ steps.tests.outcome }}
          CHROMATIC: ${{ steps.chromatic.outcome }}
        run: |
          if [ "$STORYBOOK_TESTS" != success ] || { [ "$CHROMATIC" != success ] && [ "$CHROMATIC" != skipped ]; }; then
            echo "::error::Storybook tests or Chromatic failed; review both independently reported steps."
            exit 1
          fi
