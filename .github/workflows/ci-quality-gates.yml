name: CI / Quality

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      webapp_changed:
        description: "Whether webapp files changed (or should run for other reasons)"
        required: false
        type: string
        default: "true"
      extension_changed:
        description: "Whether Chrome extension files changed (or should run for other reasons)"
        required: false
        type: string
        default: "true"
      application_server_changed:
        description: "Whether application-server files changed (or should run for other reasons)"
        required: false
        type: string
        default: "true"
      tooling_changed:
        description: "Whether repository tooling, docs, or instruction files changed"
        required: false
        type: string
        default: "true"
      windows_changed:
        description: "Whether the pull request changes Windows inputs or requests the queue tier"
        required: false
        type: string
        default: "true"
      pmd_canary:
        description: "Whether PMD wiring inputs changed"
        required: false
        type: string
        default: "false"
      gradle_dependencies:
        description: "Whether Gradle dependency inputs changed"
        required: false
        type: string
        default: "false"
      light_tier:
        description: "Whether a stacked layer runs the light tier, which skips the story tests"
        required: false
        type: string
        default: "false"
    secrets:
      CHROMATIC_PROJECT_TOKEN:
        required: false
      SURGE_TOKEN:
        required: false

permissions: {}

jobs:
  quality:
    name: Server
    if: inputs.should_skip != 'true' && (inputs.application_server_changed == 'true' || inputs.pmd_canary == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      packages: read
    defaults:
      run:
        shell: bash
    env:
      QUALITY_LEG: server
      NODE_TEST_SHARD: ""
    steps: &quality-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The contract and prose gates compare paths with the base branch. Keep that history.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - uses: ./.github/actions/setup-ci-tool
        if: env.QUALITY_LEG == 'tooling' || env.QUALITY_LEG == 'windows'
        with:
          tool: shellcheck
      - uses: ./.github/actions/setup-ci-tool
        if: env.QUALITY_LEG == 'tooling' || env.QUALITY_LEG == 'windows'
        with:
          tool: vale

      # Content-addressed, so a pull request may save them for its own reruns.
      # Windows task-input tracking cannot reliably invalidate new files, so it runs uncached.
      - name: Restore Vite task cache
        if: env.QUALITY_LEG != 'windows'
        id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ env.NODE_TEST_SHARD != '' && 'tests-' || '' }}${{ env.QUALITY_LEG }}-${{ github.run_id }}-${{ github.run_attempt }}${{ env.NODE_TEST_SHARD != '' && format('-{0}', env.NODE_TEST_SHARD) || '' }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ env.NODE_TEST_SHARD != '' && 'tests-' || '' }}${{ env.QUALITY_LEG }}-

      - name: Setup application-server caches
        if: env.QUALITY_LEG == 'server'
        uses: ./.github/actions/setup-caches

      # test:tooling renders the chart with the real Helm CLI; the release jobs install the same one.
      - name: Setup Helm
        if: env.QUALITY_LEG == 'tooling' || env.QUALITY_LEG == 'windows'
        uses: ./.github/actions/setup-helm

      # test:agents compares the loop's search proof with the real rg, and fails in CI without it.
      - name: Install ripgrep
        if: env.QUALITY_LEG == 'tooling'
        uses: ./.github/actions/setup-ci-tool
        with:
          tool: ripgrep
      - name: Install verified ripgrep on the tools server PATH
        if: env.QUALITY_LEG == 'tooling'
        run: node scripts/setup-ripgrep.ts

      # The extension's story tests run in Chromium.
      - name: Setup Playwright browsers
        if: env.QUALITY_LEG == 'extension'
        uses: ./.github/actions/setup-browsers

      - name: Quality gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEG: ${{ env.QUALITY_LEG }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The bundle budget compares with the entry ahead in the queue; a pull request uses its merge base.
          BUNDLE_BASE: ${{ github.event.merge_group.base_sha }}
          HEPHAESTUS_NODE_TEST_SHARD: ${{ env.NODE_TEST_SHARD }}
        # 15 minutes, under the job's 20: a hung task is named in the log and the summary before the
        # job limit cancels the run, which can lose its log. The step takes 5 to 11 minutes.
        run: |
          deadline() { node scripts/ci-deadline.ts 900 "$@"; }
          case "$LEG" in
            server) deadline vp run ci:server ;;
            tooling) if [ -n "$HEPHAESTUS_NODE_TEST_SHARD" ]; then deadline vp run ci:tooling-tests; else deadline vp run ci:tooling; fi ;;
            webapp) deadline vp run ci:webapp ;;
            extension) node scripts/ci-browser.ts node scripts/ci-deadline.ts 900 vp run ci:extension ;;
            windows) deadline vp run --no-cache ci:windows ;;
            *) echo "::error::Unknown quality leg: $LEG"; exit 1 ;;
          esac

      - name: Task report
        if: ${{ !cancelled() }}
        run: vp run --last-details | node scripts/report-task-run.ts

      # The log names a file that PMD could not analyze, not why; its XML report keeps the stack trace.
      - name: Retain the PMD report
        if: env.QUALITY_LEG == 'server' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-pmd-report-${{ github.run_attempt }}
          path: server/application/build/reports/pmd
          retention-days: 14
          if-no-files-found: ignore

      - name: PMD canary
        if: env.QUALITY_LEG == 'server' && inputs.pmd_canary == 'true'
        run: vp run gate:pmd-canary

      # Gradle only adds verification entries. The pull request decides drift, so a merge group skips it.
      - name: Gradle verification metadata
        if: env.QUALITY_LEG == 'server' && inputs.gradle_dependencies == 'true' && github.event_name == 'pull_request'
        run: node scripts/check-gradle-verification-metadata.ts

      # CI installs with --ignore-scripts, so prepare never runs: both hooks are dispatched here instead.
      - name: Commit-msg hook
        if: (env.QUALITY_LEG == 'tooling' || env.QUALITY_LEG == 'windows') && !cancelled()
        run: |
          node scripts/enable-hooks.ts
          test "$(git config core.hooksPath)" = ".vite-hooks"
          git config user.name ci
          git config user.email ci@example.invalid
          if git commit --allow-empty --quiet -m "bad message"; then
            echo "::error::commit-msg accepted a message commitlint rejects"
            exit 1
          fi
          git commit --allow-empty --quiet -m "chore(ci): probe the commit-msg hook"

      # The hook launcher prepends node_modules/.bin to PATH, so the launcher is shadowed there; the
      # gate itself must not run a second time.
      - name: Pre-push hook
        if: (env.QUALITY_LEG == 'tooling' || env.QUALITY_LEG == 'windows') && !cancelled()
        run: |
          node scripts/enable-hooks.ts
          probe="$(mktemp)"
          remote="$(mktemp -d)"
          launcher=node_modules/.bin/vp
          # Nothing else in CI runs the local launcher: GitHub does not put node_modules/.bin on PATH.
          "$launcher" --version > /dev/null
          mv "$launcher" "$launcher.real"
          trap 'mv "$launcher.real" "$launcher"; rm -f "$probe"; rm -rf "$remote"' EXIT
          cat > "$launcher" <<'EOF'
          #!/bin/sh
          if [ "$#" -ne 2 ] || [ "$1" != run ] || [ "$2" != check:push ]; then
            exit 1
          fi
          printf 'ran\n' > "$PRE_PUSH_PROBE"
          EOF
          chmod +x "$launcher"
          export PRE_PUSH_PROBE="$probe"
          git init --bare --quiet "$remote"
          git push --dry-run --quiet "$remote" HEAD:refs/heads/pre-push-probe
          test "$(cat "$probe")" = ran

      - name: Upload application test results
        if: (env.QUALITY_LEG == 'webapp' || env.QUALITY_LEG == 'extension') && !cancelled()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: "Test Results - ${{ env.QUALITY_LEG == 'webapp' && 'Webapp' || 'Extension' }}"
          path: "${{ env.QUALITY_LEG }}/test-results/junit-*.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ job.status == 'failure' && 50 || 0 }}
          fail-on-error: false

      - name: Retain application test reports
        if: (env.QUALITY_LEG == 'webapp' || env.QUALITY_LEG == 'extension') && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.QUALITY_LEG }}-unit-reports-${{ github.run_attempt }}
          path: ${{ env.QUALITY_LEG }}/test-results
          retention-days: 14
          if-no-files-found: warn

      - name: Summarize application tests
        if: (env.QUALITY_LEG == 'webapp' || env.QUALITY_LEG == 'extension') && !cancelled()
        continue-on-error: true
        env:
          APPLICATION_LEG: ${{ env.QUALITY_LEG }}
        run: vp run report:test-results "$APPLICATION_LEG tests" "$APPLICATION_LEG/test-results" "ci-metrics/$APPLICATION_LEG-unit.json"

      - name: Upload application test metrics
        if: (env.QUALITY_LEG == 'webapp' || env.QUALITY_LEG == 'extension') && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-metrics-${{ env.QUALITY_LEG }}-unit
          path: ci-metrics/${{ env.QUALITY_LEG }}-unit.json
          if-no-files-found: ignore
          retention-days: 14

      # The zip a Chrome Web Store submission uploads, from the same build the gates just judged.
      - name: Upload the extension package
        if: env.QUALITY_LEG == 'extension'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-chrome-${{ github.run_attempt }}
          path: extension/.output/*-production-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Save Vite task cache
        if: env.QUALITY_LEG != 'windows' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  webapp:
    name: Webapp
    if: inputs.should_skip != 'true' && inputs.webapp_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      packages: read
    defaults:
      run:
        shell: bash
    env:
      QUALITY_LEG: webapp
      NODE_TEST_SHARD: ""
    steps: *quality-steps

  extension:
    name: Extension
    if: inputs.should_skip != 'true' && inputs.extension_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      packages: read
    defaults:
      run:
        shell: bash
    env:
      QUALITY_LEG: extension
      NODE_TEST_SHARD: ""
    steps: *quality-steps

  tooling:
    name: Tooling and docs
    if: inputs.should_skip != 'true' && inputs.tooling_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      packages: read
    defaults:
      run:
        shell: bash
    env:
      QUALITY_LEG: tooling
      NODE_TEST_SHARD: ""
    steps: *quality-steps

  tooling-tests-1:
    name: Tooling and docs tests (1 of 2)
    if: inputs.should_skip != 'true' && inputs.tooling_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      packages: read
    defaults:
      run:
        shell: bash
    env:
      QUALITY_LEG: tooling
      NODE_TEST_SHARD: "1/2"
    steps: *quality-steps

  tooling-tests-2:
    name: Tooling and docs tests (2 of 2)
    if: inputs.should_skip != 'true' && inputs.tooling_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      packages: read
    defaults:
      run:
        shell: bash
    env:
      QUALITY_LEG: tooling
      NODE_TEST_SHARD: "2/2"
    steps: *quality-steps

  windows:
    name: Windows
    if: inputs.should_skip != 'true' && inputs.tooling_changed == 'true' && (github.event_name != 'pull_request' || inputs.windows_changed != 'false')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      packages: read
    defaults:
      run:
        shell: bash
    env:
      QUALITY_LEG: windows
      NODE_TEST_SHARD: ""
    steps: *quality-steps

  clean-install:
    name: "Clean install"
    if: inputs.should_skip != 'true' && inputs.tooling_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-manager: false
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run gate:toolchain
      - run: test "$(git config core.hooksPath)" = ".vite-hooks"

  webapp-stories:
    name: "Webapp stories"
    if: inputs.should_skip != 'true' && inputs.webapp_changed == 'true' && inputs.light_tier != 'true'
    # Browser rasterization depends on the OS; keep the canonical generated assets on one version.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
      statuses: write
    env:
      PREVIEW_URL: hephaestus-build-storybook-pr-${{ github.event.number }}.surge.sh
      CHROMATIC_POLICY_SKIP: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || startsWith(github.head_ref || github.ref_name, 'dependabot/') || startsWith(github.head_ref || github.ref_name, 'renovate/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - uses: ./.github/actions/setup-browsers
      - name: Run story tests and generated-asset check
        id: tests
        continue-on-error: true
        run: |
          timeout --kill-after=30s 15m node scripts/ci-browser.ts vp run test:webapp:stories
          node scripts/ci-browser.ts vp run --filter webapp export:assets
          BRAND_ASSETS=(webapp/brand webapp/public extension/public/icon docs/images/readme docs/static/img/brand docs/static/img/favicon.png docs/static/img/hephaestus-social-card.png)
          if [[ -n "$(git status --porcelain --untracked-files=all -- "${BRAND_ASSETS[@]}")" ]]; then
            echo "::error::Brand assets are stale. Run 'vp run --filter webapp export:assets' and commit the result."
            git status --short --untracked-files=all -- "${BRAND_ASSETS[@]}"
            exit 1
          fi
      - name: Build Storybook with dependency stats
        run: |
          vp run --filter webapp build-storybook
          test -s webapp/storybook-static/preview-stats.json
      - name: Clear previous Chromatic evidence
        run: node scripts/report-chromatic.ts --clear
      - name: Chromatic visual testing
        id: chromatic
        continue-on-error: true
        if: >-
          success() && env.CHROMATIC_POLICY_SKIP != 'true'
        uses: chromaui/action@6ac4c49524e1b1358b8c593c5eea877604228268 # v18.14.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: webapp
          storybookBuildDir: storybook-static
          onlyChanged: true
          zip: true
          skip: false
          autoAcceptChanges: false
          exitZeroOnChanges: false
          exitOnceUploaded: false
          # Debug log files contain signed URLs; retain structured test evidence instead.
          logLevel: warn
          junitReport: chromatic-report.xml
        env:
          CHROMATIC_BRANCH: ${{ github.head_ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Report Chromatic visual coverage
        if: always()
        env:
          CHROMATIC_OUTCOME: ${{ steps.chromatic.outcome }}
          CHROMATIC_CODE: ${{ steps.chromatic.outputs.code }}
          CHROMATIC_CAPTURED: ${{ steps.chromatic.outputs.actualCaptureCount }}
          CHROMATIC_INHERITED: ${{ steps.chromatic.outputs.inheritedCaptureCount }}
          CHROMATIC_TESTS: ${{ steps.chromatic.outputs.testCount }}
          CHROMATIC_ERRORS: ${{ steps.chromatic.outputs.errorCount }}
          CHROMATIC_CHANGES: ${{ steps.chromatic.outputs.changeCount }}
          CHROMATIC_INTERACTIONS: ${{ steps.chromatic.outputs.interactionTestFailuresCount }}
          CHROMATIC_BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
        run: node scripts/report-chromatic.ts
      - name: Deploy public Storybook preview
        id: storybook_preview
        continue-on-error: true
        if: >-
          success() && github.event_name == 'pull_request' && env.CHROMATIC_POLICY_SKIP != 'true'
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: ./node_modules/.bin/surge ./webapp/storybook-static "$PREVIEW_URL" --token "$SURGE_TOKEN"
      - name: Prepare Storybook preview links
        if: steps.storybook_preview.outcome == 'success'
        run: >-
          node scripts/render-preview-comment.ts storybook webapp/storybook-static
          "https://$PREVIEW_URL"
          ${{ github.event.pull_request.base.sha }} "$RUNNER_TEMP/storybook-preview.json"
      - name: Publish Storybook preview links
        if: steps.storybook_preview.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_COMMENT_PATH: ${{ runner.temp }}/storybook-preview.json
        with:
          script: |
            const { publishPreviewComments } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-preview-comments.ts`);
            await publishPreviewComments({ github, context, kind: "storybook", path: process.env.PREVIEW_COMMENT_PATH });
      - name: Create Storybook status check
        if: >-
          success() && ((github.event_name == 'pull_request' && steps.storybook_preview.outcome == 'success') ||
          (github.event_name != 'pull_request' && startsWith(steps.chromatic.outputs.storybookUrl, 'http')))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_URL: https://${{ env.PREVIEW_URL }}
          CHROMATIC_STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
        with:
          script: |
            const storybookUrl = context.payload.pull_request
              ? process.env.TARGET_URL
              : process.env.CHROMATIC_STORYBOOK_URL;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request?.head?.sha || context.sha,
              state: 'success',
              target_url: storybookUrl,
              description: 'Click Details to view your Storybook',
              context: 'Preview / Storybook'
            });
      - name: Upload Storybook test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: "Test Results - Webapp stories"
          path: "webapp/test-results/junit-storybook.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ (job.status == 'failure' || steps.tests.outcome == 'failure') && 50 || 0 }}
          fail-on-error: false
      - name: Upload Chromatic test results
        if: always() && startsWith(steps.chromatic.outputs.storybookUrl, 'http')
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: "Test Results - Chromatic"
          path: "webapp/chromatic-report.xml"
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Source lookup is needed only for failure annotations, not successful summaries.
          max-annotations: ${{ (job.status == 'failure' || steps.chromatic.outcome == 'failure') && 50 || 0 }}
          fail-on-error: false
          # Chromatic writes no report for a build that captures nothing, such as a limited build whose TurboSnap
          # finds no changed story. Visual coverage never decides the job; scripts/report-chromatic.ts reports it.
          fail-on-empty: false
      - name: Retain full Storybook and visual test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-reports-${{ github.run_attempt }}
          path: |
            webapp/test-results
            webapp/chromatic-report.xml
            docs/images/readme
          retention-days: 14
          if-no-files-found: warn
      # Chromatic reports visual coverage and never decides the job: an account limit or an unfinished
      # build must not block merges. The interaction tests are the gate.
      - name: Evaluate stories checks
        if: always()
        env:
          STORYBOOK_TESTS: ${{ steps.tests.outcome }}
        run: |
          if [ "$STORYBOOK_TESTS" != success ]; then
            echo "::error::Storybook interaction tests failed."
            exit 1
          fi

  fail-fast-quality:
    name: Stop the merge group early
    needs: [quality]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  fail-fast-webapp:
    name: Stop the merge group early
    needs: [webapp]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  fail-fast-extension:
    name: Stop the merge group early
    needs: [extension]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  fail-fast-tooling:
    name: Stop the merge group early
    needs: [tooling]
    if: ${{ always() && github.event_name == 'merge_group' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
