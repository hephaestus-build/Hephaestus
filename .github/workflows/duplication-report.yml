name: CI / Duplicated code report

# Measures duplicated and moved production code once a week. A report only: nothing fails on its
# numbers. docs/contributor/ci-cd.mdx § Duplicated and moved code.
on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: Duplicated and moved code of the last 7 days
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The pinned jscpd comes from the GHCR mirror of CI tools when it has it.
      packages: read
    steps:
      # The base is the last commit of main before the week, so the clone needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - name: Measure duplicated and moved code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp run report:duplication
      - name: Retain the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duplication-report-${{ github.run_id }}
          path: tmp/ci-metrics/duplication/duplication.json
          if-no-files-found: error
          retention-days: 90
