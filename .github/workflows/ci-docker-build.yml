name: CI / Docker images

on:
  workflow_call:
    inputs:
      database-artifact:
        description: "Immutable advisory database artifact ID selected by this CI run"
        type: string
        required: true
      scan-images:
        description: "Scan published images here unless the caller requires complete release evidence instead."
        type: boolean
        default: true
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      # publish and platforms have no default; reusable-docker-build.yml says why.
      publish:
        description: "Whether image jobs may write to the registry"
        required: true
        type: boolean
      platforms:
        description: "JSON list of the platforms every image build in the run publishes"
        required: true
        type: string
      reuse_run:
        description: "Successful merge-queue run whose verified images of this commit a push reuses"
        required: false
        type: string
        default: ""
      reuse_images:
        description: "JSON list of the images reuse_run published; only these are reused"
        required: false
        type: string
        default: "[]"
      webapp_changed:
        description: "Whether webapp files changed (or should build for other reasons)"
        required: false
        type: string
        default: "true"
      application_server_changed:
        description: "Whether the Build workflow published an application-server image this run"
        required: false
        type: string
        default: "true"
      agent_images_changed:
        description: "Whether agent image files changed (or should build for other reasons)"
        required: false
        type: string
        default: "true"
      postgres_image_changed:
        description: "Whether the PostgreSQL image inputs changed"
        required: false
        type: string
        default: "true"
      alias_base:
        description: "The published commit an unchanged image is aliased from; empty when the caller builds every image"
        required: false
        type: string
        default: ""
      dockerfile_images:
        description: "Whether this run builds and aliases the Dockerfile images at all; the *_changed inputs select among them"
        required: true
        type: string
      application_server_image:
        description: "Whether this run builds the application-server image from the package job's executable JAR"
        required: true
        type: string
      application-artifact:
        description: "Artifact holding the executable JAR for the application-server image"
        required: false
        type: string
        default: ""
      project-descriptor:
        description: "Buildpacks project descriptor for the application-server image"
        required: false
        type: string
        default: ""
      run-image:
        description: "Digest-pinned run image for the application-server image"
        required: false
        type: string
        default: ""
    outputs:
      application-server-digest:
        description: "Published application-server image index digest"
        value: ${{ jobs.images.outputs.application-server-digest }}

permissions: {}

jobs:
  # One build job per platform and one manifest job for every image the run publishes.
  images:
    name: "Images"
    if: >-
      inputs.application_server_image == 'true' || (inputs.dockerfile_images == 'true' && inputs.should_skip != 'true' &&
      (inputs.webapp_changed == 'true' || inputs.agent_images_changed == 'true' || inputs.postgres_image_changed == 'true'))
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      database-artifact: ${{ inputs.database-artifact }}
      application-server: ${{ inputs.application_server_image == 'true' }}
      webapp: ${{ inputs.dockerfile_images == 'true' && inputs.should_skip != 'true' && inputs.webapp_changed == 'true' }}
      agent-pi: ${{ inputs.dockerfile_images == 'true' && inputs.should_skip != 'true' && inputs.agent_images_changed == 'true' }}
      postgres: ${{ inputs.dockerfile_images == 'true' && inputs.should_skip != 'true' && inputs.postgres_image_changed == 'true' }}
      application-artifact: ${{ inputs.application-artifact }}
      project-descriptor: ${{ inputs.project-descriptor }}
      run-image: ${{ inputs.run-image }}
      registry: "ghcr.io"
      publish: ${{ inputs.publish }}
      platforms: ${{ inputs.platforms }}
      reuse-run: ${{ inputs.reuse_run }}
      reuse-images: ${{ inputs.reuse_images }}
      scan-images: ${{ inputs.scan-images }}

  # A pull request with the `preview` label or the host boot smoke needs every component at its head
  # SHA; alias verified digests for the components this pull request left alone. They are aliased
  # from the published commit `detect-changes` resolved, which is the pull request's base only when
  # the default branch contains it — docs/contributor/ci-cd.mdx has the rule.
  tag-unchanged-images:
    name: "Tag unchanged images"
    if: >-
      inputs.dockerfile_images == 'true' && inputs.should_skip != 'true' && inputs.publish && github.event_name == 'pull_request' &&
      (inputs.webapp_changed != 'true' || inputs.application_server_changed != 'true' ||
       inputs.agent_images_changed != 'true' ||
       inputs.postgres_image_changed != 'true')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      packages: write
      attestations: read
      contents: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Verify each immutable subject before moving tags; see ci-cd.mdx § Shared setup actions.
      - name: Verify and tag unchanged images
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBAPP_CHANGED: ${{ inputs.webapp_changed }}
          APPLICATION_SERVER_CHANGED: ${{ inputs.application_server_changed }}
          AGENT_IMAGES_CHANGED: ${{ inputs.agent_images_changed }}
          POSTGRES_IMAGE_CHANGED: ${{ inputs.postgres_image_changed }}
          PR_NUMBER: ${{ github.event.number }}
          ALIAS_BASE: ${{ inputs.alias_base }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          [ -n "$ALIAS_BASE" ] || {
            echo "::error::No published commit to alias from; the caller must build every image"; exit 1; }

          tag_image() {
            local image="ghcr.io/hephaestus-build/$1"
            local source="$image:$ALIAS_BASE"
            local digest
            digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$source" 2>/dev/null || true)
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              # The default branch's own push run may not have published yet; the pull request that
              # merged the commit tagged the same images under its head.
              local merged_head
              merged_head=$(gh api "repos/$REPOSITORY/commits/$ALIAS_BASE/pulls" \
                --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
              if [ -n "$merged_head" ]; then
                source="$image:$merged_head"
                digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$source" 2>/dev/null || true)
              fi
            fi
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid digest for $source: ${digest:-<empty>}"
              return 1
            fi
            local verified="$image@$digest"
            cosign verify "$verified" \
              --certificate-identity-regexp "^https://github\\.com/$REPOSITORY/\\.github/workflows/reusable-docker-build\\.yml@" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-repository "$REPOSITORY" \
              > /dev/null
            gh attestation verify "oci://$verified" --bundle-from-oci --owner "$REPOSITORY_OWNER"
            docker buildx imagetools create \
              --tag "$image:$HEAD_SHA" \
              --tag "$image:pr-$PR_NUMBER" \
              "$verified"
          }

          [ "$WEBAPP_CHANGED" = "true" ] || tag_image webapp
          [ "$APPLICATION_SERVER_CHANGED" = "true" ] || tag_image application-server
          [ "$AGENT_IMAGES_CHANGED" = "true" ] || tag_image agent-pi
          [ "$POSTGRES_IMAGE_CHANGED" = "true" ] || tag_image postgres
