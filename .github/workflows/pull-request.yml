name: "PR"

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] No pull-request code is checked out or executed.
    branches: [main]
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-title:
    name: "Validate title"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Load trusted title policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # package.json is what makes the policy module load as ESM; without it Node parses it as
          # CommonJS first and warns on the reparse.
          sparse-checkout: |
            commitlint.config.ts
            package.json
          sparse-checkout-cone-mode: false

      - name: Read title policy and validate header limits
        id: policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 2
          script: |
            const { pathToFileURL } = await import("node:url");
            const { pullRequestTitlePolicy: policy } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/commitlint.config.ts`).href);
            for (const [name, value] of Object.entries(policy)) core.setOutput(name, value);
            // A rerun keeps its original payload even after the title has been edited.
            const { data: { title } } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            // The action below reads a header pattern and a subject pattern; what those cannot
            // express is checked here, against the same policy the commit-msg hook enforces.
            const problem = title.length > policy.headerMaxLength
              ? `The title is ${title.length} characters long; the limit is ${policy.headerMaxLength}.`
              : /[\r\n]/.test(title)
                ? 'The title must be a single line.'
                : new RegExp(policy.breakingMarkerPattern).test(title)
                  ? 'A breaking change is carried by a changeset, so the title takes no ! marker.'
                  : '';
            if (problem) {
              core.setOutput('error_message', problem);
              core.setFailed(problem);
            }

      - name: Validate PR title
        id: title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ steps.policy.outputs.types }}
          scopes: ${{ steps.policy.outputs.scopes }}
          headerPattern: ${{ steps.policy.outputs.headerPattern }}
          headerPatternCorrespondence: type, scope, subject
          subjectPattern: ${{ steps.policy.outputs.subjectPattern }}

      # Through the environment and a file: the message quotes the title, which is the author's text.
      - name: Explain the validation failure
        id: explain
        if: ${{ !cancelled() && (steps.policy.outputs.error_message != '' || steps.title.outputs.error_message != '') }}
        env:
          POLICY_ERROR: ${{ steps.policy.outputs.error_message }}
          TITLE_ERROR: ${{ steps.title.outputs.error_message }}
          GUIDANCE: >-
            Use `type(scope): description`, at most ${{ steps.policy.outputs.headerMaxLength }}
            characters, with no final period and no breaking-change `!` marker. The allowed types and
            scopes are in [the contribution guidelines](${{ steps.policy.outputs.helpUrl }}).
        run: |
          {
            printf '## PR title validation failed\n\n'
            printf '%s\n\n' "${POLICY_ERROR:-$TITLE_ERROR}"
            printf '%s\n' "$GUIDANCE"
          } > "$RUNNER_TEMP/title-error.md"

      - name: Comment on PR with validation error
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ !cancelled() && steps.explain.outcome == 'success' }}
        with:
          header: pr-title-lint-error
          path: ${{ runner.temp }}/title-error.md

      - name: Remove error comment on success
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.title.outcome == 'success'
        with:
          header: pr-title-lint-error
          delete: true

      - name: Fail workflow if title validation failed
        if: steps.title.outcome == 'failure'
        run: exit 1

  # Squash-merge hides a commit's author on `main`, but a pull request's commit list keeps it
  # forever, and that list is where reviewers and provenance readers look. `CONTRIBUTING.md`
  # § Identity and Transparency asks for accountable identities; this is what holds them to it.
  verify-commit-identity:
    name: "Verify commit identity"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: write
    # No checkout: the query and the rule live here, so nothing from the pull request is fetched.
    steps:
      - name: "Resolve the author of every commit"
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const { writeFile } = require("node:fs/promises");

            // `authors(first:1)` is the primary author alone: a co-author after the first is a
            // credit, not the identity the commit is attributed to.
            const query = `query($owner:String!,$name:String!,$number:Int!,$after:String){
              repository(owner:$owner,name:$name){ pullRequest(number:$number){
                author{ __typename login }
                commits(first:100,after:$after){ pageInfo{hasNextPage endCursor}
                  nodes{ commit{ abbreviatedOid authors(first:1){ nodes{ email name user{ login } } } } } } } } }`;

            const pull = context.payload.pull_request;
            const nodes = [];
            let author;
            let after = null;
            do {
              const page = await github.graphql(query, {
                owner: context.repo.owner,
                name: context.repo.repo,
                number: pull.number,
                after,
              });
              const data = page.repository.pullRequest;
              author = data.author;
              nodes.push(...data.commits.nodes);
              after = data.commits.pageInfo.hasNextPage ? data.commits.pageInfo.endCursor : null;
            } while (after);

            // A `Bot` author's login carries no suffix while the account its commits resolve to
            // does: Renovate opens a pull request as `renovate` and signs its commits as
            // `renovate[bot]`. Deriving the one from the other keeps bots under the same rule
            // rather than exempting them.
            const expected = author.__typename === "Bot" ? `${author.login}[bot]` : author.login;
            const offenders = nodes.filter(
              ({ commit }) =>
                commit.authors.nodes[0]?.user?.login?.toLowerCase() !== expected.toLowerCase(),
            );
            if (offenders.length === 0) return;

            const listed = offenders.map(({ commit }) => {
              const [commitAuthor] = commit.authors.nodes;
              const resolved = commitAuthor?.user ? `@${commitAuthor.user.login}` : "no GitHub account";
              return `    ${commit.abbreviatedOid}  ${commitAuthor?.email ?? "no author email"}  ${resolved}`;
            });
            await writeFile(
              `${process.env.RUNNER_TEMP}/identity-comment.md`,
              [
                "## Commit identity check failed",
                "",
                `Every commit here must be authored by @${expected}, the account that opened this`,
                "pull request. These are not:",
                "",
                ...listed,
                "",
                "Point `git config user.email` at an address on that account, then re-author them:",
                "",
                `    git rebase -i --exec "git commit --amend --no-edit --reset-author" origin/${pull.base.ref}`,
                "",
              ].join("\n"),
            );
            core.setFailed(`${offenders.length} commit(s) do not resolve to @${expected}.`);

      - name: "Comment on PR with the offending commits"
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.identity.outcome == 'failure'
        with:
          header: pr-commit-identity-error
          path: ${{ runner.temp }}/identity-comment.md

      - name: "Remove error comment on success"
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.identity.outcome == 'success'
        with:
          header: pr-commit-identity-error
          delete: true

      - name: "Fail workflow if a commit did not resolve"
        if: steps.identity.outcome == 'failure'
        run: exit 1

      # AGENTS.md forbids model, agent, harness or tool attribution in a commit or a pull
      # request body; nothing enforced it here, the way `scripts/verify-changesets.ts` already
      # enforces it for a changeset summary.
      - name: "Refuse model attribution in commits and the pull request body"
        id: attribution
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const { writeFile } = require("node:fs/promises");

            // Kept equal to `scripts/lib/model-attribution.ts` by
            // `scripts/model-attribution.test.ts`; this job has no checkout to import it from.
            const patterns = [
              {
                name: "a Co-Authored-By trailer naming a model or tool",
                pattern:
                  /^co-authored-by:.*(?:claude|codex|copilot|gpt|openai|anthropic|gemini|cursor|noreply@anthropic\.com)/im,
              },
              { name: "a Claude-Session trailer", pattern: /^claude-session:/im },
              { name: 'a "Generated with" marker', pattern: /generated with/i },
              { name: "a claude.ai/code or session link", pattern: /claude\.ai\/(?:code|session)/i },
            ];
            const findAttribution = (text) =>
              patterns.filter(({ pattern }) => pattern.test(text ?? "")).map(({ name }) => name);

            const query = `query($owner:String!,$name:String!,$number:Int!,$after:String){
              repository(owner:$owner,name:$name){ pullRequest(number:$number){
                commits(first:100,after:$after){ pageInfo{hasNextPage endCursor}
                  nodes{ commit{ abbreviatedOid message } } } } } }`;

            const pull = context.payload.pull_request;
            const nodes = [];
            let after = null;
            do {
              const page = await github.graphql(query, {
                owner: context.repo.owner,
                name: context.repo.repo,
                number: pull.number,
                after,
              });
              const data = page.repository.pullRequest;
              nodes.push(...data.commits.nodes);
              after = data.commits.pageInfo.hasNextPage ? data.commits.pageInfo.endCursor : null;
            } while (after);

            const offenders = nodes
              .map(({ commit }) => ({
                oid: commit.abbreviatedOid,
                matches: findAttribution(commit.message),
              }))
              .filter(({ matches }) => matches.length > 0);
            const bodyMatches = findAttribution(pull.body);
            if (offenders.length === 0 && bodyMatches.length === 0) return;

            const listed = offenders.map(({ oid, matches }) => `    ${oid}  ${matches.join(", ")}`);
            await writeFile(
              `${process.env.RUNNER_TEMP}/attribution-comment.md`,
              [
                "## Attribution check failed",
                "",
                "A commit here or this pull request's body names the model, agent, harness or tool",
                "that helped write it. `AGENTS.md` asks for none of that; a human co-author stays",
                "welcome under the same trailer.",
                ...(listed.length > 0 ? ["", "These commits carry it:", "", ...listed] : []),
                ...(bodyMatches.length > 0
                  ? ["", `The pull request body carries it too: ${bodyMatches.join(", ")}.`]
                  : []),
                "",
                "Edit the offending commit messages:",
                "",
                `    git rebase -i --exec "git commit --amend --no-edit" origin/${pull.base.ref}`,
                "",
                ...(bodyMatches.length > 0 ? ["Then edit the pull request description to remove it.", ""] : []),
              ].join("\n"),
            );
            core.setFailed(
              `${offenders.length} commit(s) or the pull request body carry model attribution.`,
            );

      - name: "Comment on PR with the attribution violations"
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.attribution.outcome == 'failure'
        with:
          header: pr-attribution-error
          path: ${{ runner.temp }}/attribution-comment.md

      - name: "Remove attribution error comment on success"
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.attribution.outcome == 'success'
        with:
          header: pr-attribution-error
          delete: true

      - name: "Fail workflow if the attribution check failed"
        if: steps.attribution.outcome == 'failure'
        run: exit 1

  assign-author:
    name: "Assign author"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.event.action == 'opened'
    steps:
      - uses: technote-space/assign-author@9558557c5c4816f38bd06176fbc324ba14bb3160 # v1.6.2
