name: Repo / Pull request

# The unprivileged half of the pull request policy. It runs with the pull request's own workflow
# files and no permissions, and records only which pull request it ran for and why.
# pull-request-policy.yml runs the policy from the default branch when this run completes, and
# treats this record as untrusted data. docs/contributor/ci-cd.mdx § Pull request policy.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # Only a new commit supersedes a verdict. Metadata edits on one head must complete.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions: {}

jobs:
  record:
    name: "Record the pull request"
    timeout-minutes: 15
    runs-on: ubuntu-slim
    steps:
      - name: Write the pull request number and the event action
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          mkdir -p "$RUNNER_TEMP/pull-request"
          printf '%s\n%s\n' "$NUMBER" "$ACTION" > "$RUNNER_TEMP/pull-request/record"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pull-request
          path: ${{ runner.temp }}/pull-request/record
          retention-days: 1
          if-no-files-found: error
