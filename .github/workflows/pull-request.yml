name: Repo / Pull request

# The unprivileged half of the pull request policy. It runs with the pull request's own workflow
# files and read access only, and records only which pull request it ran for and why. It checks out
# only the upload action, from the default branch, never from the pull request.
# pull-request-policy.yml runs the policy from the default branch when this run completes, and
# treats this record as untrusted data. docs/contributor/ci-cd.mdx § Pull request policy.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - stacked

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # Only a new commit supersedes a verdict. Metadata edits on one head must complete.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions: {}

jobs:
  record:
    name: "Record the pull request"
    timeout-minutes: 15
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Check out the upload action from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/upload-artifact-retry
          persist-credentials: false
      - name: Write the pull request number and the event action
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          mkdir -p "$RUNNER_TEMP/pull-request"
          printf '%s\n%s\n' "$NUMBER" "$ACTION" > "$RUNNER_TEMP/pull-request/record"
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: pull-request
          path: ${{ runner.temp }}/pull-request/record
          retention-days: 1
          if-no-files-found: error
