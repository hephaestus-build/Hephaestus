name: Server Phase Reference

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read

concurrency:
  group: server-clean-reference
  cancel-in-progress: false

jobs:
  verify:
    name: Profile clean server phases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-caches

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"

      - name: Profile generated clients
        working-directory: server
        run: |
          mkdir -p ../ci-metrics
          ./gradlew :generated-clients:clean :generated-clients:jar --no-build-cache --profile
          cp generated-clients/build/libs/hephaestus-generated-clients-*.jar ../ci-metrics/generated-clients-first.jar

      - name: Verify generated artifact reproducibility
        working-directory: server
        run: |
          ./gradlew :generated-clients:clean :generated-clients:jar --no-build-cache --profile
          cmp ../ci-metrics/generated-clients-first.jar generated-clients/build/libs/hephaestus-generated-clients-*.jar
          sha256sum ../ci-metrics/generated-clients-first.jar generated-clients/build/libs/hephaestus-generated-clients-*.jar > ../ci-metrics/generated-clients-sha256.txt

      - name: Profile application and test compilation
        working-directory: server
        run: ./gradlew :application:testClasses --no-build-cache --profile

      - name: Verify test tier and shard discovery
        run: vp run test:server:selection

      - name: Profile unit and architecture execution
        working-directory: server
        run: ./gradlew :application:verification --no-build-cache --profile

      - name: Profile integration execution
        working-directory: server
        run: ./gradlew :application:integrationTest --no-build-cache --profile

      - name: Upload phase profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-phase-reference-${{ github.run_id }}
          path: |
            ci-metrics
            server/application/build/test-results
            server/build/reports/profile
          if-no-files-found: error
          retention-days: 30
