name: Security / Semgrep

on:
  pull_request:
  # Not `merge_group`: the queue lands its group's commit on main unchanged, so the push scan
  # reports on that same commit and is the one that updates main's code-scanning results.
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a superseded scan of a branch is wasted work, and a superseded scan of the
  # default branch is the only scan that commit will ever get.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan:
    name: TLS policy
    # GitHub's actions are glibc-based, so the musl scanner image runs as a container step rather
    # than as the job's container.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test policy examples
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          "$SEMGREP_IMAGE" semgrep scan --test --config security/semgrep security/semgrep --metrics=off --disable-version-check
      - name: Scan tracked source
        run: |
          mkdir -p tmp
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" -w /src \
            -v "$GITHUB_WORKSPACE/tmp:/out" \
            "$SEMGREP_IMAGE" semgrep scan --config security/semgrep --metrics=off --disable-version-check \
            --disable-nosem --strict --error --sarif-output /out/semgrep.sarif \
            --exclude security/semgrep .
      # A fork pull request's token cannot hold security-events: write, so the upload would fail on
      # a clean scan. The scan itself still reports the verdict.
      # Only the scan's verdict fails the job. The upload action retries server errors itself; an
      # upload that still fails is GitHub's code-scanning service, not the policy, so the next step
      # reports it instead of failing every pull request while that service is degraded.
      - name: Upload code scanning results
        id: upload
        if: >-
          ${{ !cancelled() && hashFiles('tmp/semgrep.sarif') != ''
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: tmp/semgrep.sarif
          category: semgrep-tls
      - name: Report a failed code scanning upload
        if: ${{ steps.upload.outcome == 'failure' }}
        run: |
          message="The scan result was not uploaded to code scanning. The scan's verdict stands, and the SARIF file is kept as this run's artifact."
          echo "::warning title=Code scanning upload failed::$message"
          echo "**Code scanning upload failed.** $message" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve scan evidence
        if: ${{ !cancelled() && hashFiles('tmp/semgrep.sarif') != '' }}
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: semgrep-${{ github.sha }}
          path: tmp/semgrep.sarif
          if-no-files-found: error
          retention-days: 14
