name: Security / Scan

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"

permissions: {}

jobs:
  security-scan:
    name: "Dependencies, secrets, and policy"
    runs-on: ubuntu-latest
    if: inputs.should_skip != 'true'
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    env:
      # Build and test dependencies execute in CI and can affect shipped artifacts too.
      TRIVY_INCLUDE_DEV_DEPS: "true"
      # trivy-action's default cache directory, so the download and both scans share one database.
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
      # The commit this event's change is measured from: the secret scan and the released-chain
      # guard judge the same range.
      EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The image scans' Trivy and advisory download: retries and a registry fallback, which the
      # action's own per-step download from a single mirror lacks. Both scans below read it.
      - uses: ./.github/actions/setup-release-security-tools
        with:
          install-syft: "false"
      - uses: ./.github/actions/download-trivy-db

      # SARIF output reports every severity whatever `severity` says, so this pass carries no
      # severity or exit code: it is the code-scanning feed, and the pass below is the verdict.
      - name: Trivy dependency scan
        id: dependencies
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          cache: "false"
          skip-setup-trivy: true

      - name: Upload Trivy results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: "trivy-results.sarif"

      # Every dependency in the checkout, not only the ones a pull request changes, so an advisory
      # published against an untouched pin fails this job on the next push to main.
      - name: Enforce dependency vulnerability policy
        id: dependency-policy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: "security/trivy-dependency-ignore.yaml"
          cache: "false"
          skip-setup-trivy: true

      - name: Secret detection
        id: secrets
        continue-on-error: true
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # The action pins the wrapper, not its scanner: the version input otherwise uses latest.
          image: ghcr.io/trufflesecurity/trufflehog
          version: 3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4
          path: ./
          base: ${{ env.EVENT_BASE }}
          head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          extra_args: --debug --only-verified --fail-on-scan-errors

      - name: Evaluate security checks
        id: security
        if: always()
        continue-on-error: true
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          DEPENDENCY_POLICY: ${{ steps.dependency-policy.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
        run: |
          failed=false
          for result in "$DEPENDENCIES" "$DEPENDENCY_POLICY" "$SECRETS"; do
            if [ "$result" != "success" ]; then failed=true; fi
          done
          if [ "$failed" = "true" ]; then
            echo "::error::One or more security checks failed; review the independently reported steps above."
            exit 1
          fi

      - uses: ./.github/actions/setup-toolchain
        if: always()
        with:
          install: "frozen"

      # A pull request's run does not repeat when its base advances, so the merge group is where a
      # migration that reached `main` since then is judged. Both need their base; only a push may lack one.
      - name: Resolve released-chain baseline
        id: baseline
        continue-on-error: true
        if: always()
        run: |
          set -euo pipefail
          BASE=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            if [ -z "$EVENT_BASE" ] || ! git cat-file -e "$EVENT_BASE^{commit}" 2>/dev/null; then
              echo "::error::Base commit ${EVENT_BASE:-<none>} is not in local history — this job needs fetch-depth: 0. Refusing to pass without checking."
              exit 1
            fi
            BASE="$EVENT_BASE"
          elif [ -n "$EVENT_BASE" ] && git cat-file -e "$EVENT_BASE^{commit}" 2>/dev/null; then
            BASE="$EVENT_BASE"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Baseline: ${BASE:-<none — no reachable previous tip, nothing to enforce>}"

      - name: Changelog immutability guard
        id: changelog-policy
        continue-on-error: true
        if: steps.baseline.outputs.base != ''
        env:
          BASE: ${{ steps.baseline.outputs.base }}
        run: node scripts/check-changelog-immutability.ts "$BASE"

      # Changelogs since the latest release tag, so it needs the tags that fetch-depth: 0 brings.
      - name: Changelog compatibility guard
        id: changelog-compatibility
        continue-on-error: true
        if: always()
        run: node scripts/check-changelog-compatibility.ts

      - name: Assert no legacy agent-image references
        id: legacy-image-policy
        continue-on-error: true
        if: always()
        run: |
          set -euo pipefail
          NEEDLE="agent-$(printf 'open\x63ode')"
          if grep -rEnI "$NEEDLE" \
                --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
                . \
              | grep -vE '^\./(MIGRATION\.md):' ; then
            echo "::error::Legacy agent image is removed in issue #1076; relocate any new references to MIGRATION.md."
            exit 1
          fi
      - name: Assert no release-channel agent image references
        id: release-channel-policy
        continue-on-error: true
        if: always()
        run: |
          set -euo pipefail
          NEEDLE="agent-pi:$(printf 'lat\x65st')"
          if grep -rEnI "$NEEDLE" \
                --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
                . \
              | grep -vE '^\./(MIGRATION\.md|docs/decisions/0031-.*\.md|server/application/src/test/java/de/tum/cit/aet/hephaestus/agent/sandbox/AgentImageReferenceGuardTest\.java):' ; then
            echo "::error::A release-channel agent image tag resolves to another release's image (ADR 0031). Leave the reference unset so it follows this deployment's image tag, or pin a digest."
            exit 1
          fi

      - name: Assert no legacy agent-image-pin.env references
        id: legacy-pin-policy
        continue-on-error: true
        if: always()
        run: |
          set -euo pipefail
          if grep -rEnI 'docker/agent-image-pin(\.local)?\.env' \
                --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
                . \
              | grep -vE '^\./(MIGRATION\.md):' \
              | grep -vE '^\./scripts/check-agent-instructions\.ts:[0-9]+:[[:space:]]*value: "docker/agent-image-pin(\.local)?\.env",$' ; then
            echo "::error::Legacy pin-file names are allowed only in migration history, the digest guide, and exact instruction-checker exceptions."
            exit 1
          fi

      - name: Evaluate security and repository policy
        if: always()
        env:
          SECURITY: ${{ steps.security.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          CHANGELOG: ${{ steps.changelog-policy.outcome }}
          CHANGELOG_COMPATIBILITY: ${{ steps.changelog-compatibility.outcome }}
          LEGACY_IMAGE: ${{ steps.legacy-image-policy.outcome }}
          RELEASE_CHANNEL: ${{ steps.release-channel-policy.outcome }}
          LEGACY_PIN: ${{ steps.legacy-pin-policy.outcome }}
        run: |
          failed=false
          for result in "$SECURITY" "$BASELINE" "$CHANGELOG" "$CHANGELOG_COMPATIBILITY" "$LEGACY_IMAGE" "$RELEASE_CHANNEL" "$LEGACY_PIN"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then failed=true; fi
          done
          if [ "$failed" = "true" ]; then
            echo "::error::One or more security or repository policy checks failed; review the independently reported steps above."
            exit 1
          fi
