# Hosts trust this workflow's signing identity. Keep signing behind the environment gate;
# making this workflow reusable would let callers share that identity.
name: Promote
run-name: Promote ${{ inputs.release || inputs.commit }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to move
        type: choice
        options: [Staging, Production]
        required: true
      release:
        description: Release to run, as vX.Y.Z. Leave empty to follow a commit instead.
        type: string
        required: false
      commit:
        description: Commit to run, as a full SHA. Only for an environment that follows main.
        type: string
        required: false
      automatic:
        description: Follow main only if the channel is not frozen or ahead of this build
        type: boolean
        default: false
      allow-rollback:
        description: Permit an older release or commit. This does not restore the database.
        type: boolean
        default: false
      freeze:
        description: Hold the environment where it is and ignore this release
        type: boolean
        default: false
      refresh-database-image:
        description: Recreate the database on the commit's PostgreSQL image instead of the carried one
        type: boolean
        default: false
permissions: {}

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      # Required reviewers still gate the job; scripts/record-deployment.ts says why.
      deployment: false
    permissions:
      # Lists CI/CD runs on main to find a later qualified build of an automatic request.
      actions: read
      contents: write
      deployments: write
      id-token: write
    env:
      # The deployment record and the channel commit both name who asked and link this run.
      REQUESTED_BY: ${{ github.triggering_actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      # Tooling comes from the dispatched workflow ref, not from the deployment target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deploy-state
          path: deploy-state
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"

      # The workflow lock covers this read through publication, including manually requested holds.
      # A skipped request leaves every later step skipped, so it publishes and records nothing.
      - name: Check automatic promotion
        id: policy
        if: ${{ inputs.automatic }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          CHANNEL: ${{ inputs.environment }}
        run: node scripts/automatic-promotion.ts

      - uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        if: ${{ steps.policy.outputs.apply != 'false' }}
        with:
          cosign-release: v3.1.4

      # Unlike tooling, upstream image pins must come from the deployment target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.policy.outputs.apply != 'false' && inputs.commit != '' }}
        with:
          ref: ${{ inputs.commit }}
          path: .promotion-inventory
          sparse-checkout: security
          persist-credentials: false

      - name: Resolve the release to promote and write the channel
        id: release
        if: ${{ steps.policy.outputs.apply != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.environment }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
          ALLOW_ROLLBACK: ${{ inputs.allow-rollback || false }}
          FREEZE: ${{ inputs.freeze || false }}
          REFRESH_DATABASE_IMAGE: ${{ inputs.refresh-database-image || false }}
          HOSTNAME: ${{ vars.APP_HOSTNAME }}
        run: node scripts/resolve-promotion.ts

      # The signed channel is the authority, so the record must never stop a deploy or a rollback.
      - name: Record the deployment
        id: deployment
        if: ${{ steps.policy.outputs.apply != 'false' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_FILE: deploy-state/${{ steps.release.outputs.channel }}
          ENVIRONMENT: ${{ inputs.environment }}
          ENVIRONMENT_URL: ${{ steps.release.outputs.environment_url }}
        run: node scripts/record-deployment.ts start

      - name: Sign the channel
        if: ${{ steps.policy.outputs.apply != 'false' }}
        working-directory: deploy-state
        env:
          CHANNEL_FILE: ${{ steps.release.outputs.channel }}
        run: cosign sign-blob --yes --bundle "${CHANNEL_FILE}.sigstore.json" "$CHANNEL_FILE"

      - name: Publish the channel
        id: publish-channel
        if: ${{ steps.policy.outputs.apply != 'false' }}
        working-directory: deploy-state
        env:
          GH_TOKEN: ${{ github.token }}
          HEADLINE: ${{ steps.release.outputs.headline }}
        run: |
          node ../scripts/commit-via-api.ts \
            --branch deploy-state \
            --message "$HEADLINE" \
            --body "Requested by ${REQUESTED_BY} in ${RUN_URL}" \
            -- channels

      - name: Verify the public webapp version
        id: webapp-version
        if: ${{ steps.policy.outputs.apply != 'false' && !inputs.freeze }}
        env:
          EXPECTED: ${{ steps.release.outputs.version }}
          HOSTNAME: ${{ vars.APP_HOSTNAME }}
        run: |
          set -euo pipefail
          # Observe the public webapp version; host metrics report stack readiness separately.
          deadline=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            config=$(curl -fsS --max-time 20 "https://${HOSTNAME}/" |
              grep -oE '/env-config\.[a-f0-9]{8}\.js' | head -1 || true)
            if [ -n "$config" ]; then
              running=$(curl -fsS --max-time 20 "https://${HOSTNAME}${config}" |
                sed -nE 's/.*APPLICATION_VERSION: "([^"]*)".*/\1/p' | head -1 || true)
              [ "$running" = "$EXPECTED" ] && { echo "Public webapp reports $running (other services not checked)"; exit 0; }
            fi
            sleep 20
          done
          echo "::error::Public webapp at ${HOSTNAME} did not report ${EXPECTED} within 15 minutes"
          exit 1

      - name: Finish the deployment record
        if: ${{ always() && steps.deployment.outputs.id != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          PUBLISHED: ${{ steps.publish-channel.outcome }}
          OBSERVED: ${{ steps.webapp-version.outcome }}
          VERSION: ${{ steps.release.outputs.version }}
          ENVIRONMENT_URL: ${{ steps.release.outputs.environment_url }}
        run: node scripts/record-deployment.ts finish

      - name: Report promotion verification scope
        if: ${{ always() && steps.publish-channel.outcome == 'success' }}
        env:
          FROZEN: ${{ inputs.freeze }}
          WEBAPP_OUTCOME: ${{ steps.webapp-version.outcome }}
        run: node scripts/report-promotion-coverage.ts

  # Continuous staging dispatches with GITHUB_TOKEN, so GitHub notifies nobody of a failed run.
  report-failure:
    needs: promote
    if: ${{ failure() && inputs.automatic }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"

      - name: Report the failure on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: node scripts/report-staging-promotion-failure.ts
