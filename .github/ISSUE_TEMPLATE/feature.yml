name: ✨ Plan a feature
description: Define user-facing behavior that is ready to implement
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Use this form for implementation-ready work. Start proposals that still need validation or design in [Ideas](https://github.com/hephaestus-build/Hephaestus/discussions/categories/ideas).

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has the problem? What do they want to do? Why can they not do it today?
      placeholder: A workspace admin needs to add a repository without reinstalling the GitHub App. This lets Hephaestus review a new repository immediately.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result.
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Observable behavior that shows the problem is solved. Each bullet is a change that ships. A measurement alone is not one (CONTRIBUTING.md § Issues).
      placeholder: |
        - [ ] A workspace admin can add a repository by entering owner/name.
        - [ ] If Hephaestus cannot access the repository, a clear error explains the problem.
        - [ ] The repository remains listed after a page reload.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant mockups, constraints, or links.
