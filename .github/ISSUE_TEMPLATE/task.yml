name: 📋 Plan technical work
description: Define a refactor, maintenance, infrastructure, documentation, or research task
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use this form for concrete technical work. Use the feature form for user-facing behavior and the bug form for unexpected behavior.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the result, not merely the activity.
      placeholder: If GitHub says a failed request is safe to retry, Hephaestus retries it.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this needed?
      description: Explain the problem and evidence. Link related work when useful.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and context
      description: Add relevant boundaries, constraints, dependencies, or links.

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Changes a reviewer can find in the repository, such as code, a test, a gate, or a document. A measurement or a verdict alone is not a criterion (CONTRIBUTING.md § Issues).
      placeholder: |
        - [ ] If a response permits a retry, Hephaestus retries with the provider-requested delay.
        - [ ] If a response does not permit a retry, the operation fails without another request.
    validations:
      required: true
