# Per-PR application stack for Coolify preview deployments.
#
# Coolify receives the opted-in PR head through its signed manual webhook and re-reads this file from
# that commit, so a pull request's own copy defines its stack. The controller refuses to deploy a pull
# request that changes anything under docker/preview/, and scripts/check-preview-stack.ts asserts the
# sandbox properties below on every pull request.
#
# Every service runs the image CI published for this exact commit — the same artifacts staging and
# production run, buildpack-built application server included. Nothing is built here, so a preview
# exercises the shipped runtime rather than a second recipe that could pass where the real one fails.
#
# This restates the reference stack rather than including it: Compose merges per key, so inheriting
# would arrive with sync, notifications and the agent digest requirement switched on, and with the
# Docker socket mounted. ADR 0035 option 6 has the rendered evidence.

services:
  postgres:
    image: ghcr.io/hephaestus-build/postgres:${SOURCE_COMMIT:?Coolify supplies the deployed commit}
    restart: unless-stopped
    environment:
      POSTGRES_DB: hephaestus
      POSTGRES_USER: hephaestus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint chowns its data directory and drops to the postgres user; without these it exits
    # with "failed switching to 'postgres'".
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hephaestus -d hephaestus"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 256

  # Clones staging into this preview over the network with a role that can only read; staging's data
  # volume is never mounted. This is the image staging itself runs, so pg_dump always matches the
  # server it reads.
  seed-loader:
    image: ghcr.io/hephaestus-build/postgres:${SOURCE_COMMIT:?Coolify supplies the deployed commit}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-shared
    environment:
      SERVICE_NAME_POSTGRES: ${SERVICE_NAME_POSTGRES:-postgres}
      SERVICE_FQDN_WEBAPP: ${SERVICE_FQDN_WEBAPP:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PREVIEW_SEED_SOURCE_HOST: ${PREVIEW_SEED_SOURCE_HOST:-app-postgres-1}
      PREVIEW_SEED_SOURCE_USERNAME: ${PREVIEW_SEED_SOURCE_USERNAME:-preview_seed}
      PREVIEW_SEED_SOURCE_DATABASE: ${PREVIEW_SEED_SOURCE_DATABASE:-hephaestus}
      PREVIEW_SEED_SOURCE_PASSWORD: ${PREVIEW_SEED_SOURCE_PASSWORD:?Set PREVIEW_SEED_SOURCE_PASSWORD to the staging seed role password}
    command:
      - sh
      - -c
      - |
        set -eu
        trap 'rm -f /tmp/seed.dump' EXIT

        if ! echo "$${SERVICE_FQDN_WEBAPP:-}" | grep -Eq "^pr[0-9]+"; then
          echo "Skipping seed-loader: non-PR deployment detected"
          exit 0
        fi

        SOURCE="$$PREVIEW_SEED_SOURCE_HOST"
        TARGET="$$SERVICE_NAME_POSTGRES"
        if [ "$$SOURCE" = "$$TARGET" ]; then
          echo "Refusing to use the preview database as its own seed source"
          exit 1
        fi

        # psql exits 0 on a missing relation, so read the answer rather than the status.
        MARKER=$$(PGPASSWORD="$$POSTGRES_PASSWORD" psql -h "$$TARGET" -U hephaestus -d hephaestus \
          -tAX -c "SELECT coalesce(to_regclass('public.hephaestus_preview_seeded')::text, '')")
        if [ -n "$$MARKER" ]; then
          echo "Skipping seed-loader: this preview has already been seeded"
          exit 0
        fi

        # Large objects are read per object, which is exactly what a role holding only
        # pg_read_all_data cannot do — so the dump skips them. Nothing maps to one today. If
        # something starts to, this stops rather than handing over a preview quietly missing data.
        export PGPASSWORD="$$PREVIEW_SEED_SOURCE_PASSWORD"
        OID_COLUMNS=$$(psql -h "$$SOURCE" -U "$$PREVIEW_SEED_SOURCE_USERNAME" \
          -d "$$PREVIEW_SEED_SOURCE_DATABASE" -tAX -v ON_ERROR_STOP=1 \
          -c "SELECT count(*) FROM information_schema.columns
               WHERE table_schema = 'public' AND data_type = 'oid'")
        if [ "$$OID_COLUMNS" != "0" ]; then
          echo "The source schema has $$OID_COLUMNS large-object columns, which this dump cannot read."
          echo "Grant the seed role access to them, or stop mapping columns to large objects."
          exit 1
        fi

        echo "Dumping staging data from $$SOURCE"
        pg_dump -h "$$SOURCE" -U "$$PREVIEW_SEED_SOURCE_USERNAME" \
          -d "$$PREVIEW_SEED_SOURCE_DATABASE" \
          --format=custom --no-owner --no-privileges --no-large-objects > /tmp/seed.dump
        test -s /tmp/seed.dump

        export PGPASSWORD="$$POSTGRES_PASSWORD"

        echo "Resetting the private preview database"
        psql -h "$$TARGET" -U hephaestus -d postgres -v ON_ERROR_STOP=1 \
          -c 'DROP DATABASE IF EXISTS hephaestus WITH (FORCE);' \
          -c 'CREATE DATABASE hephaestus OWNER hephaestus;'

        echo "Restoring staging data into the preview"
        pg_restore -h "$$TARGET" -U hephaestus -d hephaestus \
          --exit-on-error --no-owner --no-privileges < /tmp/seed.dump

        echo "Applying the preview policy"
        psql -h "$$TARGET" -U hephaestus -d hephaestus -v ON_ERROR_STOP=1 <<'SQL'
        -- 1. Silence: a clone must not act.
        UPDATE workspace
           SET practice_review_auto_trigger_enabled = FALSE,
               practice_review_manual_trigger_enabled = FALSE;

        UPDATE workspace_agent_binding
           SET enabled = FALSE,
               updated_at = NOW()
         WHERE purpose = 'PRACTICE_REVIEW';

        UPDATE review_sweep_schedule
           SET enabled = FALSE,
               updated_at = NOW();

        UPDATE agent_job
           SET status = 'CANCELLED',
               completed_at = COALESCE(completed_at, NOW()),
               worker_id = NULL,
               error_message = 'Cancelled when staging data was cloned into a preview.',
               cancellation_reason = NULL
         WHERE status IN ('QUEUED', 'RUNNING');

        UPDATE agent_job
           SET delivery_status = 'FAILED',
               error_message = CONCAT_WS(E'\n', NULLIF(error_message, ''),
                   'Delivery paused when staging data was cloned into a preview.')
         WHERE status = 'COMPLETED'
           AND delivery_status = 'PENDING';

        UPDATE sync_job
           SET status = 'CANCELLED',
               cancel_requested = TRUE,
               finished_at = COALESCE(finished_at, NOW()),
               heartbeat_at = NULL,
               error_summary = 'Cancelled when staging data was cloned into a preview.'
         WHERE status IN ('PENDING', 'RUNNING');

        -- 2. Re-home: a clone must not keep the source instance's identity. login_provider and
        -- jwt_signing_key are reseeded from this deployment's own config on boot; issued_jwt is
        -- simply dropped. Accounts survive — identity_link keys on identity_provider.
        DELETE FROM issued_jwt;
        DELETE FROM jwt_signing_key;
        DELETE FROM login_provider;

        -- 3. Forget provider secrets; catalogs, integrations and their state stay as they were, so the
        --    preview looks like staging without holding anything that can act as staging.
        UPDATE llm_connection SET api_key = NULL, enabled = FALSE, updated_at = NOW()
         WHERE api_key IS NOT NULL OR enabled;
        UPDATE workspace_llm_connection SET api_key = NULL, enabled = FALSE, updated_at = NOW()
         WHERE api_key IS NOT NULL OR enabled;
        UPDATE connection
           SET credentials_encrypted = NULL,
               credentials_alg = NULL,
               credentials_key_version = NULL,
               credentials_rotation_failed_at = NULL,
               -- the Outline signing secret lives in the config document, not in the credential bundle
               config = config - 'webhookSecret',
               updated_at = NOW()
         WHERE credentials_encrypted IS NOT NULL OR credentials_alg IS NOT NULL
            OR credentials_key_version IS NOT NULL OR credentials_rotation_failed_at IS NOT NULL
            OR config ? 'webhookSecret';
        -- A job token is a credential staging minted; the jobs are cancelled or finished, so the
        -- token has nothing left to authorise. The column is unique, hence a marker per row.
        UPDATE agent_job SET job_token = 'cleared-by-preview-clone:' || id, job_token_hash = NULL
         WHERE job_token NOT LIKE 'cleared-by-preview-clone:%';
        SQL

        # Every statement above succeeds when it matches nothing, so the marker is earned by
        # counting rather than by psql's exit status.
        echo "Verifying the preview policy took effect"
        LIVE=$$(psql -h "$$TARGET" -U hephaestus -d hephaestus -tAX -v ON_ERROR_STOP=1 -c "
          SELECT (SELECT count(*) FROM workspace
                   WHERE practice_review_auto_trigger_enabled OR practice_review_manual_trigger_enabled)
               + (SELECT count(*) FROM workspace_agent_binding WHERE enabled AND purpose = 'PRACTICE_REVIEW')
               + (SELECT count(*) FROM review_sweep_schedule WHERE enabled)
               + (SELECT count(*) FROM agent_job WHERE status IN ('QUEUED', 'RUNNING'))
               + (SELECT count(*) FROM agent_job
                   WHERE status = 'COMPLETED' AND delivery_status = 'PENDING')
               + (SELECT count(*) FROM sync_job WHERE status IN ('PENDING', 'RUNNING'))
               + (SELECT count(*) FROM login_provider)
               + (SELECT count(*) FROM jwt_signing_key)
               + (SELECT count(*) FROM issued_jwt)
               + (SELECT count(*) FROM llm_connection WHERE api_key IS NOT NULL OR enabled)
               + (SELECT count(*) FROM workspace_llm_connection WHERE api_key IS NOT NULL OR enabled)
               + (SELECT count(*) FROM connection
                   WHERE credentials_encrypted IS NOT NULL OR credentials_alg IS NOT NULL
                      OR credentials_key_version IS NOT NULL OR credentials_rotation_failed_at IS NOT NULL
                      OR config ? 'webhookSecret')
               + (SELECT count(*) FROM agent_job
                   WHERE job_token NOT LIKE 'cleared-by-preview-clone:%' OR job_token_hash IS NOT NULL)")
        if [ "$$LIVE" != "0" ]; then
          echo "Preview policy did not take effect ($$LIVE rows still live); refusing to mark this preview seeded"
          exit 1
        fi

        psql -h "$$TARGET" -U hephaestus -d hephaestus -v ON_ERROR_STOP=1 \
          -c 'CREATE TABLE hephaestus_preview_seeded (seeded_at timestamptz NOT NULL DEFAULT now());'
        echo "Seed loaded; reviews are paused and the preview owns its login apps and signing key"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 128

  appserver:
    image: ghcr.io/hephaestus-build/application-server:${SOURCE_COMMIT:?Coolify supplies the deployed commit}
    # Bounded automatic retries, unlike the reference stack, because restarting this image is not
    # free: the buildpack adds the container's CA certificates to the JRE truststore on every start,
    # that truststore is in the container's writable layer, and the additions accumulate, so each
    # restart enlarges the file the next one parses. A container that keeps failing therefore
    # becomes unable to start for a reason unrelated to why it first did, and it does so on a host
    # shared with staging. Stopping bounds both.
    #
    # Uptime resets the retry delay, not the count, so five is a budget for the container's whole
    # life rather than per incident; a preview is re-created on the next push, which clears it.
    restart: on-failure:5
    expose:
      - "8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=${APP_MAX_DIRECT_MEMORY:-128M}"
      SPRING_PROFILES_ACTIVE: prod
      APP_VERSION: ${SOURCE_COMMIT:?Coolify supplies the deployed commit}
      # APP_VERSION is a commit SHA, not a release tag, so ADR 0031's digest derivation has nothing
      # to resolve. Agents are off (AGENT_ENABLED below), but the pin guard is built regardless.
      HEPHAESTUS_AGENT_IMAGE_REQUIRE_DIGEST: "false"
      # Read by the static thc binary the health-checker buildpack installs at /workspace/health-check.
      THC_PORT: "8080"
      THC_PATH: /actuator/health/liveness
      HEPHAESTUS_RUNTIME_WEBHOOK_ENABLED: "false"
      HEPHAESTUS_RUNTIME_WORKER_ENABLED: "false"
      # prod runs forward-headers=native, so ProxyTrustGuard aborts the boot unless this is set.
      # Write this Tomcat internal-proxies regex WITHOUT backslashes: Coolify re-escapes them when
      # it writes the stack .env, so `172\.18\.` reaches the container doubled and matches nothing.
      # The valve then distrusts the proxy, X-Forwarded-Proto is dropped and OAuth redirect_uris are
      # built as http://. An unescaped '.' matches any character, which is harmless for an IP range:
      # 172.(1[6-9]|2[0-9]|3[01]).[0-9]{1,3}.[0-9]{1,3}
      HEPHAESTUS_TRUSTED_PROXIES: ${HEPHAESTUS_TRUSTED_PROXIES}
      APPLICATION_HOST_URL: https://${SERVICE_FQDN_WEBAPP}
      # Coolify renames each service to `<service>-pr-<id>` and publishes the renamed hosts as
      # SERVICE_NAME_*, so the bare service name resolves to nothing inside a preview. The defaults
      # keep this file runnable on its own.
      DATABASE_URL: postgresql://${SERVICE_NAME_POSTGRES:-postgres}:5432/hephaestus?sslmode=disable
      # That renaming is also why this is set. The transport guard allows plaintext to a database
      # it can name as local, and `postgres` is on that list — but a preview's database answers
      # to `postgres-pr-<id>`, so the guard reads a sibling container on the deployment's own
      # private network as a remote host and refuses to start. The trust is identical to the
      # reference stack's; only the name differs.
      HEPHAESTUS_DATABASE_ALLOW_INSECURE_REMOTE: "true"
      DATABASE_USERNAME: hephaestus
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # The integration consumer reads staging's JetStream, so a preview sees the events a shared
      # GitHub App delivers there rather than an empty broker.
      NATS_SERVER: ${NATS_SERVER:-nats://nats-server:4222}
      NATS_USERNAME: ${NATS_USERNAME:?Set NATS_USERNAME to the staging broker username}
      NATS_PASSWORD: ${NATS_PASSWORD:?Set NATS_PASSWORD to the staging broker password}
      NATS_ENABLED: "true"
      # Per-deploy durable name, so previews get their own JetStream consumers instead of competing
      # for one and stealing each other's messages.
      NATS_DURABLE_CONSUMER_NAME: ${SERVICE_NAME_APPSERVER:-appserver}-consumer
      # A preview is deleted, not shut down, so it never removes its durables from the shared
      # stream. Shorter than the shipped 30d because a preview is abandoned at merge, and long
      # enough that a redeploy resumes on its own cursor.
      HEPHAESTUS_INTEGRATION_CONSUMER_INACTIVE_THRESHOLD: 72h
      HEPHAESTUS_AUTH_ISSUER: https://${SERVICE_FQDN_WEBAPP}
      HEPHAESTUS_AUTH_STATE_COOKIE_KEY: ${HEPHAESTUS_AUTH_STATE_COOKIE_KEY:?Set HEPHAESTUS_AUTH_STATE_COOKIE_KEY to a Base64-encoded 32-byte key}
      HEPHAESTUS_AUTH_BOOTSTRAP_ADMINS: ${HEPHAESTUS_AUTH_BOOTSTRAP_ADMINS:-}
      HEPHAESTUS_SECURITY_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_ENCRYPTION_KEY:?Set HEPHAESTUS_SECURITY_ENCRYPTION_KEY to exactly 32 printable ASCII characters}
      HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY:?Set HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY to exactly 32 printable ASCII characters}
      HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY_VERSION:-1}
      HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY:-}
      HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY_VERSION:-}
      HEPHAESTUS_SECURITY_CREDENTIAL_ROTATION_ENABLED: ${HEPHAESTUS_SECURITY_CREDENTIAL_ROTATION_ENABLED:-false}
      GITHUB_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
      GH_APP_ID: "0"
      GH_APP_PRIVATE_KEY: ""
      GH_AUTH_TOKEN: ""
      GITLAB_ENABLED: "false"
      GITLAB_WORKSPACE_CREATION: "false"
      HEPHAESTUS_INTEGRATION_SLACK_ENABLED: "false"
      HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED: "false"
      AGENT_ENABLED: "false"
      GIT_CHECKOUT_ENABLED: "false"
      MONITORING_RUN_ON_STARTUP: "false"
      MONITORING_SYNC_CRON: "-"
      MONITORING_BACKFILL_ENABLED: "false"
      LEADERBOARD_NOTIFICATION_ENABLED: "false"
      SENTRY_DSN: ""
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET to at least 32 printable ASCII characters}
      WEBHOOK_EXTERNAL_URL: ""
    # Joined to reach staging's broker; this stack's own database and SPA stay on Coolify's
    # per-preview network.
    networks:
      - staging-shared
    depends_on:
      postgres:
        condition: service_healthy
      seed-loader:
        condition: service_completed_successfully
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 15s
      timeout: 5s
      # First boot runs Liquibase over a freshly restored staging dump, on a host shared with
      # staging.
      retries: 10
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
          pids: 512
  webapp:
    image: ghcr.io/hephaestus-build/webapp:${SOURCE_COMMIT:?Coolify supplies the deployed commit}
    # `expose` is how Coolify learns which port to route ${SERVICE_FQDN_WEBAPP} to; the image's own
    # EXPOSE is not read for that.
    expose:
      - "80"
    restart: unless-stopped
    environment:
      APPLICATION_VERSION: preview
      APPLICATION_CLIENT_URL: https://${SERVICE_FQDN_WEBAPP}
      GIT_BRANCH: ${COOLIFY_BRANCH:-}
      # One origin, as production has: the API answers under the app's own hostname at /api, and
      # Coolify strips the prefix before the container sees it. The session and CSRF cookies carry
      # the `__Host-` prefix, which forbids a Domain attribute and so binds them to exactly one
      # host — on sibling hostnames the page cannot read the CSRF cookie it has to send back, and
      # every request that changes something is refused.
      APPLICATION_SERVER_URL: https://${SERVICE_FQDN_WEBAPP}/api
      TANSTACK_DEVTOOLS_ENABLED: "true"
      SENTRY_ENVIRONMENT: preview
      SENTRY_DSN: ""
    depends_on:
      appserver:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx's master chowns its cache directories and then runs its workers as the nginx user. With
    # CHOWN alone the master survives and every worker exits "fatal code 2 and cannot be respawned",
    # which leaves a container that looks up and serves nothing.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 128

networks:
  # Staging's own network, joined by name rather than declared here, so this is a deliberate shared
  # network and not one of the project-scoped ones every preview would silently share.
  staging-shared:
    external: true
    name: shared-network

volumes:
  postgres-data:
