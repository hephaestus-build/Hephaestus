services:
  # ─────────────────────────────────────────────────────────────────────────────
  # webhook-server — inbound webhook receiver (same image as application-server,
  # activated with SPRING_PROFILES_ACTIVE=prod,webhook so only the
  # integration.core.webhook beans load). Deployed as a separate container from
  # application-server so an app-server restart doesn't drop incoming webhooks
  # (push events aren't manually redeliverable on GitHub/GitLab). See ADR 0008.
  # ─────────────────────────────────────────────────────────────────────────────
  webhook-server:
    image: "${HEPHAESTUS_IMAGE_APPLICATION_SERVER:?verified release lock required}"
    # Bounds heap sizing to this container so co-located JVMs don't oversubscribe host RAM.
    # Must fit the Spring classpath-scan startup spike (well above the small steady footprint),
    # or the JVM OOMs during boot.
    mem_limit: ${WEBHOOK_SERVER_MEM_LIMIT:-2g}
    cpus: ${WEBHOOK_SERVER_CPUS:-2.0}
    pids_limit: ${WEBHOOK_SERVER_PIDS_LIMIT:-256}
    expose:
      - "8080"
    environment:
      HEPHAESTUS_RELEASE_COMMIT: ${HEPHAESTUS_RELEASE_COMMIT:-}
      HEPHAESTUS_IMAGE_APPLICATION_SERVER: ${HEPHAESTUS_IMAGE_APPLICATION_SERVER:-}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.0}
      TRACING_OTLP_ENABLED: ${TRACING_OTLP_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
      APP_VERSION: ${IMAGE_TAG}
      SPRING_PROFILES_ACTIVE: "prod,webhook"
      HEPHAESTUS_RUNTIME_WEBHOOK_ENABLED: "true"
      HEPHAESTUS_RUNTIME_SERVER_ENABLED: "false"
      HEPHAESTUS_RUNTIME_WORKER_ENABLED: "false"
      SPRING_LIQUIBASE_ENABLED: "false"
      # NATS — reuses the existing `natsConnection` bean to publish inbound events.
      HEPHAESTUS_SYNC_NATS_ENABLED: "true"
      HEPHAESTUS_SYNC_NATS_SERVER: "nats://nats-server:4222"
      NATS_USERNAME: ${NATS_USERNAME:?Set NATS_USERNAME}
      NATS_PASSWORD: ${NATS_PASSWORD:?Set NATS_PASSWORD}
      # Stream bounds belong on THIS container. The beans that read hephaestus.webhook.stream.* are
      # gated on the webhook role, so the same variables on application-server (which runs with the
      # role off) would configure nothing at all. `gate:env` fails the build if they drift back.
      HEPHAESTUS_WEBHOOK_STREAM_MAX_AGE: ${HEPHAESTUS_WEBHOOK_STREAM_MAX_AGE:-180d}
      HEPHAESTUS_WEBHOOK_STREAM_MAX_BYTES: ${HEPHAESTUS_WEBHOOK_STREAM_MAX_BYTES:-1GB}
      # github carries essentially all of the traffic, so it is the only per-stream override and the
      # only one worth moving. Raise it and NATS_JS_MAX_FILE_BYTES together.
      HEPHAESTUS_WEBHOOK_STREAM_MAX_BYTES_GITHUB: ${HEPHAESTUS_WEBHOOK_STREAM_MAX_BYTES_GITHUB:-10GB}
      # The loss counter charges dropped webhooks only to durables under this name, and
      # application-server derives every durable it creates from the same value — so the two
      # containers have to be given the same one.
      NATS_DURABLE_CONSUMER_NAME: ${NATS_DURABLE_CONSUMER_NAME:-hephaestus}
      # Startup refuses to boot if the stream bounds sum above this, so the broker can never be
      # asked to hold more than its volume. Same value as the broker's own max_file below.
      HEPHAESTUS_WEBHOOK_STREAM_STORAGE_BUDGET: ${NATS_JS_MAX_FILE_BYTES:-17179869184}
      # Lowering a bound on a stream that has already outgrown it deletes the excess. Set true for
      # one deliberate start-up to apply it; startup otherwise logs what it would cost and declines.
      HEPHAESTUS_WEBHOOK_STREAM_ALLOW_DESTRUCTIVE_LIMIT_UPDATES: ${HEPHAESTUS_WEBHOOK_STREAM_ALLOW_DESTRUCTIVE_LIMIT_UPDATES:-false}
      # Applying that bound sheds the excess before the broker replies, so the wait scales with the
      # bytes deleted. Raise it on a stream large enough that 5 minutes is not enough.
      HEPHAESTUS_WEBHOOK_STREAM_LIMIT_UPDATE_TIMEOUT: ${HEPHAESTUS_WEBHOOK_STREAM_LIMIT_UPDATE_TIMEOUT:-5m}
      # Shared webhook secret used for incoming HMAC / token verification.
      # WEBHOOK_EXTERNAL_URL is only used by auto-registration (server role) and is intentionally
      # not set on the webhook-server pod.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET to at least 32 printable ASCII characters}
      # DataSource for the JPA layer (connection credentials used by the HMAC
      # path reads); the auth web layer and workspace-context filter are gated off this role.
      # Internal, trusted docker-network DB: skip TLS. pgJDBC doesn't validate Postgres' self-signed cert
      # so it adds no authentication, only the SSL handshake's NIO direct buffers that OOM the JVM off-heap
      # default; confidentiality is fine to drop here (creds already sit in plaintext compose env).
      DATABASE_URL: postgresql://postgres:5432/hephaestus?sslmode=disable
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      # Connection credentials are decrypted on every role.
      HEPHAESTUS_SECURITY_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_ENCRYPTION_KEY:?Set HEPHAESTUS_SECURITY_ENCRYPTION_KEY to exactly 32 printable ASCII characters}
      HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY:?Set HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY to exactly 32 printable ASCII characters}
      HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY_VERSION:-1}
      HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY:-}
      HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY_VERSION:-}
      HEPHAESTUS_SECURITY_CREDENTIAL_ROTATION_ENABLED: ${HEPHAESTUS_SECURITY_CREDENTIAL_ROTATION_ENABLED:-false}
      # Slack Events API + interactivity are received by this pod under /webhooks/slack*.
      # Interactivity may send Slack follow-ups; OAuth/admin and mentor replies stay on application-server.
      HEPHAESTUS_INTEGRATION_SLACK_ENABLED: ${HEPHAESTUS_INTEGRATION_SLACK_ENABLED:-false}
      HEPHAESTUS_INTEGRATION_SLACK_SIGNING_SECRET: ${HEPHAESTUS_INTEGRATION_SLACK_SIGNING_SECRET:-}
      # Outline change notifications arrive here under /webhooks/outline. The flag gates
      # OutlineWebhookSignatureVerifier + OutlineWebhookSecretSource; without it WebhookIngestPipeline
      # has no verifier for the kind and answers 501 to EVERY delivery, which Outline counts as a
      # failure and auto-disables the subscription after 25 of them. No signing secret here: Outline's
      # secret is per-subscription (minted by OutlineWebhookRegistrar on the server pod, stored
      # encrypted on the connection row) and is read back through JPA, not from the environment.
      # Keep in lockstep with application-server's value.
      HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED: ${HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED:-false}
      HEPHAESTUS_INTEGRATION_OUTLINE_ALLOWED_ORIGINS: ${HEPHAESTUS_INTEGRATION_OUTLINE_ALLOWED_ORIGINS:-}
      # application-prod.yml binds host-url=${APPLICATION_HOST_URL} with no YAML default; compose always
      # supplies it (an unset var fails the boot at placeholder resolution).
      APPLICATION_HOST_URL: https://${APP_HOSTNAME}
      SENTRY_DSN: ${SENTRY_DSN}
      # forward-headers=native (application-prod.yml) → ProxyTrustGuard fails the boot unless pinned.
      HEPHAESTUS_TRUSTED_PROXIES: ${HEPHAESTUS_TRUSTED_PROXIES:-}
      # AgentImagePinGuard loads in any prod pod; set false for non-release deploys that skip the pin.
      HEPHAESTUS_AGENT_IMAGE_REQUIRE_DIGEST: ${HEPHAESTUS_AGENT_IMAGE_REQUIRE_DIGEST:-true}
      # Both agent image guards are deliberately not role-gated (ADR 0031): the server and the agent
      # image are one runtime contract, so a reference the workers cannot run has to fail this pod
      # too rather than let it boot on a deployment the rest of the stack rejects. That makes the
      # lock's digest a setting this pod is owed, exactly as in docker/compose.app.yaml. Unset, the
      # reference derives from APP_VERSION — a tag, which the pin guard above refuses.
      HEPHAESTUS_AGENT_IMAGE_REFERENCE: ${HEPHAESTUS_IMAGE_AGENT_PI:?verified release lock required}
      # thc healthcheck target: readiness (reports unhealthy while NATS/JetStream is unavailable).
      THC_PORT: "8080"
      THC_PATH: /actuator/health/readiness
    # nats-server only: `postgres` belongs to compose.app.yaml, and depends_on is project-scoped, so
    # naming it here orders nothing and makes this file refuse to render. Cross-project ordering is
    # the deployment workflow's; docker/self-host/compose.single-host.yaml merges all three projects
    # into one and does declare it. Losing the ordering is safe here: `restart: unless-stopped`
    # carries the receiver over a database that is not up yet, and its readiness group names no `db`
    # contributor, so ingestion health stays honest while it waits.
    depends_on:
      nats-server:
        condition: service_healthy
    restart: unless-stopped
    # Spring drains HTTP (timeout-per-shutdown-phase 20s) THEN WebhookGracefulShutdown drains
    # NATS (up to 15s). Docker must allow ≥35s before SIGKILL, or the JVM is cut mid-drain.
    stop_grace_period: 40s
    networks:
      - shared-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.http-webhook-server.entryPoints=http"
      - "traefik.http.routers.http-webhook-server.middlewares=redirect-to-https"
      - "traefik.http.routers.http-webhook-server.rule=(${APP_HOST_MATCH:-Host(`${APP_HOSTNAME}`)}) && PathPrefix(`/webhooks`)"
      - "traefik.http.routers.https-webhook-server.entryPoints=https"
      # No stripprefix: the receiver owns the full "/webhooks/{kind}" path (controller + payload-size
      # filter + security chain all bind to /webhooks/**). Stripping it would 404 every delivery.
      # Match the receiver's 25 MiB limit here, not on the shared entrypoint where buffering would
      # hold /api SSE responses. Keeping it with this router avoids a dependency on the proxy stack.
      # HSTS rides on the router, not on the entrypoint: an entrypoint middleware exists only when
      # this deployment's edge is the proxy stack, and behind someone else's proxy the header
      # would silently go missing. The other security headers are set by the responses
      # themselves, so this is the one that has nowhere else to come from.
      - traefik.http.middlewares.core-hsts.headers.stsSeconds=2592000
      - traefik.http.middlewares.core-hsts.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.webhook-body-limit.buffering.maxRequestBodyBytes=26214400
      - traefik.http.middlewares.webhook-body-limit.buffering.memRequestBodyBytes=1048576
      - "traefik.http.routers.https-webhook-server.middlewares=core-hsts,webhook-body-limit,gzip"
      - "traefik.http.routers.https-webhook-server.rule=(${APP_HOST_MATCH:-Host(`${APP_HOSTNAME}`)}) && PathPrefix(`/webhooks`)"
      - "traefik.http.routers.https-webhook-server.tls.certresolver=letsencrypt"
      - "traefik.http.routers.https-webhook-server.tls=true"
      - "traefik.http.routers.http-webhook-server.priority=100"
      - "traefik.http.routers.https-webhook-server.priority=100"
      - "traefik.http.services.https-webhook-server.loadbalancer.server.port=8080"
      # Routing-layer probe: drops a bad backend from the LB pool.
      - "traefik.http.services.https-webhook-server.loadbalancer.healthcheck.path=/actuator/health/readiness"
      - "traefik.http.services.https-webhook-server.loadbalancer.healthcheck.interval=15s"
      - "traefik.http.services.https-webhook-server.loadbalancer.healthcheck.timeout=5s"
    # thc healthcheck (see docker/compose.app.yaml).
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nats-server:
    image: ${HEPHAESTUS_IMAGE_NATS:?verified release lock required}
    restart: unless-stopped
    ports:
      # Publish on loopback by default.
      - "${NATS_BIND_HOST:-127.0.0.1}:4222:4222"
    command: ["--config", "/etc/nats/nats-server.conf"]
    environment:
      NATS_USERNAME: ${NATS_USERNAME:?Set NATS_USERNAME}
      NATS_PASSWORD: ${NATS_PASSWORD:?Set NATS_PASSWORD}
    volumes:
      - nats-data:/data
    configs:
      - source: nats-server.conf
        target: /etc/nats/nats-server.conf
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


networks:
  shared-network:
    name: shared-network
    driver: bridge

volumes:
  nats-data:

configs:
  nats-server.conf:
    content: |
      listen: "0.0.0.0:4222" 

      authorization {
        user: $$NATS_USERNAME
        password: $$NATS_PASSWORD
      }

      http_port: 8222

      # A message the receiver accepts but the broker refuses is verified, admitted and then lost.
      # NATS defaults max_payload to 1MB, far below the 25 MiB hephaestus.webhook.http.max-payload-bytes
      # admits, so it is pinned to the same number here and the receiver logs at ERROR if they differ.
      max_payload: ${NATS_MAX_PAYLOAD_BYTES:-26214400}

      jetstream {
        store_dir: "/data"
        max_mem: ${NATS_JS_MAX_MEM:-4G}
        # Per-message fsync protects R1 acknowledgements at a throughput cost:
        # https://jepsen.io/analyses/nats-2.12.1
        sync_interval: always
        # In bytes, and shared with HEPHAESTUS_WEBHOOK_STREAM_STORAGE_BUDGET above so the two cannot
        # drift. A byte count is the one literal NATS and Spring read identically. Keep it under the
        # free space on this volume — docs/admin/webhook-ingestion-operations says what happens if not.
        max_file: ${NATS_JS_MAX_FILE_BYTES:-17179869184}
      }
