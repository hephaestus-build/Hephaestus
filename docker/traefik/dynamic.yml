tls:
  options:
    default:
      minVersion: VersionTLS12

{{ if eq (env "HEPHAESTUS_WORKSPACE_SUBDOMAINS_ENABLED") "true" }}
{{ $base := env "HEPHAESTUS_WORKSPACE_SUBDOMAINS_BASE_DOMAIN" }}
{{ if or (ne $base (env "APP_HOSTNAME")) (gt (len $base) 189) (not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?([.][a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*[.][a-z]([a-z0-9-]{0,61}[a-z0-9])?$" $base)) }}
{{ fail "Subdomains require APP_HOSTNAME to equal the lowercase DNS base domain" }}
{{ end }}
{{ if ne (env "ACME_CHALLENGE") "dnschallenge.provider" }}
{{ fail "Subdomains require ACME_CHALLENGE=dnschallenge.provider" }}
{{ end }}
{{ $domain := regexQuoteMeta $base }}
{{ $reserved := "www|api|docs|admin|auth|login|mail|status|staging|preview|info|marketing|sales|support|abuse|noc|security|postmaster|hostmaster|usenet|news|webmaster|uucp|ftp|w|settings|integrations|consent|legal|privacy|terms|unsubscribe|landing|oauth|oauth2|webhooks|actuator|livez|readyz|error|swagger-ui|v3|identity-providers|workspaces|workers|mentor|feedback|practices|activity|about|imprint|audit|catalog|login-providers|models|person-data|surveys|usage|users|onboarding|practice-profile|practices-across-the-workspace|workspace-activity|new|github|gitlab|members|teams|outline|scm|slack|releases|review|reviews|user|observations|runs|work|practice-groups|assets|static|cdn|traefik|grafana|prometheus|nats|postgres|registry|agents|config-audit|connections|contributors|internal|llm|practice-catalog|product-feedback|sync|team|user-view|notifications|providers|pr[0-9]+" }}
{{ $tenant := printf "HostRegexp(`^[a-z0-9][a-z0-9-]{1,49}[a-z0-9][.]%s$`) && !HostRegexp(`^(%s)[.]%s$`) && !HostRegexp(`^.*--.*$`)" $domain $reserved $domain }}
{{ $paths := "!PathRegexp(`^/(api|auth|oauth|oauth2|login|consent|webhooks|actuator)(/|$)`)" }}
http:
  routers:
    http-tenant:
      entryPoints: [http]
      rule: '{{ $tenant }} && {{ $paths }}'
      priority: 6
      middlewares: [redirect-to-https@docker]
      service: https-webapp@docker
    https-tenant:
      entryPoints: [https]
      rule: '{{ $tenant }} && {{ $paths }}'
      priority: 6
      middlewares: [app-hsts@docker, webapp-body-limit@docker]
      service: https-webapp@docker
      tls:
        certResolver: letsencrypt
        domains:
          - main: '{{ $base }}'
            sans: ['*.{{ $base }}']
{{ if eq (env "HEPHAESTUS_EDGE_MAINTENANCE_ENABLED") "true" }}
    http-tenant-maintenance:
      entryPoints: [http]
      rule: '{{ $tenant }} && {{ $paths }}'
      priority: 1
      middlewares: [redirect-to-https@docker]
      service: maintenance@docker
    https-tenant-maintenance:
      entryPoints: [https]
      rule: '{{ $tenant }} && {{ $paths }}'
      priority: 1
      service: maintenance@docker
      tls:
        certResolver: letsencrypt
        domains:
          - main: '{{ $base }}'
            sans: ['*.{{ $base }}']
{{ end }}
{{ end }}
