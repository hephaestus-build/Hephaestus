services:
  reverse-proxy:
    # Keep at >=3.3: below it the app-server sticky.cookie.path label (workspace replica affinity)
    # fails to parse and Traefik silently drops the whole router. Pin a current 3.x.
    image: ${HEPHAESTUS_IMAGE_TRAEFIK:?verified release lock required}
    restart: unless-stopped
    networks:
      - shared-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # A named volume, not a path beside this file: under the reconciler this file lives in a
      # per-release worktree, so a relative bind would put the ACME account and certificates in
      # state that a release replaces. Traefik would then re-issue on every deployment and Let's
      # Encrypt would rate-limit the domain into serving an untrusted certificate.
      - letsencrypt:/letsencrypt
    command:
      - "--ping=true"
      - "--ping.entrypoint=http"
      - "--metrics.prometheus=true"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.https.address=:443"
      # Request-body caps stay on their service routers because buffering here would hold SSE
      # responses and make the app and core stacks depend on this proxy stack.
      - "--entrypoints.https.http.middlewares=security-headers@docker"
      - "--entrypoints.http.http.encodequerysemicolons=true"
      - "--entryPoints.http.http2.maxConcurrentStreams=50"
      - "--entrypoints.https.http.encodequerysemicolons=true"
      - "--entryPoints.https.http2.maxConcurrentStreams=50"
      # Mentor chat is a long-running SSE stream (10-minute SseEmitter timeout). Traefik's
      # default idleTimeout (180s) would close it mid-turn during long Pi LLM calls; the app
      # server emits a comment-only SSE keep-alive every 20s of silence (MentorChatService
      # HEARTBEAT_QUIET_NS) so the proxy sees regular traffic. 300s here is the safety margin
      # above the 20s heartbeat — if heartbeats stop, the proxy reaps within 5 minutes.
      - "--entryPoints.http.transport.respondingTimeouts.idleTimeout=300s"
      - "--entryPoints.https.transport.respondingTimeouts.idleTimeout=300s"
      # Backend timeouts belong in static configuration: a serversTransport is definable only by the
      # file provider, so a router that named one would break whenever this stack is not deployed.
      # These land on default@internal, which every service that names no transport uses. Traefik
      # ships dialTimeout=30s and responseHeaderTimeout=0 — no timeout — so an application-server
      # that accepts the connection and never answers would otherwise hold the client forever. Only
      # the wait for response headers is bounded, so SSE response bodies are unaffected.
      - "--serversTransport.forwardingTimeouts.dialTimeout=10s"
      - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=30s"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@tum.de"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http"
      - "--providers.docker=true"
      # Docker labels cannot define TLS options, so load them through the file provider.
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    configs:
      - source: traefik-dynamic
        target: /etc/traefik/dynamic.yml
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.security-headers.headers.stsSeconds=2592000
      - traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.frameDeny=true
      - traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.security-headers.headers.permissionsPolicy=geolocation=(), camera=(), microphone=(), payment=()
      - "traefik.http.middlewares.security-headers.headers.contentSecurityPolicy=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
      - traefik.http.middlewares.errorpage.errors.status=501,502,503,504
      - traefik.http.middlewares.errorpage.errors.service=maintenance
      - traefik.http.middlewares.errorpage.errors.query=/index.html
    healthcheck:
      test: 'wget -qO- http://localhost:80/ping || exit 1'
      interval: 4s
      timeout: 2s
      retries: 5
    # Same cap as the other shared-infra containers (compose.core.yaml). Access logging is off, so
    # this is startup, ACME and router errors only — but an unreachable ACME endpoint or a bad label
    # retries forever, and an uncapped json-file log fills the host disk with it.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  maintenance:
    image: ${HEPHAESTUS_IMAGE_NGINX:?verified release lock required}
    restart: unless-stopped
    configs:
      - source: maintenance-page
        target: /usr/share/nginx/html/index.html
      - source: nginx-default-config
        target: /etc/nginx/conf.d/default.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.http-maintenance.entryPoints=http"
      - "traefik.http.routers.http-maintenance.middlewares=redirect-to-https"
      - "traefik.http.routers.http-maintenance.rule=(${APP_HOST_MATCH:-Host(`${APP_HOSTNAME}`)})"
      - "traefik.http.routers.https-maintenance.entryPoints=https"
      - "traefik.http.routers.https-maintenance.rule=(${APP_HOST_MATCH:-Host(`${APP_HOSTNAME}`)})"
      - "traefik.http.routers.https-maintenance.tls.certresolver=letsencrypt"
      - "traefik.http.routers.https-maintenance.tls=true"
      - "traefik.http.routers.http-maintenance.priority=1"
      - "traefik.http.routers.https-maintenance.priority=1"
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3s
    # Access logging is off (see the nginx-default-config below), so this is nginx startup and error
    # output only — but the page auto-refreshes every 5s, so a long outage with browsers left open is
    # exactly when a repeating error would grow unattended.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared-network:
    name: shared-network
    driver: bridge

configs:
  traefik-dynamic:
    content: |
      tls:
        options:
          default:
            minVersion: VersionTLS12
  nginx-default-config:
    content: |
      server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        # No per-request access line. This server answers on a catch-all Host rule
        # whenever the webapp router is down, so the URL it would log is the deep
        # link the contributor was trying to reach — and those name people
        # (/w/<slug>/user/<username>). Keeps the "no layer writes a per-request
        # IP/URL record" posture whole; error_log is untouched.
        access_log off;

        location / {
            rewrite ^ /index.html break;
        }
      }

  maintenance-page:
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <title>Hephaestus Maintenance</title>
      <meta http-equiv="refresh" content="5"/>
      <style>
          html, body { padding: 0; margin: 0; width: 100%; height: 100%; }
          * {box-sizing: border-box;}
          body { text-align: center; padding: 0; background: #353d47; color: #fff; font-family: sans-serif; }
          h1 { font-size: 50px; font-weight: 100; text-align: center;}
          body { font-weight: 100; font-size: 20px; color: #fff; text-align: center; display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center; -webkit-box-align: center; -ms-flex-align: center; align-items: center;}
          article { display: block; width: 700px; padding: 50px; margin: 0 auto; }
          a { color: #fff; font-weight: bold;}
          a:hover { text-decoration: none; }
          svg.brand { width: 96px; }
      </style>
      <article>
          <svg class="brand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Hephaestus"><circle cx="64" cy="64" r="64" fill="#315FDC"/><g transform="translate(24 20) scale(3.3333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.2V3.6"/><circle cx="12" cy="2.8" r="1" fill="#fff"/><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M2 14h2M20 14h2M8.6 13.5h.8M14.6 13.5h.8M9.7 16.8c1.1 1.1 3.5 1.1 4.6 0"/></g></svg>
          <h1>We&rsquo;ll be back soon!</h1>
          <div>
              <p>We&rsquo;re performing some maintenance at the moment. Sorry for the inconvenience.</p>
              <p>&mdash; Your Hephaestus Administrators</p>
          </div>
      </article>
      </html>

volumes:
  letsencrypt:
