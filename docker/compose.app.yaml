# Practice review reads these from both runtime roles: the app server answers the settings and
# rate-limits a review asked for by hand, while the worker composes and delivers what a review found.
# Anchored rather than repeated because forwarding a key to only one of them is silent — the role that
# does not receive it falls back to the built-in default and the operator's setting does nothing.
x-practice-review-env: &practice-review-env
  # Auto-trigger is a per-workspace setting; this is the instance gate above it.
  PRACTICE_REVIEW_DELIVER_TO_MERGED: ${PRACTICE_REVIEW_DELIVER_TO_MERGED:-false}
  PRACTICE_REVIEW_COOLDOWN_MINUTES: ${PRACTICE_REVIEW_COOLDOWN_MINUTES:-15}
  # Feature visibility, separate from the review gate above.
  PRACTICE_REVIEW_MAX_REQUESTS_PER_REQUESTER_PER_HOUR: ${PRACTICE_REVIEW_MAX_REQUESTS_PER_REQUESTER_PER_HOUR:-5}
  PRACTICE_REVIEW_PROGRESS_FOOTER: ${PRACTICE_REVIEW_PROGRESS_FOOTER:-false}
  PRACTICE_REVIEW_REACTION_SUPPRESSION: ${PRACTICE_REVIEW_REACTION_SUPPRESSION:-false}
  # Spend guardrails for reviewing past work. A campaign is priced before it runs; these bound what
  # an administrator can confirm in one.
  PRACTICE_REVIEW_BACKFILL_MAX_WINDOW: ${PRACTICE_REVIEW_BACKFILL_MAX_WINDOW:-400d}
  PRACTICE_REVIEW_BACKFILL_MAX_ARTIFACTS: ${PRACTICE_REVIEW_BACKFILL_MAX_ARTIFACTS:-5000}
  PRACTICE_REVIEW_BACKFILL_BATCH_SIZE: ${PRACTICE_REVIEW_BACKFILL_BATCH_SIZE:-25}
  PRACTICE_REVIEW_BACKFILL_COST_HISTORY_WINDOW: ${PRACTICE_REVIEW_BACKFILL_COST_HISTORY_WINDOW:-90d}
  # How long a recorded review opportunity may stay unsettled before it is retried, then given up on.
  SIGNAL_LEDGER_PENDING_RETRY_AFTER: ${SIGNAL_LEDGER_PENDING_RETRY_AFTER:-1h}
  SIGNAL_LEDGER_PENDING_LAPSE_AFTER: ${SIGNAL_LEDGER_PENDING_LAPSE_AFTER:-7d}
  SIGNAL_LEDGER_SWEEP_BATCH_SIZE: ${SIGNAL_LEDGER_SWEEP_BATCH_SIZE:-200}

# Both application roles reach the SCM: the server clones on a push, the worker fetches the commit a
# review pins before it can read a diff. Anchored for the same reason as the block above — a role
# without these authenticates as nobody, and the review that needed the diff reports insufficient
# evidence rather than failing.
x-scm-access-env: &scm-access-env
  GH_APP_ID: ${GH_APP_ID:-0}
  GH_APP_PRIVATE_KEY: ${GH_APP_PRIVATE_KEY}
  GH_APP_PRIVATE_KEY_LOCATION: ${GH_APP_PRIVATE_KEY_LOCATION:-}
  GH_AUTH_TOKEN: ${GH_AUTH_TOKEN}
  GIT_CHECKOUT_ENABLED: ${GIT_CHECKOUT_ENABLED:-false}

services:
  webapp:
    image: "${HEPHAESTUS_IMAGE_WEBAPP:?verified release lock required}"
    environment:
      APPLICATION_VERSION: ${IMAGE_TAG}
      APPLICATION_CLIENT_URL: https://${APP_HOSTNAME}
      APPLICATION_SERVER_URL: https://${APP_HOSTNAME}/api
      # Imprint/privacy source. Leave unset and bind-mount a host directory
      # onto /usr/share/nginx/html/legal-overrides for forks. Use "tumaet" only
      # for the canonical AET deployment. See docs/admin/legal-pages.mdx.
      LEGAL_PROFILE: ${LEGAL_PROFILE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      SENTRY_DSN: ${SENTRY_DSN}
      TANSTACK_DEVTOOLS_ENABLED: ${TANSTACK_DEVTOOLS_ENABLED:-false}
    ports:
      - "80"
    depends_on:
      # Gate on app-server readiness so the SPA isn't served before the API answers.
      application-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shared-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.http-webapp.entryPoints=http"
      - "traefik.http.routers.http-webapp.middlewares=redirect-to-https"
      - "traefik.http.routers.http-webapp.rule=(${APP_HOST_MATCH:-Host(`${APP_HOSTNAME}`)}) && PathPrefix(`/`)"
      - "traefik.http.routers.http-webapp.service=http-webapp"
      - "traefik.http.routers.https-webapp.entryPoints=https"
      # Keep buffering off the /api router because it would hold SSE responses until they close.
      # Define this middleware with its router so the app stack does not depend on the proxy stack.
      # HSTS rides on the router, not on the entrypoint: an entrypoint middleware exists only when
      # this deployment's edge is the proxy stack, and behind someone else's proxy the header
      # would silently go missing. The other security headers are set by the responses
      # themselves, so this is the one that has nowhere else to come from.
      - traefik.http.middlewares.app-hsts.headers.stsSeconds=2592000
      - traefik.http.middlewares.app-hsts.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.webapp-body-limit.buffering.maxRequestBodyBytes=26214400
      - traefik.http.middlewares.webapp-body-limit.buffering.memRequestBodyBytes=1048576
      - "traefik.http.routers.https-webapp.middlewares=app-hsts,webapp-body-limit"
      - "traefik.http.routers.https-webapp.rule=(${APP_HOST_MATCH:-Host(`${APP_HOSTNAME}`)}) && PathPrefix(`/`)"
      - "traefik.http.routers.https-webapp.service=https-webapp"
      - "traefik.http.routers.https-webapp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.https-webapp.tls=true"
      - "traefik.http.services.http-webapp.loadbalancer.server.port=80"
      - "traefik.http.services.https-webapp.loadbalancer.server.port=80"
      - "traefik.http.routers.http-webapp.priority=2"
      - "traefik.http.routers.https-webapp.priority=3"
      # Everything the instance serves is loaded from one origin. This router takes the served hosts
      # that are not APP_HOSTNAME and sends the browser there; it outranks https-webapp and loses to
      # the /api (10) and /webhooks (100) routers, so an open tab and a provider still posting to an
      # older name keep working through a domain move. With APP_HOST_MATCH unset the rule reduces to
      # `Host(x) && !Host(x)` and matches nothing, so a single-hostname instance never redirects.
      - "traefik.http.middlewares.canonical-host.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.canonical-host.redirectregex.replacement=https://${APP_HOSTNAME}/$${1}"
      - "traefik.http.middlewares.canonical-host.redirectregex.permanent=true"
      - "traefik.http.routers.https-canonical.entryPoints=https"
      - "traefik.http.routers.https-canonical.middlewares=app-hsts,canonical-host"
      - "traefik.http.routers.https-canonical.rule=(${APP_HOST_MATCH:-Host(`${APP_HOSTNAME}`)}) && !Host(`${APP_HOSTNAME}`) && PathPrefix(`/`)"
      - "traefik.http.routers.https-canonical.service=https-webapp"
      # No certresolver here on purpose: ACME derives a router's domains from its rule and does not
      # deduplicate them, so this rule's negated Host() would order a certificate that names
      # APP_HOSTNAME twice. https-webapp's resolver already covers every served name, and SNI finds
      # that certificate for this router.
      - "traefik.http.routers.https-canonical.tls=true"
      - "traefik.http.routers.https-canonical.priority=4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # A new named volume is created root-owned, and one created by an earlier image keeps that image's
  # uid. The buildpack image runs as `cnb` (1002:1001), so nothing under /data/git-repos is writable
  # until the ownership matches — and that surfaces when an agent job first writes there, not at
  # startup. -h so a symlink inside a checkout is retargeted rather than followed out of the volume.
  volume-init:
    image: ${HEPHAESTUS_IMAGE_ALPINE:?verified release lock required}
    command:
      - sh
      - -c
      - "chown -Rh 1002:1001 /data/git-repos && chmod 0755 /data/git-repos"
    volumes:
      - git-repos:/data/git-repos
    restart: "no"
    network_mode: none
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"


  application-server:
    image: "${HEPHAESTUS_IMAGE_APPLICATION_SERVER:?verified release lock required}"
    # Bounds heap sizing to this container; without it the JVM targets host RAM and co-located
    # services oversubscribe and swap. Hosts the NATS sync consumers, so it takes the largest limit.
    mem_limit: ${APPLICATION_SERVER_MEM_LIMIT:-5g}
    cpus: ${APPLICATION_SERVER_CPUS:-4.0}
    pids_limit: ${APPLICATION_SERVER_PIDS_LIMIT:-512}
    ports:
      - "8080"
    environment:
      # The buildpack's 10M MaxDirectMemorySize sits below this role's steady NIO
      # footprint (NATS + HTTP); give it headroom.
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=${APP_MAX_DIRECT_MEMORY:-128M}"
      APP_VERSION: ${IMAGE_TAG}
      SPRING_PROFILES_ACTIVE: prod
      APPLICATION_HOST_URL: https://${APP_HOSTNAME}
      # Tomcat RemoteIpValve proxy trust. forward-headers-strategy=native (application-prod.yml) is
      # active in prod, so ProxyTrustGuard fails the boot unless this is a non-blank internal-proxies
      # regex pinned to the ingress (Traefik). Empty default surfaces the guard's clear fail-fast.
      HEPHAESTUS_TRUSTED_PROXIES: ${HEPHAESTUS_TRUSTED_PROXIES:-}
      # Webhook reception runs in a dedicated `webhook-server` container (see ADR 0008
      # + docker/compose.core.yaml). Disable it here so the receiver beans don't load
      # in application-server (saves RAM; prevents accidental localhost traffic).
      HEPHAESTUS_RUNTIME_WEBHOOK_ENABLED: "false"
      # Internal, trusted docker-network DB: skip TLS. pgJDBC doesn't validate Postgres' self-signed cert
      # so it adds no authentication, only the SSL handshake's NIO direct buffers that OOM the JVM off-heap
      # default; confidentiality is fine to drop here (creds already sit in plaintext compose env).
      DATABASE_URL: postgresql://postgres:5432/hephaestus?sslmode=disable
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      NATS_SERVER: nats://nats-server:4222
      NATS_USERNAME: ${NATS_USERNAME:?Set NATS_USERNAME}
      NATS_PASSWORD: ${NATS_PASSWORD:?Set NATS_PASSWORD}
      # Auth (Hephaestus-native; ADR 0017). State-cookie key MUST be base64 32-byte AES.
      HEPHAESTUS_AUTH_ISSUER: https://${APP_HOSTNAME}
      HEPHAESTUS_AUTH_STATE_COOKIE_KEY: ${HEPHAESTUS_AUTH_STATE_COOKIE_KEY:?Set HEPHAESTUS_AUTH_STATE_COOKIE_KEY to a Base64-encoded 32-byte key}
      # First instance super-admin bootstrap (auth-cutover runbook). The admin UI is admin-gated, so
      # the first APP_ADMIN must come from operator config — comma-separated <provider>:@user or
      # <provider>:<subject>. Optional break-glass token enables POST /auth/bootstrap-admin.
      HEPHAESTUS_AUTH_BOOTSTRAP_ADMINS: ${HEPHAESTUS_AUTH_BOOTSTRAP_ADMINS:-}
      HEPHAESTUS_AUTH_BOOTSTRAP_TOKEN: ${HEPHAESTUS_AUTH_BOOTSTRAP_TOKEN:-}
      # Sourced from GH_OAUTH_* — GitHub Actions reserves the GITHUB_ prefix for secret/variable
      # names, so the deploy can't provide GITHUB_OAUTH_*; the container still presents it to Spring.
      GITHUB_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      GITLAB_OAUTH_BASE_URL: ${GITLAB_OAUTH_BASE_URL:-https://gitlab.com}
      GITLAB_OAUTH_DISPLAY_NAME: ${GITLAB_OAUTH_DISPLAY_NAME:-GitLab}
      GH_APP_INSTALLATION_URL: ${GH_APP_INSTALLATION_URL:-}
      # Default on: the integration event flow needs NATS in prod (the code-level fallback is off for local dev).
      NATS_ENABLED: ${NATS_ENABLED:-true}
      NATS_DURABLE_CONSUMER_NAME: ${NATS_DURABLE_CONSUMER_NAME:-hephaestus}
      # How long this deployment's durables may go with nothing bound to them before JetStream
      # deletes them. See docker/.env.example for what to set it to and when.
      HEPHAESTUS_INTEGRATION_CONSUMER_INACTIVE_THRESHOLD: ${HEPHAESTUS_INTEGRATION_CONSUMER_INACTIVE_THRESHOLD:-30d}
      MONITORING_TIMEFRAME: ${MONITORING_TIMEFRAME:-7}
      MONITORING_RUN_ON_STARTUP: ${MONITORING_RUN_ON_STARTUP:-true}
      MONITORING_SYNC_CRON: ${MONITORING_SYNC_CRON:-0 0 * * * *}
      MONITORING_SYNC_COOLDOWN_IN_MINUTES: ${MONITORING_SYNC_COOLDOWN_IN_MINUTES:-60}
      MONITORING_BACKFILL_ENABLED: ${MONITORING_BACKFILL_ENABLED:-true}
      MONITORING_BACKFILL_BATCH_SIZE: ${MONITORING_BACKFILL_BATCH_SIZE:-50}
      MONITORING_BACKFILL_RATE_LIMIT_THRESHOLD: ${MONITORING_BACKFILL_RATE_LIMIT_THRESHOLD:-500}
      MONITORING_BACKFILL_INTERVAL_SECONDS: ${MONITORING_BACKFILL_INTERVAL_SECONDS:-60}
      # Per-workspace channel/team now live on the Slack Connection config; this is the global kill-switch.
      LEADERBOARD_NOTIFICATION_ENABLED: ${LEADERBOARD_NOTIFICATION_ENABLED:-true}
      LEADERBOARD_SCHEDULE_DAY: ${LEADERBOARD_SCHEDULE_DAY:-2}
      LEADERBOARD_SCHEDULE_TIME: ${LEADERBOARD_SCHEDULE_TIME:-9}
      SENTRY_DSN: ${SENTRY_DSN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET to at least 32 printable ASCII characters}
      # WEBHOOK_EXTERNAL_URL intentionally unset: GitLab auto-registration defaults it to
      # APPLICATION_HOST_URL (same origin here), then appends /webhooks/gitlab itself.
      # AES-256-GCM key for credentials encrypted at rest in the `connection` table. Exactly 32
      # chars. Required in prod (fail-fast); the Liquibase backfill re-encrypts on boot, so this
      # MUST be set on application-server (where Liquibase runs). Keep it stable.
      HEPHAESTUS_SECURITY_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_ENCRYPTION_KEY:?Set HEPHAESTUS_SECURITY_ENCRYPTION_KEY to exactly 32 printable ASCII characters}
      HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY:?Set HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY to exactly 32 printable ASCII characters}
      HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY_VERSION:-1}
      HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY:-}
      HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY_VERSION:-}
      HEPHAESTUS_SECURITY_CREDENTIAL_ROTATION_ENABLED: ${HEPHAESTUS_SECURITY_CREDENTIAL_ROTATION_ENABLED:-false}
      # Slack OAuth/admin and mentor replies run here. Inbound Events API + interactivity are verified on webhook-server.
      HEPHAESTUS_INTEGRATION_SLACK_ENABLED: ${HEPHAESTUS_INTEGRATION_SLACK_ENABLED:-false}
      HEPHAESTUS_INTEGRATION_SLACK_CLIENT_ID: ${HEPHAESTUS_INTEGRATION_SLACK_CLIENT_ID:-}
      HEPHAESTUS_INTEGRATION_SLACK_CLIENT_SECRET: ${HEPHAESTUS_INTEGRATION_SLACK_CLIENT_SECRET:-}
      HEPHAESTUS_INTEGRATION_SLACK_REDIRECT_URI: ${HEPHAESTUS_INTEGRATION_SLACK_REDIRECT_URI:-}
      # Outline (documentation content source). Every Outline bean is @ConditionalOnProperty with
      # matchIfMissing=false, so an unset flag means no admin surface, no sync, no content projection.
      # Inbound change notifications are verified on webhook-server, which needs the same flag — but
      # NOT a secret: Outline's webhook secret is per-subscription, minted by OutlineWebhookRegistrar
      # and stored encrypted on the connection row (unlike Slack's one global signing secret).
      HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED: ${HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED:-false}
      HEPHAESTUS_INTEGRATION_OUTLINE_ALLOWED_ORIGINS: ${HEPHAESTUS_INTEGRATION_OUTLINE_ALLOWED_ORIGINS:-}
      # Link-only login provider (Slack-style): attaches a member's Outline identity to their
      # Hephaestus account so mirrored documents can be attributed; it is never a sign-in button.
      # Independent of the flag above and of the per-workspace API key. Callback:
      # https://<host>/api/login/oauth2/code/outline. BASE_URL is REQUIRED whenever CLIENT_ID is set —
      # Outline is self-hosted, so there is no default origin, and a blank/invalid value makes
      # LoginProviderService logs an ERROR and skips the seed (no boot failure, no linking button).
      OUTLINE_OAUTH_BASE_URL: ${OUTLINE_OAUTH_BASE_URL:-}
      OUTLINE_OAUTH_DISPLAY_NAME: ${OUTLINE_OAUTH_DISPLAY_NAME:-Outline}
      OUTLINE_OAUTH_CLIENT_ID: ${OUTLINE_OAUTH_CLIENT_ID:-}
      OUTLINE_OAUTH_CLIENT_SECRET: ${OUTLINE_OAUTH_CLIENT_SECRET:-}
      # GitLab integration
      GITLAB_ENABLED: ${GITLAB_ENABLED:-false}
      # Which GitLab instance workspace creation and SCM sync talk to (not auth). Unset, it follows
      # GITLAB_OAUTH_BASE_URL, so an operator who configures GitLab login gets the SAME instance for
      # sync without naming it twice — that chain mirrors application.yml's, and it is the reason
      # this line must not carry a hard-coded instance default: a concrete value here always wins,
      # so pinning one silently pointed every self-hoster at that instance.
      GITLAB_DEFAULT_SERVER_URL: ${GITLAB_DEFAULT_SERVER_URL:-${GITLAB_OAUTH_BASE_URL:-https://gitlab.com}}
      # Agent sandbox (practice review + Pi mentor chat). Activated by the worker role
      # (hephaestus.runtime.worker.enabled), then gated per-workspace via WorkspaceFeatures.
      HEPHAESTUS_AGENT_IMAGE_REQUIRE_DIGEST: ${HEPHAESTUS_AGENT_IMAGE_REQUIRE_DIGEST:-true}
      HEPHAESTUS_AGENT_IMAGE_REFERENCE: ${HEPHAESTUS_IMAGE_AGENT_PI:?verified release lock required}
      SANDBOX_DOCKER_HOST: ${SANDBOX_DOCKER_HOST:-unix:///var/run/docker.sock}
      SANDBOX_DOCKER_TLS_VERIFY: ${SANDBOX_DOCKER_TLS_VERIFY:-false}
      SANDBOX_DOCKER_CERT_PATH: ${SANDBOX_DOCKER_CERT_PATH:-}
      SANDBOX_DOCKER_APP_SERVER_CONTAINER_ID: ${SANDBOX_DOCKER_APP_SERVER_CONTAINER_ID:-}
      SANDBOX_DOCKER_CLI: ${SANDBOX_DOCKER_CLI:-docker}
      SANDBOX_API_PORT: ${SANDBOX_API_PORT:-8081}
      SANDBOX_API_MAX_REQUEST_BYTES: ${SANDBOX_API_MAX_REQUEST_BYTES:-4194304}
      SANDBOX_API_REQUESTS_PER_MINUTE: ${SANDBOX_API_REQUESTS_PER_MINUTE:-120}
      SANDBOX_DOCKER_CONTAINER_RUNTIME: ${SANDBOX_DOCKER_CONTAINER_RUNTIME:-}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-5}
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-4294967296}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2.0}
      # Agent job queue (practice review). The queue runs on PostgreSQL — no NATS involved. NATS
      # stays required elsewhere on this pod for webhook-driven sync consumption (NATS_ENABLED above).
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      HEPHAESTUS_FABRIC_ROOT: /data/git-repos
      HEPHAESTUS_FABRIC_GC_RETENTION_DAYS: ${HEPHAESTUS_FABRIC_GC_RETENTION_DAYS:-30}
      # Instance-wide LLM knobs. Providers, models, prices and credentials are NOT here — they are
      # runtime catalog data an instance admin registers in the UI. These three are the deploy-time
      # facts that cannot be.
      # Second display currency for spend figures. Empty (the default) is USD only. EUR is the one
      # supported value: anything else — including a well-formed code like GBP — FAILS THE BOOT with a
      # message naming what is accepted, rather than starting up and quietly showing USD.
      # The reports and the FX fetcher are server-role, so this belongs on this pod.
      HEPHAESTUS_LLM_DISPLAY_CURRENCY: ${HEPHAESTUS_LLM_DISPLAY_CURRENCY:-}
      HEPHAESTUS_LLM_FX_DAILY_URL: ${HEPHAESTUS_LLM_FX_DAILY_URL:-https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
      # Storage limitation on the spend ledger. The nightly sweep is server-role, so this pod only.
      # Raise it where a commercial or tax retention obligation runs past the default; deletion is
      # irreversible.
      HEPHAESTUS_LLM_USAGE_RETENTION: ${HEPHAESTUS_LLM_USAGE_RETENTION:-P400D}
      # SSRF guard. Set on BOTH this pod and the worker or the two disagree: this pod decides whether
      # a loopback provider URL may be SAVED, the worker's proxy decides whether it may be DIALLED.
      # Leave false in production.
      HEPHAESTUS_LLM_EGRESS_ALLOW_LOOPBACK: ${HEPHAESTUS_LLM_EGRESS_ALLOW_LOOPBACK:-false}
      <<: [*practice-review-env, *scm-access-env]
      GITLAB_WORKSPACE_CREATION: ${GITLAB_WORKSPACE_CREATION:-false}
      # LLM providers are registered at runtime (Instance admin → AI models), not via env vars —
      # the proxy reads each connection's base URL/auth from the catalog per request.
      # Worker control channel: same env var feeds the worker pod's registration-token claim.
      HEPHAESTUS_WORKER_HUB_TOKEN_REGISTRATION_TOKEN: ${HEPHAESTUS_WORKER_REGISTRATION_TOKEN:-}
      # thc healthcheck target: actuator liveness on the management port.
      THC_PORT: "8080"
      THC_PATH: /actuator/health/liveness
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Joins the host's docker group so the unprivileged image can reach root:docker 0660
    # /var/run/docker.sock. Host-specific — see DOCKER_GROUP_ID in .env.example.
    group_add:
      - "${DOCKER_GROUP_ID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - git-repos:/data/git-repos
    networks:
      - shared-network
    labels:
      - "traefik.enable=true"
      # Pin Traefik to shared-network: the app-server temporarily joins agent sandbox
      # networks (agent-net-*) during review jobs. Without this label, Traefik can pick
      # the sandbox network IP and route requests to an unreachable internal network.
      - "traefik.docker.network=shared-network"
      - "traefik.http.middlewares.https-application-server-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.edge-api-rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.edge-api-rate-limit.ratelimit.period=1s"
      - "traefik.http.middlewares.edge-api-rate-limit.ratelimit.burst=200"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.http-application-server.entryPoints=http"
      - "traefik.http.routers.http-application-server.middlewares=redirect-to-https"
      - "traefik.http.routers.http-application-server.rule=(${APP_HOST_MATCH:-Host(`${APP_HOSTNAME}`)}) && PathPrefix(`/api`)"
      - "traefik.http.routers.http-application-server.service=http-application-server"
      - "traefik.http.routers.https-application-server.entryPoints=https"
      - "traefik.http.routers.https-application-server.middlewares=app-hsts,edge-api-rate-limit,https-application-server-stripprefix"
      - "traefik.http.routers.https-application-server.rule=(${APP_HOST_MATCH:-Host(`${APP_HOSTNAME}`)}) && PathPrefix(`/api`)"
      - "traefik.http.routers.https-application-server.tls.certresolver=letsencrypt"
      - "traefik.http.routers.https-application-server.tls=true"
      - "traefik.http.routers.https-application-server.service=https-application-server"
      - "traefik.http.services.http-application-server.loadbalancer.server.port=8080"
      - "traefik.http.services.https-application-server.loadbalancer.server.port=8080"
      - "traefik.http.routers.http-application-server.priority=5"
      - "traefik.http.routers.https-application-server.priority=10"
      # Replica affinity for workspace traffic (mentor lives here) — see docs/contributor/unified-pi-runtime.mdx.
      # maxAge=300 matches hephaestus.mentor.idle-ttl-seconds; cookie.path requires Traefik >=3.3.
      - "traefik.http.services.https-application-server.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.https-application-server.loadbalancer.sticky.cookie.name=__Secure-hep_workspace_aff"
      - "traefik.http.services.https-application-server.loadbalancer.sticky.cookie.httpOnly=true"
      - "traefik.http.services.https-application-server.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.https-application-server.loadbalancer.sticky.cookie.sameSite=lax"
      - "traefik.http.services.https-application-server.loadbalancer.sticky.cookie.path=/api/workspaces"
      - "traefik.http.services.https-application-server.loadbalancer.sticky.cookie.maxAge=300"
      - "traefik.http.services.https-application-server.loadbalancer.healthcheck.path=/actuator/health/readiness"
      - "traefik.http.services.https-application-server.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.https-application-server.loadbalancer.healthcheck.timeout=3s"
    # The distroless image has no shell for a wget probe; the probe is the static thc binary the
    # health-checker buildpack adds at /workspace/health-check (server/application/pom.xml).
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Matches application.yml's SHUTDOWN_TIMEOUT default (20s) plus headroom so SIGTERM has time
    # to drain in-flight requests before Docker SIGKILLs the launcher.
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Worker runtime — same image, worker profile. Dials the hub over WSS; the only inbound port is
  # the sandbox gateway.
  application-worker:
    image: "${HEPHAESTUS_IMAGE_APPLICATION_SERVER:?verified release lock required}"
    # Bounds heap sizing to this container (see application-server).
    mem_limit: ${APPLICATION_WORKER_MEM_LIMIT:-3g}
    cpus: ${APPLICATION_WORKER_CPUS:-4.0}
    pids_limit: ${APPLICATION_WORKER_PIDS_LIMIT:-512}
    environment:
      # See application-server: the buildpack's 10M direct-memory default is too small.
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=${APP_MAX_DIRECT_MEMORY:-128M}"
      APP_VERSION: ${IMAGE_TAG}
      SPRING_PROFILES_ACTIVE: prod,worker
      <<: [*practice-review-env, *scm-access-env]
      HEPHAESTUS_TRUSTED_PROXIES: ${HEPHAESTUS_TRUSTED_PROXIES:-}
      HEPHAESTUS_AGENT_IMAGE_REQUIRE_DIGEST: ${HEPHAESTUS_AGENT_IMAGE_REQUIRE_DIGEST:-true}
      # Valueless, as on application-server above; this is the pod that actually opens sandboxes.
      HEPHAESTUS_AGENT_IMAGE_REFERENCE: ${HEPHAESTUS_IMAGE_AGENT_PI:?verified release lock required}
      HEPHAESTUS_HUB_URL: ws://application-server:8080/api/workers/connect
      HEPHAESTUS_WORKER_REGISTRATION_TOKEN: ${HEPHAESTUS_WORKER_REGISTRATION_TOKEN:-}
      # Agent job queue (practice review). The queue runs on PostgreSQL — this pod needs no NATS at
      # all (it runs no sync/webhook role), so no NATS_SERVER is set here.
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      HEPHAESTUS_FABRIC_ROOT: /data/git-repos
      HEPHAESTUS_FABRIC_GC_RETENTION_DAYS: ${HEPHAESTUS_FABRIC_GC_RETENTION_DAYS:-30}
      SANDBOX_DOCKER_HOST: ${SANDBOX_DOCKER_HOST:-unix:///var/run/docker.sock}
      SANDBOX_DOCKER_TLS_VERIFY: ${SANDBOX_DOCKER_TLS_VERIFY:-false}
      SANDBOX_DOCKER_CERT_PATH: ${SANDBOX_DOCKER_CERT_PATH:-}
      SANDBOX_DOCKER_APP_SERVER_CONTAINER_ID: ${SANDBOX_DOCKER_APP_SERVER_CONTAINER_ID:-}
      SANDBOX_DOCKER_CLI: ${SANDBOX_DOCKER_CLI:-docker}
      SANDBOX_API_PORT: ${SANDBOX_API_PORT:-8081}
      SANDBOX_API_MAX_REQUEST_BYTES: ${SANDBOX_API_MAX_REQUEST_BYTES:-4194304}
      SANDBOX_API_REQUESTS_PER_MINUTE: ${SANDBOX_API_REQUESTS_PER_MINUTE:-120}
      SANDBOX_DOCKER_CONTAINER_RUNTIME: ${SANDBOX_DOCKER_CONTAINER_RUNTIME:-}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-5}
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-4294967296}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2.0}
      # SSRF guard for the in-process LLM proxy. Must match application-server's value: that pod
      # decides whether a loopback provider URL may be SAVED, this one whether it may be DIALLED, and
      # a split between them shows up as connections that save fine and then fail at call time.
      HEPHAESTUS_LLM_EGRESS_ALLOW_LOOPBACK: ${HEPHAESTUS_LLM_EGRESS_ALLOW_LOOPBACK:-false}
      # No LLM credential passthrough needed: the proxy runs in-process on this pod (it follows
      # the worker/sandbox capability) and reads providers
      # from the same instance/workspace catalog as application-server.
      HEPHAESTUS_WORKER_CAPACITY_REVIEW_MAX: ${HEPHAESTUS_WORKER_REVIEW_MAX:-auto}
      HEPHAESTUS_WORKER_CAPACITY_MENTOR_MAX: ${HEPHAESTUS_WORKER_MENTOR_MAX:-auto}
      HEPHAESTUS_WORKER_DRAIN_TIMEOUT: ${HEPHAESTUS_WORKER_DRAIN_TIMEOUT:-5m}
      SENTRY_DSN: ${SENTRY_DSN}
      # Persistence for the JPA layer the worker shares (connection credentials,
      # workspace/agent context). The auth web layer is gated off this role, so no auth env is needed.
      # Internal, trusted docker-network DB: skip TLS. pgJDBC doesn't validate Postgres' self-signed cert
      # so it adds no authentication, only the SSL handshake's NIO direct buffers that OOM the JVM off-heap
      # default; confidentiality is fine to drop here (creds already sit in plaintext compose env).
      DATABASE_URL: postgresql://postgres:5432/hephaestus?sslmode=disable
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      # Connection credentials are decrypted on every role.
      HEPHAESTUS_SECURITY_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_ENCRYPTION_KEY:?Set HEPHAESTUS_SECURITY_ENCRYPTION_KEY to exactly 32 printable ASCII characters}
      HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY:?Set HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY to exactly 32 printable ASCII characters}
      HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${HEPHAESTUS_SECURITY_CREDENTIAL_ENCRYPTION_KEY_VERSION:-1}
      HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY:-}
      HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${HEPHAESTUS_SECURITY_PRIOR_CREDENTIAL_ENCRYPTION_KEY_VERSION:-}
      HEPHAESTUS_SECURITY_CREDENTIAL_ROTATION_ENABLED: ${HEPHAESTUS_SECURITY_CREDENTIAL_ROTATION_ENABLED:-false}
      # The worker assembles the sandbox context itself (AgentJobExecutor → JobTypeHandler
      # #prepareInputFiles → WorkspaceContextBuilder), and OutlineDocumentContentSource carries only
      # the integration gate — no runtime-role gate. Without this flag the source bean is absent here
      # and every review/mentor run silently ships a context with no wiki documents. It reads the
      # mirrored rows from Postgres, so it needs no Outline API credential or OAuth client. It does
      # need the same operator-approved origin allowlist as the server and webhook roles.
      # Keep in lockstep with application-server's value.
      HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED: ${HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED:-false}
      HEPHAESTUS_INTEGRATION_OUTLINE_ALLOWED_ORIGINS: ${HEPHAESTUS_INTEGRATION_OUTLINE_ALLOWED_ORIGINS:-}
      # Slack, like Outline, ships role-agnostic slack.enabled-gated beans (mentor, ingest, credential
      # provider, NATS subscription provider) that the worker's shared JPA/context layer instantiates.
      # Wire it to the worker exactly like Outline so both integrations load identically here.
      # Keep in lockstep with application-server's value.
      HEPHAESTUS_INTEGRATION_SLACK_ENABLED: ${HEPHAESTUS_INTEGRATION_SLACK_ENABLED:-false}
      # application-prod.yml binds host-url=${APPLICATION_HOST_URL} with no YAML default; compose always
      # supplies it so the agent context builds links from a real origin (an unset var fails the boot).
      APPLICATION_HOST_URL: https://${APP_HOSTNAME}
      # thc runs inside the container, so it reaches the loopback-bound management endpoint.
      THC_PORT: "8080"
      THC_PATH: /actuator/health/liveness
    depends_on:
      application-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Joins the host's docker group so the unprivileged image can reach root:docker 0660
    # /var/run/docker.sock. Host-specific — see DOCKER_GROUP_ID in .env.example.
    group_add:
      - "${DOCKER_GROUP_ID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - git-repos:/data/git-repos
    networks:
      - shared-network
    # 5m drain budget + 1m headroom; matches spring.lifecycle.timeout-per-shutdown-phase.
    stop_grace_period: 6m
    # thc healthcheck (see application-server). The worker fronts no Traefik router, so this is its
    # only health signal.
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: "${HEPHAESTUS_IMAGE_POSTGRES:?verified release lock required}"
    environment:
      - POSTGRES_DB=hephaestus
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=root
    ports:
      - "5432"
    networks:
      shared-network:
        aliases:
          - postgres
    restart: unless-stopped
    volumes:
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 10s
      retries: 10
    # Same cap as the other long-running services in this file. Postgres logs checkpoints, autovacuum
    # and every failed connection attempt; on the single-host install it shares a disk with the data
    # directory it is logging about, so an unbounded log can take the database down with it.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  shared-network:
    name: shared-network
    driver: bridge

volumes:
  postgresql-data:
  git-repos:
