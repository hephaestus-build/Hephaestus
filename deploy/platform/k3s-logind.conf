# The logind setting of a one-host install: /etc/systemd/logind.conf.d/zz-hephaestus.conf.
# docs/admin/kubernetes.mdx § Install on one host (k3s).
#
# The kubelet holds a shutdown for at most InhibitDelayMaxSec, so this value bounds the shutdown
# grace period of k3s-kubelet.yaml. The last file in the directory wins: the name sorts after the
# kubelet's own 99-kubelet.conf and after Ubuntu's unattended-upgrades-logind-maxdelay.conf, which
# sets 30 seconds.
[Login]
InhibitDelayMaxSec=300
