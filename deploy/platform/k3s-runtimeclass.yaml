# The RuntimeClass of the sandboxes on the one-host platform: gVisor, whose runtime
# k3s-containerd.toml.tmpl gives containerd. k3s-values.yaml names it for the sandbox templates.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
# The Sentry and the gofer of each gVisor Pod, which the scheduler and the sandbox quotas count with
# the Pod's requests: docs/admin/kubernetes.mdx § Sandbox templates.
overhead:
  podFixed:
    memory: 48Mi
    cpu: 10m
