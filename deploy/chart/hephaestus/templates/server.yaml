{{- include "hephaestus.databaseSecretCheck" . }}
{{- $name := include "hephaestus.name" (dict "root" . "component" "server") }}
{{- $config := .Values.config }}
{{- $sandbox := .Values.sandbox }}
{{- $drain := int .Values.server.drainTimeoutSeconds }}
{{- $connections := include "hephaestus.databaseConnectionCapacity" . | fromJson }}
{{- $grace := ternary (add $drain 120) 45 $sandbox.enabled }}
{{- $startupFailures := 60 }}
{{- if $sandbox.enabled }}
{{- $api := .Values.networkPolicy.kubernetesApi }}
{{- $_ := required "networkPolicy.kubernetesApi.cidr is required: state the API endpoint that the network plugin sees" $api.cidr }}
{{- if eq (int $api.port) 0 }}
{{- fail "networkPolicy.kubernetesApi.port is required: state the API endpoint port that the network plugin sees" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "server") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  selector:
    {{- include "hephaestus.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  # The migration Job owns the schema; the server waits for it. 0 stops it for database maintenance.
  replicas: {{ include "hephaestus.replicas" (dict "root" . "replicas" .Values.server.replicas) }}
  # Allow the old servers to drain and their replacements to start before declaring a stalled rollout.
  progressDeadlineSeconds: {{ add $grace (mul 10 $startupFailures) }}
  # The inbox leases order each item across replicas; claim epochs fence sandbox results.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "hephaestus.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hephaestus.podLabels" (dict "root" . "component" "server") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      # The sandboxes need the Kubernetes API, with the Role in sandbox.yaml; nothing else does.
      automountServiceAccountToken: {{ $sandbox.enabled }}
      priorityClassName: {{ include "hephaestus.priorityClass" (dict "root" $ "tier" "roles") }}
      enableServiceLinks: false
      securityContext:
        {{- include "hephaestus.podSecurityContext" (dict "user" 1002 "group" 1001) | nindent 8 }}
      # The preStop pause, the HTTP phase (SHUTDOWN_TIMEOUT, 20 s), the event consumer's wait (10 s) and headroom. ShutdownFitsGraceTest checks the sum. With sandboxes, the review drain comes first, then two
      # minutes for the shutdown phases and the sandboxes' stop calls.
      terminationGracePeriodSeconds: {{ $grace }}
      {{- if $sandbox.enabled }}
      # A server on a lost node leaves its claims to their leases; a replacement starts soon.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      {{- end }}
      containers:
        - name: server
          image: {{ include "hephaestus.image" (dict "root" . "name" "application-server") | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HEPHAESTUS_WORKSPACE_SUBDOMAINS_ENABLED
              value: {{ .Values.workspaceSubdomains.enabled | quote }}
            - name: HEPHAESTUS_WORKSPACE_SUBDOMAINS_BASE_DOMAIN
              value: {{ .Values.host | quote }}
            {{- include "hephaestus.env.databasePool" (dict "maximumPoolSize" $connections.serverPool "minimumIdle" .Values.server.databasePool.minimumIdle) | nindent 12 }}
            - name: HEPHAESTUS_INTEGRATION_CONSUMER_CLAIMERS
              value: {{ .Values.server.inboxClaimers | quote }}
            {{- include "hephaestus.env.pod" . | nindent 12 }}
            {{- include "hephaestus.env.release" . | nindent 12 }}
            {{- include "hephaestus.env.shared" . | nindent 12 }}
            {{- include "hephaestus.env.storedData" . | nindent 12 }}
            {{- include "hephaestus.env.ingestion" . | nindent 12 }}
            {{- include "hephaestus.env.scm" . | nindent 12 }}
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # The buildpack's 10M direct-memory default sits below this role's HTTP footprint.
            {{- if $sandbox.enabled }}
            # A blocked socket call pins its carrier on Java 21, so the scheduler needs a carrier for each
            # gateway connection.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxDirectMemorySize=128M -Djdk.virtualThreadScheduler.maxPoolSize={{ add (int $sandbox.gateway.maxConnections) 256 }}
            {{- else }}
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxDirectMemorySize=128M
            {{- end }}
            - name: GIT_MAX_CACHE_BYTES
              value: {{ include "hephaestus.gitCacheBytes" (dict "gitCache" .Values.server.gitCache "role" "server") | quote }}
            # Practice reviews and conversation turns run only with their sandboxes.
            - name: AGENT_ENABLED
              value: {{ $sandbox.enabled | quote }}
            {{- if $sandbox.enabled }}
            {{- include "hephaestus.env.sandbox" . | nindent 12 }}
            {{- end }}
            - name: HEPHAESTUS_RESEARCH_ORGANIZATION
              value: {{ $config.researchOrganization | quote }}
            - name: HEPHAESTUS_WORKSPACE_CREATIONPOLICY
              value: {{ $config.workspaceCreationPolicy | quote }}
            - name: HEPHAESTUS_PUBLIC_ACTIVITY_ENABLED
              value: {{ $config.publicActivity.enabled | quote }}
            - name: HEPHAESTUS_PUBLIC_ACTIVITY_REPOSITORY_VISIBILITY_MAX_AGE
              value: {{ $config.publicActivity.repositoryVisibilityMaxAge | quote }}
            - name: HEPHAESTUS_LLM_DISPLAY_CURRENCY
              value: {{ $config.llmDisplayCurrency | quote }}
            {{- include "hephaestus.env.modelEgress" . | nindent 12 }}
            {{- include "hephaestus.privateCaEnv" . | nindent 12 }}
            - name: SYNC_RUN_ON_STARTUP
              value: {{ $config.sync.runOnStartup | quote }}
            - name: SYNC_TIMEFRAME_DAYS
              value: {{ $config.sync.timeframeDays | int | quote }}
            - name: SYNC_CRON
              value: {{ $config.sync.syncCron | quote }}
            - name: SYNC_COOLDOWN_MINUTES
              value: {{ $config.sync.cooldownMinutes | int | quote }}
            - name: SYNC_BACKFILL_ENABLED
              value: {{ $config.sync.backfill.enabled | quote }}
            - name: SYNC_BACKFILL_BATCH_SIZE
              value: {{ $config.sync.backfill.batchSize | int | quote }}
            - name: SYNC_BACKFILL_RATE_LIMIT_THRESHOLD
              value: {{ $config.sync.backfill.rateLimitThreshold | int | quote }}
            - name: SYNC_BACKFILL_INTERVAL_SECONDS
              value: {{ $config.sync.backfill.intervalSeconds | int | quote }}
            {{- if ge (int $config.email.rateLimit.optionalDailyCapacity) (int $config.email.rateLimit.dailyCapacity) }}
            {{- fail "config.email.rateLimit.optionalDailyCapacity must be lower than dailyCapacity" }}
            {{- end }}
            - name: HEPHAESTUS_EMAIL_RATE_LIMIT_DAILY_CAPACITY
              value: {{ $config.email.rateLimit.dailyCapacity | int | quote }}
            - name: HEPHAESTUS_EMAIL_RATE_LIMIT_OPTIONAL_DAILY_CAPACITY
              value: {{ $config.email.rateLimit.optionalDailyCapacity | int | quote }}
            - name: HEPHAESTUS_AUTH_ISSUER
              value: {{ printf "https://%s" .Values.host | quote }}
            {{- include "hephaestus.secretEnv" (dict "root" . "env" "HEPHAESTUS_AUTH_STATE_COOKIE_KEY") | nindent 12 }}
            # The auth layer runs on this role only.
            - name: HEPHAESTUS_AUTH_ASSURANCE_ENFORCED
              value: {{ $config.auth.assuranceEnforced | quote }}
            - name: HEPHAESTUS_AUTH_BOOTSTRAP_ADMINS
              value: {{ $config.auth.bootstrapAdmins | join "," | quote }}
            {{- include "hephaestus.secretEnv" (dict "root" . "env" "HEPHAESTUS_AUTH_BOOTSTRAP_TOKEN" "optional" true) | nindent 12 }}
            - name: HEPHAESTUS_AUTH_BROWSER_EXTENSION_IDS
              value: {{ $config.auth.browserExtensionIds | join "," | quote }}
            - name: HEPHAESTUS_AUTH_PASSKEYS_INSTANCE_ADMIN_REQUIRED
              value: {{ $config.auth.passkeys.instanceAdminRequired | quote }}
            - name: HEPHAESTUS_AUTH_PASSKEYS_WORKSPACE_ADMIN_REQUIRED
              value: {{ $config.auth.passkeys.workspaceAdminRequired | quote }}
            - name: HEPHAESTUS_AUTH_PASSKEYS_RP_ID
              value: {{ $config.auth.passkeys.rpId | quote }}
            - name: HEPHAESTUS_AUTH_PASSKEYS_ALLOWED_ORIGINS
              value: {{ $config.auth.passkeys.allowedOrigins | join "," | quote }}
            - name: HEPHAESTUS_AUTH_PASSKEYS_ADMIN_MAX_AGE
              value: {{ $config.auth.passkeys.adminMaxAge | quote }}
            - name: GITHUB_OAUTH_CLIENT_ID
              value: {{ $config.github.oauthClientId | quote }}
            {{- include "hephaestus.secretEnv" (dict "root" . "env" "GITHUB_OAUTH_CLIENT_SECRET" "optional" true) | nindent 12 }}
            - name: GH_APP_CLIENT_ID
              value: {{ $config.github.appClientId | quote }}
            {{- include "hephaestus.secretEnv" (dict "root" . "env" "GH_APP_CLIENT_SECRET" "optional" true) | nindent 12 }}
            - name: GH_APP_INSTALLATION_URL
              value: {{ $config.github.appInstallationUrl | quote }}
            - name: GITLAB_OAUTH_CLIENT_ID
              value: {{ $config.gitlab.oauthClientId | quote }}
            {{- include "hephaestus.secretEnv" (dict "root" . "env" "GITLAB_OAUTH_CLIENT_SECRET" "optional" true) | nindent 12 }}
            - name: GITLAB_OAUTH_BASE_URL
              value: {{ $config.gitlab.oauthBaseUrl | quote }}
            - name: GITLAB_OAUTH_DISPLAY_NAME
              value: {{ $config.gitlab.oauthDisplayName | quote }}
            - name: PAGE_EXPERIENCE_METRICS
              value: {{ $config.pageExperienceMetrics | quote }}
            - name: BROWSER_FAULT_REPORTS
              value: {{ $config.browserFaultReports | quote }}
            - name: HEPHAESTUS_INTEGRATION_SLACK_CLIENT_ID
              value: {{ $config.slack.clientId | quote }}
            {{- include "hephaestus.secretEnv" (dict "root" . "env" "HEPHAESTUS_INTEGRATION_SLACK_CLIENT_SECRET" "optional" true) | nindent 12 }}
            - name: OUTLINE_OAUTH_BASE_URL
              value: {{ $config.outline.oauthBaseUrl | quote }}
            - name: OUTLINE_OAUTH_DISPLAY_NAME
              value: {{ $config.outline.oauthDisplayName | quote }}
            - name: OUTLINE_OAUTH_CLIENT_ID
              value: {{ $config.outline.oauthClientId | quote }}
            {{- include "hephaestus.secretEnv" (dict "root" . "env" "OUTLINE_OAUTH_CLIENT_SECRET" "optional" true) | nindent 12 }}
            - name: SPRING_MAIL_HOST
              value: {{ $config.email.host | quote }}
            - name: SPRING_MAIL_PORT
              value: {{ $config.email.port | int | quote }}
            - name: SPRING_MAIL_USERNAME
              value: {{ $config.email.username | quote }}
            {{- include "hephaestus.secretEnv" (dict "root" . "env" "SPRING_MAIL_PASSWORD" "optional" true) | nindent 12 }}
            # A relay without a username takes no credentials: an internal relay.
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
              value: {{ ne $config.email.username "" | quote }}
            # STARTTLS on submission (587), or implicit TLS (465). Both verify the relay.
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE
              value: {{ eq $config.email.tls "implicit" | quote }}
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
              value: {{ eq $config.email.tls "starttls" | quote }}
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED
              value: {{ eq $config.email.tls "starttls" | quote }}
            - name: HEPHAESTUS_EMAIL_FROM
              value: {{ $config.email.from | quote }}
            - name: HEPHAESTUS_EMAIL_FROM_NAME
              value: {{ $config.email.fromName | quote }}
            - name: HEPHAESTUS_EMAIL_REPLY_TO
              value: {{ $config.email.replyTo | quote }}
            - name: HEPHAESTUS_LLM_USAGE_RETENTION
              value: {{ $config.llmUsageRetention | quote }}
            - name: HEPHAESTUS_FEEDBACK_RETENTION
              value: {{ $config.feedbackRetention | quote }}
            - name: HEPHAESTUS_RELEASE_CHECK_ENABLED
              value: {{ $config.releaseCheckEnabled | quote }}
            - name: HEPHAESTUS_COMMIT_IDENTITY_RESOLUTION_ENABLED
              value: {{ $config.commitIdentityResolutionEnabled | quote }}
          ports:
            - name: http
              containerPort: 8080
            {{- if $sandbox.enabled }}
            - name: sandbox-gateway
              containerPort: {{ include "hephaestus.gatewayPort" . }}
            {{- end }}
            - name: management
              containerPort: 9090
          {{- /* The schema wait (HEPHAESTUS_DATABASE_MIGRATION_WAIT, 10 minutes) runs before readiness. */}}
          {{- include "hephaestus.probes" (dict "startupFailures" $startupFailures) | nindent 10 }}
          {{- include "hephaestus.preStop" . | nindent 10 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- include "hephaestus.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: git-cache
              mountPath: /data/git-repos
            - name: tmp
              mountPath: /tmp
            {{- include "hephaestus.postgresqlCaMount" . | nindent 12 }}
            {{- include "hephaestus.privateCaMount" . | nindent 12 }}
      volumes:
        # Commit ingestion mirrors and review clones: a cache that the server fills again after a restart.
        - name: git-cache
          emptyDir:
            sizeLimit: {{ .Values.server.gitCache.sizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- include "hephaestus.postgresqlCaVolume" . | nindent 8 }}
        {{- include "hephaestus.privateCaVolume" . | nindent 8 }}
