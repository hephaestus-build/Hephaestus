{{- /*
The server creates SandboxClaims in the sandbox namespace.
The operator creates that namespace with the Restricted Pod Security level, for this release alone:
the servers remove what they do not use there. The chart writes its quota, its policies and the
server's API authority in it. The platform isolation gate proves the boundary before a release runs (docs/admin/kubernetes.mdx § Sandbox prerequisites).
The server's own Deployment, Service account and policy are in server.yaml and networkpolicy.yaml.
*/}}
{{- if .Values.sandbox.enabled }}
{{- $name := include "hephaestus.name" (dict "root" . "component" "server") }}
{{- $port := include "hephaestus.gatewayPort" . | int }}
{{- $sandboxes := include "hephaestus.sandboxNamespace" (dict "root" .) }}
{{- $api := .Values.networkPolicy.kubernetesApi }}
{{- $_ := required "networkPolicy.kubernetesApi.cidr is required: state the API endpoint that the network plugin sees" $api.cidr }}
{{- if eq (int $api.port) 0 }}
{{- fail "networkPolicy.kubernetesApi.port is required: state the API endpoint port that the network plugin sees" }}
{{- end }}
{{- /* values.schema.json owns each value's shape; the server refuses the same values at start. */}}
{{- if .Values.sandbox.quota.enabled }}
{{- /*
Each PriorityClass tier has its own quota, so that review and conversation sandboxes cannot take each
other's room. Each sandbox template owns its requests. The reviews tier holds the
reviews that sandbox.reviewMemory holds, once: during a rollout the new server waits for the old one's
room.
The conversations tier holds the conversation sandboxes of the whole installation, not of each
server. Each admitted turn has room for its conversation sandbox.
*/}}
{{- $turns := int (include "hephaestus.conversationTurns" .) }}
{{- $review := include "hephaestus.templateSandbox" (dict "root" . "kind" "review") | fromJson }}
{{- $conversation := include "hephaestus.templateSandbox" (dict "root" . "kind" "conversation") | fromJson }}
{{- $conversations := $turns }}
{{- $reviews := int (include "hephaestus.reviews" .) }}
{{- /* Requests, not limits: sandbox Pods are Burstable, and a quota on limits would admit about half the reviews
that the node holds. The scheduler places Pods by their requests; a limit bounds one Pod's own peak. */}}
{{- /* A quota counts a Pod's RuntimeClass overhead with its requests, so each Pod adds the class's overhead. */}}
{{- $reviewPods := $reviews }}
{{- $tiers := list
  (dict "tier" "reviews"
    "pods" $reviewPods
    "memoryMi" (mul $reviews (int $review.memoryMi))
    "cpuMillis" (int (include "hephaestus.reviewCpuMillis" .))
    "diskMi" (mul $reviews (int $review.ephemeralStorageMi)))
  (dict "tier" "conversations"
    "pods" $conversations
    "memoryMi" (mul $conversations (int $conversation.memoryMi))
    "cpuMillis" (mul $conversations (int $conversation.cpuMillis))
    "diskMi" (mul $conversations (int $conversation.ephemeralStorageMi))) }}
{{- if eq (include "hephaestus.priorityClass" (dict "root" . "tier" "reviews")) (include "hephaestus.priorityClass" (dict "root" . "tier" "conversations")) }}
{{- fail "priorityClasses.reviews and priorityClasses.conversations must differ: each tier's quota selects its Pods by PriorityClass" }}
{{- end }}
{{- range $tiers }}
{{- $class := include "hephaestus.priorityClass" (dict "root" $ "tier" .tier) }}
{{- if not $class }}
{{- fail (printf "priorityClasses.%s is required: the sandbox quota of each tier selects its Pods by PriorityClass" .tier) }}
{{- end }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "hephaestus.name" (dict "root" $ "component" (printf "sandbox-quota-%s" .tier)) }}
  namespace: {{ $sandboxes }}
  labels:
    {{- include "hephaestus.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
spec:
  hard:
    pods: {{ .pods | quote }}
    requests.cpu: {{ printf "%dm" .cpuMillis | quote }}
    requests.memory: {{ printf "%dMi" .memoryMi | quote }}
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: [{{ $class | quote }}]
---
{{- end }}
{{- /* Objects that no sandbox may own, whatever its tier, and the disk of both tiers together: a quota scoped
by PriorityClass cannot count ephemeral storage. */}}
{{- $diskMi := 0 }}
{{- range $tiers }}
{{- $diskMi = add $diskMi .diskMi }}
{{- end }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "hephaestus.name" (dict "root" . "component" "sandbox-quota") }}
  namespace: {{ $sandboxes }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "sandbox") | nindent 4 }}
spec:
  hard:
    requests.ephemeral-storage: {{ printf "%dMi" $diskMi | quote }}
    persistentvolumeclaims: "0"
    services: "0"
    secrets: "0"
---
{{- end }}
# Every sandbox starts with no ingress or egress. The gateway policy below grants its only egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hephaestus.name" (dict "root" . "component" "sandbox-deny") }}
  namespace: {{ $sandboxes }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "sandbox") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# The servers' authority over the sandboxes of this namespace, and over nothing else in it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $sandboxes }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "sandbox") | nindent 4 }}
rules:
  # A subject's sandbox is an agent-sandbox claim. The server creates and deletes claims and lists its own; the
  # controller creates the sandbox and its Pod from the kind's template.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $sandboxes }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "sandbox") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Sandboxes may reach the servers on the gateway port, and nothing else: no
# DNS, no API, no database, no broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hephaestus.name" (dict "root" . "component" "sandbox-gateway") }}
  namespace: {{ $sandboxes }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "sandbox") | nindent 4 }}
spec:
  podSelector:
    {{- include "hephaestus.policy.gatewaySources" . | nindent 4 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "hephaestus.selectorLabels" (dict "root" . "component" "server") | nindent 14 }}
      ports:
        - port: {{ $port }}
          protocol: TCP
---
# The servers' gateway port.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hephaestus.name" (dict "root" . "component" "sandbox-gateway") }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  type: ClusterIP
  # Every ready server serves the same run/lease identity from PostgreSQL.
  selector:
    {{- include "hephaestus.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: sandbox-gateway
      port: {{ $port }}
      targetPort: sandbox-gateway
      protocol: TCP
{{- end }}
