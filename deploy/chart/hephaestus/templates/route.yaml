{{- /*
The platform owns the Gateway API resources, the controller, the Gateway, its TLS certificate and
the HTTP to HTTPS redirect. This route needs two HTTPRoute filters from that controller: URLRewrite
with ReplacePrefixMatch, and ResponseHeaderModifier for HSTS. The other security headers come from
the responses themselves, as in Compose.
*/}}
{{- if and .Values.workspaceSubdomains.enabled (gt (len .Values.host) 189) }}
{{- fail "workspace subdomains need a host of at most 189 characters" }}
{{- end }}
{{- $parentRefs := .Values.route.parentRefs }}
{{- if eq (len $parentRefs) 0 }}
{{- fail "route.parentRefs is required: name the Gateway that the platform operates." }}
{{- end }}
{{- $hsts := dict "type" "ResponseHeaderModifier" "responseHeaderModifier" (dict "set" (list (dict "name" "Strict-Transport-Security" "value" "max-age=2592000; includeSubDomains"))) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hephaestus.name" (dict "root" . "component" "route") }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "route") | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.host | quote }}
  # The most specific match wins, so the order below is for the reader only.
  rules:
    # Slack interactivity commits a consent change on the server before Slack is acknowledged.
    - matches:
        - path:
            type: Exact
            value: /webhooks/slack/interactivity
      filters:
        - {{ toJson $hsts }}
      backendRefs:
        - name: {{ include "hephaestus.name" (dict "root" . "component" "server") }}
          port: 8080
    # The receiver owns the full /webhooks/{kind} path. It is never rewritten.
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks
      filters:
        - {{ toJson $hsts }}
      backendRefs:
        - name: {{ include "hephaestus.name" (dict "root" . "component" "webhook") }}
          port: 8080
    # The server serves the API without the /api prefix, as behind Traefik in Compose. The auth
    # layer adds the prefix back to the browser-facing OAuth URLs.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - {{ toJson $hsts }}
      # The Heph live stream under /api stays open far longer than one request. Zero
      # asks the controller to disable each deadline; a controller that cannot may use its longest
      # value instead. Both are set because either one alone leaves the other to the implementation.
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: {{ include "hephaestus.name" (dict "root" . "component" "server") }}
          port: 8080
    # Everything else is the SPA. The webapp serves index.html for an unknown path.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - {{ toJson $hsts }}
      backendRefs:
        - name: {{ include "hephaestus.name" (dict "root" . "component" "webapp") }}
          port: 8080

{{- if .Values.workspaceSubdomains.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hephaestus.name" (dict "root" . "component" "workspace-route") }}
  labels:
    {{- include "hephaestus.labels" (dict "root" . "component" "route") | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $parentRefs | nindent 4 }}
  hostnames:
    - {{ printf "*.%s" .Values.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - {{ toJson $hsts }}
      backendRefs:
        - name: {{ include "hephaestus.name" (dict "root" . "component" "webapp") }}
          port: 8080
{{- end }}
