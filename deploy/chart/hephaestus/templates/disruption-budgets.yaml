{{- $replicas := dict "server" .Values.server.replicas }}
{{- range $component, $enabled := dict "postgresql" .Values.postgresql.bundled "server" true }}
{{- if $enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hephaestus.name" (dict "root" $ "component" $component) }}
  labels:
    {{- include "hephaestus.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  {{- if gt (int (get $replicas $component | default 1)) 1 }}
  maxUnavailable: 1
  {{- else }}
  # A singleton stops voluntary eviction until the operator starts planned maintenance.
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "hephaestus.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
