{{- $loop := and .Values.worker.enabled (gt (int (include "hephaestus.conversationTurns" .)) 0) }}
{{- $replicas := dict "worker" .Values.worker.replicas "conversation-loop" .Values.conversationLoop.replicas }}
{{- range $component, $enabled := dict "postgresql" .Values.postgresql.bundled "nats" .Values.nats.bundled "server" true "worker" .Values.worker.enabled "conversation-loop" $loop }}
{{- if $enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hephaestus.name" (dict "root" $ "component" $component) }}
  labels:
    {{- include "hephaestus.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  {{- if gt (int (get $replicas $component)) 1 }}
  maxUnavailable: 1
  {{- else }}
  # A singleton stops voluntary eviction until the operator starts planned maintenance.
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "hephaestus.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
