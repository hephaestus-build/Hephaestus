# Prometheus alert rules for Hephaestus. docs/admin/observability.mdx § Alert rules gives the scrape
# labels that these rules read, the exporters of the second group, and each threshold.
# docs/admin/production-operations-runbook.mdx § Alert response gives the response to each alert.
# hephaestus-alerts.test.yml beside this file holds the unit tests: vp run test:alerts.
groups:
  # The application's own metrics, from the management listener of each runtime role.
  - name: hephaestus
    rules:
      - alert: HephaestusMetricsUnavailable
        expr: up{job="hephaestus"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A Hephaestus metrics target cannot be scraped
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # Fires for as long as a role is scraped and the rules run. An outside dead-man check that stops
      # receiving it shows that the monitoring itself stopped: the scrape, the rules or the notifications.
      - alert: HephaestusWatchdog
        expr: count(up{job="hephaestus"} == 1) > 0
        labels:
          severity: none
        annotations:
          summary: The monitoring of Hephaestus scrapes, evaluates and notifies
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusProductFeedbackStuck
        expr: max(product_feedback_oldest_waiting_seconds{job="hephaestus"}) > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A product feedback report has waited more than 30 minutes to reach GitHub or the admins
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusProductFeedbackFilingFailing
        expr: sum(increase(product_feedback_steps_total{job="hephaestus",step="file",outcome="stopped"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: Product feedback stopped filing to GitHub; the reports wait in Needs action
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusProductFeedbackMoveRefused
        expr: sum(increase(product_feedback_steps_total{job="hephaestus",step="transition",outcome="refused"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: Product feedback refused a state move; the report keeps its state and can hold back filing
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusConsumerPoison
        expr: sum by (kind) (increase(integration_consumer_poison_total{job="hephaestus"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: An integration event was stored for administrator replay
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A handler that outlived the handler timeout gave its event back to the stream; it retries like a failure.
      - alert: HephaestusConsumerHandlerTimedOut
        expr: sum by (kind) (increase(integration_message_process_duration_seconds_count{job="hephaestus",outcome="timed_out"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: An integration event outlived the handler timeout and returned to its stream
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A publication that its listener can never complete is retried every five minutes without a limit.
      - alert: HephaestusEventPublicationsOverdue
        expr: max by (listener) (event_publications_overdue{job="hephaestus"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Durable server work has stayed incomplete for more than an hour and keeps retrying
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # The gauge exists only while the job is enabled. A queue that does not shrink means provider answers stopped.
      - alert: HephaestusCommitIdentityResolutionStalled
        expr: commit_identity_pending{job="hephaestus"} > 0 and delta(commit_identity_pending{job="hephaestus"}[6h]) >= 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Commit link correction made no progress for 6 hours
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # An email leaves the queue after its last attempt, so an outage shrinks the queue and the alert above stays quiet.
      - alert: HephaestusCommitIdentityResolutionUnanswered
        expr: >-
          sum(increase(commit_identity_resolutions_total{job="hephaestus",outcome="unanswered"}[6h]))
          > (sum(increase(commit_identity_resolutions_total{job="hephaestus",outcome=~"resolved|no_account|erased"}[6h])) or vector(0))
        labels:
          severity: warning
        annotations:
          summary: Commit link correction lost more emails than it answered in 6 hours
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusInboxRetentionFailing
        expr: sum(increase(integration_consumer_inbox_retention_failures_total{job="hephaestus"}[24h])) >= 2
        labels:
          severity: warning
        annotations:
          summary: Delivery inbox cleanup failed more than once in 24 hours
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # Each count is one statement that read a workspace's table without binding the workspace. In throw mode the
      # server refused it, so its request or job failed. One count is a defect, so the alert has no threshold.
      # The server registers a table's counter at its first violation, so that series has no earlier sample for
      # increase() to compare. The second operand counts a series that is new in the window.
      - alert: HephaestusTenancyViolations
        expr: >-
          sum by (table, mode) (
            increase(tenancy_violation_total{job="hephaestus"}[15m]) > 0
            or (tenancy_violation_total{job="hephaestus"} > 0 unless tenancy_violation_total{job="hephaestus"} offset 15m)
          )
        labels:
          severity: warning
        annotations:
          summary: A database statement on {{ $labels.table }} did not stay in one workspace ({{ $labels.mode }} mode)
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusConsumerRetryStalled
        expr: sum by (kind) (increase(integration_consumer_nak_total{job="hephaestus"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Integration events kept retrying for 15 minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusStreamPollStale
        expr: >-
          webhook_stream_poll_age_seconds{job="hephaestus",runtime_role="webhook"} > 180
          or webhook_stream_poll_age_seconds{job="hephaestus",runtime_role="webhook"}
          != webhook_stream_poll_age_seconds{job="hephaestus",runtime_role="webhook"}
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Webhook stream gauges are stale or have never been refreshed
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusStreamPollMissing
        expr: >-
          up{job="hephaestus",runtime_role="webhook"} == 1
          unless on (job, instance)
          webhook_stream_poll_age_seconds{job="hephaestus",runtime_role="webhook"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A scraped webhook receiver exports no stream poll age
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusStreamBacklog
        expr: max by (stream) (webhook_stream_consumer_pending{job="hephaestus",runtime_role="webhook"}) > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 50 events of a stream stayed undelivered to the consumers for 15 minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookStreamPastAgeBound
        expr: >-
          max by (stream) (webhook_stream_oldest_message_age_seconds{job="hephaestus",runtime_role="webhook"})
          > 1.1 * max by (stream) (webhook_stream_age_bound_seconds{job="hephaestus",runtime_role="webhook"})
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A webhook stream holds deliveries past its age bound; a shorter bound has not taken effect
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A wait is measured when the event is handled. A catch-up after a restart ends inside the short window and
      # the hold, so only a consumer that stays behind fires.
      - alert: HephaestusEventsDelayed
        expr: >-
          1 - sum by (kind) (increase(integration_message_lag_seconds_bucket{job="hephaestus",le="300.0"}[10m]))
          / sum by (kind) (increase(integration_message_lag_seconds_count{job="hephaestus"}[10m]))
          > 0.1
          and sum by (kind) (increase(integration_message_lag_seconds_count{job="hephaestus"}[10m])) >= 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 10 % of a provider's events kept waiting over 5 minutes for 15 minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusStreamConsumerStopped
        expr: max by (stream) (webhook_stream_consumer_pending{job="hephaestus",runtime_role="webhook"}) > 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: A stream kept undelivered events for 6 hours; a consumer that stays stopped past its retention loses them
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookRetentionBelowAgeBound
        expr: >-
          max by (stream) (webhook_stream_oldest_message_age_seconds{job="hephaestus",runtime_role="webhook"})
          < 0.9 * max by (stream) (webhook_stream_age_bound_seconds{job="hephaestus",runtime_role="webhook"})
          and max by (stream) (webhook_stream_bytes_utilization{job="hephaestus",runtime_role="webhook"}) > 0.9
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A webhook stream sheds deliveries at its byte bound before its age bound; it keeps less than it promises
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookPublishFailing
        expr: sum(increase(webhook_publish_total{job="hephaestus",outcome="failure"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The webhook receiver cannot store deliveries on the broker
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookReceiverBusy
        expr: sum(increase(webhook_rejected_total{job="hephaestus",reason="busy"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The webhook receiver refuses deliveries because large ones fill its memory
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookRedeliveryNotRunning
        expr: >-
          sum(increase(github_webhook_redelivery_total{job="hephaestus",outcome=~"unavailable|refused"}[30m])) > 2
        labels:
          severity: warning
        annotations:
          summary: GitHub refuses redeliveries, or the deliveries of the GitHub App cannot be read
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookRedeliveryTruncated
        expr: sum(increase(github_webhook_redelivery_total{job="hephaestus",outcome="truncated"}[2h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: GitHub redelivery runs read only part of the App's deliveries at least three times in two hours
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookRedeliveriesRequested
        expr: >-
          sum by (namespace) (increase(github_webhook_redelivery_total{job="hephaestus",outcome="requested"}[1h])) >= 3
          and on (namespace)
          sum by (namespace) (increase(github_webhook_redelivery_total{job="hephaestus",outcome="requested"}[1h]))
          / on (namespace)
          sum by (namespace) (increase(webhook_publish_total{job="hephaestus",stream="github",outcome="success"}[1h]))
          > 0.05
        labels:
          severity: warning
        annotations:
          summary: The server asked GitHub to redeliver more than 5 % of the received GitHub deliveries in one hour
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookEventsUnrecovered
        expr: max(github_webhook_unrecovered{job="hephaestus"}) > 0
        labels:
          severity: warning
        annotations:
          summary: GitHub events failed every delivery attempt and were not received
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusBudgetExhausted
        expr: sum(increase(llm_budget_exhausted_total{job="hephaestus"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: A workspace crossed the instance-funded monthly budget cap
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusBudgetBlocked
        expr: sum by (surface, cap) (increase(llm_budget_blocked_total{job="hephaestus"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: LLM budget admission kept refusing work for 15 minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusModelRefusalsReachCallers
        expr: >-
          sum by (pool) (increase(llm_pool_upstream_throttled_total{job="hephaestus"}[10m]))
          - sum by (pool) (increase(llm_pool_upstream_absorbed_total{job="hephaestus"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A model provider's refusals kept reaching callers for 15 minutes instead of only slowing them
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusModelLimitAtFloor
        expr: >-
          max by (pool) (llm_pool_limit{job="hephaestus"}) <= 2
          and on (pool) (
            sum by (pool) (increase(llm_pool_limit_decreases_total{job="hephaestus"}[30m]))
            + sum by (pool) (increase(llm_pool_first_token_baseline_resets_total{job="hephaestus"}[30m]))
          ) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: A model's call limit stayed at its floor of two calls for 30 minutes while its provider refused, queued or did not answer
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A conversation's reader waits for the answer, so its calls get a bound of seconds.
      - alert: HephaestusConversationModelWaitLong
        expr: >-
          1 - sum by (pool) (increase(llm_pool_permit_wait_seconds_bucket{job="hephaestus",class=~"turn|product_feedback",le="5.0"}[15m]))
          / sum by (pool) (increase(llm_pool_permit_wait_seconds_count{job="hephaestus",class=~"turn|product_feedback"}[15m]))
          > 0.1
          and sum by (pool) (increase(llm_pool_permit_wait_seconds_count{job="hephaestus",class=~"turn|product_feedback"}[15m])) >= 10
        labels:
          severity: warning
        annotations:
          summary: More than 10 % of a model's conversation calls waited over 5 seconds for a free call in 15 minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A review's calls queue by design. A call that waits two minutes holds its sandbox idle inside its deadline.
      - alert: HephaestusReviewModelWaitLong
        expr: >-
          1 - sum by (pool) (increase(llm_pool_permit_wait_seconds_bucket{job="hephaestus",class!~"turn|product_feedback",le="120.0"}[1h]))
          / sum by (pool) (increase(llm_pool_permit_wait_seconds_count{job="hephaestus",class!~"turn|product_feedback"}[1h]))
          > 0.25
          and sum by (pool) (increase(llm_pool_permit_wait_seconds_count{job="hephaestus",class!~"turn|product_feedback"}[1h])) >= 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than a quarter of a model's review calls waited over two minutes for a free call in one hour
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusModelPermitsExpired
        expr: sum by (pool) (increase(llm_pool_permits_expired_total{job="hephaestus"}[1h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: Workers stopped renewing at least three of a model's calls in flight in one hour
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusModelPermitRenewalFailing
        expr: sum(increase(llm_pool_lease_renewal_failures_total{job="hephaestus"}[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: Workers failed at least three renewals of their model call permits in 15 minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusAgentJobsFailing
        expr: sum(increase(agent_job_total{job="hephaestus",outcome=~"failed|timed_out"}[1h])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: At least three agent jobs failed or timed out in one hour
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusFeedbackSendRetrying
        expr: >-
          max(practice_feedback_send_attempts{job="hephaestus"})
          >= max(practice_feedback_send_readback_limit{job="hephaestus"}) / 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A feedback send kept using at least half its readback attempt threshold for one minute
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusFeedbackSendMetricsUnavailable
        expr: >-
          practice_feedback_send_attempts{job="hephaestus",runtime_role="server"}
          != practice_feedback_send_attempts{job="hephaestus",runtime_role="server"}
          or
          (up{job="hephaestus",runtime_role="server"} == 1
          unless on (job, instance) practice_feedback_send_attempts{job="hephaestus",runtime_role="server"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A server cannot read the attempts of feedback sends that are not DONE
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusFeedbackDeliveriesFailing
        expr: sum by (destination) (increase(practice_feedback_settled_total{job="hephaestus",state="failed"}[1h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: At least three feedback deliveries to one destination failed in one hour
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusReviewSandboxFailing
        expr: sum(increase(agent_job_infra_retry_requeued_total{job="hephaestus",cause="sandbox"}[1h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: Review sandboxes failed to start, initialize or finish at least three times in one hour
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusSandboxGatewayRefusing
        expr: sum by (reason) (increase(sandbox_gateway_refused_total{job="hephaestus",reason!="attempt_ended"}[10m])) >= 60
        labels:
          severity: warning
        annotations:
          summary: The sandbox gateway refused at least 60 requests for one reason in ten minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusSandboxGatewayConnectionsHigh
        expr: sandbox_gateway_connections{job="hephaestus"} / sandbox_gateway_connections_limit{job="hephaestus"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A sandbox gateway holds more than 80 percent of the connections it allows
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusGitCacheNearlyFull
        expr: git_cache_bytes{job="hephaestus"} / git_cache_limit_bytes{job="hephaestus"} > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A role's Git cache volume stayed above 90 percent, and eviction cannot free it
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusGitMirrorsEvicted
        expr: sum(increase(git_mirror_evictions_total{job="hephaestus"}[1h])) >= 5
        labels:
          severity: warning
        annotations:
          summary: At least five kept Git mirrors were evicted in one hour; the volume is too small for the monitored repositories
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusAttemptKeysNotSyncing
        expr: sum by (task) (increase(attempt_key_sync_failures_total{job="hephaestus"}[15m])) >= 5
        labels:
          severity: warning
        annotations:
          summary: A worker failed five times in 15 minutes to publish or load the keys that verify sandbox credentials
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusReviewUnreachable
        expr: >-
          sum by (cause) (increase(agent_job_infra_retry_requeued_total{job="hephaestus",cause=~"server_unreachable|provider_unreachable"}[1h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: Review sandboxes failed to reach the server or the model provider at least three times in one hour
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusReviewServerError
        expr: sum(increase(agent_job_server_error_total{job="hephaestus"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: The server answered a review's results with its own error, so the review ended without them
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusPersonErasureInterrupted
        expr: sum(increase(person_data_erasure_failures_total{job="hephaestus"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: Person erasure stopped or could not record its failure state
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusReviewPreparationFailing
        expr: sum(increase(agent_job_infra_retry_requeued_total{job="hephaestus",cause="preparation"}[30m])) >= 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Review attempts kept failing before their sandbox started, so they run again
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A stage that never ends has no sample: the attempt's deadline ends it, and HephaestusAgentJobsFailing reports that.
      - alert: HephaestusReviewStageSlow
        expr: >-
          (
            sum by (stage) (increase(agent_job_stage_duration_seconds_count{job="hephaestus",stage!="sandbox"}[6h]))
            - sum by (stage) (increase(agent_job_stage_duration_seconds_bucket{job="hephaestus",stage!="sandbox",le="600.0"}[6h]))
            or
            sum by (stage) (increase(agent_job_stage_duration_seconds_count{job="hephaestus",stage="sandbox"}[6h]))
            - sum by (stage) (increase(agent_job_stage_duration_seconds_bucket{job="hephaestus",stage="sandbox",le="1800.0"}[6h]))
          ) >= 3
        labels:
          severity: warning
        annotations:
          summary: One stage of review attempts ran past its bound at least three times in six hours
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusReviewWorkerLost
        expr: sum(increase(agent_run_reaped_total{job="hephaestus",kind="review",outcome="attempts_exhausted"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: A review failed because the holder of each of its attempts stopped renewing its lease
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusAgentRunReaperFailing
        expr: sum(increase(agent_run_reaper_failure_total{job="hephaestus"}[10m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The run reaper keeps failing to take back an expired run, so its work waits
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusAgentSandboxReaperFailing
        expr: sum(increase(agent_sandbox_reaper_failure_total{job="hephaestus"}[10m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The sandbox reaper keeps failing to delete sandboxes that no work needs, so they hold cluster capacity
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusAgentSandboxUnisolated
        expr: sum(increase(agent_sandbox_revoked_total{job="hephaestus",reason="unisolated"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: A sandbox could still reach the Kubernetes API 10 seconds after it started, so its network policy does not hold
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusReviewFeedbackUnconfirmed
        expr: sum(increase(agent_job_composition_stopped_total{job="hephaestus",outcome="unrecorded"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: A review closed as partial because every attempt ended before it confirmed where its feedback went
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusAgentQueueStalled
        expr: max(agent_queue_oldest_age_seconds{job="hephaestus"}) > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An agent job that can run has waited for a worker for more than one hour
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusOutboxStalled
        expr: max by (kind) (action_oldest_due_seconds{job="hephaestus"}) > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An outbox action has waited for more than 15 minutes since it became due
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusOutboxUncertain
        expr: sum by (kind) (increase(action_ended_total{job="hephaestus",state="UNCERTAIN"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: An outbox action ended uncertain, so its write may have reached the provider and nothing confirms it
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusSandboxIsolationFailed
        expr: sandbox_isolation_passed{job="hephaestus",runtime_role="worker"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A worker's sandbox isolation probe failed, so the worker starts no sandbox
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWalArchiveFailing
        expr: >-
          max(database_wal_archive_failing{job="hephaestus"}) == 1
          or sum(increase(database_wal_archive_sample_failures_total{job="hephaestus"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL cannot archive its WAL, or the server cannot read whether it can
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A connection that the pool cannot give within its timeout fails the request or the job that asked for it.
      - alert: HephaestusDatabaseConnectionTimeouts
        expr: sum by (runtime_role) (increase(hikaricp_connections_timeout_total{job="hephaestus"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: The {{ $labels.runtime_role }} role could not get a database connection in time, so requests or jobs failed
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # The sizing target is an acquire p95 below 50 ms (docs/admin/sizing.mdx). The floor keeps a quiet process from
      # firing on a few acquires during a database restart.
      - alert: HephaestusDatabasePoolSlow
        expr: >-
          1 - sum by (runtime_role) (increase(hikaricp_connections_acquire_seconds_bucket{job="hephaestus",le="0.05"}[30m]))
            / sum by (runtime_role) (increase(hikaricp_connections_acquire_seconds_count{job="hephaestus"}[30m])) > 0.05
          and sum by (runtime_role) (increase(hikaricp_connections_acquire_seconds_count{job="hephaestus"}[30m])) >= 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5 % of the {{ $labels.runtime_role }} role's database connections took longer than 50 ms to get
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusBrowserFaultsRising
        expr: sum by (kind) (increase(browser_faults_total{job="hephaestus"}[1h])) >= 20
        labels:
          severity: warning
        annotations:
          summary: Readers' browsers reported at least twenty failures of one kind in one hour
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # The metric's label job reaches the store as exported_job, because the scrape sets its own job.
      - alert: HephaestusPrivacyJobFailing
        expr: sum by (exported_job) (increase(privacy_job_completed_total{job="hephaestus",outcome=~"failure|incomplete"}[26h])) >= 2
        labels:
          severity: warning
        annotations:
          summary: A privacy job failed or left eligible work at least twice in 26 hours
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # Both sweeps run each hour, and an empty backlog also counts as a run.
      - alert: HephaestusPrivacyJobNotRunning
        expr: >-
          sum by (exported_job) (increase(privacy_job_completed_total{job="hephaestus",exported_job=~"account_erasure|export_retention"}[4h])) == 0
        for: 90m
        labels:
          severity: warning
        annotations:
          summary: An hourly privacy sweep ended no run in four hours
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

  # Kubernetes and cluster metrics: kube-state-metrics, the kubelet, node-exporter and cert-manager.
  # The PVC and CronJob names are those that the chart gives a release. The webhook rules select the
  # Deployment by the chart's labels, which kube-state-metrics exports only when they are allowed. Add a namespace matcher to
  # limit a rule to the release namespace.
  # Service level objectives. The API objectives are multi-window burn-rate alerts over a 30-day budget: a fast
  # burn spends 2 % of the budget in one hour, a slow burn 5 % in six hours. The latency ratio divides by the +Inf
  # bucket, so a server without the 2 s bucket (before the upgrade) counts on neither side. Each alert needs a
  # floor of requests, so that one failure on an idle instance does not page.
  # docs/admin/observability.mdx § Service level objectives gives each objective and its reason.
  - name: hephaestus-slos
    rules:
      - alert: HephaestusApiErrorBudgetBurnFast
        expr: >-
          (sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*",status=~"5.."}[1h])) / sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*"}[1h]))) > 14.4 * 0.005
          and (sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*"}[5m]))) > 14.4 * 0.005
          and sum(increase(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*"}[1h])) >= 100
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The API answers with server errors fast enough to spend its monthly error budget in two days
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusApiErrorBudgetBurnSlow
        expr: >-
          (sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*",status=~"5.."}[6h])) / sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*"}[6h]))) > 6 * 0.005
          and (sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*",status=~"5.."}[30m])) / sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*"}[30m]))) > 6 * 0.005
          and sum(increase(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*"}[6h])) >= 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The API answers with server errors fast enough to spend its monthly error budget in five days
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # The ticket window: a burn rate of 1 over three days spends 10 % of the budget. It finds a slow leak that
      # neither page window sees, and is work for the next working day.
      - alert: HephaestusApiErrorBudgetBurnTicket
        expr: >-
          (sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*",status=~"5.."}[3d])) / sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*"}[3d]))) > 0.005
          and (sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*",status=~"5.."}[6h])) / sum(rate(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*"}[6h]))) > 0.005
          and sum(increase(http_server_requests_seconds_count{job="hephaestus",runtime_role="server",uri!~"/internal/.*"}[3d])) >= 1000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: The API answered with server errors for three days at a rate that spends its monthly error budget
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusApiLatencyBudgetBurnFast
        expr: >-
          (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="2.0"}[1h])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="+Inf"}[1h]))) > 14.4 * 0.005
          and (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="2.0"}[5m])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="+Inf"}[5m]))) > 14.4 * 0.005
          and sum(increase(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="+Inf"}[1h])) >= 100
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: API reads take longer than 2 seconds often enough to spend the monthly budget in two days
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusApiLatencyBudgetBurnSlow
        expr: >-
          (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="2.0"}[6h])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="+Inf"}[6h]))) > 6 * 0.005
          and (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="2.0"}[30m])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="+Inf"}[30m]))) > 6 * 0.005
          and sum(increase(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="+Inf"}[6h])) >= 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: API reads take longer than 2 seconds often enough to spend the monthly budget in five days
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusApiLatencyBudgetBurnTicket
        expr: >-
          (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="2.0"}[3d])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="+Inf"}[3d]))) > 0.005
          and (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="2.0"}[6h])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="+Inf"}[6h]))) > 0.005
          and sum(increase(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri!~"/internal/.*|.*/events|.*/download|.*/export|.*/sarif",le="+Inf"}[3d])) >= 1000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: API reads took longer than 2 seconds for three days often enough to spend the monthly budget
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # Activity reads: 95 % within 1 s. The Activity route templates are the workspace and public activity routes.
      - alert: HephaestusActivityLatencyBudgetBurnFast
        expr: >-
          (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="1.0"}[1h])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="+Inf"}[1h]))) > 14.4 * 0.05
          and (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="1.0"}[5m])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="+Inf"}[5m]))) > 14.4 * 0.05
          and sum(increase(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="+Inf"}[1h])) >= 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Activity reads take longer than 1 second often enough to spend the monthly budget in two days
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusActivityLatencyBudgetBurnSlow
        expr: >-
          (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="1.0"}[6h])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="+Inf"}[6h]))) > 6 * 0.05
          and (1 - sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="1.0"}[30m])) / sum(rate(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="+Inf"}[30m]))) > 6 * 0.05
          and sum(increase(http_server_requests_seconds_bucket{job="hephaestus",runtime_role="server",method="GET",status!~"5..",uri=~"(/public)?/workspaces/[^/]+/activity(/.*)?",le="+Inf"}[6h])) >= 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Activity reads take longer than 1 second often enough to spend the monthly budget in five days
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # Conversation turns: 95 % get the first part of their answer within 10 s. A small instance has few turns an hour,
      # so the floors keep one slow turn in a quiet hour from firing.
      - alert: HephaestusConversationFirstTokenBudgetBurnFast
        expr: >-
          (1 - sum(increase(mentor_turn_first_token_seconds_bucket{job="hephaestus",le="10.0"}[1h])) / sum(increase(mentor_turn_first_token_seconds_count{job="hephaestus"}[1h]))) > 14.4 * 0.05
          and (1 - sum(increase(mentor_turn_first_token_seconds_bucket{job="hephaestus",le="10.0"}[5m])) / sum(increase(mentor_turn_first_token_seconds_count{job="hephaestus"}[5m]))) > 14.4 * 0.05
          and sum(increase(mentor_turn_first_token_seconds_count{job="hephaestus"}[1h])) >= 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Conversation turns start their answer later than 10 seconds often enough to spend the monthly budget in two days
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusConversationFirstTokenBudgetBurnSlow
        expr: >-
          (1 - sum(increase(mentor_turn_first_token_seconds_bucket{job="hephaestus",le="10.0"}[6h])) / sum(increase(mentor_turn_first_token_seconds_count{job="hephaestus"}[6h]))) > 6 * 0.05
          and (1 - sum(increase(mentor_turn_first_token_seconds_bucket{job="hephaestus",le="10.0"}[30m])) / sum(increase(mentor_turn_first_token_seconds_count{job="hephaestus"}[30m]))) > 6 * 0.05
          and sum(increase(mentor_turn_first_token_seconds_count{job="hephaestus"}[6h])) >= 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Conversation turns start their answer later than 10 seconds often enough to spend the monthly budget in five days
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A failed or lost turn leaves a developer without an answer. A turn that the developer stopped is no failure.
      - alert: HephaestusConversationTurnsFailing
        expr: >-
          sum(increase(mentor_turn_completed_total{job="hephaestus",outcome=~"failed|lease_expired"}[1h]))
            / sum(increase(mentor_turn_completed_total{job="hephaestus"}[1h])) > 0.2
          and sum(increase(mentor_turn_completed_total{job="hephaestus"}[1h])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than a fifth of the conversation turns of the last hour failed or lost their worker
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusPageExperiencePoor
        expr: >-
          sum(rate(web_vital_duration_seconds_bucket{job="hephaestus",vital="lcp",le="2.5"}[6h]))
          / sum(rate(web_vital_duration_seconds_count{job="hephaestus",vital="lcp"}[6h])) < 0.75
          and sum(increase(web_vital_duration_seconds_count{job="hephaestus",vital="lcp"}[6h])) >= 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Fewer than 75 % of page loads showed their main content within 2.5 seconds over six hours
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # The weekly ticket: a small instance seldom has 50 loads in six hours, so the six-hour alert stays silent.
      - alert: HephaestusPageExperiencePoorWeekly
        expr: >-
          sum(rate(web_vital_duration_seconds_bucket{job="hephaestus",vital="lcp",le="2.5"}[7d]))
          / sum(rate(web_vital_duration_seconds_count{job="hephaestus",vital="lcp"}[7d])) < 0.75
          and sum(increase(web_vital_duration_seconds_count{job="hephaestus",vital="lcp"}[7d])) >= 50
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Fewer than 75 % of page loads showed their main content within 2.5 seconds over seven days
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # An item review that does not end complete leaves a developer without feedback for part of its practices.
      # Readiness waits and budget stops are decisions of policy with their own signals, so they count on neither side.
      - alert: HephaestusReviewsIncomplete
        expr: >-
          sum(
            increase(practice_review_ended_total{job="hephaestus",kind="item",status=~"partial|failed",reason!~"readiness_refused|budget"}[6h])
            or increase(practice_review_ended_total{job="hephaestus",kind="item",status="cancelled",reason="no_sandbox_room"}[6h])
          )
          / sum(
            increase(practice_review_ended_total{job="hephaestus",kind="item",status=~"partial|failed",reason!~"readiness_refused|budget"}[6h])
            or increase(practice_review_ended_total{job="hephaestus",kind="item",status="cancelled",reason="no_sandbox_room"}[6h])
            or increase(practice_review_ended_total{job="hephaestus",kind="item",status="complete"}[6h])
          ) > 0.25
          and sum(
            increase(practice_review_ended_total{job="hephaestus",kind="item",status=~"partial|failed",reason!~"readiness_refused|budget"}[6h])
            or increase(practice_review_ended_total{job="hephaestus",kind="item",status="cancelled",reason="no_sandbox_room"}[6h])
            or increase(practice_review_ended_total{job="hephaestus",kind="item",status="complete"}[6h])
          ) >= 4
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than a quarter of the item reviews of the last six hours did not end complete
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A wrong claim costs more trust than a missing one, so a small share is worth a look. A mark that its author
      # removed does not count. Without a judged result in the window there is no share to read.
      - alert: HephaestusResultsMarkedIncorrect
        expr: >-
          (
            sum(increase(practice_result_marked_total{job="hephaestus",kind="incorrect",change="set"}[7d]))
            - sum(increase(practice_result_marked_total{job="hephaestus",kind="incorrect",change="removed"}[7d]))
          ) / sum(increase(practice_result_recorded_total{job="hephaestus",outcome=~"met|not_met"}[7d])) > 0.05
          and (
            sum(increase(practice_result_marked_total{job="hephaestus",kind="incorrect",change="set"}[7d]))
            - sum(increase(practice_result_marked_total{job="hephaestus",kind="incorrect",change="removed"}[7d]))
          ) >= 5
          and sum(increase(practice_result_recorded_total{job="hephaestus",outcome=~"met|not_met"}[7d])) > 0
        labels:
          severity: warning
        annotations:
          summary: People marked more than 5 % of the week's judged results incorrect
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # Readback that cannot tell whether a copy reached the work leaves the feedback Unconfirmed: the copy may be
      # missing, and a retry could post it twice. A proved absence is the case where a resend is safe, so it does not fire.
      - alert: HephaestusFeedbackReadbackUnknown
        expr: >-
          sum by (provider) (increase(practice_feedback_readback_total{job="hephaestus",outcome="unknown"}[1d])) > 0
        labels:
          severity: warning
        annotations:
          summary: Readback could not tell whether feedback reached the work on {{ $labels.provider }}
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A review that a push or a request started, and whose feedback no person approves first. The objective is 90 %
      # within 30 minutes; more than 30 % late spends its budget three times as fast.
      - alert: HephaestusFeedbackDeliverySlow
        expr: >-
          1 - sum(increase(practice_review_first_delivery_seconds_bucket{job="hephaestus",trigger=~"event|request",approval="none",le="1800.0"}[6h]))
            / sum(increase(practice_review_first_delivery_seconds_count{job="hephaestus",trigger=~"event|request",approval="none"}[6h])) > 0.3
          and sum(increase(practice_review_first_delivery_seconds_count{job="hephaestus",trigger=~"event|request",approval="none"}[6h])) >= 4
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 30 % of the reviews of the last six hours posted their first feedback later than 30 minutes after their occasion
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusFeedbackDeliveryStalled
        expr: max(practice_feedback_oldest_waiting_seconds{job="hephaestus"}) > 7200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Feedback on the work has waited more than two hours for its first posted copy
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
  # postgres_exporter of postgresql.metrics (docs/admin/observability.mdx, Database metrics). Without the
  # exporter these series do not exist, and the rules stay silent.
  - name: hephaestus-postgresql
    rules:
      # PostgreSQL broke a deadlock by cancelling one of the transactions, which the role then retried or failed.
      - alert: HephaestusDatabaseDeadlocks
        expr: sum by (namespace, datname) (increase(pg_stat_database_deadlocks{job="postgresql"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL broke a deadlock in the last 15 minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # An open transaction holds back autovacuum for every table and can hold locks that others wait for.
      - alert: HephaestusDatabaseTransactionOpenLong
        expr: max by (namespace) (pg_long_running_transactions_oldest_timestamp_seconds{job="postgresql"}) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A database transaction has been open for more than 5 minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # The floor keeps a small table, where a few deleted rows are a large share, quiet.
      - alert: HephaestusDatabaseDeadRowsHigh
        expr: >-
          pg_stat_user_tables_n_dead_tup{job="postgresql"} > 10000
          and pg_stat_user_tables_n_dead_tup{job="postgresql"} > 0.2 * pg_stat_user_tables_n_live_tup{job="postgresql"}
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A table has held more than 20 % dead rows for an hour, so autovacuum does not keep up
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # PostgreSQL stops writes at about 2 billion. Autovacuum freezes old rows long before 1 billion.
      - alert: HephaestusDatabaseTransactionIdAgeHigh
        expr: max by (namespace, datname) (pg_database_wraparound_age_datfrozenxid_seconds{job="postgresql"}) > 1e9
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A database's oldest unfrozen transaction ID is more than 1 billion old
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
  - name: hephaestus-kubernetes
    rules:
      # All namespaces: the cluster serves only this release, and a killed cert-manager or exporter also needs a person.
      # A restarted container shows in last_terminated_reason. A sandbox never restarts, so it shows in terminated_reason.
      - alert: HephaestusContainerOomKilled
        expr: >-
          max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) == 1
          and on (namespace, pod, container) increase(kube_pod_container_status_restarts_total[15m]) > 0
          or
          max by (namespace, pod, container) (kube_pod_container_status_terminated_reason{reason="OOMKilled"}) == 1
        labels:
          severity: warning
        annotations:
          summary: The kernel killed a container for its memory
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookReceiverDown
        expr: >-
          kube_deployment_status_replicas_available == 0
          and on (namespace, deployment) kube_deployment_spec_replicas > 0
          and on (namespace, deployment)
          kube_deployment_labels{label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="webhook"}
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No webhook receiver of the release is available, so provider deliveries fail
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusWebhookReceiverUnready
        expr: >-
          kube_deployment_status_replicas_unavailable > 0
          and on (namespace, deployment) kube_deployment_status_replicas_available > 0
          and on (namespace, deployment)
          kube_deployment_labels{label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="webhook"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A webhook receiver replica stayed unavailable for 15 minutes while another serves
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # A release name longer than 34 characters truncates and hashes the CronJob names, which the name match then
      # misses. The label match finds those CronJobs when kube-state-metrics exports their labels.
      - alert: HephaestusBackupStale
        expr: |-
          time() - max by (namespace, release) (
            label_replace(
              kube_cronjob_status_last_successful_time{cronjob=~".+-postgresql-backup-(full|diff)"},
              "release", "$1", "cronjob", "(.+)-postgresql-backup-(?:full|diff)"
            )
            or
            label_replace(
              kube_cronjob_status_last_successful_time
              * on (namespace, cronjob) group_left (label_app_kubernetes_io_instance)
              kube_cronjob_labels{label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="postgresql-backup"},
              "release", "$1", "label_app_kubernetes_io_instance", "(.+)"
            )
          ) > 30 * 3600
          or
          # kube-state-metrics exports no last-success time before a CronJob's first success: count from its
          # creation instead.
          (
            time() - min by (namespace, release) (
              label_replace(
                kube_cronjob_created{cronjob=~".+-postgresql-backup-(full|diff)"},
                "release", "$1", "cronjob", "(.+)-postgresql-backup-(?:full|diff)"
              )
              or
              label_replace(
                kube_cronjob_created
                * on (namespace, cronjob) group_left (label_app_kubernetes_io_instance)
                kube_cronjob_labels{label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="postgresql-backup"},
                "release", "$1", "label_app_kubernetes_io_instance", "(.+)"
              )
            ) > 30 * 3600
            unless on (namespace, release)
            (
              label_replace(
                kube_cronjob_status_last_successful_time{cronjob=~".+-postgresql-backup-(full|diff)"},
                "release", "$1", "cronjob", "(.+)-postgresql-backup-(?:full|diff)"
              )
              or
              label_replace(
                kube_cronjob_status_last_successful_time
                * on (namespace, cronjob) group_left (label_app_kubernetes_io_instance)
                kube_cronjob_labels{label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="postgresql-backup"},
                "release", "$1", "label_app_kubernetes_io_instance", "(.+)"
              )
            )
          )
        labels:
          severity: critical
        annotations:
          summary: No PostgreSQL backup completed in the last 30 hours
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusPostgresVolumeFilling
        expr: >-
          kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"data-.+-postgresql-0"}
          / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"data-.+-postgresql-0"}
          < 0.15
          and
          kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"data-.+-postgresql-0"}
          / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"data-.+-postgresql-0"}
          >= 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The PostgreSQL volume has between 5 % and 15 % free space
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusPostgresVolumeFilling
        expr: >-
          kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"data-.+-postgresql-0"}
          / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"data-.+-postgresql-0"}
          < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The PostgreSQL volume has less than 5 % free space
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusJetStreamVolumeFilling
        expr: >-
          kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"data-.+-nats-0"}
          / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"data-.+-nats-0"}
          < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The NATS JetStream volume has less than 10 % free space
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusNodeDiskFilling
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay",mountpoint!~"/var/lib/kubelet/pods/.+"}
          / node_filesystem_size_bytes
          < 0.15
          and node_filesystem_readonly == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A node file system has less than 15 % free space
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusCertificateExpiring
        expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A certificate that cert-manager manages expires in less than seven days, or has no issued certificate
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
  # The pull reconciler's metrics, from node-exporter's textfile collector on each host that runs
  # hephaestus-reconcile.timer (docs/admin/pull-based-deployment.mdx § Watching it). Load this
  # group only where such a host is scraped: HephaestusDeployMetricsMissing fires where none reports.
  - name: hephaestus-pull-deploy
    rules:
      - alert: HephaestusDeployReconcileFailing
        expr: hephaestus_deploy_reconcile_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Every reconcile run of a host failed for 15 minutes, so the host does not follow its release channel
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusDeployReconcileStale
        expr: time() - hephaestus_deploy_reconcile_timestamp_seconds > 2400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A host's reconciler has finished no run for 40 minutes
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusDeployMetricsMissing
        expr: absent(hephaestus_deploy_reconcile_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No host reports the reconciler's metrics
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - alert: HephaestusDeployToolingPending
        expr: hephaestus_deploy_tooling_pending == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A host runs reconciler tooling that no apply has recorded
          runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
