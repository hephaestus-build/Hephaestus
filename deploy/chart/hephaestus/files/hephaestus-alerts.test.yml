  - name: a deadlock fires for 15 minutes, a database without one stays quiet
    interval: 1m
    input_series:
      - series: 'pg_stat_database_deadlocks{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datid="16384",datname="hephaestus"}'
        values: "0x10 1x30"
      - series: 'pg_stat_database_deadlocks{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datid="5",datname="postgres"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: HephaestusDatabaseDeadlocks
        exp_alerts: []
      - eval_time: 15m
        alertname: HephaestusDatabaseDeadlocks
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: hephaestus
              datname: hephaestus
            exp_annotations:
              summary: PostgreSQL broke a deadlock in the last 15 minutes
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - eval_time: 40m
        alertname: HephaestusDatabaseDeadlocks
        exp_alerts: []

  - name: existing deadlock totals and counter resets stay quiet until a new deadlock
    interval: 1m
    input_series:
      - series: 'pg_stat_database_deadlocks{job="postgresql",namespace="hephaestus",datname="kept_total"}'
        values: "7x30"
      - series: 'pg_stat_database_deadlocks{job="postgresql",namespace="hephaestus",datname="reset_only"}'
        values: "7x2 0x28"
      - series: 'pg_stat_database_deadlocks{job="postgresql",namespace="hephaestus",datname="increment_after_start"}'
        values: "7x2 8x28"
      - series: 'pg_stat_database_deadlocks{job="postgresql",namespace="hephaestus",datname="increment_after_reset"}'
        values: "7 0x2 1x27"
    alert_rule_test:
      - eval_time: 0m
        alertname: HephaestusDatabaseDeadlocks
        exp_alerts: []
      - eval_time: 2m
        alertname: HephaestusDatabaseDeadlocks
        exp_alerts: []
      - eval_time: 4m
        alertname: HephaestusDatabaseDeadlocks
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: hephaestus
              datname: increment_after_start
            exp_annotations:
              summary: PostgreSQL broke a deadlock in the last 15 minutes
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
          - exp_labels:
              severity: warning
              namespace: hephaestus
              datname: increment_after_reset
            exp_annotations:
              summary: PostgreSQL broke a deadlock in the last 15 minutes
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - eval_time: 25m
        alertname: HephaestusDatabaseDeadlocks
        exp_alerts: []

  - name: a transaction open for 10 minutes fires, one open for 4 minutes does not
    interval: 1m
    input_series:
      - series: 'pg_long_running_transactions_oldest_timestamp_seconds{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus"}'
        values: "0 60 120 180 240 0 0 0 0 0 60+60x15"
    alert_rule_test:
      - eval_time: 5m
        alertname: HephaestusDatabaseTransactionOpenLong
        exp_alerts: []
      - eval_time: 25m
        alertname: HephaestusDatabaseTransactionOpenLong
        exp_alerts:
          - exp_labels:
              severity: warning
