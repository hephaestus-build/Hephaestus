  - name: slow Activity reads burn the budget fast and slow, other routes and a quiet hour do not
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/workspaces/{workspaceSlug}/activity/me",le="1.0"}'
        values: "0+1x420"
