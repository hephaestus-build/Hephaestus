      - eval_time: 40m
        alertname: HephaestusWebhookRedeliveryNotRunning
        exp_alerts: []
  - name: a short archive failure, a single failed read, archive_mode off and a healthy archive do not fire
    interval: 1m
    input_series:
      - series: 'database_wal_archive_failing{job="hephaestus",instance="server-a:9090",runtime_role="server"}'
        values: "1x5 0x10"
      - series: 'database_wal_archive_failing{job="hephaestus",instance="server-b:9090",runtime_role="server"}'
        values: "NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN"
      - series: 'database_wal_archive_sample_failures_total{job="hephaestus",instance="server-a:9090",runtime_role="server"}'
        values: "0 0 0 1x13"
    alert_rule_test:
      - eval_time: 15m
        alertname: HephaestusWalArchiveFailing
        exp_alerts: []

  - name: the Hephaestus server with no available replica is down, one with an unavailable replica beside an available one is unready, a stopped one and cert-manager's webhook are quiet
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="hephaestus",deployment="hephaestus-server"}'
        values: "0x20"
      - series: 'kube_deployment_status_replicas_unavailable{namespace="hephaestus",deployment="hephaestus-server"}'
        values: "1x20"
      - series: 'kube_deployment_spec_replicas{namespace="hephaestus",deployment="hephaestus-server"}'
        values: "1x20"
      - series: 'kube_deployment_labels{namespace="hephaestus",deployment="hephaestus-server",label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="server"}'
        values: "1x20"
      - series: 'kube_deployment_status_replicas_available{namespace="hephaestus",deployment="staging-server"}'
        values: "1x20"
      - series: 'kube_deployment_status_replicas_unavailable{namespace="hephaestus",deployment="staging-server"}'
        values: "1x20"
      - series: 'kube_deployment_spec_replicas{namespace="hephaestus",deployment="staging-server"}'
        values: "2x20"
      - series: 'kube_deployment_labels{namespace="hephaestus",deployment="staging-server",label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="server"}'
        values: "1x20"
      # server.replicas=0 for maintenance.
      - series: 'kube_deployment_status_replicas_available{namespace="maintenance",deployment="hephaestus-server"}'
        values: "0x20"
      - series: 'kube_deployment_status_replicas_unavailable{namespace="maintenance",deployment="hephaestus-server"}'
        values: "0x20"
      - series: 'kube_deployment_spec_replicas{namespace="maintenance",deployment="hephaestus-server"}'
        values: "0x20"
      - series: 'kube_deployment_labels{namespace="maintenance",deployment="hephaestus-server",label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="server"}'
        values: "1x20"
      # Another application's webhook, without the chart's labels.
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager",deployment="cert-manager-webhook"}'
        values: "0x20"
      - series: 'kube_deployment_status_replicas_unavailable{namespace="cert-manager",deployment="cert-manager-webhook"}'
        values: "1x20"
      - series: 'kube_deployment_spec_replicas{namespace="cert-manager",deployment="cert-manager-webhook"}'
        values: "1x20"
      - series: 'kube_deployment_labels{namespace="cert-manager",deployment="cert-manager-webhook",label_app_kubernetes_io_name="webhook",label_app_kubernetes_io_component="webhook"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: HephaestusServerDown
        exp_alerts: []
      - eval_time: 6m
        alertname: HephaestusServerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: hephaestus
              deployment: hephaestus-server
            exp_annotations:
              summary: No server of the release is available, so the API and provider deliveries fail
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - eval_time: 10m
        alertname: HephaestusServerUnready
        exp_alerts: []
      - eval_time: 16m
        alertname: HephaestusServerUnready
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: hephaestus
              deployment: staging-server
            exp_annotations:
              summary: A server replica stayed unavailable for 15 minutes while another serves
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

  # time() starts at 0, so a value is a time in seconds from the start of the test, and a negative value is before it.
  # The backup CronJobs are created 28 hours before the start, at -100800. Thus the backup tests evaluate hours 29 to 32
  # of their life, and not the 28 hours that come before. The rule has no `for`, so the shift changes no result.
  - name: a release whose newest backup is 31 hours old fires, a release with a daily backup does not
    interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="hephaestus",cronjob="hephaestus-postgresql-backup-full"}'
        values: "-100800x180"
      - series: 'kube_cronjob_created{namespace="hephaestus",cronjob="hephaestus-postgresql-backup-diff"}'
        values: "-100800x180"
      # The weekly full backup is old; the daily differential backup of hour 24 is recent.
      - series: 'kube_cronjob_status_last_successful_time{namespace="hephaestus",cronjob="hephaestus-postgresql-backup-full"}'
        values: "-100800x180"
      - series: 'kube_cronjob_status_last_successful_time{namespace="hephaestus",cronjob="hephaestus-postgresql-backup-diff"}'
        values: "-14400x180"
      # A second release in the same namespace: its last backup is from the start.
      - series: 'kube_cronjob_created{namespace="hephaestus",cronjob="staging-postgresql-backup-diff"}'
        values: "-100800x180"
      - series: 'kube_cronjob_status_last_successful_time{namespace="hephaestus",cronjob="staging-postgresql-backup-diff"}'
        values: "-100800x180"
      # Another CronJob of the namespace is not a backup.
      - series: 'kube_cronjob_status_last_successful_time{namespace="hephaestus",cronjob="report"}'
        values: "-100800x180"
    alert_rule_test:
      - eval_time: 1h
        alertname: HephaestusBackupStale
        exp_alerts: []
      - eval_time: 3h
        alertname: HephaestusBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: hephaestus
              release: staging
            exp_annotations:
              summary: No PostgreSQL backup completed in the last 30 hours
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

  - name: backup CronJobs with no successful run for 30 hours fire
    interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="hephaestus",cronjob="hephaestus-postgresql-backup-full"}'
        values: "-100800x180"
      - series: 'kube_cronjob_created{namespace="hephaestus",cronjob="hephaestus-postgresql-backup-diff"}'
        values: "-100800x180"
    alert_rule_test:
      - eval_time: 1h
        alertname: HephaestusBackupStale
        exp_alerts: []
      - eval_time: 3h
        alertname: HephaestusBackupStale
        exp_alerts:
          - exp_labels:
