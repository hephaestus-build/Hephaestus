        values: "0 6 6x38"
    alert_rule_test:
      - eval_time: 25m
        alertname: HephaestusAgentSandboxReaperFailing
        exp_alerts: []

  - name: a sandbox dispatch that keeps failing fires, a short failure does not
    interval: 1m
    input_series:
      - series: 'agent_sandbox_dispatch_failure_total{job="hephaestus",instance="server-a:9090"}'
        values: "0+2x40"
      - series: 'agent_sandbox_dispatch_failure_total{job="hephaestus",instance="server-b:9090"}'
