        values: "0x30 1x30"
    alert_rule_test:
      - eval_time: 50m
        alertname: HephaestusConversationTurnsFailing
        exp_alerts: []

  - name: fast Activity reads and slow other routes do not burn the Activity budget
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/public/workspaces/{slug}/activity",le="1.0"}'
        values: "0+10x420"
      - series: 'http_server_requests_seconds_bucket{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/public/workspaces/{slug}/activity",le="+Inf"}'
        values: "0+10x420"
      - series: 'http_server_requests_seconds_bucket{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/workspaces/{workspaceSlug}/team",le="1.0"}'
        values: "0x420"
      - series: 'http_server_requests_seconds_bucket{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/workspaces/{workspaceSlug}/team",le="+Inf"}'
        values: "0+10x420"
    alert_rule_test:
      - eval_time: 400m
        alertname: HephaestusActivityLatencyBudgetBurnFast
