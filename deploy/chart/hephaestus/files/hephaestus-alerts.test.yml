      - series: 'kube_cronjob_labels{namespace="hephaestus",cronjob="hephaestus-postgresql-backup-diff",label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="postgresql-backup",label_app_kubernetes_io_instance="hephaestus"}'
        values: "1x180"
      - series: 'kube_cronjob_status_last_successful_time{namespace="hephaestus",cronjob="hephaestus-postgresql-backup-diff"}'
        values: "-100800x180"
    alert_rule_test:
      - eval_time: 3h
        alertname: HephaestusBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: hephaestus
              release: hephaestus
            exp_annotations:
              summary: No PostgreSQL backup completed in the last 30 hours
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
          - exp_labels:
              severity: critical
              namespace: hephaestus
              release: hephaestus-production-for-the-whole-faculty
            exp_annotations:
              summary: No PostgreSQL backup completed in the last 30 hours
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

