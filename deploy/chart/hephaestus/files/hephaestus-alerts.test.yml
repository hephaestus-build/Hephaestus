  # Each long-window case evaluates soon after its rule can fire. rate() divides the errors and the requests by the
  # same window, so a ratio over three or seven days needs only the hours that the series covers. A series of days
  # would cost promtool an evaluation of every rule at each minute of them.
  - name: server errors at 0.6 % open a ticket, 0.4 % does not
    interval: 10m
    input_series:
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/api/workspaces/{workspaceSlug}/team"}'
        values: "0+994x15"
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="500",uri="/api/workspaces/{workspaceSlug}/team"}'
        values: "0+6x15"
    alert_rule_test:
      - eval_time: 2h
        alertname: HephaestusApiErrorBudgetBurnTicket
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The API answered with server errors for three days at a rate that spends its monthly error budget
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # The page windows stay silent: 0.6 % is far below a fast or a slow burn.
      - eval_time: 2h
        alertname: HephaestusApiErrorBudgetBurnSlow
        exp_alerts: []

  - name: an error rate within the budget, or an idle instance, opens no ticket
    interval: 10m
    input_series:
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/api/workspaces/{workspaceSlug}/team"}'
        values: "0+996x15"
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="500",uri="/api/workspaces/{workspaceSlug}/team"}'
        values: "0+4x15"
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server-b:9090",runtime_role="server",method="GET",status="500",uri="/api/idle"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 2h
        alertname: HephaestusApiErrorBudgetBurnTicket
        exp_alerts: []

  - name: slow reads at 0.6 % open a ticket, 0.3 % does not
    interval: 10m
    input_series:
      - series: 'http_server_requests_seconds_bucket{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/api/workspaces/{workspaceSlug}/team",le="2.0"}'
        values: "0+994x15"
      - series: 'http_server_requests_seconds_bucket{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/api/workspaces/{workspaceSlug}/team",le="+Inf"}'
