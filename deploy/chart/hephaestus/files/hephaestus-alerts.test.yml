      - eval_time: 70m
        alertname: HephaestusCheckoutUnverified
        exp_alerts: []

  # The batch band passes the hour at minute 2 and fires after its 5 minutes; the background band stays under it.
  - name: a run that waits more than an hour fires for its band, a shorter wait does not
    interval: 1m
    input_series:
      - series: 'agent_run_oldest_due_age_seconds{job="hephaestus",instance="server:9090",kind="review",band="batch"}'
        values: "1800 3300 3700 3760 3820 3880 3940 4000 4060"
      - series: 'agent_run_oldest_due_age_seconds{job="hephaestus",instance="server:9090",kind="turn",band="batch"}'
        values: "0x9"
      - series: 'agent_run_oldest_due_age_seconds{job="hephaestus",instance="server:9090",kind="review",band="background"}'
        values: "3000x9"
    alert_rule_test:
      - eval_time: 1m
