              namespace: hephaestus
              release: hephaestus
            exp_annotations:
              summary: No PostgreSQL backup completed in the last 30 hours
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

  # A release name of more than 34 characters: the chart truncates and hashes the CronJob names, so only their labels
  # tell the release. The full backup is old, the differential one is recent: the newest backup counts.
  - name: backup CronJobs of a long release name are found by their labels
    interval: 1m
    input_series:
      - series: 'kube_cronjob_labels{namespace="hephaestus",cronjob="hephaestus-production-for-the-whole-facul-1a2b3c4d-full",label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="postgresql-backup",label_app_kubernetes_io_instance="hephaestus-production-for-the-whole-faculty"}'
        values: "1x240"
      - series: 'kube_cronjob_labels{namespace="hephaestus",cronjob="hephaestus-production-for-the-whole-facul-1a2b3c4d-diff",label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="postgresql-backup",label_app_kubernetes_io_instance="hephaestus-production-for-the-whole-faculty"}'
        values: "1x240"
      - series: 'kube_cronjob_status_last_successful_time{namespace="hephaestus",cronjob="hephaestus-production-for-the-whole-facul-1a2b3c4d-full"}'
        values: "-100800x240"
      - series: 'kube_cronjob_status_last_successful_time{namespace="hephaestus",cronjob="hephaestus-production-for-the-whole-facul-1a2b3c4d-diff"}'
        values: "-10800x240"
    alert_rule_test:
      - eval_time: 1h
        alertname: HephaestusBackupStale
        exp_alerts: []
      - eval_time: 3h
        alertname: HephaestusBackupStale
        exp_alerts: []
      - eval_time: 4h
        alertname: HephaestusBackupStale
        exp_alerts: []

  - name: a stale backup of a long release name fires under its release
    interval: 1m
    input_series:
      - series: 'kube_cronjob_labels{namespace="hephaestus",cronjob="hephaestus-production-for-the-whole-facul-1a2b3c4d-full",label_app_kubernetes_io_name="hephaestus",label_app_kubernetes_io_component="postgresql-backup",label_app_kubernetes_io_instance="hephaestus-production-for-the-whole-faculty"}'
