              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

  - name: a large table with a quarter dead rows fires, a small one and a vacuumed one do not
    interval: 5m
    input_series:
      - series: 'pg_stat_user_tables_n_dead_tup{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datname="hephaestus",schemaname="public",relname="issue"}'
        values: "50000x20"
      - series: 'pg_stat_user_tables_n_live_tup{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datname="hephaestus",schemaname="public",relname="issue"}'
        values: "200000x20"
      - series: 'pg_stat_user_tables_n_dead_tup{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datname="hephaestus",schemaname="public",relname="label"}'
        values: "900x20"
      - series: 'pg_stat_user_tables_n_live_tup{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datname="hephaestus",schemaname="public",relname="label"}'
        values: "100x20"
      - series: 'pg_stat_user_tables_n_dead_tup{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datname="hephaestus",schemaname="public",relname="commit"}'
        values: "20000x20"
      - series: 'pg_stat_user_tables_n_live_tup{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datname="hephaestus",schemaname="public",relname="commit"}'
        values: "1000000x20"
    alert_rule_test:
      - eval_time: 30m
        alertname: HephaestusDatabaseDeadRowsHigh
        exp_alerts: []
      - eval_time: 90m
        alertname: HephaestusDatabaseDeadRowsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: postgresql
              instance: postgresql-exporter:9187
              namespace: hephaestus
              datname: hephaestus
              schemaname: public
              relname: issue
