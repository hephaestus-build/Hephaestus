  - name: an interactive run that waits more than a minute fires after a minute
    interval: 1m
    input_series:
      - series: 'agent_run_oldest_due_age_seconds{job="hephaestus",instance="server:9090",kind="turn",band="interactive"}'
        values: "0 20 70 100 130 160 0x4"
