        exp_alerts: []
      - eval_time: 60m
        alertname: HephaestusActivityLatencyBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Activity reads take longer than 1 second often enough to spend the monthly budget in five days
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

