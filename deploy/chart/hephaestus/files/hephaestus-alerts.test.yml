              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

  - name: a transaction ID age past 1 billion is critical, a frozen database is quiet
    interval: 5m
    input_series:
      - series: 'pg_database_wraparound_age_datfrozenxid_seconds{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datname="hephaestus"}'
        values: "1100000000x10"
      - series: 'pg_database_wraparound_age_datfrozenxid_seconds{job="postgresql",instance="postgresql-exporter:9187",namespace="hephaestus",datname="postgres"}'
        values: "200000000x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: HephaestusDatabaseTransactionIdAgeHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: HephaestusDatabaseTransactionIdAgeHigh
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: hephaestus
              datname: hephaestus
            exp_annotations:
              summary: A database's oldest unfrozen transaction ID is more than 1 billion old
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

  # Each long-window case evaluates soon after its rule can fire. rate() divides the errors and the requests by the
  # same window, so a ratio over three or seven days needs only the hours that the series covers. A series of days
  # would cost promtool an evaluation of every rule at each minute of them.
  - name: server errors at 0.6 % open a ticket, 0.4 % does not
    interval: 10m
    input_series:
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/workspaces/{workspaceSlug}/team"}'
        values: "0+994x15"
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="500",uri="/workspaces/{workspaceSlug}/team"}'
        values: "0+6x15"
    alert_rule_test:
      - eval_time: 2h
        alertname: HephaestusApiErrorBudgetBurnTicket
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The API answered with server errors for three days at a rate that spends its monthly error budget
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      # The page windows stay silent: 0.6 % is far below a fast or a slow burn.
      - eval_time: 2h
        alertname: HephaestusApiErrorBudgetBurnSlow
        exp_alerts: []

  - name: an error rate within the budget, or an idle instance, opens no ticket
    interval: 10m
    input_series:
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/workspaces/{workspaceSlug}/team"}'
        values: "0+996x15"
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="500",uri="/workspaces/{workspaceSlug}/team"}'
        values: "0+4x15"
      - series: 'http_server_requests_seconds_count{job="hephaestus",instance="server-b:9090",runtime_role="server",method="GET",status="500",uri="/idle"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 2h
        alertname: HephaestusApiErrorBudgetBurnTicket
        exp_alerts: []

