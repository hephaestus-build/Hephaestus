          - exp_labels:
              severity: warning
              namespace: prod
              persistentvolumeclaim: data-prod-postgresql-0
            exp_annotations:
              summary: The PostgreSQL volume has between 5 % and 15 % free space
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
      - eval_time: 14m
        alertname: HephaestusPostgresVolumeFilling
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: hephaestus
              persistentvolumeclaim: data-hephaestus-postgresql-0
            exp_annotations:
              summary: The PostgreSQL volume has between 5 % and 15 % free space
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response
          - exp_labels:
              severity: critical
              namespace: prod
              persistentvolumeclaim: data-prod-postgresql-0
            exp_annotations:
              summary: The PostgreSQL volume has less than 5 % free space
              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

