        values: "0+1000x15"
    alert_rule_test:
      - eval_time: 2h
        alertname: HephaestusApiLatencyBudgetBurnTicket
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: API reads took longer than 2 seconds for three days often enough to spend the monthly budget
