      - series: 'agent_run_first_token_seconds_bucket{job="hephaestus",kind="turn",start="warm",instance="server-b:9090",runtime_role="server",le="10.0"}'
        values: "0x420"
      - series: 'agent_run_first_token_seconds_count{job="hephaestus",kind="turn",start="warm",instance="server-b:9090",runtime_role="server"}'
        values: "0+0.5x420"
    alert_rule_test:
