        values: "0+10x420"
      - series: 'http_server_requests_seconds_bucket{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/workspaces/{workspaceSlug}/team",le="1.0"}'
        values: "0x420"
      - series: 'http_server_requests_seconds_bucket{job="hephaestus",instance="server:9090",runtime_role="server",method="GET",status="200",uri="/workspaces/{workspaceSlug}/team",le="+Inf"}'
        values: "0+5x420"
    alert_rule_test:
      - eval_time: 1m
