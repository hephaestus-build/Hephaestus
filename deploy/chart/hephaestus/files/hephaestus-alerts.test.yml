              runbook_url: https://docs.hephaestus.build/admin/production-operations-runbook#alert-response

  - name: a checkout failure before the first scrape fires only while the series is new
    interval: 1m
    input_series:
      - series: 'evidence_checkout_copies_total{job="hephaestus",instance="replacement:9090",outcome="mismatch"}'
        values: "1x90"
    alert_rule_test:
