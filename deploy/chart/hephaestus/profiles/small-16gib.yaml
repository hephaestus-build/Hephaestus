# One node of 16 GiB, on top of small.yaml: --values profiles/small.yaml --values profiles/small-16gib.yaml.
# The worker stops before its replacement starts, as in small.yaml. docs/admin/kubernetes.mdx § Profiles gives
# the arithmetic; a chart test checks that the steady state and an upgrade fit the node.
nats:
  # JetStream's caches grow above the request, up to the limit of small.yaml.
  resources:
    requests: { memory: 512Mi }
