# One small cluster: a single k3s node of 4 vCPU, at least 16 GiB of memory (32 GiB gives more
# headroom) and 150 GiB of disk. Bundled PostgreSQL and NATS, one server that runs five reviews at a
# time, and bounded caches; the chart derives the sandbox quotas.
# docs/admin/helm-chart.md § Profiles gives the arithmetic; a chart test checks that the requests,
# one upgrade beside them, and the quota fit.
#
# The sandboxes are on: reviews are the product. The operator states sandbox.namespace and
# networkPolicy.kubernetesApi, and the chart refuses to render without them
# (docs/admin/kubernetes.mdx § Install).
postgresql:
  bundled: true
  # Shared-node policy. Keep the proven container ceiling until the loaded trial qualifies 1536Mi.
  resources:
    requests: { memory: 2Gi }
  backup:
    resources:
      requests: { memory: 512Mi }
  parameters:
    shared_buffers: 256MB
    work_mem: 2MB
    hash_mem_multiplier: 1.0
    max_connections: 80
    maintenance_work_mem: 64MB
    autovacuum_work_mem: 32MB
    autovacuum_max_workers: 3
    effective_cache_size: 1GB
    max_parallel_workers_per_gather: 0
    max_wal_size: 1GB
nats:
  bundled: true
  jetstream:
    maxFileBytes: 8589934592
# The small-installation replay policy is independent of general chart defaults.
webhook:
  stream:
    maxAge: 7d
    maxBytesByStream:
      github: 6442450944B
    maxBytes: 536870912B
server:
  databasePool: { maximumPoolSize: 40, minimumIdle: 2 }
  # One node holds one server: the old server stops before its replacement starts. Each upgrade is an
  # outage of the API. The gateway stays available while in-flight reviews finish.
  rolloutStrategy: Recreate
  drainTimeoutSeconds: 600
  gitCache:
    sizeLimit: 20Gi
  resources:
    limits: { ephemeral-storage: 22Gi }
sandbox:
  enabled: true
  # Five reviews of 512 MiB. Each review beyond them takes 100m of CPU from the resident turns
  # while a backup runs.
  reviewMemory: 2560Mi
# One node: one loop, and a second one only while it rolls out.
conversationLoop:
  replicas: 1
  # The CPU budget admits conversation turns from the remaining CPU budget. The tools quota stays at
  # eight plus two warm Pods.
  turns: auto
