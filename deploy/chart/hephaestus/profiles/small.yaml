# One small cluster: a single k3s node of 4 vCPU, 32 GiB and 150 GiB of disk. Bundled PostgreSQL and
# NATS, one worker that runs one review at a time, and bounded caches; the chart derives the sandbox quotas.
# docs/admin/kubernetes.mdx § Profiles gives the arithmetic; a chart test checks that the requests,
# one upgrade beside them, and the quota fit.
#
# The worker is on: reviews are the product. The operator states worker.sandbox.namespace and
# networkPolicy.kubernetesApi, and the chart refuses to render without them
# (docs/admin/kubernetes.mdx § Install).
postgresql:
  bundled: true
nats:
  bundled: true
server:
  gitCache:
    sizeLimit: 10Gi
  resources:
    limits: { ephemeral-storage: 12Gi }
worker:
  enabled: true
  replicas: 1
  # The worker stops before its replacement starts, so each upgrade is a planned outage of reviews and
  # Heph. A surge would run a second Heph host and turn pool that the node's CPU does not hold, and they
  # sit idle until the old worker drains.
  rolloutStrategy: Recreate
  # An upgrade waits for the drain, so the outage stays short.
  drainTimeoutSeconds: 600
  reviews: 1
  # The worker's automatic number of Heph turns. A chart test checks that each single-node profile holds
  # them beside the review, from sandbox-pod-requests.json.
  hephTurns: 8
  gitCache:
    sizeLimit: 10Gi
  resources:
    limits: { ephemeral-storage: 12Gi }
