# One small cluster: a single k3s node of 4 vCPU, at least 16 GiB of memory (32 GiB gives more
# headroom) and 150 GiB of disk. Bundled PostgreSQL, one server that runs five reviews at a
# time, and bounded caches; the chart derives the sandbox quotas. With the gVisor overhead of
# k3s-values.yaml, the one-host install runs four reviews at a time.
# docs/admin/helm-chart.md § Sandbox capacity budget gives the arithmetic; a chart test checks that the requests,
# one upgrade beside them, and the quota fit.
#
# The sandboxes are on: reviews are the product. The operator states sandbox.namespace and
# networkPolicy.kubernetesApi, and the chart refuses to render without them
# (docs/admin/kubernetes.mdx § Install).
postgresql:
  bundled: true
  # Shared-node policy. Keep the proven container ceiling until the loaded trial qualifies 1536Mi.
  resources:
    requests: { memory: 2Gi }
  backup:
    resources:
      requests: { memory: 512Mi }
  parameters:
    shared_buffers: 256MB
    work_mem: 2MB
    hash_mem_multiplier: 1.0
    # max_connections follows the rollout client budget, rounded up with a floor of 120.
    maintenance_work_mem: 64MB
    autovacuum_work_mem: 32MB
    autovacuum_max_workers: 3
    effective_cache_size: 1GB
    max_parallel_workers_per_gather: 0
    max_wal_size: 1GB
server:
  databasePool: { maximumPoolSize: auto, minimumIdle: 2 }
  # Reserve a replacement beside the draining server within the single node budget.
  replicas: 1
  drainTimeoutSeconds: 600
  gitCache:
    sizeLimit: 20Gi
  resources:
    limits: { ephemeral-storage: 22Gi }
sandbox:
  conversationTurns: auto
  # Recorded node capacity less kubelet reservations and the hard eviction floor, rounded down.
  budget: { cpu: 3500m, memory: 14196Mi }
  enabled: true
  # Review capacity follows the template requests and RuntimeClass overhead.
  reviewMemory: 2560Mi
