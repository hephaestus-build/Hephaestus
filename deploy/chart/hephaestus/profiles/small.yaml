# One small cluster: a single k3s node of 4 vCPU, 32 GiB and 150 GiB of disk. Bundled PostgreSQL and
# NATS, one worker that runs one review at a time, bounded caches, and a sandbox quota for that worker.
# docs/admin/kubernetes.mdx § Profiles gives the arithmetic; a chart test checks that the requests,
# one upgrade beside them, and the quota fit.
#
# The worker is on: reviews are the product. The operator states worker.sandbox.namespace and
# networkPolicy.kubernetesApi, and the chart refuses to render without them
# (docs/admin/kubernetes.mdx § Install).
postgresql:
  bundled: true
nats:
  bundled: true
server:
  gitCache:
    sizeLimit: 10Gi
  resources:
    limits: { ephemeral-storage: 12Gi }
worker:
  enabled: true
  replicas: 1
  reviews: 1
  hephTurns: 1
  gitCache:
    sizeLimit: 10Gi
  resources:
    limits: { ephemeral-storage: 12Gi }
  sandbox:
    # While the old worker drains beside the new one, by memory limit: one review (1280 MiB), two Heph
    # hosts (2 x 1 GiB), two turn pools (2 x 3 x 544 MiB: 2 pooled sandboxes and the hephTurns running
    # one), and the new worker's isolation probe (768 MiB).
    quota:
      enabled: true
      pods: 12
      cpu: "12"
      memory: 16Gi
