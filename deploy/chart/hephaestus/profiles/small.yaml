# One small cluster: a single k3s node of 4 vCPU, 32 GiB and 150 GiB of disk. Bundled PostgreSQL and
# NATS, one worker that runs one review at a time, and bounded caches; the chart derives the sandbox quotas.
# docs/admin/kubernetes.mdx § Profiles gives the arithmetic; a chart test checks that the requests,
# one upgrade beside them, and the quota fit.
#
# The worker is on: reviews are the product. The operator states worker.sandbox.namespace and
# networkPolicy.kubernetesApi, and the chart refuses to render without them
# (docs/admin/kubernetes.mdx § Install).
postgresql:
  bundled: true
  # Shared-node policy. Keep the proven container ceiling until the loaded trial qualifies 1536Mi.
  resources:
    requests: { memory: 2Gi }
  backup:
    resources:
      requests: { memory: 512Mi }
  parameters:
    shared_buffers: 256MB
    work_mem: 2MB
    hash_mem_multiplier: 1.0
    max_connections: 80
    maintenance_work_mem: 64MB
    autovacuum_work_mem: 32MB
    autovacuum_max_workers: 3
    effective_cache_size: 1GB
    max_parallel_workers_per_gather: 0
    max_wal_size: 1GB
nats:
  bundled: true
  jetstream:
    maxFileBytes: 8589934592
# The small-installation replay and durable-expiry policy is independent of general chart defaults.
webhook:
  stream:
    maxAge: 7d
    maxAgeByStream:
      slack: 7d
      outline: 7d
    maxBytesGithub: 4294967296B
    maxBytes: 536870912B
config:
  consumerInactiveThreshold: 30d
server:
  databasePool: { maximumPoolSize: 16, minimumIdle: 2 }
  gitCache:
    sizeLimit: 10Gi
  resources:
    limits: { ephemeral-storage: 12Gi }
worker:
  databasePool: { maximumPoolSize: 24, minimumIdle: 2 }
  enabled: true
  replicas: 1
  # Drain the old worker before its replacement starts so the node holds 32 resident turns.
  # Reviews and conversations pause during the drain and replacement.
  rolloutStrategy: Recreate
  reviews: 1
  # The CPU budget admits 32 resident turns. The tools quota stays at eight plus two warm Pods.
  conversationTurns: auto
  gitCache:
    sizeLimit: 10Gi
  resources:
    limits: { ephemeral-storage: 12Gi }
