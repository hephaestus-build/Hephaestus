# A managed cluster of several nodes on which the release has no cluster-admin:
# docs/admin/managed-cluster.mdx. The cluster's admins apply the admin bundle, which holds every
# cluster-scoped object, so the chart renders namespaced objects only. Sandboxes run on the cluster's
# default runtime with hostUsers: false.
#
# The worker is on. The operator states worker.sandbox.namespace and networkPolicy.kubernetesApi, and
# the chart refuses to render without them (docs/admin/managed-cluster.mdx § Values).
priorityClasses:
  # The admin bundle (deploy/platform/hephaestus-cluster-admin.yaml) creates these three.
  create: false
  roles: hephaestus-roles
  conversations: hephaestus-conversations
  reviews: hephaestus-reviews
# The staging bench of 2026-11-10 measured a server peak of 2325 MiB: 91 % of the default 2560Mi.
# The JVM sizes its heap from the limit, so the request equals it.
server:
  resources:
    requests: { cpu: 500m, memory: 3072Mi }
    limits: { cpu: "4", memory: 3072Mi }
worker:
  enabled: true
  sandbox:
    # Sixteen reviews of 384 MiB at once, across the sandbox nodes.
    reviewMemory: 6144Mi
    # The agent-sandbox controller runs in the release namespace with Roles; the admin bundle grants
    # it the one read-only ClusterRole that its caches need.
    controller:
      enabled: true
